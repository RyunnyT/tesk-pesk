<h1>1부 루멘 마을 · 탑다운 시안</h1>
<p class="lead">방향키나 WASD로 위아래 어디든 걸어요. J 또는 Z로 점프하면 울타리, 바위, 통나무, 좁은 개울을 넘을 수 있어요. 스페이스로 말을 걸거나 조사해요. M으로 지도를 접고 펴요. 1부의 지워진 곳 8군데를 모두 다시 쓰면 동쪽 길이 열려요.</p>

<div class="hud"><span id="h1"></span><span id="h2"></span><span id="h3"></span><span id="h4" class="goal"></span></div>

[[0,-1],[0,1],[-1,0],[1,0]].forEach(([dx,dy])=>{if(isGrass(nb(dx,dy))){const col='#76a04c';if(dy===-1)for(let i=0;i<16;i+=2)P(c,X+i,Y,1,1+(hsh(tx+i,ty)%2),col);if(dy===1)for(let i=0;i<16;i+=2)P(c,X+i,Y+15-(hsh(tx+i,ty+1)%2),1,1+(hsh(tx+i,ty+1)%2),col);if(dx===-1)for(let i=0;i<16;i+=2)P(c,X,Y+i,1+(hsh(tx,ty+i)%2),1,col);if(dx===1)for(let i=0;i<16;i+=2)P(c,X+15-(hsh(tx+1,ty+i)%2),Y+i,1+(hsh(tx+1,ty+i)%2),1,col)}})}

const cost=p.core?6:3;if(save.dust<cost){toast('별빛 가루가 '+(cost-save.dust)+'개 더 필요해요. 지문을 읽으면 가루를 받아요');return}
save.dust-=cost;p.done=true;save.done[p.i]=1;store();p.tiles.forEach(([a,y])=>{for(let i=0;i<4;i++)sp.push({a:a*T+Math.random()*16,y:y*T+Math.random()*16,t:8+Math.random()*10})});
if(PATCH.every(q=>q.done)){openGate();toast('1부를 모두 다시 썼어요! 동쪽 길이 열렸어요')}else toast('별빛 가루 '+cost+'개로 다시 썼어요');hud()}
function openBook(s){busy=true;bk={s,stage:'read',qi:0};renderBook();$('book').hidden=false}
function renderBook(){const s=bk.s,el=$('bk'),idx=SPOTS.indexOf(s)+1;
if(bk.stage==='read'){el.innerHTML='<h3>「'+s.t+'」</h3><p style="color:#8a7a60;font-size:.85em;margin-top:-4px">'+s.n+' · 1부 지문 '+idx+' / 75</p>'+(s.p?s.p.map(t=>'<p>'+t+'</p>').join(''):'<p class="ph">이 자리에 선생님의 지문이 들어가요. 75개 지문이 부마다 6~7개씩 이런 장소에 놓여요.</p><p class="ph">지문마다 확인 문제 2~3개가 붙어요.</p>')+'<div class="bkb"><button type="button" data-bq="1">'+(s.q?'다 읽었어요 · 문제 풀기':'다 읽었어요')+'</button></div>'}
else if(bk.stage==='q'){const [qq,ch]=s.q[bk.qi];el.innerHTML='<h3>문제 '+(bk.qi+1)+' / '+s.q.length+'</h3><p>'+qq+'</p><div class="bkc">'+ch.map((c,i)=>'<button type="button" data-ans="'+i+'">'+c+'</button>').join('')+'</div><p class="qm" id="bkm"></p><div class="bkb"><button type="button" class="ghost" data-back="1">지문 다시 보기</button></div>'}
else el.innerHTML='<h3>다 읽었어요!</h3><p>'+bk.msg+'</p><div class="bkb"><button type="button" data-bc="1">닫기</button></div>';
el.scrollTop=0;const f=el.querySelector('button');if(f)f.focus()}
function finishBook(){const s=bk.s,first=!save.read[s.id];save.read[s.id]=1;if(first)save.dust+=3;store();hud();bk.msg=first?'별빛 가루 +3'+(s.main?'. 이 책을 읽어서 1부의 핵심 자리를 열 수 있게 되었어요.':''):'다시 읽었어요.';bk.stage='done';renderBook()}
function closeBook(){$('book').hidden=true;bk=null;busy=false;$('stage').focus()}
$('book').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!bk)return;const d=b.dataset;if(b.id==='bx'){closeBook();return}
if(d.bq){if(bk.s.q){bk.stage='q';renderBook()}else finishBook()}else if(d.back){bk.stage='read';renderBook()}
else if(d.ans!=null){if(+d.ans===bk.s.q[bk.qi][2]){bk.qi++;if(bk.qi>=bk.s.q.length)finishBook();else renderBook()}else{b.disabled=true;$('bkm').textContent='지문을 다시 읽어 보면 답이 있어요'}}else if(d.bc)closeBook()});
function interact(t){if(!t)return;const o=t.ref;if(t.type==='npc')openDlg(o,o.lines,()=>{if(!save.met[o.id]){save.met[o.id]=1;store();hud()}});else if(t.type==='spot')openBook(o);else if(t.type==='patch')fillPatch(o);
else if(t.type==='door')toast(o.n+'에 들어가요. 실제 게임에서는 건물 안 맵이 열려요');else if(t.type==='gate')toast('안개가 길을 막고 있어요. 1부의 지워진 곳을 모두 다시 써야 열려요')}
$('act').onclick=()=>interact(near());
addEventListener('keydown',e=>{const c=e.code;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(c)&&e.target.tagName!=='BUTTON')e.preventDefault();
if(c==='Escape'&&bk){closeBook();return}if(c==='Space'||c==='Enter'||c==='KeyE'){if(e.target.tagName==='BUTTON'&&!dl)return;if(dl){nextDlg();return}if(!busy)interact(near());return}
if(c==='KeyJ'||c==='KeyZ'){jump();return}if(c==='KeyM'){toggleMap();return}keys[c]=true});
addEventListener('keyup',e=>{keys[e.code]=false});
function update(){if(busy){pl.mv=false;return}let dx=0,dy=0;if(keys.ArrowLeft||keys.KeyA)dx--;if(keys.ArrowRight||keys.KeyD)dx++;if(keys.ArrowUp||keys.KeyW)dy--;if(keys.ArrowDown||keys.KeyS)dy++;
if(pl.air){pl.z+=pl.vz;pl.vz-=0.32;tryMove(pl,pl.jx,0,true);tryMove(pl,0,pl.jy,true);if(pl.z<=0){pl.z=0;if(hitbox(pl.x,pl.y,false)){if(pl.air<12&&(pl.jx||pl.jy)){pl.z=0.5;pl.vz=0.6;pl.air++}else{pl.x=pl.sx;pl.y=pl.sy;pl.air=0;toast('조금 더 가까이 가서 뛰어 봐요')}}else pl.air=0}if(pl.air)pl.air=Math.max(1,pl.air)}
else if(dx||dy){const l=Math.hypot(dx,dy);tryMove(pl,dx/l*1.4,0,false);tryMove(pl,0,dy/l*1.2,false);if(dx)pl.dir=dx>0?1:-1;pl.face=Math.abs(dy)>Math.abs(dx)?(dy<0?'u':'d'):'s';pl.mv=true;if(tk%3===0)pl.f++}else pl.mv=false;
if(gateOpen&&pl.x>47*T+4){pl.x=47*T+4;if(tk%40===0)toast('여기서 2부 「꺼진 등대」로 넘어가요. 시안은 여기까지예요')}
const ptx=Math.floor(pl.x/T),pty=Math.floor(pl.y/T);for(let y=pty-6;y<=pty+6;y++)for(let a=ptx-8;a<=ptx+8;a++)if(y>=0&&a>=0&&y<MH&&a<MW)EXP[y][a]=true;
NPCS.forEach(n=>{if(n.still||n.talk)return;if(n.wait>0){n.wait--;n.mv=false;return}const ex=n.tx-n.x,ey=n.ty-n.y,d=Math.hypot(ex,ey);
if(d<1){n.wait=40+Math.random()*90;n.tx=n.hx+(Math.random()-0.5)*56;n.ty=n.hy+(Math.random()-0.5)*40;n.mv=false;return}
const ox=n.x,oy=n.y;tryMove(n,ex/d*0.5,ey/d*0.5,false);if(ox===n.x&&oy===n.y){n.tx=n.x;n.ty=n.y}n.dir=ex>0?1:-1;n.face=Math.abs(ey)>Math.abs(ex)?(ey<0?'u':'d'):'s';n.mv=true;if(tk%4===0)n.f++})}
function drawChar(n,isP){const px=Math.round(n.x-cam.x),py=Math.round(n.y-cam.y),z=Math.round(n.z||0),fl=n.dir<0,r=(a,y,w,h,col)=>P(x,fl?px+8-(a+w):px+a-8,py-18+y-z,w,h,col);
if(isP)P(x,px-4,py,8,1,'rgba(0,0,0,'+(z?0.15:0.22)+')');
if(n.owl){const b=Math.round(Math.sin((tk+px)/9)*1.5)-4;owl(r,b,fr)}else{const b=n.mv?n.f%2:((fr+px)%8<4?0:1);person(r,z?0:b,n.mv?n.f:fr,isP?KN:n,n.mv&&!z,n.face)}}
function bubble(bx,by){P(x,bx-6,by-6,13,8,'#2b2b2b');P(x,bx-5,by-5,11,6,'#ffffff');P(x,bx-1,by+2,3,2,'#2b2b2b');for(let i=0;i<3;i++)if((fr>>1)%4>i)P(x,bx-3+i*3,by-2,1,1,'#2b2b2b')}
function star(cx,cy){const s2=(fr%6<3)?3:4;P(x,cx-s2,cy,2*s2+1,1,'#ffd86b');P(x,cx,cy-s2,1,2*s2+1,'#ffd86b');P(x,cx-1,cy-1,3,3,'#fff6d0')}
function goal(){const N=id=>NPCS.find(n=>n.id===id),near1=list=>{let b=null,bd=1e9;list.forEach(([gx,gy])=>{const d=Math.hypot(gx-pl.x,gy-pl.y);if(d<bd){bd=d;b={x:gx,y:gy}}});return b};
if(!save.met.momo){const n=N('momo');return{t:'모모와 이야기하기',x:n.x,y:n.y-8}}
if(!save.met.bran){const n=N('bran');return{t:'수련장에서 브란 스승님 만나기',x:n.x,y:n.y-8}}
if(!save.read.song){const s=SPOTS[0];return{t:'도서관 앞 「잊힌 노래」 읽기',x:s.tx*T+8,y:s.ty*T+6}}
const left=PATCH.filter(p=>!p.done&&!p.core);
if(left.length&&save.dust<3){const un=SPOTS.filter(s=>!save.read[s.id]);if(un.length)return{t:'지문을 읽어 별빛 가루 모으기',...near1(un.map(s=>[s.tx*T+8,s.ty*T+6]))}}
if(left.length){const pts=[];left.forEach(p=>p.tiles.forEach(([a,y])=>pts.push([a*T+8,y*T+8])));return{t:'지워진 곳 다시 쓰기 ('+(7-left.length)+'/7)',...near1(pts)}}
const core=PATCH.find(p=>p.core);if(!core.done){if(save.dust<6){const un=SPOTS.filter(s=>!save.read[s.id]);if(un.length)return{t:'지문을 읽어 별빛 가루 모으기',...near1(un.map(s=>[s.tx*T+8,s.ty*T+6]))}}const [a,y]=core.tiles[Math.floor(core.tiles.length/2)];return{t:'금빛 핵심 자리 다시 쓰기',x:a*T+8,y:y*T+8}}
return{t:'동쪽 길을 따라 2부로',x:47*T,y:20*T}}
function drawGoal(){const g=goal(),sx=g.x-cam.x,sy=g.y-cam.y;
if(sx>10&&sx<W-10&&sy>30&&sy<H-6){const ax=Math.round(sx),ay=Math.round(sy)-36+Math.round(Math.sin(fr/3)*2);P(x,ax-2,ay-6,5,7,'#2b2b2b');P(x,ax-1,ay-5,3,6,'#ffd86b');for(let i=0;i<5;i++){P(x,ax-6+i,ay+i,13-2*i,2,'#2b2b2b');P(x,ax-5+i,ay+i,11-2*i,1,i%2?'#ffb84a':'#ffd86b')}return}
const L0=14,R0=W-14,T0=40,B0=H-14,cx=(L0+R0)/2,cy=(T0+B0)/2,dx=sx-cx,dy=sy-cy,ang=Math.atan2(dy,dx),t=Math.min((R0-cx)/Math.max(Math.abs(dx),0.01),(B0-cy)/Math.max(Math.abs(dy),0.01)),ex=cx+dx*t;let ey=cy+dy*t;if(mmOpen&&ex>W-86&&ey<70)ey=70;const pu=1+0.08*Math.sin(fr/3);
x.save();x.translate(Math.round(ex),Math.round(ey));x.rotate(ang);x.scale(pu,pu);x.fillStyle='#2b2b2b';x.beginPath();x.moveTo(10,0);x.lineTo(-7,-8);x.lineTo(-3,0);x.lineTo(-7,8);x.closePath();x.fill();x.fillStyle=fr%8<6?'#ffd86b':'#fff1b0';x.beginPath();x.moveTo(7,0);x.lineTo(-5,-5);x.lineTo(-2,0);x.lineTo(-5,5);x.closePath();x.fill();x.restore()}
function frame(){tk++;fr=tk>>1;update();
cam.x=Math.max(0,Math.min(WW-W,Math.round(pl.x-W/2)));cam.y=Math.max(0,Math.min(WH-H,Math.round(pl.y-H/2-6)));
x.drawImage(base,-cam.x,-cam.y);
const tx0=Math.floor(cam.x/T),ty0=Math.floor(cam.y/T);
for(let y=ty0;y<=ty0+12&&y<MH;y++)for(let a=tx0;a<=tx0+20&&a<MW;a++){const g=G[y][a],X=a*T-cam.x,Y=y*T-cam.y;
if(g==='~'){const k=hsh(a,y);if((fr+k)%14<5)P(x,X+(k%10),Y+((k>>4)%14),4,1,'#cfe6f6')}
if(g==='-'){const o=(fr+a*3)%16;P(x,X+3,Y+o,1,3,'#b5dcf2');P(x,X+11,Y+((o+8)%16),1,3,'#b5dcf2')}
const key=a+','+y;if(ER.has(key)&&!PATCH[ER.get(key)].done){const pi=ER.get(key),core=PATCH[pi].core;x.drawImage(sk,a*T,y*T,T,T,X,Y,T,T);
const nb=(dx,dy)=>{const k2=(a+dx)+','+(y+dy);return ER.has(k2)&&ER.get(k2)===pi};const ec=core?'#e0b040':'#cfc7b5';
if(!nb(0,-1))for(let i=0;i<16;i++)P(x,X+i,Y+(hsh(a*16+i,y)%2),1,1,ec);if(!nb(0,1))for(let i=0;i<16;i++)P(x,X+i,Y+15-(hsh(a*16+i,y+1)%2),1,1,ec);if(!nb(-1,0))for(let i=0;i<16;i++)P(x,X+(hsh(a,y*16+i)%2),Y+i,1,1,ec);if(!nb(1,0))for(let i=0;i<16;i++)P(x,X+15-(hsh(a+1,y*16+i)%2),Y+i,1,1,ec);
if((fr+a*5+y*3)%23===0)P(x,X+(hsh(a,y)%14),Y+(hsh(y,a)%14),2,2,'#ffd86b')}}
if(!gateOpen){x.globalAlpha=0.55+0.1*Math.sin(fr/6);for(let y=17;y<=22;y++)for(let i=0;i<3;i++){const X=46*T-cam.x+((fr*0.4+i*11+y*7)%30),Y=y*T-cam.y+i*5;P(x,X,Y,18,4,'#f6f3ea')}x.globalAlpha=1}
SPOTS.forEach(s=>{if(!save.read[s.id]&&(fr+s.tx)%16<8)P(x,s.tx*T+13-cam.x,s.ty*T-2-cam.y,2,2,'#ffd86b')});
const lt=BLD.find(b=>b.tower);x.globalAlpha=0.25+0.1*Math.sin(fr/5);disc(x,(lt.x*T+lt.w*T/2)-cam.x,lt.y*T+9-cam.y,9,'#ffe9a0');x.globalAlpha=1;
[...NPCS.map(n=>({y:n.y,d:()=>drawChar(n,false)})),{y:pl.y,d:()=>drawChar(pl,true)}].sort((a,b)=>a.y-b.y).forEach(o=>o.d());
x.drawImage(over,-cam.x,-cam.y);if(!busy)drawGoal();
const t=busy?null:near();if(t){const o=t.ref;if(t.type==='npc')bubble(Math.round(o.x-cam.x),Math.round(o.y-cam.y)-26+(o.owl?-4:0));else if(t.type==='spot')star(o.tx*T+8-cam.x,o.ty*T-6-cam.y);else if(t.type==='door')star(o.dx*T+8-cam.x,o.dy*T-cam.y);else if(t.type==='patch')star(Math.round(pl.x-cam.x),Math.round(pl.y-cam.y)-26)}
const lab=t?({npc:t.ref&&t.ref.n+'에게 말 걸기',spot:t.ref&&t.ref.n+' 읽기',door:t.ref&&t.ref.n+' 들어가기',patch:t.ref&&(t.ref.core?'핵심 자리 다시 쓰기 · 가루 6':'다시 쓰기 · 가루 3'),gate:'막힌 길 살펴보기'})[t.type]:'';if(lab!==lastAct){lastAct=lab;$('act').textContent=lab;$('act').hidden=!lab}
sp=sp.filter(p=>p.t-->0);sp.forEach(p=>{p.y-=0.5;P(x,p.a-cam.x,p.y-cam.y,1,3,'#ffd86b');P(x,p.a-1-cam.x,p.y+1-cam.y,3,1,'#fff3c4')});
if(mmOpen&&tk%6===0)drawMini()}
const mc=$('mmc').getContext('2d');
function drawMini(){const CL={'~':'#3a6ea5','-':'#5aa6dc','b':'#a07850','#':'#6b5a48','^':'#8fbd52',':':'#d9b87e','s':'#e0cc98','q':'#cdb488','H':'#b9ad98'};
for(let y=0;y<MH;y++)for(let a=0;a<MW;a++){let col='#14112a';if(EXP[y][a]){const o=O[y][a],k=a+','+y;col=CL[G[y][a]]||'#7db546';if(o==='T')col='#2f5f35';if(o==='B')col='#c0805a';if(o==='X')col='#ffffff';if(o==='K')col=SPOTS.some(s=>s.tx===a&&s.ty===y&&!save.read[s.id])?'#f48fb1':'#c9a24a';if(ER.has(k)&&!PATCH[ER.get(k)].done)col='#f6f3ea'}mc.fillStyle=col;mc.fillRect(a*2,y*2,2,2)}
if(fr%4<3){mc.fillStyle='#ffd86b';mc.fillRect(Math.floor(pl.x/T)*2-1,Math.floor(pl.y/T)*2-1,3,3)}const g=goal();if(fr%8<5){mc.fillStyle='#ff7a3a';mc.fillRect(Math.floor(g.x/T)*2-1,Math.floor(g.y/T)*2-1,3,3)}}
function toggleMap(){mmOpen=!mmOpen;$('mmc').hidden=!mmOpen;$('mmb').textContent=mmOpen?'지도 접기 ▴':'지도 ▾';$('mmb').setAttribute('aria-expanded',String(mmOpen));if(mmOpen)drawMini()}
$('mmb').onclick=toggleMap;
if(window.matchMedia&&matchMedia('(pointer: coarse)').matches){$('pad').hidden=false;$('btns').hidden=false}
document.querySelectorAll('#pad button').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});
$('bJ').addEventListener('pointerdown',e=>{e.preventDefault();jump()});$('bA').addEventListener('pointerdown',e=>{e.preventDefault();if(dl)nextDlg();else if(!busy)interact(near())});
hud();drawMini();toast('위아래로 걸어 보세요. J 키로 점프!');setInterval(frame,50);
</script>
