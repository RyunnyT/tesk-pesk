<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Gowun+Dodum&display=swap">
<style>

<body>
<div class="wrap">
<h1>아르카 연대기 배경</h1>
<p class="lead">마이룸 오른쪽 문으로 나가 모험을 시작해요. 몬스터를 물리치고 퀘스트를 끝내면 별빛 가루가 모이고, 그 가루로 하얗게 지워진 곳을 다시 써요. 문 위에 화살표가 뜬 건물은 들어갈 수 있고, 왼쪽 위 지도(M 키)에서 가 본 곳을 확인할 수 있어요. 전투에서는 1·2·3 키나 버튼으로 스킬을 써요.</p>
<div class="stage" id="stage"><canvas id="cv" width="320" height="180" aria-label="아르카 연대기 맵"></canvas>
<div class="hud"><span id="hp"></span><span id="hs"></span><span id="hh" class="hh"></span><span id="hl"></span></div><div class="trk" id="trk" hidden></div><button class="lb" id="lb" type="button">로비로 돌아가기</button><div class="mm" id="mm"><button id="mmb" type="button" aria-expanded="false">지도 ▾</button><div class="mmp" id="mmp" hidden></div></div><div class="box book" id="book" role="dialog" aria-label="책 읽기" hidden><button class="cx" id="bx" type="button" aria-label="닫기">×</button><div class="bk" id="bk"></div></div>
<div class="toast" id="toast" hidden></div>
<button class="act" id="act" type="button" hidden></button>
<div class="box dlg" id="dlg" hidden><b id="dn"></b><p id="dt"></p><div class="dch" id="dch" hidden></div><span class="nx" id="dnx">다음 ▼</span></div>
<div class="box panel" id="panel" role="dialog" aria-label="마이룸" hidden><button class="cx" id="px" type="button" aria-label="닫기">×</button><div class="tabs" id="tabs"></div><div class="pc" id="pc"></div></div>
<div class="box quiz" id="quiz" role="dialog" aria-label="별빛 문제" hidden><button class="cx" id="qx" type="button" aria-label="닫기">×</button><b id="qt">별빛 문제</b><p class="qh" id="qh" hidden></p><div class="qq" id="qq"></div><div class="qc" id="qc"></div><div class="qs" id="qs" hidden></div><p class="qm" id="qm"></p><button class="run" id="qrun" type="button" hidden>도망가기</button></div>
</div>

</div>
<script>
const W=320,H=180,X0=192,COLS=8,PAPER='#f6f3ea';
const cv=document.getElementById('cv'),x=cv.getContext('2d');
const mk=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;return c};
const skyC=mk(),scC=mk(),skC=mk(),s=skyC.getContext('2d'),g=scC.getContext('2d'),k=skC.getContext('2d');
let seed=1;const rn=()=>(seed=(seed*16807)%2147483647)/2147483647;
const P=(c,a,y,w,h,col)=>{c.fillStyle=col;c.fillRect(Math.round(a),Math.round(y),w,h)};
const disc=(c,cx,cy,r,col)=>{for(let dy=-r;dy<=r;dy++){const w=Math.floor(Math.sqrt(r*r-dy*dy));P(c,cx-w,cy+dy,2*w+1,1,col)}};
const BY=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
function dith(c,pal,y0,y1){const n=pal.length-1;for(let y=y0;y<y1;y++){const t=(y-y0)/Math.max(1,y1-y0-1)*n,b=Math.floor(t),f=t-b;for(let a=0;a<W;a++)P(c,a,y,1,1,pal[f>(BY[y%4][a%4]+0.5)/16?Math.min(b+1,n):b])}}
function tex(c,y0,y1,cols,n,x0=0,x1=W){for(let i=0;i<n;i++)P(c,x0+rn()*(x1-x0),y0+rn()*(y1-y0),1,1,cols[i%cols.length])}
function fg(c,c1,c2){for(let a=0;a<W;a+=2){const h=3+Math.floor(rn()*7);P(c,a,180-h,1,h,c1);if(rn()<0.6)P(c,a+1,182-h,1,h-2,c2)}}
function pathH(c,fn,cl,hw){for(let a=0;a<W;a++){const yc=fn(a);P(c,a,yc-hw-1,1,2*hw+3,cl[0]);P(c,a,yc-hw,1,2*hw+1,cl[1]);P(c,a,yc-2,1,4,cl[2]);if(rn()<0.3)P(c,a,yc-hw-2,1,2,cl[3]);if(rn()<0.3)P(c,a,yc+hw+1,1,2,cl[3]);if(rn()<0.08)P(c,a,yc-hw+2+rn()*(2*hw-4),2,1,cl[4])}}
function tree(c,cx,y,p,t){P(c,cx-1,y-9,3,9,t||'#7a5236');P(c,cx,y-9,1,9,'#5e3f29');disc(c,cx,y-15,9,p[0]);disc(c,cx-1,y-16,8,p[1]);disc(c,cx-2,y-18,6,p[2]);disc(c,cx-4,y-20,3,p[3])}
function pine(c,cx,y,h,c1,c2,sn){P(c,cx-1,y-3,3,4,'#4a3424');const tl=Math.ceil(h/3);for(let i=0;i<h;i++){const tr=i%tl,w=Math.floor(tr*0.7+i*0.18)+1,yy=y-h+i-3;P(c,cx-w,yy,2*w+1,1,c1);P(c,cx-w,yy,Math.max(1,w),1,c2);if(sn&&tr<2)P(c,cx-w,yy,2*w+1,1,sn)}}
function house(c,a,y,o){const w=o.w||26,h=o.h||17,O=o.O||'#5b3a29';P(c,a-1,y-h-1,w+2,h+2,O);P(c,a,y-h,w,h,o.wall);P(c,a+w-4,y-h,4,h,o.shade);P(c,a,y-2,w,2,o.shade);
for(let i=0;i<13;i++){const L=a-4+i,Wd=w+8-2*i;if(Wd<=0)break;P(c,L-1,y-h-1-i,Wd+2,1,O);P(c,L,y-h-1-i,Wd,1,i%3===0?o.roofD:o.roof);P(c,L,y-h-1-i,2,1,o.roofL)}
const dx=a+Math.floor(w/2)-3;P(c,dx,y-10,7,10,O);P(c,dx+1,y-9,5,9,o.door||'#8a5a3b');P(c,dx+5,y-5,1,1,'#ffd86b');
[a+3,a+w-7].forEach(wx=>{P(c,wx-1,y-14,6,6,O);P(c,wx,y-13,4,4,o.win||'#9fd0f0');if(!o.lit)P(c,wx,y-13,2,2,'#d6eefa');P(c,wx-1,y-8,6,2,'#a0522d');P(c,wx,y-9,1,1,'#f48fb1');P(c,wx+2,y-9,1,1,'#ffd54f')});
if(o.chim){P(c,a+w-9,y-h-13,5,9,O);P(c,a+w-8,y-h-12,3,8,'#9a8a7a')}}
function clouds(c,list,c1,c2){list.forEach(q=>{q.x+=0.12*q.s;if(q.x>W+20)q.x=-40;const cx=Math.round(q.x),cy=q.y;disc(c,cx,cy,6,c1);disc(c,cx+8,cy-3,8,c1);disc(c,cx+17,cy,6,c1);P(c,cx-6,cy,30,6,c1);P(c,cx-5,cy+5,28,2,c2)})}
function twinkle(c,fr,n,ym){for(let i=0;i<n;i++)if((fr+i*7)%23<3){const a=(i*53)%W,y=(i*29)%ym;P(c,a-1,y,3,1,'#ffffff');P(c,a,y-1,1,3,'#ffffff')}}
function smoke(c,fr,ox,oy,run){const t0=run?fr:0;for(let q=0;q<4;q++){const t=(t0*0.6+q*9)%36;c.globalAlpha=Math.max(0,1-t/36)*0.85;disc(c,Math.round(ox+Math.sin((t0+q*10)/8)*1.5+t*0.2),Math.round(oy-t),2+Math.floor(t/12),'#eef2f5')}c.globalAlpha=1}

function lumen(au){const cl=[{x:10,y:22,s:1},{x:140,y:38,s:0.7},{x:220,y:14,s:1.2}];
const TP=au?['#8a3a1c','#b4532b','#d0743a','#eba64a']:['#3f7a2a','#4a8530','#5a9e3a','#78b84a'];
const GR=au?['#a6b856','#93a548','#b9c96a','#8fa245']:['#8cc152','#7db546','#9bcc5f','#79b041'];
const pathY=a=>148+Math.round(5*Math.sin(a/34));
return{top:104,paint(){
