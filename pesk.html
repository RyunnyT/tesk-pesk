let bankActiveTab = 'dashboard';
// myDeposits는 loadData()에서 Firebase 기준으로 채워짐
const DEFAULT_BANK_PLANS = [
  {id:'w1', label:'1주일', days:7, rate:0.5},
  {id:'w2', label:'2주일', days:14, rate:1.2},
  {id:'m1', label:'1개월', days:30, rate:3.0},
  {id:'m3', label:'3개월', days:90, rate:10.0},
  {id:'m6', label:'6개월', days:180, rate:25.0},
];
let BANK_PLANS = DEFAULT_BANK_PLANS.map(p=>({...p}));
// 서버 상품표(tesk-bank-plans)에서 상품을 찾는다. 비어 있으면 기본 상품표(loadData와 같은 규칙).
function _serverBankPlan(serverPlans, planId){
  const list = Array.isArray(serverPlans) && serverPlans.length ? serverPlans : DEFAULT_BANK_PLANS;
  const p = list.find(x=>x && x.id===planId);
  if(!p) return null;
  const rate = Number(p.rate), days = Number(p.days);
  if(!Number.isFinite(rate) || rate < 0 || !Number.isFinite(days) || days <= 0) return null;
  return {id:p.id, label:String(p.label||''), rate, days};
}
let bankBadgeBonus = 0; // 배지 이율 가산 기능 제거됨
function _myBadgeCount(){ return (studentBadges[myStudentNum]||[]).length; }
function _bonusRate(){ return 0; }
function _effectiveRate(planRate){ return planRate; }
function _depositValueNow(dep){
  const elapsedMs = Date.now() - new Date(dep.startDate).getTime();
  const elapsedDays = Math.max(0, elapsedMs/(1000*60*60*24));
  const progress = Math.min(1, elapsedDays/dep.termDays);
  // 만기 전 중도해지시 이율의 30%만 적용
  const effRate = progress>=1 ? dep.rate/100 : (dep.rate/100)*0.3*progress;
  return Math.floor(dep.amount * (1 + effRate));
}
function _depositMaturedValue(dep){
  return Math.floor(dep.amount * (1 + dep.rate/100));
}

// 예금 만기 도래 시 학생 알림 (기기별 1회)
function checkDepositMaturityNotices(){
  try{
    if(!myStudentNum || !Array.isArray(myDeposits) || !myDeposits.length) return;
    const seenKey = 'pesk-deposit-matured-seen-' + myStudentNum;
    let seen = [];
    try{ seen = JSON.parse(localStorage.getItem(seenKey)||'[]'); }catch(_e){}
    const seenSet = new Set(seen);
    let changed = false;
    myDeposits.forEach(dep=>{
      if(!dep || !dep.startDate || !dep.termDays) return;
      const id = String(dep.id || (dep.startDate + '|' + dep.amount + '|' + dep.termDays));
      if(seenSet.has(id)) return;
      const elapsedDays = (Date.now() - new Date(dep.startDate).getTime()) / (1000*60*60*24);
      if(elapsedDays < Number(dep.termDays)) return;
      seenSet.add(id);
      changed = true;
      const value = _depositMaturedValue(dep);
      addNotif('🏦 예금 만기! ' + Number(dep.amount||0).toLocaleString() + ' 🪙 예금이 만기됐어요. 지금 찾으면 ' + value.toLocaleString() + ' 🪙을 받아요!');
    });
    if(changed) localStorage.setItem(seenKey, JSON.stringify([...seenSet].slice(-100)));
  }catch(e){
    console.warn('deposit maturity check failed', e);
  }
}
function _depositValueAt(dep, nowMs){
  const start = new Date(dep.startDate).getTime();
  const termDays = Number(dep.termDays||0);
  const amount = Number(dep.amount||0);
  if(!start || !termDays || !amount) return Math.floor(amount);
  const elapsedDays = Math.max(0, (Number(nowMs||Date.now()) - start)/(1000*60*60*24));
  const progress = Math.min(1, elapsedDays/termDays);
  const rate = Number(dep.rate||0) / 100;
  const effRate = progress>=1 ? rate : rate*0.3*progress;
  return Math.floor(amount * (1 + effRate));
}
function _economyListFromDoc(allData, merger){
  return _canonicalEconomyList(allData||{}, merger);
}
function _buildAssetSnapshot(cash, portfolioList, depositList, prices, nowMs){
  const at = Number(nowMs||Date.now());
  const holdings = (Array.isArray(portfolioList)?portfolioList:[])
    .filter(p=>Number(p?.qty||0)>0)
    .map(p=>{
      const qty = Number(p.qty||0);
      const price = Number((prices||{})[p.code]||p.avgPrice||0);
      return {
        code:p.code||'',
        name:p.name||p.code||'',
        qty,
        price,
        value:Math.round(qty*price)
      };
    });
  const deposits = (Array.isArray(depositList)?depositList:[]).map(d=>{
    const value = _depositValueAt(d, at);
    return {
      id:d.id||'',
      label:d.label||d.planId||'예금',
      amount:Number(d.amount||0),
      rate:Number(d.rate||0),
      termDays:Number(d.termDays||0),
      value
    };
  });
  const stockValue = holdings.reduce((sum,h)=>sum+Number(h.value||0),0);
  const depositTotal = deposits.reduce((sum,d)=>sum+Number(d.value||0),0);
  const cashValue = Math.round(Number(cash||0));
  return {
    cash: cashValue,
    stockValue: Math.round(stockValue),
    depositTotal: Math.round(depositTotal),
    total: Math.round(cashValue + stockValue + depositTotal),
    stockHoldings: holdings,
    deposits,
    asOf: new Date(at).toISOString()
  };
}
function _isDepositMatured(dep){
  const elapsedMs = Date.now() - new Date(dep.startDate).getTime();
  return elapsedMs >= dep.termDays*24*60*60*1000;
}

  let body = '';

  const blockKind = bankActiveTab==='stock' ? 'stock' : (bankActiveTab==='bank' ? 'bank' : '');
  const blockNotice = blockKind && economyBlocked(blockKind)
    ? '<div style="padding:10px 12px;border:1px solid #fecaca;background:#fff1f2;color:#b91c1c;border-radius:10px;font-size:12px;font-weight:800;line-height:1.5;margin-bottom:12px;">' + escHtml(economyBlockReason(blockKind)) + '</div>'
    : '';
  return tabBar + blockNotice + '<div id="bank-tab-body">' + body + '</div>';
}

function switchBankTab(tab){
  bankActiveTab = tab;

// 주식 탭: 투자 현황 + 매매 시장
function buildStockTab(me, coins){
  // 투자 현황
  let investRows = '';
  if(myPortfolio.length > 0){
    investRows = myPortfolio.map(p=>{
      const curPrice = stockPrices[p.code] || p.avgPrice;
      const totalVal = curPrice * p.qty;
      const gain = (curPrice - p.avgPrice) * p.qty;
      const gainPct = ((curPrice - p.avgPrice)/p.avgPrice*100).toFixed(1);
      const isUp = gain >= 0;
      return '<div class="port-item" style="flex-wrap:wrap;">'
        + '<div class="port-icon">📊</div>'
        + '<div class="port-name"><div class="pn-name">' + escHtml(p.name) + '</div><div class="pn-qty">' + p.qty + '주 · 평균 ' + p.avgPrice.toLocaleString() + '🪙</div></div>'
        + '<div class="port-value"><div class="pv-amount ' + (isUp?'up':'down') + '">' + totalVal.toLocaleString() + '🪙</div><div class="pv-change ' + (isUp?'up':'down') + '">' + (isUp?'▲':'▼') + Math.abs(gainPct) + '%</div></div>'
        + '<div style="width:100%;display:flex;gap:6px;margin-top:8px;padding-left:40px;">'
        + '<input type="number" id="sell-qty-' + p.code + '" placeholder="매도 수량" min="1" max="' + p.qty + '" style="flex:1;padding:6px 8px;border:1px solid #e5e7eb;border-radius:8px;font-size:11px;">'
        + '<button onclick="sellStockPesk(\'' + p.code + '\',\'' + escHtml(p.name) + '\',' + curPrice + ',\'sell-qty-' + p.code + '\')" style="padding:6px 14px;background:#ef4444;color:#fff;border:none;border-radius:8px;font-weight:700;font-size:11px;cursor:pointer;">매도</button>'
        + '<button onclick="sellStockPesk(\'' + p.code + '\',\'' + escHtml(p.name) + '\',' + curPrice + ',\'sell-qty-' + p.code + '\',' + p.qty + ')" style="padding:6px 10px;background:#fef3c7;color:#92400e;border:1px solid #fde68a;border-radius:8px;font-weight:700;font-size:11px;cursor:pointer;">전량</button>'
        + '</div>'
        + '</div>';
    }).join('');
  } else {
    investRows = '<div class="empty-state" style="padding:16px 0;"><span class="empty-icon">📊</span>아직 보유 중인 주식이 없어요</div>';
  }
  const myInvest = '<div class="bank-coin-card"><div class="bcc-label">💰 현재 현금</div><div class="bcc-amount">' + coins.toLocaleString() + ' 🪙</div></div>'
    + '<div class="bank-section"><div class="bank-section-header"><span class="bank-section-title">📈 내 투자 현황</span></div><div class="bank-section-body">' + investRows + '</div></div>';

  // 주식 시장 (항상 표시)
  const market = '<div class="bank-section"><div class="bank-section-header"><span class="bank-section-title">🏪 주식 시장</span></div><div class="bank-section-body">' + buildTradeView(me) + '</div></div>';

  return myInvest + market;
}

      </div>

// 서버 경제 모드(USE_SERVER_ECONOMY): 예금·주식 거래를 Cloud Functions(functions/bank.js)가 처리한다.
// 플래그가 꺼져 있으면 null → 아래의 기존 트랜잭션 경로를 그대로 쓴다.
function _serverBank(){
  const api = window._economyApi;
  return (window.TESK_USE_SERVER_ECONOMY && api && api.bankDeposit) ? api : null;
}
async function _runServerBank(label, call){
  try{
    const r = await call();
    await refreshEconomyFromServer(true);
    return r;
  }catch(e){
    alert(label + ' 실패: ' + (e?.message || '잠시 후 다시 시도해주세요.'));
    await refreshEconomyFromServer(true);
    return null;
  }
}

function createDeposit(...args){return economyOnce('deposit-create',()=>_createDeposit(...args));}
async function _createDeposit(planId){
  if(!(await ensureActiveStudentSession(false))) return;
  if(economyBlocked('bank')) return economyBlockedNotice('bank');
  const plan = BANK_PLANS.find(p=>p.id===planId);
  if(!plan) return;
  const amt = Number(document.getElementById('dep-amt-'+planId).value)||0;
  if(!Number.isSafeInteger(amt)||amt<10) return alert('10 🪙 이상의 정수로 예금해주세요');
  const me = await ensurePointsFresh(amt);
  if(!me || me.points < amt) return alert('보유 금액이 부족해요');
  const effRate = _effectiveRate(plan.rate);
  if(!confirm(`${amt.toLocaleString()} 🪙을 ${plan.label} 예금(+${effRate.toFixed(1)}%)에 예치할까요?\n만기 ${plan.days}일 후: ${Math.floor(amt*(1+effRate/100)).toLocaleString()} 🪙`)) return;
  const serverApi = _serverBank();
  if(serverApi){
    const r = await _runServerBank('예금', ()=>serverApi.bankDeposit(roomId, plan.id, amt));
    if(r) addTxn(`🏦 ${plan.label} 예금`, amt, 'spend');
    switchBankTab('bank');
    return;
  }

  let txResult = null;
  try{
    const db = window._db;
    const studentsRef = window._fsDoc(db,'classrooms',roomId,'data','tesk-students');
    const depositsRef = window._fsDoc(db,'classrooms',roomId,'data','pesk-deposits');
    const portfoliosRef = window._fsDoc(db,'classrooms',roomId,'data','pesk-portfolios');
    const stockPricesRef = window._fsDoc(db,'classrooms',roomId,'data','tesk-stock-prices');
    const plansRef = window._fsDoc(db,'classrooms',roomId,'data','tesk-bank-plans');
    await window._fsRunTxn(db, async (txn)=>{
      const [studSnap, depSnap, portSnap, priceSnap, planSnap] = await Promise.all([txn.get(studentsRef), txn.get(depositsRef), txn.get(portfoliosRef), txn.get(stockPricesRef), txn.get(plansRef)]);
      const allStudents = studSnap.exists() ? (studSnap.data().value||[]) : [];
      const allDeposits = depSnap.exists() ? (depSnap.data().value||{}) : {};
      const allPortfolios = portSnap.exists() ? (portSnap.data().value||{}) : {};
      const serverPrices = priceSnap.exists() ? (priceSnap.data().value||{}) : {};
      // 이율·기간은 화면의 값이 아니라 선생님이 저장한 상품표로 다시 확인한다.
      const serverPlan = _serverBankPlan(planSnap.exists() ? planSnap.data().value : null, plan.id);
      if(!serverPlan) throw new Error('PLAN_CHANGED');
      if(Number(serverPlan.rate)!==Number(effRate) || Number(serverPlan.days)!==Number(plan.days)) throw new Error('PLAN_CHANGED');
      const stuIdx=allStudents.findIndex(s=>Number(s.num)===Number(myStudentNum));
      if(stuIdx < 0) throw new Error('STUDENT_NOT_FOUND');
      const beforePoints = Number(allStudents[stuIdx].points||0);
      if(beforePoints < amt) throw new Error('INSUFFICIENT_BALANCE:'+beforePoints);
      const afterPoints = beforePoints - amt;
      allStudents[stuIdx].points = afterPoints;

      const current = _canonicalEconomyList(allDeposits, _mergeDepositLists);
      const beforeDeposits = current.map(d=>({...d}));
      const myPortForSnapshot = _economyListFromDoc(allPortfolios, _mergePortfolioLists);
      const snapAt = Date.now();
      const dep = {id:uid(),accountUid:myAccountUid,studentNum:myStudentNum,planId:serverPlan.id,label:serverPlan.label,amount:amt,rate:Number(serverPlan.rate),termDays:Number(serverPlan.days),startDate:new Date(snapAt).toISOString()};
      current.push(dep);
      const assetBefore = _buildAssetSnapshot(beforePoints, myPortForSnapshot, beforeDeposits, serverPrices, snapAt);
      const assetAfter = _buildAssetSnapshot(afterPoints, myPortForSnapshot, current, serverPrices, snapAt);
      _setMyEconomyList(allDeposits, current);

      txn.set(studentsRef,{value:allStudents,updatedAt:new Date().toISOString()});
      txn.set(depositsRef,{value:allDeposits,updatedAt:new Date().toISOString()});
      txResult = { allStudents, myDeposits: current, dep, beforePoints, afterPoints, assetBefore, assetAfter };
    });
  }catch(e){
    if(String(e?.message||'').startsWith('INSUFFICIENT_BALANCE:')){
      const balance = Number(String(e.message).split(':')[1]||0);
      alert('현재 보유 금액이 부족해요.\n필요: '+amt.toLocaleString()+' 🪙\n보유: '+balance.toLocaleString()+' 🪙');
      return;
    }
    if(String(e?.message||'')==='PLAN_CHANGED'){
      alert('선생님이 예금 상품을 바꿨어요. 화면을 새로 불러온 뒤 다시 예금해주세요.');
      await refreshEconomyFromServer(true);
      return;
    }
    alert('예금 실패: '+e.message);
    return;
  }

  students = txResult?.allStudents || students;
  myDeposits = txResult?.myDeposits || myDeposits;
  localTxns.unshift({type:'spend',desc:`🏦 ${plan.label} 예금`,amount:amt,date:new Date().toLocaleDateString('ko-KR')});
  localStorage.setItem(TXN_KEY(),JSON.stringify(localTxns));
  await pushEconLog({
    type:'bank_deposit',
    detail:`${plan.label} 예금`,
    delta:-amt,
    balanceBefore:Number(txResult?.beforePoints||0),
    balanceAfter:Number(txResult?.afterPoints||0),
    assetBefore:txResult?.assetBefore,
    assetAfter:txResult?.assetAfter,
    meta:{depositId:txResult?.dep?.id, planId:plan.id, planLabel:plan.label, rate:effRate, termDays:plan.days}
  });
  await refreshEconomyFromServer(false);
  switchBankTab('bank');
}

function withdrawDeposit(...args){return economyOnce('deposit-withdraw',()=>_withdrawDeposit(...args));}
async function _withdrawDeposit(idx, matured){
  if(!(await ensureActiveStudentSession(false))) return;
  const dep = myDeposits[idx]; if(!dep) return;
  const val = matured ? _depositMaturedValue(dep) : _depositValueNow(dep);
  const label = matured ? '만기 수령' : '중도 해지';
  if(!confirm(`${label}하시겠어요?\n수령액: ${val.toLocaleString()} 🪙${!matured?'\n(만기 전 해지는 이율의 30%만 적용돼요)':''}`)) return;
  const serverApi = _serverBank();
  if(serverApi){
    const r = await _runServerBank('예금 해지', ()=>serverApi.bankWithdraw(roomId, dep.id, matured));
    if(r) addTxn(`🏦 예금 ${label}`, Number(r.payout||0), 'earn');
    switchBankTab('bank');
    return;
  }

  let txResult = null;
  try{
    const db = window._db;
    const studentsRef = window._fsDoc(db,'classrooms',roomId,'data','tesk-students');
    const depositsRef = window._fsDoc(db,'classrooms',roomId,'data','pesk-deposits');
    const portfoliosRef = window._fsDoc(db,'classrooms',roomId,'data','pesk-portfolios');
    const stockPricesRef = window._fsDoc(db,'classrooms',roomId,'data','tesk-stock-prices');
    await window._fsRunTxn(db, async (txn)=>{
      const [studSnap, depSnap, portSnap, priceSnap] = await Promise.all([txn.get(studentsRef), txn.get(depositsRef), txn.get(portfoliosRef), txn.get(stockPricesRef)]);
      const allStudents = studSnap.exists() ? (studSnap.data().value||[]) : [];
      const allDeposits = depSnap.exists() ? (depSnap.data().value||{}) : {};
      const allPortfolios = portSnap.exists() ? (portSnap.data().value||{}) : {};
      const serverPrices = priceSnap.exists() ? (priceSnap.data().value||{}) : {};
      const stuIdx=allStudents.findIndex(s=>Number(s.num)===Number(myStudentNum));
      if(stuIdx < 0) throw new Error('STUDENT_NOT_FOUND');

      const current = _canonicalEconomyList(allDeposits, _mergeDepositLists);
      const depIdx = current.findIndex(d=>String(d.id)===String(dep.id));
      if(depIdx < 0) throw new Error('DEPOSIT_NOT_FOUND');
      const latestDep = current[depIdx];
      if(matured&&!_isDepositMatured(latestDep))throw new Error('아직 만기가 되지 않은 예금이에요.');
      const payout=_isDepositMatured(latestDep)?_depositMaturedValue(latestDep):_depositValueNow(latestDep);
      if(!Number.isSafeInteger(payout)||payout<0)throw new Error('예금 금액을 확인해주세요.');
      const beforePoints = Number(allStudents[stuIdx].points||0);
      const afterPoints = beforePoints + payout;
      allStudents[stuIdx].points = afterPoints;
      const beforeDeposits = current.map(d=>({...d}));
      current.splice(depIdx,1);
      const myPortForSnapshot = _economyListFromDoc(allPortfolios, _mergePortfolioLists);
      const snapAt = Date.now();
      const assetBefore = _buildAssetSnapshot(beforePoints, myPortForSnapshot, beforeDeposits, serverPrices, snapAt);
      const assetAfter = _buildAssetSnapshot(afterPoints, myPortForSnapshot, current, serverPrices, snapAt);
      _setMyEconomyList(allDeposits, current);

      txn.set(studentsRef,{value:allStudents,updatedAt:new Date().toISOString()});
      txn.set(depositsRef,{value:allDeposits,updatedAt:new Date().toISOString()});
      txResult = { allStudents, myDeposits: current, beforePoints, afterPoints, payout, dep: latestDep, assetBefore, assetAfter };
    });
  }catch(e){
    if(String(e?.message||'')==='DEPOSIT_NOT_FOUND'){
      alert('이미 해지되었거나 찾을 수 없는 예금이에요. 화면을 새로고침합니다.');
      switchBankTab('bank');
      return;
    }
    alert('예금 해지 실패: '+e.message);
    return;
  }

  students = txResult?.allStudents || students;
  myDeposits = txResult?.myDeposits || myDeposits;
  const payout = Number(txResult?.payout||val);
  const latestDep = txResult?.dep || dep;
  localTxns.unshift({type:'earn',desc:`🏦 예금 ${label}`,amount:payout,date:new Date().toLocaleDateString('ko-KR')});
  localStorage.setItem(TXN_KEY(),JSON.stringify(localTxns));
  await pushEconLog({
    type:'bank_withdraw',
    detail:`${latestDep.label||''} ${label}`,
    delta:payout,
    balanceBefore:Number(txResult?.beforePoints||0),
    balanceAfter:Number(txResult?.afterPoints||0),
    assetBefore:txResult?.assetBefore,
    assetAfter:txResult?.assetAfter,
    meta:{depositId:latestDep.id, planId:latestDep.planId, matured:!!matured}
  });
  await refreshEconomyFromServer(false);
  switchBankTab('bank');
}

function showBankSubView(view){

function filterStocks(query){
  const container = document.getElementById('stock-list-container');
  if(!container) return;
  const items = container.querySelectorAll('.stock-list-item');
  items.forEach(item=>{
    const name = item.querySelector('.s-name')?.textContent || '';
    item.style.display = name.toLowerCase().includes(query.toLowerCase()) ? 'block' : 'none';
  });
}

// 매수 진행 중 더블클릭 방지
let _stockBuyInProgress = false;

async function _buyStockPesk(code, name, _ignoredPrice){
  if(_stockBuyInProgress){ return; }
  if(!(await ensureActiveStudentSession(false))) return;
  if(economyBlocked('stock')) return economyBlockedNotice('stock');

  // ── 수량 검증 (정수 1~9999만 허용) ──
  const qtyEl = document.getElementById('qty-'+code);
  const qtyRaw = qtyEl ? qtyEl.value : '';
  const qty = parseInt(qtyRaw, 10);
  if(!Number.isFinite(qty) || qty <= 0 || qty > 9999 || String(qty) !== String(qtyRaw).trim()){
    alert('정확한 수량을 입력하세요 (1~9999 사이의 정수).');
    return;
  }

  // ── 가격은 클라 인자가 아닌 stockPrices에서 직접 fetch (사용자 조작·stale 방지) ──
  let livePrice = Number(stockPrices && stockPrices[code]);
  if(!Number.isFinite(livePrice) || livePrice <= 0){
    alert('주식 가격 정보를 불러오는 중이에요. 잠시 후 다시 시도해주세요.');
    return;
  }
  // stale 우려에 대비해 트랜잭션 직전 한 번 더 Firestore에서 확인하기 위해 별도 fetch
  // (트랜잭션 내부에선 가격 doc을 read해서 다시 검증)

  const totalCost = livePrice * qty;
  if(!Number.isFinite(totalCost) || totalCost <= 0){
    alert('금액 계산 오류: '+totalCost);
    return;
  }

  const me = await ensurePointsFresh(totalCost);
  if(!me){ alert('학생 정보를 찾을 수 없어요.'); return; }
  // 클라이언트 1차 체크 (UX용 — 진짜 검증은 트랜잭션 내부에서)
  const myCash = Number(me.points || 0);
  if(myCash < totalCost){
    alert('코인이 부족해요!\n필요: '+totalCost.toLocaleString()+' 🪙\n보유 현금: '+myCash.toLocaleString()+' 🪙\n(주식·예금은 매수에 사용할 수 없어요)');
    return;
  }
  if(!confirm(name+' '+qty+'주를 '+totalCost.toLocaleString()+' 🪙에 매수하시겠어요?\n(개당 '+livePrice.toLocaleString()+' 🪙)')) return;
  const serverApi = _serverBank();
  if(serverApi){
    _stockBuyInProgress = true;
    try{
      const r = await _runServerBank('매수', ()=>serverApi.stockBuy(roomId, code, name, qty, livePrice));
      if(r){
        if(qtyEl) qtyEl.value = '';
        addTxn(name+' '+qty+'주 매수', Number(r.cost||totalCost), 'spend');
        alert('✅ '+name+' '+qty+'주 매수 완료! ('+Number(r.cost||totalCost).toLocaleString()+' 🪙 차감)');
      }
    }finally{ _stockBuyInProgress = false; }
    return;
  }

  _stockBuyInProgress = true;
  try {
    const db = window._db;
    const studentsRef = window._fsDoc(db,'classrooms',roomId,'data','tesk-students');
    const portfoliosRef = window._fsDoc(db,'classrooms',roomId,'data','pesk-portfolios');
    const depositsRef = window._fsDoc(db,'classrooms',roomId,'data','pesk-deposits');
    const stockPricesRef = window._fsDoc(db,'classrooms',roomId,'data','tesk-stock-prices');

    let txResult = null;
    await window._fsRunTxn(db, async (txn)=>{
      const studSnap = await txn.get(studentsRef);
      const portSnap = await txn.get(portfoliosRef);
      const depSnap = await txn.get(depositsRef);
      const priceSnap = await txn.get(stockPricesRef);
      const allStudents = studSnap.exists() ? (studSnap.data().value || []) : [];
      const allPortfolios = portSnap.exists() ? (portSnap.data().value || {}) : {};
      const allDeposits = depSnap.exists() ? (depSnap.data().value || {}) : {};
      const serverPrices = priceSnap.exists() ? (priceSnap.data().value || {}) : {};

      const stuIdx=allStudents.findIndex(s=>Number(s.num)===Number(myStudentNum));
      if(stuIdx < 0) throw new Error('STUDENT_NOT_FOUND');

      // ── 서버에서 가격을 다시 가져와 트랜잭션 시점 가격으로 검증 ──
      const serverPrice = Number(serverPrices[code]);
      if(!Number.isFinite(serverPrice) || serverPrice <= 0){
        throw new Error('PRICE_UNAVAILABLE');
      }
      // 가격이 변동되어 있으면 서버 가격 사용 (사용자에게 손해 가지 않게: 더 비싸지면 fail, 더 싸지면 그대로 적용)
      if(serverPrice > livePrice){
        // 가격이 비싸졌음 — 사용자가 본 가격으로 살 수 없음
        throw new Error('PRICE_CHANGED:' + serverPrice);
      }
      const finalPrice = serverPrice; // 서버 가격이 같거나 싸지면 서버 가격 사용
      const finalTotalCost = finalPrice * qty;

      const beforePoints = Number(allStudents[stuIdx].points || 0);
      // ── 핵심 잔액 검증 (서버 기준 현금만 사용. 주식·예금 합산 절대 금지) ──
      if(beforePoints < finalTotalCost){
        throw new Error('INSUFFICIENT_BALANCE:' + beforePoints);
      }
      const afterPoints = beforePoints - finalTotalCost;
      // 이중 안전장치: afterPoints가 음수면 절대 진행 불가
      if(afterPoints < 0){
        throw new Error('NEGATIVE_BALANCE_GUARD');
      }
      allStudents[stuIdx].points = afterPoints;

      const key = myEconomyKey();
      const myPort = _canonicalEconomyList(allPortfolios, _mergePortfolioLists);
      const beforePort = myPort.map(p=>({...p}));
      const myDepsForSnapshot = _economyListFromDoc(allDeposits, _mergeDepositLists);
      const existing = myPort.find(p=>p.code===code);
      if(existing){
        const newQty = existing.qty + qty;
        existing.avgPrice = Math.round((existing.avgPrice*existing.qty + finalPrice*qty) / newQty);
        existing.qty = newQty;
        existing.studentNum = myStudentNum;
        existing.accountUid = myAccountUid;
      } else {
        myPort.push({code, name, qty, avgPrice: finalPrice, studentNum:myStudentNum, accountUid:myAccountUid});
      }
      _setMyEconomyList(allPortfolios, myPort);

      txn.set(studentsRef,{ value: allStudents, updatedAt: new Date().toISOString() });
      txn.set(portfoliosRef,{ value: allPortfolios, updatedAt: new Date().toISOString() });
      const snapAt = Date.now();
      const assetBefore = _buildAssetSnapshot(beforePoints, beforePort, myDepsForSnapshot, serverPrices, snapAt);
      const assetAfter = _buildAssetSnapshot(afterPoints, myPort, myDepsForSnapshot, serverPrices, snapAt);
      if(assetAfter.total !== assetBefore.total){
        throw new Error('ASSET_MISMATCH:' + assetBefore.total + ':' + assetAfter.total);
      }
      txResult = { allStudents, myPort, beforePoints, afterPoints, finalPrice, finalTotalCost, assetBefore, assetAfter };
    });

    await economyAfterCommit(async()=>{
    students = txResult?.allStudents || students;
    myPortfolio = txResult?.myPort || myPortfolio;
    if(qtyEl) qtyEl.value = '';
    const finalCost = txResult?.finalTotalCost || totalCost;
    const finalPrice2 = txResult?.finalPrice || livePrice;
    addTxn(name+' '+qty+'주 매수', finalCost, 'spend');
    await pushEconLog({
      type:'stock_buy',
      detail:`${name} ${qty}주 매수`,
      delta:-finalCost,
      balanceBefore:Number(txResult?.beforePoints||0),
      balanceAfter:Number(txResult?.afterPoints||0),
      assetBefore:txResult?.assetBefore,
      assetAfter:txResult?.assetAfter,
      meta:{code, name, qty, price: finalPrice2}
    });

    const meAfter = await refreshEconomyFromServer(false) || students.find(s=>s.num===myStudentNum) || me;
    const panel = document.getElementById('panel-stock');
    if(panel) panel.innerHTML = buildBankPanel(meAfter);
    alert('✅ '+name+' '+qty+'주 매수 완료! ('+finalCost.toLocaleString()+' 🪙 차감)');
    });
  } catch(e) {
    const msg = String(e?.message||'');
    if(msg.startsWith('INSUFFICIENT_BALANCE:')){
      const balance = Number(msg.split(':')[1]||0);
      alert('현금이 부족해요.\n필요: '+totalCost.toLocaleString()+' 🪙\n현재 보유 현금: '+balance.toLocaleString()+' 🪙\n(주식·예금은 매수에 직접 사용할 수 없어요. 매도하거나 예금을 해지해야 합니다.)');
      return;
    }
    if(msg.startsWith('PRICE_CHANGED:')){
      const newP = Number(msg.split(':')[1]||0);
      alert('주식 가격이 방금 변동됐어요.\n표시 가격: '+livePrice.toLocaleString()+' 🪙 → 현재 가격: '+newP.toLocaleString()+' 🪙\n다시 확인 후 매수해주세요.');
      return;
    }
    if(msg === 'PRICE_UNAVAILABLE'){
      alert('주식 가격 정보를 찾을 수 없어요. 잠시 후 다시 시도해주세요.');
      return;
    }
    if(msg==='SHOP_PRICE_CHANGED'||msg==='ITEM_UNAVAILABLE'){alert('상품의 가격이나 판매 상태가 바뀌었어요. 새로고침 후 다시 확인해주세요.');return;}
    if(msg === 'STUDENT_NOT_FOUND'){
      alert('학생 정보를 다시 불러오는 중이에요. 잠시 후 다시 시도해주세요.');
      return;
    }
    if(msg === 'NEGATIVE_BALANCE_GUARD'){
      alert('잔액 검증 오류. 매수가 차단됐어요.');
      return;
    }
    if(msg.startsWith('ASSET_MISMATCH:')){
      alert('자산 계산이 맞지 않아 매수를 중단했어요. 새로고침 후 다시 시도해주세요.');
      return;
    }
    alert('매수 실패: ' + e.message);
  } finally {
    _stockBuyInProgress = false;
  }
}

let _stockSellInProgress = false;
async function _sellStockPesk(code, name, price, customQtyId, presetQty){
  if(_stockSellInProgress){ return; }
  if(!(await ensureActiveStudentSession(false))) return;
  if(myEconomyRestriction().stockBlocked) return economyBlockedNotice('stock');
  const qtyEl = document.getElementById(customQtyId || ('qty-'+code));
  const qtyRaw = presetQty ? String(presetQty) : String(qtyEl?.value||'').trim();
  const qty = parseInt(qtyRaw, 10);
  if(!Number.isFinite(qty) || qty <= 0 || qty > 9999 || String(qty) !== qtyRaw){
    alert('정확한 수량을 입력하세요. (1~9999 사이의 정수)');
    return;
  }

  const myHolding = myPortfolio.find(p=>p.code===code);
  if(!myHolding || myHolding.qty < qty){
    alert('보유 수량이 부족해요!\n보유: '+(myHolding?.qty||0)+'주');
    return;
  }
  const displayPrice = Number(price)||0;
  const totalGain = displayPrice * qty;
  if(!confirm(name+' '+qty+'주를 '+totalGain.toLocaleString()+' 🪙에 매도하시겠어요?')) return;
  const serverApi = _serverBank();
  if(serverApi){
    _stockSellInProgress = true;
    try{
      const r = await _runServerBank('매도', ()=>serverApi.stockSell(roomId, code, qty, displayPrice));
      if(r){
        if(qtyEl) qtyEl.value = '';
        addTxn(name+' '+qty+'주 매도', Number(r.gain||totalGain), 'earn');
        alert('✅ '+name+' '+qty+'주 매도 완료! ('+Number(r.gain||totalGain).toLocaleString()+' 🪙 획득)');
      }
    }finally{ _stockSellInProgress = false; }
    return;
  }

  const me = students.find(s=>s.num===myStudentNum);
  _stockSellInProgress = true;
  try {
    const db = window._db;
    const studentsRef = window._fsDoc(db,'classrooms',roomId,'data','tesk-students');
    const portfoliosRef = window._fsDoc(db,'classrooms',roomId,'data','pesk-portfolios');
    const depositsRef = window._fsDoc(db,'classrooms',roomId,'data','pesk-deposits');
    const stockPricesRef = window._fsDoc(db,'classrooms',roomId,'data','tesk-stock-prices');
    let txResult = null;
    await window._fsRunTxn(db, async (txn)=>{
      const studSnap = await txn.get(studentsRef);
      const portSnap = await txn.get(portfoliosRef);
      const depSnap = await txn.get(depositsRef);
      const priceSnap = await txn.get(stockPricesRef);
      const allStudents = studSnap.exists() ? (studSnap.data().value || []) : [];
      const allPortfolios = portSnap.exists() ? (portSnap.data().value || {}) : {};
      const allDeposits = depSnap.exists() ? (depSnap.data().value || {}) : {};
      const serverPrices = priceSnap.exists() ? (priceSnap.data().value || {}) : {};
      const stuIdx=allStudents.findIndex(s=>Number(s.num)===Number(myStudentNum));
      if(stuIdx < 0) throw new Error('STUDENT_NOT_FOUND');
      const serverPrice = Number(serverPrices[code]);
      if(!Number.isFinite(serverPrice) || serverPrice <= 0) throw new Error('PRICE_UNAVAILABLE');
      if(serverPrice !== displayPrice) throw new Error('PRICE_CHANGED:' + serverPrice);
      const finalGain = serverPrice * qty;
      const key = myEconomyKey();
      let myPort = _canonicalEconomyList(allPortfolios, _mergePortfolioLists);
      const idx = myPort.findIndex(p=>p.code===code);
      if(idx < 0 || (myPort[idx].qty||0) < qty) throw new Error('INSUFFICIENT_HOLDING');
      const beforePort = myPort.map(p=>({...p}));
      const myDepsForSnapshot = _economyListFromDoc(allDeposits, _mergeDepositLists);

      myPort[idx].qty -= qty;
      if(myPort[idx].qty <= 0) myPort.splice(idx,1);
      _setMyEconomyList(allPortfolios, myPort);

      const beforePoints = Number(allStudents[stuIdx].points || 0);
      const afterPoints = beforePoints + finalGain;
      allStudents[stuIdx].points = afterPoints;

      txn.set(studentsRef,{ value: allStudents, updatedAt: new Date().toISOString() });
      txn.set(portfoliosRef,{ value: allPortfolios, updatedAt: new Date().toISOString() });
      const snapAt = Date.now();
      const assetBefore = _buildAssetSnapshot(beforePoints, beforePort, myDepsForSnapshot, serverPrices, snapAt);
      const assetAfter = _buildAssetSnapshot(afterPoints, myPort, myDepsForSnapshot, serverPrices, snapAt);
      if(assetAfter.total !== assetBefore.total){
        throw new Error('ASSET_MISMATCH:' + assetBefore.total + ':' + assetAfter.total);
      }
      txResult = { allStudents, myPort, beforePoints, afterPoints, finalGain, finalPrice: serverPrice, assetBefore, assetAfter };
    });

    await economyAfterCommit(async()=>{
    myPortfolio = txResult?.myPort || myPortfolio;
    students = txResult?.allStudents || students;
    if(qtyEl) qtyEl.value = '';
    const finalGain = Number(txResult?.finalGain||totalGain);
    const finalPrice = Number(txResult?.finalPrice||displayPrice);
    addTxn(name+' '+qty+'주 매도', finalGain, 'earn');
    await pushEconLog({
      type:'stock_sell',
      detail:`${name} ${qty}주 매도`,
      delta:finalGain,
      balanceBefore:Number(txResult?.beforePoints||0),
      balanceAfter:Number(txResult?.afterPoints||0),
      assetBefore:txResult?.assetBefore,
      assetAfter:txResult?.assetAfter,
      meta:{code, name, qty, price:finalPrice}
    });

    const meAfter = await refreshEconomyFromServer(false) || students.find(s=>s.num===myStudentNum) || me;
    const panel = document.getElementById('panel-stock');
    if(panel) panel.innerHTML = buildBankPanel(meAfter);
    alert('✅ '+name+' '+qty+'주 매도 완료! ('+finalGain.toLocaleString()+' 🪙 획득)');
    });
  } catch(e) {
    if(String(e?.message||'').startsWith('PRICE_CHANGED:')){
      const newP = Number(String(e.message).split(':')[1]||0);
      alert('주식 가격이 방금 변동됐어요.\n표시 가격: '+displayPrice.toLocaleString()+' 🪙 → 현재 가격: '+newP.toLocaleString()+' 🪙\n다시 확인 후 매도해주세요.');
      return;
    }
    if(String(e?.message||'')==='PRICE_UNAVAILABLE'){
      alert('주식 가격 정보를 찾을 수 없어요. 잠시 후 다시 시도해주세요.');
      return;
    }
    if(String(e?.message||'')==='INSUFFICIENT_HOLDING'){
      alert('보유 수량이 부족해요!\n새로고침 후 다시 시도해주세요.');
      return;
    }
    if(String(e?.message||'')==='STUDENT_NOT_FOUND'){
      alert('학생 정보를 다시 불러오는 중이에요. 잠시 후 다시 시도해주세요.');
      return;
    }
    if(String(e?.message||'').startsWith('ASSET_MISMATCH:')){
      alert('자산 계산이 맞지 않아 매도를 중단했어요. 새로고침 후 다시 시도해주세요.');
      return;
    }
    alert('매도 실패: ' + e.message);
  } finally {
    _stockSellInProgress = false;
  }
}

    + '</div>';

function buildChecklistBody(date){
  const items=myAllowedChecklistItems();
  const roster=students.slice().sort((a,b)=>Number(a.num)-Number(b.num));
  return items.map(item=>{
    const map=checklistRecords?.[date]?.[item.id] || {};
    const doneCount=roster.filter(s=>map[s.num]?.checked || map[String(s.num)]?.checked).length;
    const rows=roster.map(s=>{
      const rec=map[s.num] || map[String(s.num)];
      const checked=!!rec?.checked;
      return '<button class="checklist-row ' + (checked?'checked':'') + '" data-checklist-item="' + escHtml(item.id) + '" data-checklist-student="' + Number(s.num) + '" onclick="toggleChecklistItemForStudent(\'' + escHtml(item.id) + '\',' + Number(s.num) + ')">'
        + '<span class="checklist-student"><b class="num">' + Number(s.num) + '</b> ' + escHtml(s.name) + '</span>'
        + '<span class="checklist-state">' + (checked?'완료':'미체크') + '</span>'
        + '</button>';
    }).join('');
    return '<div style="border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:12px;background:#fff;">'
      + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">'
      + '<div style="font-size:14px;font-weight:900;">' + escHtml(item.title) + '</div>'
      + '<div style="font-size:11px;color:var(--sub);font-weight:800;">' + doneCount + ' / ' + roster.length + '명</div>'
      + '</div>'
      + '<div class="checklist-roster">' + rows + '</div>'
      + '</div>';
  }).join('');
}

async function toggleChecklistItemForStudent(itemId, stuNum){
  if(!canUseChecklist()){
    showFeedbackNotice('🔒 체크리스트 권한이 필요해요.');
    return;
  }
  if(!allowedChecklistItemIds().has(String(itemId))){
    showFeedbackNotice('🔒 이 체크 항목 권한이 필요해요.');
    return;
  }
  const date=document.getElementById('checklist-date')?.value || todayISO();
  const ref=window._fsDoc(window._db,'classrooms',roomId,'data','pesk-checklists');
  let nextValue=null;
  const prevValue=JSON.parse(JSON.stringify(checklistRecords||{}));
  const applyToggle=(records)=>{
    const data=records && typeof records==='object' ? records : {};
    data[date]=data[date]||{};
    data[date][itemId]=data[date][itemId]||{};
    const key=String(stuNum);
    const cur=data[date][itemId][key];
    if(cur?.checked){
      delete data[date][itemId][key];
    }else{
      data[date][itemId][key]={
        checked:true,
        studentNum:Number(stuNum),
        checkerNum:myStudentNum,
        checkerName:myStudentName,
        accountUid:myAccountUid||'',
        checkedAt:new Date().toISOString()
      };
    }
    return data;
  };
  nextValue=applyToggle(JSON.parse(JSON.stringify(checklistRecords||{})));
  checklistRecords=nextValue;
  renderChecklistBody();
  const motionBtn=document.querySelector('.checklist-row[data-checklist-item="'+String(itemId).replace(/"/g,'\\"')+'"][data-checklist-student="'+Number(stuNum)+'"]');
  if(motionBtn){ motionBtn.classList.add('checking'); setTimeout(()=>motionBtn.classList.remove('checking'),220); }
  try{
    if(window._fsRunTxn){
      await window._fsRunTxn(window._db, async (txn)=>{
        const snap=await txn.get(ref);
        nextValue=applyToggle(snap.exists() ? (snap.data().value||{}) : {});
        txn.set(ref,{value:nextValue,updatedAt:new Date().toISOString()});
      });
    }else{
      const snap=await window._fsGetDoc(ref);
      nextValue=applyToggle(snap.exists() ? (snap.data().value||{}) : {});
      await window._fsSetDoc(ref,{value:nextValue,updatedAt:new Date().toISOString()});
    }
    checklistRecords=nextValue||checklistRecords;
    renderChecklistBody();
  }catch(e){
    const msg=String(e?.message||'');
    const checkedAfter=!!(nextValue?.[date]?.[itemId]?.[String(stuNum)]?.checked || nextValue?.[date]?.[itemId]?.[Number(stuNum)]?.checked);
    const bridged = msg.includes('permission') ? await pushChecklistBridgeEvent({date,itemId,stuNum,checked:checkedAfter}) : false;
    if(bridged){
      checklistRecords=nextValue||checklistRecords;
      renderChecklistBody();
      showFeedbackNotice('✅ 체크가 선생님 화면으로 전송됐어요.');
      return;
    }
    checklistRecords=prevValue;
    renderChecklistBody();
    alert('체크 저장 실패: ' + msg + (msg.includes('permission') ? '\n\nFirebase 규칙에서 학생 체크 저장이 막혀 있어요. 보조 전송도 실패하면 규칙 배포가 필요합니다.' : ''));
  }
}

async function pushChecklistBridgeEvent({date,itemId,stuNum,checked}){
  if(!window._fbReady || !window._db || !roomId) return false;
  try{
    const ref=window._fsDoc(window._db,'classrooms',roomId,'data','tesk-teacher-notif');
    const item=(checklistItems||[]).find(x=>String(x.id)===String(itemId));
    const target=students.find(s=>Number(s.num)===Number(stuNum));
    const event={
      id:'check_'+Date.now()+'_'+uid(),
      type:'checklist-toggle',
      checklistDate:date,
      itemId:String(itemId),
      itemTitle:item?.title||'체크리스트',
      studentNum:Number(stuNum),
      studentName:target?.name||'',
      checkerNum:myStudentNum,
      checkerName:myStudentName,
      accountUid:myAccountUid||'',
      checked:!!checked,
      msg:`${myStudentName} 학생이 ${target?.name||stuNum+'번'} ${item?.title||'체크리스트'}를 ${checked?'체크':'해제'}했습니다.`,
      createdAt:new Date().toISOString(),
      date:new Date().toLocaleString('ko-KR'),
      read:false
    };
    if(window._fsRunTxn){
      await window._fsRunTxn(window._db, async (txn)=>{
        const snap=await txn.get(ref);
        const rows=snap.exists() ? (snap.data().value||[]) : [];
        rows.unshift(event);
        if(rows.length>200) rows.length=200;
        txn.set(ref,{value:rows,updatedAt:new Date().toISOString()});
      });
    }else{
      const snap=await window._fsGetDoc(ref);
      const rows=snap.exists() ? (snap.data().value||[]) : [];
      rows.unshift(event);
      if(rows.length>200) rows.length=200;
      await window._fsSetDoc(ref,{value:rows,updatedAt:new Date().toISOString()});
    }
    return true;
  }catch(err){
    console.warn('checklist bridge failed', err);
    return false;
  }
}

/* ── 카탈로그 / 가격 ── */
function avCatalog(){ return window.AV_MANIFEST || {}; }
function avCatOff(cat){ return (avPrices.offCats||[]).includes(cat); }
function avItemOff(id){ return (avPrices.offItems||[]).includes(id); }
/* 선생님이 판매 중지한 부위·아이템은 옷장에서 숨김. 단, 이미 산 것은 계속 보임 */
function avList(cat){
  const owned = myAvatar && Array.isArray(myAvatar.owned) ? myAvatar.owned : [];
  const eq = (myAvatar && myAvatar.equipped) ? myAvatar.equipped : {};
  return (avCatalog()[cat] || []).filter(i =>
    !avItemOff(i.id) || owned.includes(i.id) || eq[cat] === i.id);
}
function avVisibleCats(){
  return AV_CATS.filter(c => {
    if(!(avCatalog()[c] || []).length) return false;
    if(!avCatOff(c)) return true;
    // 판매 중지된 부위라도 이미 착용/보유 중이면 갈아입을 수 있게 남겨둠
    const a = myAvatar || {};
    return (a.equipped && a.equipped[c]) || (Array.isArray(a.owned) && avList(c).some(i => a.owned.includes(i.id)));
  });
}
function avFind(cat, id){ return (avCatalog()[cat] || []).find(i => i.id === id) || null; }
function avPriceOf(cat, item){
  if(!item) return 0;
  const byItem = avPrices.items ? avPrices.items[item.id] : undefined;
  if(typeof byItem === 'number') return Math.max(0, byItem);
  const byCat = avPrices.cats ? avPrices.cats[cat] : undefined;
  if(typeof byCat === 'number') return Math.max(0, byCat);
  if(item.price != null) return Math.max(0, item.price);
  return AV_PRICE[cat] != null ? AV_PRICE[cat] : 200;   // 표정처럼 0원인 부위가 있으므로 || 금지
}
function avCatOf(id){
  return AV_CATS.find(c => (avCatalog()[c] || []).some(i => i.id === id)) || null;
}

function _applyAvatarDoc(all){
  allAvatars = (all && typeof all === 'object') ? all : {};
  myAvatar = allAvatars[myStudentNum] || allAvatars[String(myStudentNum)] || null;
}
function _applyAvatarPriceDoc(raw){
  avPrices = (raw && typeof raw === 'object')
    ? {cats: raw.cats || {}, items: raw.items || {},
       offCats: Array.isArray(raw.offCats) ? raw.offCats : [],
       offItems: Array.isArray(raw.offItems) ? raw.offItems : [],
       petJob: (raw.petJob && typeof raw.petJob === 'object') ? raw.petJob : null}
    : {cats:{}, items:{}, offCats:[], offItems:[], petJob:null};
}

function avDefault(){

/* 성별은 몸 그림만 바꾸는 표현이라 돈이 들지 않고, 아무 때나 되돌릴 수 있다 */
function avGender(){ return avEquipped().gender === 'girl' ? 'girl' : 'boy'; }
function avState(){
  if(!myAvatar || !myAvatar.equipped) myAvatar = avDefault();
  if(!Array.isArray(myAvatar.owned)) myAvatar.owned = [];
  if(typeof myAvatar.spent !== 'number') myAvatar.spent = 0;
  if(!myAvatar.pets || typeof myAvatar.pets !== 'object') myAvatar.pets = {};
  return myAvatar;
}
function avEquipped(){ return avState().equipped; }
/* 코디를 통째로 갈아입을 때 쓰는 빈 옷장 상태.
   방·펫·염색은 '옷'이 아니라서 코디를 바꿔도 그대로 남아야 한다.
   (예전에는 여기서 pet 과 색이 통째로 지워져 프리셋을 입으면 펫이 사라졌다) */
function avOutfitBase(eq){
  const base = {face:null, hair:null, top:null, bottom:null, shoes:null, hat:null, weapon:null,
                room:eq.room, pet:eq.pet || null, gender:eq.gender === 'girl' ? 'girl' : 'boy'};
  (window.AV_TINTABLE || []).forEach(c => { base[c + 'Color'] = eq[c + 'Color'] || ''; });
  return base;
}
function avOwns(cat, item){
  return (!item.craft && avPriceOf(cat, item) === 0) || avState().owned.includes(item.id);
}

/* ── 스프라이트 미리 불러오기 (합성을 동기로 하기 위해) ── */
function avPreload(){
  const S = window.AV_SPRITES;
  if(!S || _avPreloaded) return Promise.resolve(!!S);
  return Promise.all(Object.keys(S).map(k => new Promise(res => {
    const im = new Image();
    im.onload = () => { AV_IMG[k] = im; res(true); };
    im.onerror = () => res(false);
    im.src = window.AV_PNG(k);
  }))).then(() => { _avPreloaded = true; return true; });
}

/* ── 장비 조합 → 64x64 PNG dataURL ── */
function avCharDataURL(eq){
  eq = eq || {};
  // 성별에 따라 몸·머리 그림이 달라지므로 캐시 키에도 넣는다
  const key = (eq.gender || 'boy') + '|'
            + AV_DRAWN.map(c => c + ':' + (eq[c]||'') + ':' + (eq[c+'Color']||'')).join(',');
  if(AV_CACHE[key]) return AV_CACHE[key];
  if(!AV_IMG['base/base_body']) return AV_BLANK; // 아직 로딩 전 — 깨진 이미지 대신 투명 픽셀
  const base = window.AV_BODY ? window.AV_BODY(eq.gender)
                              : {body:'base/base_body', head:'base/base_head'};
  const cv = document.createElement('canvas'); cv.width = cv.height = 64;
  const ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
  if(AV_IMG[base.body]) ctx.drawImage(AV_IMG[base.body], 0, 0);
  if(AV_IMG[base.head]) ctx.drawImage(AV_IMG[base.head], 0, 0);
  if(eq.face && AV_IMG['face/' + eq.face]) ctx.drawImage(AV_IMG['face/' + eq.face], 0, 0);
  // 화려한 파생 아이템(색 입힌 것)은 AV_DRAW 가 대신 그려준다
  AV_LAYER.forEach(c => {
    if(!eq[c]) return;
    const tint = window.AV_TINT_COLOR ? window.AV_TINT_COLOR(c, eq[c + 'Color']) : null;
    if(window.AV_DRAW) window.AV_DRAW(ctx, c, eq[c], AV_IMG, tint);
    else if(AV_IMG[c + '/' + eq[c]]) ctx.drawImage(AV_IMG[c + '/' + eq[c]], 0, 0);
  });
  return AV_CACHE[key] = cv.toDataURL('image/png');
}

  // 👕 옷장 — 내가 가진 아이템만

/* ─────────────────────────────────────────

───────────────────────────────────────── */

/* 학급 활동으로 얻는 친밀도 — 펫은 버튼만 눌러서는 다 크지 않고,
   실제로 글을 쓰고 문제를 풀어야 자란다 */

function petLevelOfCare(care){
  return Math.max(1, Math.min(PET_MAX_LEVEL, 1 + Math.floor((Number(care)||0) / PET_CARE_PER_LEVEL)));
}
function petCareForLevel(lv){ return Math.max(0, (Math.max(1, lv) - 1) * PET_CARE_PER_LEVEL); }
/* 옷장의 펫 아이템 → 펫 도감의 종류. 같은 종류라도 팔레트가 달라 다른 펫으로 보인다 */

/* ── 등급 ──
   비싼 펫이 색만 다르면 값을 낼 이유가 없다. 등급마다 실제로 달라지는 것:

   · coin   하루 한 번 심부름으로 벌어오는 코인
   · glow   방·옷장·우리 반에서 몸 주변에 도는 빛
   · badge  이름 옆 표시 */
const PET_TIERS = {
  common: {name:'일반', badge:'',   glow:'',        decay:1.0,  coin:3,  maxStage:3},
  rare:   {name:'희귀', badge:'⭐', glow:'#7fd8f5', decay:0.75, coin:6,  maxStage:3},
  unique: {name:'유니크',badge:'💜',glow:'#bb8af7',decay:0.65,coin:6,maxStage:3},
  // 전설만 4단계(왕관)까지 자란다 — 다른 펫으로는 절대 볼 수 없는 모습
  legend: {name:'전설', badge:'👑', glow:'#ffc93c', decay:0.55, coin:10, maxStage:4}
};
const PET_TIER_OF = {
  p_chick:'common', p_cat:'common', p_dog:'common', p_slime:'common', p_rabbit:'common',
  p_cat_bk:'rare',  p_slime_p:'unique', p_slime_r:'rare',
  p_chick_g:'legend'
};
function petTier(id){ return PET_TIERS[PET_TIER_OF[id] || 'common'] || PET_TIERS.common; }
function petTierKey(id){ return PET_TIER_OF[id] || 'common'; }

function petClamp(v){ return Math.max(0, Math.min(PET_MAX, Math.round(Number(v) || 0))); }

/* 그림 — 펫 도감(벡터)이 있으면 단계별로, 없으면 예전 16×16 그림으로 */
function petImgURL(id, stage){
  const sp = PET_SPECIES_OF[id];
  const info = window.AV_PET ? window.AV_PET(id) : null;
  if(window.PET_DATAURL && sp)
    return window.PET_DATAURL(sp, Math.min(3, Math.max(1, stage || 1)), 128, info ? info.pal : null);
  return window.AV_PET_URL ? window.AV_PET_URL(id) : '';
}
function petStageOfCare(care, id){
  const lv = petLevelOfCare(care);
  const max = id ? (petTier(id).maxStage || 3) : 3;
  if(max >= 4 && lv >= PET_EVO_LV4) return 4;
  return lv >= PET_EVO_LV3 ? 3 : lv >= PET_EVO_LV2 ? 2 : 1;
}
/* 이 펫이 갈 수 있는 단계별 필요 레벨 (전설만 4단계) */
function petStageLevels(id){
  return (petTier(id).maxStage || 3) >= 4
    ? [1, PET_EVO_LV2, PET_EVO_LV3, PET_EVO_LV4]
    : [1, PET_EVO_LV2, PET_EVO_LV3];
}
/* 남의 아바타 기록에서 단계만 꺼내기 (우리 반 갤러리용) */
function petStageOf(record, id){
  const pets = (record && record.pets) || {};
  const r = pets[id] || pets[String(id)];
  return petStageOfCare(r ? r.care : 0, id);
}
/* 남의 아바타 기록에서 펫 이름 꺼내기 (우리 반 갤러리용).
   이름을 안 지었으면 단계 이름("아기 고양이" 등)을 대신 쓴다. */
function petNameOf(record, id, stage){
  const pets = (record && record.pets) || {};
  const r = pets[id] || pets[String(id)];
  const nm = r ? String(r.name || '').trim() : '';
  return nm || petStageName(id, stage || 1);
}
function petStageName(id, stage){
  const sp = window.PET_INFO ? window.PET_INFO(PET_SPECIES_OF[id]) : null;
  if(sp && sp.stages && sp.stages[stage - 1]) return sp.stages[stage - 1];
  const info = window.AV_PET ? window.AV_PET(id) : null;
  return info ? info.name : '펫';
}

function petStore(){
  const a = avState();
  if(!a.pets || typeof a.pets !== 'object') a.pets = {};
  return a.pets;
}
/* 저장된 값에 '그동안 흐른 시간'을 반영한 지금 상태 */
function petNow(id){
  const now = Date.now();
  const raw = petStore()[id];
  const today = todayISO();
  if(!raw)
    return {id, name:'', born:now, care:0, hunger:PET_MAX, clean:PET_MAX, happy:PET_MAX,
            at:now, acts:{}, day:today, dayCare:0, dayAct:0, dayRecv:0, chkDay:'', jobAt:0, dayGuard:0, isNew:true};
  const hours = Math.max(0, (now - (Number(raw.at) || now)) / 3600e3);
  const slow = petTier(id).decay;   // 등급이 높을수록 천천히 줄어든다
  const dec = k => petClamp((raw[k] == null ? PET_MAX : Number(raw[k])) - PET_DECAY[k] * slow * hours);
  const sameDay = raw.day === today;
  return {
    id,
    name: String(raw.name || ''),
    born: Number(raw.born) || now,
    care: Math.max(0, Number(raw.care) || 0),
    hunger: dec('hunger'), clean: dec('clean'), happy: dec('happy'),
    at: now,
    acts: (raw.acts && typeof raw.acts === 'object') ? raw.acts : {},
    day: sameDay ? raw.day : today,
    dayCare: sameDay ? Math.max(0, Number(raw.dayCare) || 0) : 0,
    dayAct:  sameDay ? Math.max(0, Number(raw.dayAct)  || 0) : 0,
    dayRecv: sameDay ? Math.max(0, Number(raw.dayRecv) || 0) : 0,
    chkDay: String(raw.chkDay || ''),
    jobAt: Math.max(0, Number(raw.jobAt) || 0),
    dayGuard: sameDay ? Math.max(0, Number(raw.dayGuard) || 0) : 0,
    isNew: false
  };
}
/* 지금 상태를 저장 형태로 되돌려 놓기 (실제 쓰기는 avSaveEquip / petBuySnack 이 한다) */
function petPut(s){
  const store = petStore();
  store[s.id] = {name:s.name, born:s.born, care:s.care, hunger:s.hunger, clean:s.clean,
                 happy:s.happy, at:s.at, acts:s.acts, day:s.day, dayCare:s.dayCare,
                 dayAct:s.dayAct||0, dayRecv:s.dayRecv||0, chkDay:s.chkDay||'', jobAt:s.jobAt||0,
                 dayGuard:s.dayGuard||0};
  return store[s.id];
}
function petMood(s){
  if(s.hunger <= 25) return {emo:'🍚', text:'배고파요…',      cls:'sad'};
  if(s.clean  <= 25) return {emo:'💧', text:'꼬질꼬질해요…',  cls:'sad'};
  if(s.happy  <= 25) return {emo:'💤', text:'심심해요…',      cls:'sad'};
  if(Math.min(s.hunger, s.clean, s.happy) >= 70) return {emo:'💛', text:'기분 최고!', cls:'glad'};
  return {emo:'🙂', text:'잘 지내고 있어요', cls:''};
}
function petCoolLeft(s, key){
  const act = PET_ACTS[key]; if(!act) return 0;
  const last = Number(s.acts[key]) || 0;
  return Math.max(0, last + act.cool - Date.now());
}
function petCoolText(ms){
  const m = Math.ceil(ms / 60000);
  return m >= 60 ? Math.floor(m / 60) + '시간 ' + (m % 60 ? (m % 60) + '분' : '') : m + '분';
}

/* ── 펫 카드 ── */
function buildPetCard(me){
  const eq = avEquipped();
  if(!eq.pet){
    const first = (avList('pet') || [])[0];
    return '<div class="pet-card empty">'
      + '<div class="pet-empty-icon">🐾</div>'
      + '<div><b>아직 함께하는 펫이 없어요</b>'
      + '<p>옷장의 <b>🐾 펫</b>에서 한 마리를 데려오면 밥을 주고 놀아줄 수 있어요.'
      + (first ? ' 가장 싼 펫은 ' + escHtml(first.name) + '예요.' : '') + '</p></div>'
      + '<button class="pet-empty-go" onclick="avShowCat(\'pet\')">펫 보러 가기 →</button></div>';
  }

  const s = petNow(eq.pet);
  const stage = petStageOfCare(s.care, eq.pet);
  const lv = petLevelOfCare(s.care);
  const mood = petMood(s);
  const days = Math.max(1, Math.floor((Date.now() - s.born) / 86400e3) + 1);
  // 진행바는 '다음 레벨까지' — 매일 눈에 띄게 차오른다
  const atMax = lv >= PET_MAX_LEVEL;
  const curBase = petCareForLevel(lv);
  const nextBase = petCareForLevel(lv + 1);
  const bondRatio = atMax ? 1 : Math.min(1, (s.care - curBase) / Math.max(1, nextBase - curBase));
  const capped = s.dayCare >= PET_DAY_CARE;
  const actLeft = Math.max(0, PET_DAY_ACT - s.dayAct);

  const gauges = PET_GAUGES.map(([k, label]) => {
    const v = s[k];
    return '<div class="pet-gauge' + (v <= 25 ? ' low' : '') + '">'
      + '<span class="pet-gauge-label">' + label + '</span>'
      + '<span class="pet-gauge-bar"><i style="width:' + v + '%"></i></span>'
      + '<span class="pet-gauge-num">' + v + '</span></div>';
  }).join('');

  const coins = me ? Number(me.points || 0) : 0;
  const shopOff = economyBlocked('shop');
  const acts = PET_ACT_KEYS.map(key => {
    const act = PET_ACTS[key];
    const left = petCoolLeft(s, key);
    const poor = act.cost > 0 && coins < act.cost;
    const off  = act.cost > 0 && shopOff;
    const dis = left > 0 || poor || off;
    const sub = left > 0 ? petCoolText(left) + ' 뒤'
              : act.cost > 0 ? act.cost + ' 🪙'
              : '무료';
    return '<button class="pet-act' + (dis ? ' off' : '') + '"' + (dis ? ' disabled' : '')
      + ' onclick="petDo(\'' + key + '\')">'
      + '<span class="pet-act-icon">' + act.icon + '</span>'
      + '<span class="pet-act-name">' + act.label + '</span>'
      + '<span class="pet-act-sub">' + sub + '</span></button>';
  }).join('');

  const tier = petTier(eq.pet);
  const tierChip = tier.badge
    ? '<span class="pet-tier ' + petTierKey(eq.pet) + '">' + tier.badge + ' ' + tier.name + '</span>' : '';
  const nameHtml = (s.name
      ? escHtml(s.name)
      : '<span class="pet-noname">이름 없음</span>')
    + ' <span class="pet-kind">· ' + escHtml(petStageName(eq.pet, stage)) + '</span>' + tierChip;

  // 🎁 심부름 — 잘 돌본 펫만, 하루 한 번
  const job = petJobReady(s);
  const jobPay = petJobReward(s);
  const jobHtml = !petJobEnabled() ? ''
    : '<button class="pet-job' + (job.ok ? '' : ' off') + '"' + (job.ok ? '' : ' disabled')
      + ' onclick="petErrand()">🎁 심부름 보내기'
      + '<span>' + (job.ok ? '+' + jobPay + '🪙'
          : job.why === 'cool' ? petCoolText(job.left) + ' 뒤'
          : '세 가지 모두 ' + PET_JOB_MIN + ' 이상일 때') + '</span></button>';

  return '<div class="pet-card">'
    + '<div class="pet-top">'
    +   '<div class="pet-face ' + mood.cls + (tier.glow ? ' glow' : '') + '"'
    +     (tier.glow ? ' style="--fx:' + tier.glow + '"' : '')
    +     ' title="진화 과정 보기" onclick="openPetEvolution()">'
    +     '<img src="' + petImgURL(eq.pet, stage) + '" alt="">'
    +     '<span class="pet-bubble">' + mood.emo + '</span></div>'
    +   '<div class="pet-meta">'
    +     '<div class="pet-name">' + nameHtml
    +       '<button class="pet-rename" onclick="petRename()" title="이름 짓기">✏️</button></div>'
    +     '<div class="pet-sub">' + escHtml(mood.text) + ' · 함께한 지 ' + days + '일 · ' + stage + '단계</div>'
    +     '<div class="pet-bond">'
    +       '<span class="pet-lv">Lv.' + lv + '</span>'
    +       '<span class="pet-bond-bar"><i style="width:' + Math.round(bondRatio * 100) + '%"></i></span>'
    +       '<span class="pet-bond-num">💗 ' + s.care + (atMax ? ' · 만렙' : ' / ' + nextBase) + '</span>'
    +     '</div>'
    +   '</div>'
    + '</div>'
    + '<div class="pet-gauges">' + gauges + '</div>'
    + '<div class="pet-acts">' + acts + '</div>'
    + jobHtml
    + '<p class="pet-hint">'
    +   (capped ? '오늘 돌보기 친밀도는 다 채웠어요 (하루 ' + PET_DAY_CARE + '). '
              : '돌볼 때마다 💗+1 (하루 ' + PET_DAY_CARE + '까지). ')
    +   '<b>펫은 돌보기만으로는 다 크지 않아요.</b> '
    +   '✍️ 글쓰기 제출 💗+' + PET_GROW.writing.care
    +   ' · 🎓 정답 ' + PET_QUIZ_PER_CARE + '개 💗+' + PET_GROW.quiz.care
    +   ' · ✅ 체크리스트 💗+' + PET_GROW.checklist.care
    +   ' · 🤝 친구 펫 쓰다듬기 💗+' + PET_GROW.pat.care
    +   ' (활동은 하루 ' + PET_DAY_ACT + '까지, 오늘 ' + actLeft + ' 남음)<br>'
    +   '펫은 배고파도 사라지지 않으니 걱정 말아요.</p>'
    + '</div>';
}

/* ── 🌱 학급 활동으로 펫 키우기 ──
   글을 쓰고 문제를 풀면 펫이 자란다. 돌보기 버튼만으로는 다 클 수 없다.
   여러 곳에서 불리므로 조용히 실패한다 — 펫 때문에 글쓰기 제출이 막히면 안 된다. */
async function petGrow(kind, times){
  try{
    const g = PET_GROW[kind];
    if(!g) return 0;
    const eq = avEquipped();
    if(!eq.pet) return 0;
    const s = petNow(eq.pet);
    const want = Math.max(1, Number(times) || 1) * g.care;
    const gain = Math.min(want, Math.max(0, PET_DAY_ACT - s.dayAct));
    if(gain <= 0) return 0;

    const beforeLv = petLevelOfCare(s.care);
    const beforeStage = petStageOfCare(s.care, eq.pet);
    s.care += gain;
    s.dayAct += gain;
    s.happy = petClamp(s.happy + 4);   // 주인이 열심히 하면 펫도 기분이 좋아진다
    s.at = Date.now();
    if(kind === 'checklist') s.chkDay = todayISO();
    petPut(s);
    await avSaveEquip();

    const afterLv = petLevelOfCare(s.care);
    const afterStage = petStageOfCare(s.care, eq.pet);
    const nm = s.name || petStageName(eq.pet, afterStage);
    if(afterStage > beforeStage){
      addNotif('🐾 ' + nm + '이(가) ' + afterStage + '단계 ' + petStageName(eq.pet, afterStage) + '(으)로 자랐어요!');
      showFeedbackNotice('🎉 ' + g.label + '! 펫이 진화했어요 → ' + petStageName(eq.pet, afterStage));
    } else if(afterLv > beforeLv){
      showFeedbackNotice('🐾 ' + g.label + '! ' + nm + ' Lv.' + afterLv + ' 달성 (💗+' + gain + ')');
    } else {
      showFeedbackNotice('🐾 ' + g.label + ' — ' + nm + ' 💗+' + gain);
    }
    if(document.getElementById('panel-myroom')) avRefresh();
    return gain;
  }catch(e){ console.warn('펫 성장 실패', e); return 0; }
}

/* ── 🐾 펫 능력 (모험 전용) ──
   설계 2-6: 무기는 정답을 대신하지 않고 '정답의 가치'를 키운다.
   그래서 데미지·모험 경험치·오답 방어만 건드리고,
   코인과 학습 XP 에는 절대 손대지 않는다 (2-7 게임 → 학급화폐 금지).

   배율은 등급보다 '얼마나 오래 잘 돌봤는가'가 더 크게 작용하도록 잡았다.
   돈으로 비싼 펫만 사면 되는 구조를 피하기 위해서다. */
const PET_TIER_POWER = { common:{dmg:0.00, exp:0.00}, rare:{dmg:0.15, exp:0.10},unique:{dmg:0.20,exp:0.10}, legend:{dmg:0.30, exp:0.20} };
const PET_LV_DMG = 0.005;      // 펫 레벨 1당 데미지 +0.5% (Lv.30 이면 +15%)
const PET_LV_EXP = 0.004;
const PET_GUARD_MAX = 3;       // 전설 펫의 오답 방어 하루 횟수
const PET_POWER_MIN_GAUGE = 40;   // 이보다 낮으면 힘이 절반으로 준다

function petPower(){
  const eq = avEquipped();
  const none = {dmg:1, exp:1, guard:false, tier:null, lv:0, weak:false, has:false};
  if(!eq.pet || !window.RPG) return none;
  const s = petNow(eq.pet);
  const tierKey = petTierKey(eq.pet);
  const t = PET_TIER_POWER[tierKey] || PET_TIER_POWER.common;
  const lv = petLevelOfCare(s.care);
  // 배고프거나 더러우면 제 힘을 못 낸다 — 다마고치를 방치하지 않을 이유가 생긴다
  const weak = Math.min(s.hunger, s.clean, s.happy) < PET_POWER_MIN_GAUGE;
  const half = weak ? 0.5 : 1;
  return {
    has: true, tier: tierKey, lv, weak,
    dmg: 1 + (t.dmg + lv * PET_LV_DMG) * half,
    exp: 1 + (t.exp + lv * PET_LV_EXP) * half,
    guard: tierKey === 'legend' && !weak && (s.dayGuard || 0) < PET_GUARD_MAX
  };
}
/* 오답 방어를 한 번 쓴다 */
function petUseGuard(){
  const eq = avEquipped();
  if(!eq.pet) return false;
  const s = petNow(eq.pet);
  if((s.dayGuard || 0) >= PET_GUARD_MAX) return false;
  s.dayGuard = (s.dayGuard || 0) + 1;
  s.at = Date.now();
  petPut(s);
  return true;
}

/* ── 🎁 펫 심부름 ── (소소한 코인 벌이)
   학급 화폐가 새로 생기는 창구라서, 물가가 흔들리지 않도록 세 겹으로 묶어 둔다.
   ① 하루 한 번만  ② 펫을 잘 돌봐 세 게이지가 모두 PET_JOB_MIN 이상일 때만
   ③ 금액은 등급 + 레벨로만 오르고 PET_JOB_MAX 를 넘지 않는다
   선생님이 마이룸 설정에서 통째로 끌 수 있고, 번 돈은 거래 로그에 남는다. */
const PET_JOB_COOL = 20 * 3600e3;   // 하루 한 번 (20시간)
const PET_JOB_MIN  = 40;            // 세 게이지가 모두 이 이상이어야 나간다
const PET_JOB_MAX  = 16;            // 하루 최대 획득 (모험 학습 하루 상한 50보다 한참 낮게)
function petJobEnabled(){
  const j = avPrices && avPrices.petJob;
  return !j || j.enabled !== false;   // 설정이 없으면 켜짐이 기본
}
function petJobReward(s){
  const tier = petTier(s.id);
  const byLevel = Math.floor(petLevelOfCare(s.care) / 5);   // 5레벨마다 +1
  return Math.max(0, Math.min(PET_JOB_MAX, tier.coin + byLevel));
}
function petJobReady(s){
  if(!petJobEnabled()) return {ok:false, why:'off'};
  const left = Math.max(0, (Number(s.jobAt)||0) + PET_JOB_COOL - Date.now());
  if(left > 0) return {ok:false, why:'cool', left};
  if(Math.min(s.hunger, s.clean, s.happy) < PET_JOB_MIN) return {ok:false, why:'weak'};
  return {ok:true};
}
async function petErrand(){
  if(_petBusy || _avBusy) return;
  const eq = avEquipped();
  if(!eq.pet) return;
  const me = getMyStudent();
  if(!me) return alert('학생 정보를 찾을 수 없어요.');
  const s = petNow(eq.pet);
  const ready = petJobReady(s);
  if(!ready.ok){
    if(ready.why === 'off')  return showFeedbackNotice('지금은 심부름을 보낼 수 없어요');
    if(ready.why === 'cool') return showFeedbackNotice('⏳ 심부름은 ' + petCoolText(ready.left) + ' 뒤에 또 보낼 수 있어요');
    return showFeedbackNotice('🍚 펫을 먼저 돌봐주세요 — 세 가지가 모두 ' + PET_JOB_MIN + ' 이상이어야 나가요');
  }
  if(!(await ensureActiveStudentSession(false))) return;
  const reward = petJobReward(s);
  if(reward <= 0) return;

  const prevRaw = petStore()[eq.pet] ? Object.assign({}, petStore()[eq.pet]) : null;
  s.jobAt = Date.now();
  s.happy = petClamp(s.happy - 8);    // 다녀오면 조금 지친다
  s.hunger = petClamp(s.hunger - 8);
  s.at = Date.now();
  petPut(s);

  _petBusy = true;
  try{
    await petPayErrand(reward, s.name || petStageName(eq.pet, petStageOfCare(s.care, eq.pet)));
  }catch(e){
    if(prevRaw) petStore()[eq.pet] = prevRaw; else delete petStore()[eq.pet];
    avBuyError(e, 0);
  }finally{
    _petBusy = false;
    avRefresh();
  }
}
/* 코인 지급 + 펫 기록을 한 트랜잭션으로. 서버에 기록된 마지막 심부름 시각으로 다시 확인해
   새로고침을 반복해도 하루 한 번만 받게 한다. */
async function petPayErrand(reward, petName){
  const db = window._db;
  if(!db || !window._fsRunTxn) throw new Error('OFFLINE');
  const studentsRef = window._fsDoc(db,'classrooms',roomId,'data','tesk-students');
  const avatarsRef  = window._fsDoc(db,'classrooms',roomId,'data','pesk-avatars');
  const a = avState();
  const petId = avEquipped().pet;
  let out = null;

  await window._fsRunTxn(db, async (txn)=>{
    const studSnap = await txn.get(studentsRef);
    const avSnap   = await txn.get(avatarsRef);
    const allStudents = studSnap.exists() ? (studSnap.data().value || []) : [];
    const allAv       = avSnap.exists()   ? (avSnap.data().value   || {}) : {};

    const prev = allAv[myStudentNum] || allAv[String(myStudentNum)] || {};
    const serverPet = (prev.pets && prev.pets[petId]) || {};
    const serverJobAt = Number(serverPet.jobAt) || 0;
    if(serverJobAt && Date.now() - serverJobAt < PET_JOB_COOL) throw new Error('ERRAND_TOO_SOON');

    const idx = allStudents.findIndex(st => st.num === myStudentNum);
    if(idx < 0) throw new Error('STUDENT_NOT_FOUND');
    const before = Number(allStudents[idx].points || 0);
    const after = before + reward;
    allStudents[idx].points = after;

    allAv[myStudentNum] = _avMergeRecord(prev, a);
    txn.set(studentsRef, {value: allStudents, updatedAt: new Date().toISOString()});
    txn.set(avatarsRef,  {value: allAv,       updatedAt: new Date().toISOString()});
    out = {allStudents, allAv, before, after};
  });

  students   = out.allStudents;
  allAvatars = out.allAv;
  myAvatar   = out.allAv[myStudentNum];

  addTxn('펫 심부름 (' + petName + ')', reward, 'earn');
  await pushEconLog({
    type: 'pet_job', detail: '펫 심부름 (' + petName + ')', delta: reward,
    balanceBefore: out.before, balanceAfter: out.after,
    meta: {petId, tier: petTierKey(petId)}
  });
  addNotif('🎁 ' + petName + '이(가) 심부름을 다녀와 ' + reward + '🪙을 물어왔어요!');
  showFeedbackNotice('🎁 심부름 완료! +' + reward + '🪙');
  renderEconomyPanels(getMyStudent());
}

/* ── 🤝 친구 펫 쓰다듬기 ──
   우리 반 룸에서 친구 펫을 누르면 서로 💗+1. 친구당 하루 한 번, 하루 PET_PAT_MAX_DAY 명까지.
   친밀도는 코인·XP와 무관한 값이라 남의 기록을 조금 올려주어도 경제에 영향이 없다. */
function petPatState(){
  const a = avState();
  const today = todayISO();
  const p = (a.pats && typeof a.pats === 'object') ? a.pats : {};
  return (p.day === today && Array.isArray(p.to))
    ? {day: today, to: p.to.map(Number).filter(Number.isFinite)}
    : {day: today, to: []};
}
function petCanPat(num){
  const st = petPatState();
  if(Number(num) === Number(myStudentNum)) return false;
  if(st.to.includes(Number(num))) return false;
  return st.to.length < PET_PAT_MAX_DAY;
}
async function petPatFriend(num){
  if(_petBusy || _avBusy) return;
  const n = Number(num);
  const st = petPatState();
  if(st.to.includes(n)) return showFeedbackNotice('🤝 오늘은 이미 쓰다듬었어요');
  if(st.to.length >= PET_PAT_MAX_DAY)
    return showFeedbackNotice('🤝 오늘은 ' + PET_PAT_MAX_DAY + '명까지 쓰다듬을 수 있어요');
  if(!window._fbReady || !window._db || !window._fsRunTxn)
    return showFeedbackNotice('연결 상태를 확인해주세요');

  const a = avState();
  _petBusy = true;
  try{
    const ref = window._fsDoc(window._db,'classrooms',roomId,'data','pesk-avatars');
    let msg = '';
    await window._fsRunTxn(window._db, async (txn)=>{
      const snap = await txn.get(ref);
      const all = snap.exists() ? (snap.data().value || {}) : {};
      const fKey = all[n] ? n : (all[String(n)] ? String(n) : null);
      const friend = fKey != null ? all[fKey] : null;
      const fPet = friend && friend.equipped ? friend.equipped.pet : null;
      if(!fPet) throw new Error('NO_FRIEND_PET');

      // 친구 펫에 +1 (친구가 오늘 받을 수 있는 한도 안에서만)
      const fPets = (friend.pets && typeof friend.pets === 'object') ? friend.pets : {};
      const rec = Object.assign({care:0, dayRecv:0, day:''}, fPets[fPet] || {});
      const today = todayISO();
      const recv = rec.day === today ? Math.max(0, Number(rec.dayRecv)||0) : 0;
      const given = recv < PET_PAT_RECV_MAX ? 1 : 0;
      rec.care = Math.max(0, Math.min(999, Math.round(Number(rec.care)||0) + given));
      rec.day = today;
      rec.dayRecv = recv + given;
      fPets[fPet] = rec;
      all[fKey] = Object.assign({}, friend, {pets: fPets, updatedAt: new Date().toISOString()});

      // 내 기록: 오늘 쓰다듬은 친구 목록 + 내 펫 친밀도
      const myPrev = all[myStudentNum] || all[String(myStudentNum)] || {};
      const nextTo = st.to.concat([n]);
      a.pats = {day: today, to: nextTo};
      const myRec = _avMergeRecord(myPrev, a);
      myRec.pats = {day: today, to: nextTo};
      all[myStudentNum] = myRec;
      allAvatars = all;
      txn.set(ref, {value: all, updatedAt: new Date().toISOString()});
      msg = given ? '' : '(친구는 오늘 이미 많이 받았어요)';
    });
    myAvatar = allAvatars[myStudentNum];
    const gained = await petGrow('pat', 1);
    const who = (students.find(s=>Number(s.num)===n) || {}).name || '친구';
    if(!gained) showFeedbackNotice('🤝 ' + who + '의 펫을 쓰다듬었어요! ' + msg);
  }catch(e){
    const a2 = avState();
    if(a2.pats) a2.pats = {day: todayISO(), to: st.to};
    if(String(e.message) === 'NO_FRIEND_PET') showFeedbackNotice('그 친구는 아직 펫이 없어요');
    else { console.warn('쓰다듬기 실패', e); showFeedbackNotice('지금은 쓰다듬을 수 없어요'); }
  }finally{
    _petBusy = false;
    avRefresh();
  }
}

/* 오늘 내가 체크리스트에 체크됐고 아직 안 받았으면 친밀도를 준다 (하루 1회) */
async function petClaimChecklist(){
  try{
    const eq = avEquipped();
    if(!eq.pet) return;
    const today = todayISO();
    const s = petNow(eq.pet);
    if(s.chkDay === today) return;
    const dayRec = (checklistRecords || {})[today] || {};
    const done = Object.keys(dayRec).some(itemId => {
      const m = dayRec[itemId] || {};
      const r = m[myStudentNum] || m[String(myStudentNum)];
      return !!(r && r.checked);
    });
    if(!done) return;
    await petGrow('checklist', 1);
  }catch(e){ console.warn('체크리스트 친밀도 실패', e); }
}

/* ── 🗿 보스 · 우리 반 보스 (전용 탭) ──

/* 보스전 시작 — 오늘 기회를 쓰고 보스전 전용 공격권을 만든다 */
async function bossStartFight(){
  if(rpgBusy || rpgShooter) return;
  if(!bossEntry().pending){
    const eq = avEquipped(), pet = window.PeskCombat.petProfile(eq.pet, eq.pet ? petLevelOfCare(petNow(eq.pet).care) : 1, petTierKey(eq.pet));
    const ticket = {id:uid()+'-boss-'+Date.now().toString(36), mode:'shooter', monsterId:'__boss__', weaponStyle:rpgWeapon().id,
      weaponId:eq.weapon||'', petId:eq.pet||'', petTier:pet?.tier||'common', petSkill:'', expMultiplier:1, power:avPower(eq).total};
    rpgBusy = true; qzBusy = true;
    try{
      await rpgMutateProgress((current,all,cfg)=>{
        const G = window.RPG, state = G.bossState(cfg,all,students);
        if(!state.on || state.cleared) throw new Error('BOSS_UNAVAILABLE');
        const e = G.bossChallenge(cfg, current, qzToday());
        if(e.pending) return current;            // 다른 창에서 이미 시작했다 — 이어서 싸운다
        if(!e.unlocked || e.usedToday) throw new Error('BOSS_UNAVAILABLE');
        const prev = G.bossRollRound(current.boss, cfg.roundId);
        return {...current, boss:{...prev, day:qzToday(),
          pending:{...ticket, bossRound:cfg.roundId, ammo:cfg.dailyAmmo, baseDamage:cfg.dailyAmmo*G.BASE_DMG}}};
      });
      bossFx = '';
    }catch(e){
      bossFx = '지금은 보스에 도전할 수 없어요. 오늘 도전 조건을 확인해주세요.';
      console.warn('보스전 시작 실패', e); await rpgReloadProgress();

/* 보스전 결과 — 공격권 하나를 정확히 한 번만 정산한다. 모험 체력·몬스터는 건드리지 않는다 */
async function bossFinishFight(options={}){
  const t = bossEntry().pending;
  if(rpgBusy || !t) return false;
  rpgBusy = true; qzBusy = true;
  const beforePct = bossNow()?.pct || 0;
  avRefresh();
  let outcome, saved = false;
  try{
    await rpgMutateProgress((current,all,cfg)=>{
      const G = window.RPG, rec = G.normalizeBossRec(current.boss), ticket = rec.pending;
      if(!ticket || ticket.id!==t.id) throw new Error('ATTACK_ALREADY_USED');
      if(!cfg.enabled || cfg.roundId!==ticket.bossRound || G.bossState(cfg,all,students).cleared){
        outcome = {expired:true}; return {...current, boss:{...rec, pending:null}};
      }
      const g = G.normalizeGame(current.game);
      const r = window.PeskCombat.resolve({...g, pendingAttack:ticket, heroHp:100},
        {ticketId:ticket.id, skip:!!options.skip || !options.report, report:options.report, usePet:false}, G, window.QRATE);
      outcome = r;
      // 펫 스킬 충전·전투 기록만 가져온다. 모험 체력·몬스터·모험 공격권은 그대로 둔다
      return {...current, game:{...r.game, heroHp:g.heroHp, hp:g.hp, monsterId:g.monsterId, pendingAttack:g.pendingAttack, carryDamage:g.carryDamage},
        boss:(()=>{const base = G.bossRollRound(rec, cfg.roundId), playDay = rec.day || qzToday();
          const days = r.damage > 0 && !base.days.includes(playDay) ? [...base.days, playDay].sort() : base.days;
          return {...base, dmg:base.dmg + r.damage, days, pending:null};})()};
    });
    saved = true; bossShooterReport = null;
    if(outcome.expired) bossFx = '보스전이 이미 끝났어요. 공동 보상을 확인해보세요!';
    else{
      rpgAnim = {kind:'hit', dmg:outcome.damage, prevPct:beforePct, weapon:t.weaponStyle};
      bossFx = (options.skip ? '📚 기본 공격 · ' : '⚔️ 보스에게 ') + outcome.damage.toLocaleString() + ' 피해!'
        + (options.report && !options.skip ? (options.report.perfect ? ' · 🌟 완벽한 전투' : '') + (options.report.boosts ? ' · 강타 ' + options.report.boosts + '회' : '') : '')
        + ' · 오늘 도전 완료';
    }
  }catch(e){
    bossFx = '보스전 결과를 저장하지 못했어요. 오늘 도전 기회는 그대로예요. 다시 시도해주세요.';
    if(e.message==='ATTACK_ALREADY_USED'){ await rpgReloadProgress(); bossFx = '이미 저장된 보스전이에요. 최신 기록을 불러왔어요.'; }
    console.warn('보스전 저장 실패', e);
  }finally{ rpgBusy = false; qzBusy = false; avRefresh(); }
  setTimeout(rpgClearAnim, 1000);
  await bossClaimTitle();
  return saved;
}

/* ── 🔬 진화 도감 ──
   펫을 누르면 1 → 2 → 3단계가 어떻게 생겼고 친밀도가 얼마나 필요한지 한눈에 보여준다.
   아직 도달하지 않은 단계도 실루엣이 아니라 그대로 보여준다 — 목표가 보여야 돌볼 마음이 생긴다. */
function openPetEvolution(petId){
  const eq = avEquipped();
  const id = petId || eq.pet;
  if(!id) return;
  const preview = id !== eq.pet;          // 아직 안 데려온 펫을 구경하는 중
  const s = preview
    ? {id, name:'', care:0, hunger:PET_MAX, clean:PET_MAX, happy:PET_MAX}
    : petNow(id);
  const eqId = id;
  const now = petStageOfCare(s.care, eqId);
  const lv = petLevelOfCare(s.care);
  const needLv = petStageLevels(eqId);        // 전설 펫이면 4단계까지 나온다
  const need = needLv.map(petCareForLevel);
  const info = window.AV_PET ? window.AV_PET(eqId) : null;
  const tier = petTier(eqId);
  const nm = preview ? (info ? info.name : '펫') : (s.name || petStageName(eqId, now));

  const steps = needLv.map((_, i) => i + 1).map((st, i) => {
    const reached = !preview && now >= st;
    const remain = Math.max(0, need[i] - s.care);
    return '<div class="pev-step' + (reached || preview ? ' on' : '') + (!preview && now === st ? ' cur' : '') + '">'
      + '<img src="' + petImgURL(eqId, st) + '" alt="">'
      + '<div class="pev-stage">' + st + '단계</div>'
      + '<div class="pev-name">' + escHtml(petStageName(eqId, st)) + '</div>'
      + '<div class="pev-need">' + (st === 1 ? 'Lv.1 처음부터'
          : preview ? 'Lv.' + needLv[i] + ' 부터'
          : reached ? 'Lv.' + needLv[i] + ' 달성'
          : 'Lv.' + needLv[i] + ' 필요<br><b>💗 ' + remain + ' 남음</b>') + '</div>'
      + (!preview && now === st ? '<div class="pev-badge">지금</div>' : '')
      + (st === 4 ? '<div class="pev-only">👑 전설 전용</div>' : '')
      + '</div>';
  }).join('<div class="pev-arrow">→</div>');

  // 등급이 실제로 뭘 바꾸는지 — 값을 더 낼지 말지 판단할 수 있게 숫자로 보여준다
  const slowPct = Math.round((1 - tier.decay) * 100);
  const tierRow = '<div class="pev-tier ' + petTierKey(eqId) + '">'
    + '<b>' + (tier.badge ? tier.badge + ' ' : '') + tier.name + ' 펫</b>'
    + '<span>' + (slowPct > 0 ? '배고픔·기분이 ' + slowPct + '% 천천히 줄어요' : '보통 속도로 배고파져요')
    + ' · 심부름 하루 한 번 ' + tier.coin + '🪙부터'
    + ' · 최종 ' + (tier.maxStage || 3) + '단계'
    + ((tier.maxStage || 3) >= 4 ? ' 👑' : '') + '</span></div>';

  const price = info ? Number(info.price || 0) : 0;
  const tip = preview
    ? '아직 데려오지 않은 펫이에요. 💗 ' + PET_CARE_PER_LEVEL + '마다 1레벨씩 오르고 '
      + 'Lv.' + PET_EVO_LV2 + '·Lv.' + PET_EVO_LV3 + '에서 위 모습으로 자라요.'
      + (price ? '<br><b>' + price.toLocaleString() + ' 🪙</b>' : '')
    : now >= 3
      ? '🎉 ' + escHtml(nm) + '은(는) 다 자랐어요! 계속 돌보면 Lv.' + PET_MAX_LEVEL + '까지 올라가요.'
      : '💗 ' + PET_CARE_PER_LEVEL + '마다 1레벨씩 올라요. 돌보기(하루 ' + PET_DAY_CARE + ')보다 '
        + '<b>글쓰기·모험 학습</b>로 더 빨리 자라요.';

  const ov = document.createElement('div');
  ov.className = 'pev-overlay';
  ov.id = 'pev-overlay';
  ov.onclick = (e)=>{ if(e.target === ov) closePetEvolution(); };
  ov.innerHTML = '<div class="pev-box">'
    + '<div class="pev-title">🐾 ' + escHtml(nm) + '의 진화 과정</div>'
    + '<div class="pev-sub">' + (preview ? '데려오기 전 미리보기'
        : '지금 Lv.' + lv + ' · 💗 ' + s.care + ' · ' + now + '단계') + '</div>'
    + tierRow
    + '<div class="pev-steps' + (needLv.length >= 4 ? ' four' : '') + '">' + steps + '</div>'
    + '<p class="pev-tip">' + tip + '</p>'
    + '<button class="pev-close" onclick="closePetEvolution()">닫기</button>'
    + '</div>';
  document.body.appendChild(ov);
}
function closePetEvolution(){
  const el = document.getElementById('pev-overlay');
  if(el) el.remove();
}

/* ── 돌보기 ── */
let _petBusy = false;
async function petDo(key){
  if(_petBusy || _avBusy) return;
  const act = PET_ACTS[key]; if(!act) return;
  const eq = avEquipped();
  if(!eq.pet) return;
  const me = getMyStudent();
  if(!me) return alert('학생 정보를 찾을 수 없어요.');

  const s = petNow(eq.pet);
  const left = petCoolLeft(s, key);
  if(left > 0) return showFeedbackNotice('⏳ ' + act.label + '는 ' + petCoolText(left) + ' 뒤에 또 할 수 있어요');

  if(act.cost > 0){
    if(!(await ensureActiveStudentSession(false))) return;
    if(economyBlocked('shop')) return economyBlockedNotice('shop');
    const fresh = await ensurePointsFresh(act.cost) || me;
    if(Number(fresh.points || 0) < act.cost)
      return alert('코인이 부족해요!\n필요: ' + act.cost + ' 🪙\n보유: ' + Number(fresh.points || 0).toLocaleString() + ' 🪙');
  }

  // 게이지·친밀도를 먼저 계산해 두고, 코인이 드는 것만 트랜잭션으로 확정한다
  const gained = Math.min(act.care, Math.max(0, PET_DAY_CARE - s.dayCare));
  Object.keys(act.gain).forEach(k => { s[k] = petClamp(s[k] + act.gain[k]); });
  s.acts = Object.assign({}, s.acts, {[key]: Date.now()});
  s.care += gained;
  s.dayCare += gained;
  s.at = Date.now();
  if(s.isNew && !s.born) s.born = Date.now();

  const beforeStage = petStageOfCare(s.care - gained, eq.pet);
  const afterStage  = petStageOfCare(s.care, eq.pet);

  const prevRaw = petStore()[eq.pet] ? Object.assign({}, petStore()[eq.pet]) : null;
  petPut(s);

  _petBusy = true;
  try{
    if(act.cost > 0) await petBuySnack(act);
    else await avSaveEquip();
    if(afterStage > beforeStage){
      const nm = s.name || petStageName(eq.pet, afterStage);
      addNotif('🐾 ' + nm + '이(가) ' + afterStage + '단계 ' + petStageName(eq.pet, afterStage) + '(으)로 자랐어요!');
      showFeedbackNotice('🎉 펫이 자랐어요! → ' + petStageName(eq.pet, afterStage));
    } else {
      showFeedbackNotice(act.icon + ' ' + act.label + ' 완료!' + (gained ? ' (💗 +' + gained + ')' : ''));
    }
  }catch(e){
    if(prevRaw) petStore()[eq.pet] = prevRaw; else delete petStore()[eq.pet];
    avBuyError(e, act.cost);
  }finally{
    _petBusy = false;
    avRefresh();
  }
}

/* 간식만 코인을 쓴다 — 매점·마이룸 구매와 같은 방식으로 잔액 차감과 상태 저장을 한 트랜잭션에 */
async function petBuySnack(act){
  const db = window._db;
  if(!db || !window._fsRunTxn) throw new Error('OFFLINE');
  const studentsRef = window._fsDoc(db, 'classrooms', roomId, 'data', 'tesk-students');
  const avatarsRef  = window._fsDoc(db, 'classrooms', roomId, 'data', 'pesk-avatars');
  const a = avState();
  let out = null;

  await window._fsRunTxn(db, async (txn) => {
    const studSnap = await txn.get(studentsRef);
    const avSnap   = await txn.get(avatarsRef);
    const allStudents = studSnap.exists() ? (studSnap.data().value || []) : [];
    const allAv       = avSnap.exists()   ? (avSnap.data().value   || {}) : {};

    const idx = allStudents.findIndex(st => st.num === myStudentNum);
    if(idx < 0) throw new Error('STUDENT_NOT_FOUND');
    const before = Number(allStudents[idx].points || 0);
    if(before < act.cost) throw new Error('INSUFFICIENT_BALANCE:' + before);
    const after = before - act.cost;
    allStudents[idx].points = after;

    const prev = allAv[myStudentNum] || allAv[String(myStudentNum)] || {};
    allAv[myStudentNum] = _avMergeRecord(prev, a);

    txn.set(studentsRef, {value: allStudents, updatedAt: new Date().toISOString()});
    txn.set(avatarsRef,  {value: allAv,       updatedAt: new Date().toISOString()});
    out = {allStudents, allAv, before, after};
  });

  students   = out.allStudents;
  allAvatars = out.allAv;
  myAvatar   = out.allAv[myStudentNum];

  addTxn('펫 ' + act.label, act.cost, 'spend');
  await pushEconLog({
    type: 'pet_care',
    detail: '펫 ' + act.label,
    delta: -act.cost,
    balanceBefore: out.before,
    balanceAfter: out.after
  });
  renderEconomyPanels(getMyStudent());
}

  if(input === null) return;

        + ' alt="">' : '';
    // 친구가 지어준 펫 이름 — 이름이 없으면 펫 종류 이름을 대신 보여준다
    const pName = eq.pet ? petNameOf(av, eq.pet, pStage) : '';

/* 친구 모험 기록 가져오기 — 1분에 한 번까지만. 올릴 내 기록이 있으면 올리면서 받는다(같은 읽기 1회).
   force: 화면을 떠날 때 밀린 요약을 올리는 경우 (숨김 상태여도 보낸다) */
async function pullQuizProgress(force){
  if(!window._fbReady || !window._db || !roomId || _quizPullBusy) return;
  if(!force && (document.hidden || Date.now() - _quizPullAt < 60000)) return;
  if(force && !_quizSummaryDirty) return;
  _quizPullBusy = true; _quizPullAt = Date.now();
  try{
    const st = quizStore();
    let summary;
    if(_quizSummaryDirty && myQuiz){ _quizSummaryDirty = false; summary = await st.flushSummary(myStudentNum, myQuiz); }
    else summary = await st.loadSummary();
    if(!force) receiveQuizProgress(withMyQuiz(summary));
  }catch(e){ console.warn('모험 기록 불러오기 실패', e); }
  finally{ _quizPullBusy = false; }
}
function receiveQuizProgress(all){
  _quizSnapshotVersion++;
  if(qzBusy || rpgBusy || _bossClaimBusy || classBossSettlementBusy){queueQuizResync();return;}
  _applyQuizProgress(all);
  if(rpgQ && rpgPicked===null && !rpgGame().pendingAttack && rpgQ._attemptTried!==Number(qzDaily().tried||0))rpgQ=null;
  scheduleAdventureRefresh();
  bossClaimTitle();
}
function queueQuizResync(){
  if(_quizResyncTimer!==null)return;
  _quizResyncTimer=setTimeout(async()=>{
    _quizResyncTimer=null;
    if(qzBusy || rpgBusy || _bossClaimBusy || classBossSettlementBusy){queueQuizResync();return;}
    const version=_quizSnapshotVersion;
    try{
      const all=await loadQuizProgressView();
      if(version===_quizSnapshotVersion)receiveQuizProgress(all);
    }catch(e){console.warn('모험 진행도 동기화 실패',e);}
  },500);
}
