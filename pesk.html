   (다른 탭에 있을 때 돌리면 배터리만 먹는다) */
let _petTimer = null;
function petTick(on){
  if(_petTimer){ clearInterval(_petTimer); _petTimer = null; }
  if(!on) return;
  _petTimer = setInterval(()=>{
    const panel = document.getElementById('panel-myroom');
    if(!panel || panel.style.display === 'none'){ petTick(false); return; }
    if(avRoomTab !== 'me' || _petBusy || _avBusy) return;
    if(!avEquipped().pet) return;
    avRefresh();
  }, 60000);
}

/* ─────────────────────────────────────────
   📖 오늘의 지문
   · 선생님이 승인한 지문만, 공개일부터 '놓친 회차 기간'까지 풀 수 있다.
   · 처음 채점한 정답 수를 먼저 저장한다 → 새로고침해도 첫 점수는 바뀌지 않는다.
   · 4문항을 모두 맞히면 완료. 보상은 서버 문서의 설정과 첫 점수로 한 번만 계산한다.
   · 기록: 내 모험 기록(pesk-quiz-progress/students/{번호}).literacy[날짜] = {first, done, coin, essay, essayOk}
───────────────────────────────────────── */
let litDoc = {cfg: null, sheets: {}};
let litView = null;   // {date, answers:{blanks, choice}, marks, msg}
let litBusy = false;
function _applyLiteracy(raw){
  const v = (raw && typeof raw === 'object') ? raw : {};
  const sheets = {};
  Object.entries((v.sheets && typeof v.sheets === 'object') ? v.sheets : {}).forEach(([d, s]) => {
    if(!s || s.status !== 'approved' || !s.sheet || !window.LiteracyCore) return;
    const chk = LiteracyCore.validate(s.sheet);
    if(chk.ok) sheets[d] = {date: d, subject: s.subject || '', topic: s.topic || '', sheet: chk.sheet,
      essay: s.essay && s.essay.on && s.essay.question ? String(s.essay.question) : ''};
  });
  litDoc = {cfg: window.LiteracyCore ? LiteracyCore.normalizeCfg(v.cfg) : null, sheets};
}
function litRec(date){ return ((myQuiz && myQuiz.literacy) || {})[date] || null; }
function litState(date){ return LiteracyCore.stateOn(date, todayISO(), litDoc.cfg ? litDoc.cfg.graceDays : 2); }
/* 지금 풀 수 있는 지문 (📖 오늘의 지문 탭의 숫자 배지·목록) */
function litOpenList(){ return Object.values(litDoc.sheets).filter(s => litState(s.date) === 'open').sort((a,b)=>a.date<b.date?1:-1); }
function litLabel(d){ return Number(d.slice(5,7)) + '/' + Number(d.slice(8)) + '(' + LiteracyCore.dowName(d) + ')'; }

/* 오늘 할 일 카드 — 풀 수 있는 지문마다 한 장 */
function litTodayTasks(){
  if(!window.LiteracyCore) return [];
  const today = todayISO();
  return litOpenList().map(s => {
    const r = litRec(s.date);
    const until = LiteracyCore.windowOf(s.date, litDoc.cfg.graceDays).until;
    if(r && r.done) return s.date === today ? {icon:'📖', done:true, go:"openLiteracy('" + s.date + "')", title:'오늘의 지문 완료', desc:'「' + s.sheet.title + '」 · 🪙 ' + Number(r.coin||0) + ' 받았어요'} : null;
    return {icon:'📖', hot: s.date === today, go:"openLiteracy('" + s.date + "')",
      title: s.date === today ? '오늘의 지문' : '지난 지문 풀기',
      desc: '「' + s.sheet.title + '」' + (s.date === today ? '' : ' · ' + litLabel(s.date)) + ' · ' + litLabel(until) + '까지'};
  }).filter(Boolean);
}

/* 📖 오늘의 지문은 모험 탭 안에서 연다 (advMode 'lit') */
function litEnsurePanel(){ return document.getElementById('panel-adventure'); }
function openLiteracy(date){
  litView = date && litDoc.sheets[date] ? {date, answers:{blanks:['','',''], choice:-1}, marks:null, msg:''} : null;
  advMode = 'lit';
  _litOpening = true;
  try{ showTab('adventure'); } finally{ _litOpening = false; }
}
function closeLiteracy(){ litView = null; advMode = 'rpg'; avRefresh(); window.scrollTo({top:0,behavior:'smooth'}); }
function renderLiteracyPanel(){
  if(advMode !== 'lit') return;
  const panel = litEnsurePanel();
  if(!panel || panel.style.display === 'none') return;
  if(!window.LiteracyCore){ panel.innerHTML = '<div class="lit-empty">지문 기능을 불러오지 못했어요. 새로고침해 주세요.</div>'; return; }
  LiteracyCore.injectStyles();
  if(litView && !litDoc.sheets[litView.date]) litView = null;
  panel.innerHTML = rpgSubjectTabsHtml() + (litView ? litSheetHtml() : litListHtml());
  if(litView) litBind(panel);
}
function litListHtml(){
  const open = litOpenList();
  const today = todayISO();
  const done = Object.values(litDoc.sheets).filter(s => litRec(s.date)?.done && litState(s.date) !== 'open').sort((a,b)=>a.date<b.date?1:-1).slice(0,6);
  const card = (s, sub, cls) => '<button type="button" class="lit-item' + (cls||'') + '" onclick="openLiteracy(\'' + s.date + '\')">'
    + '<span class="lit-item-subj">' + escHtml(s.subject) + '</span>'
    + '<span class="lit-item-body"><b>' + escHtml(s.sheet.title) + '</b><small>' + sub + '</small></span><span class="lit-item-go">›</span></button>';
  let next = '';
  if(!open.some(s => !litRec(s.date)?.done)){
    const days = todoSchedule ? todoSchedule.weekly.literacy : [];
    const nd = LiteracyCore.upcomingDates(days, LiteracyCore.addDays(today, 1), 1)[0];
    next = '<div class="lit-empty">🌱 지금 풀 지문을 다 했어요.' + (nd ? '<br>다음 지문은 <b>' + litLabel(nd) + '</b>에 열려요.' : '') + '</div>';
  }
  return '<div class="lit-list">'
    + '<div class="lit-list-head"><div class="lit-list-title">📖 오늘의 지문</div><div class="lit-list-sub">글을 읽고 한눈에 정리 빈칸을 채워 봐요. 처음 채점할 때 많이 맞힐수록 보너스!</div></div>'
    + open.map(s => {
        const r = litRec(s.date);
        const until = LiteracyCore.windowOf(s.date, litDoc.cfg.graceDays).until;
        return card(s, litLabel(s.date) + (r && r.done ? ' · ✅ 완료 · 🪙 ' + Number(r.coin||0) : ' · ' + litLabel(until) + '까지'), r && r.done ? ' done' : (s.date === today ? ' hot' : ''));
      }).join('')
    + next
    + (done.length ? '<div class="lit-list-sub" style="margin:16px 2px 6px;">지난 기록</div>' + done.map(s => card(s, litLabel(s.date) + ' · 처음 ' + litRec(s.date).first + '/4', ' done')).join('') : '')
    + '</div>';
}
function litSheetHtml(){
  const s = litDoc.sheets[litView.date];
  const r = litRec(litView.date);
  const finished = !!(r && r.done);
  const closed = litState(litView.date) !== 'open';
  const fb = litView.marks && !litView.marks.allRight
    ? '<div class="lit-fb">' + litView.marks.wrong.map(w => '<button type="button" data-lit-goto="' + w.evidence + '">✗ ' + w.n + '번' + (w.empty ? (w.n === 4 ? '을 아직 고르지 않았어' : ' 빈칸을 아직 채우지 않았어') : '이 틀렸어') + '. 👉 ' + w.evidence + '문단을 다시 읽어 봐</button>').join('') + '</div>' : '';
  let tail = '';
  if(finished){
    tail = '<div class="lit-card lit-sec lit-reward"><h3>🎉 완료했어요!</h3><div class="lit-note">처음 채점: 4문항 중 ' + r.first + '개 정답</div>'
      + '<div class="lit-rw total"><span>받은 보상</span><b>🪙 ' + Number(r.coin||0) + '</b></div>'
      + (Number(r.tickets) > 0 ? '<div class="lit-rw on"><span>모험 공격권</span><b>⚔️ +' + Number(r.tickets) + '</b></div>' : '')
      + ((typeof bossOn === 'function' && bossOn() && String(r.doneAt||'') && LiteracyCore.ymd(new Date(r.doneAt)) === todayISO()) ? '<div class="lit-note" style="margin-top:8px;">오늘 보스 도전 조건도 채웠어요! 🤝</div>' : '')
      + (Number(r.first) < litDoc.cfg.bonusMin ? '<div class="lit-note" style="margin-top:8px;">처음에 ' + litDoc.cfg.bonusMin + '개 이상 맞히면 보너스 🪙' + litDoc.cfg.coinBonus + '! 다음엔 천천히 읽어 봐요.</div>' : '')
      + '</div>'
      + (s.essay ? litEssayHtml(s, r, closed) : '')
      + litNextHtml(litView.date);
  }else if(closed){
    tail = '<div class="lit-empty">이 지문은 풀 수 있는 기간이 지났어요.</div>';
  }else{
    tail = fb + (litView.msg ? '<div class="lit-note" style="margin-bottom:8px;">' + escHtml(litView.msg) + '</div>' : '')
      + '<button type="button" class="lit-btn" id="lit-check"' + (litBusy ? ' disabled' : '') + '>' + (litBusy ? '저장하는 중…' : '채점하기') + '</button>'
      + '<div class="lit-note" data-learning-save style="text-align:center;margin-top:6px;"></div>';
  }
  const ans = finished ? {blanks: LiteracyCore.blanksOf(s.sheet).map(b=>b.answer), choice: s.sheet.final_quiz.answer} : litView.answers;
  return '<div class="lit-top"><button type="button" class="lit-back" onclick="openLiteracy()">‹ 지문 목록</button></div>'
    + LiteracyCore.renderSheet(s.sheet, {dateLabel: litLabel(s.date), subject: s.subject, answers: ans,
        marks: finished ? LiteracyCore.grade(s.sheet, ans) : litView.marks, locked: finished || closed || litBusy})
    + '<div class="lit">' + tail + '</div>';
}
/* 다 푼 뒤: 아직 안 푼 지문이 있으면 바로 이어 풀고, 없으면 모험으로 돌아간다 */
function litNextHtml(date){
  const next = litOpenList().find(x => x.date !== date && !litRec(x.date)?.done);
  return next
    ? '<button type="button" class="lit-btn" style="margin-top:4px;" onclick="openLiteracy(\'' + next.date + '\')">다음 지문 풀기 · ' + escHtml(next.sheet.title) + ' ›</button>'
    : '<button type="button" class="lit-btn ghost" style="margin-top:4px;" onclick="closeLiteracy()">⚔️ 모험 문제 풀러 가기</button>';
}
function litEssayHtml(s, r, closed){
  const locked = !!r.essayOk || closed;
  return '<div class="lit-card lit-sec lit-essay"><div class="lit-sec-t"><span class="lit-tag">서술형</span>선생님이 낸 문제<span class="lit-q">선택</span></div>'
    + '<div class="lit-quiz">' + escHtml(s.essay) + '</div>'
    + '<textarea id="lit-essay-text" maxlength="600" placeholder="글에서 찾은 근거를 넣어 2~3문장으로 써 봐요."' + (locked ? ' disabled' : '') + '>' + escHtml(r.essay || '') + '</textarea>'
    + (r.essayOk ? '<div class="lit-note" style="margin-top:6px;">👍 선생님이 확인했어요.</div>'
        : locked ? '' : '<button type="button" class="lit-btn ghost" id="lit-essay-send" style="margin-top:8px;"' + (litBusy ? ' disabled' : '') + '>' + (r.essay ? '고쳐서 다시 내기' : '선생님께 내기') + '</button>')
    + '</div>';
}
function litBind(panel){
  panel.querySelectorAll('[data-lit-blank]').forEach(inp => inp.addEventListener('input', () => {
    litView.answers.blanks[Number(inp.dataset.litBlank)] = inp.value;
    inp.parentElement.classList.remove('no');
  }));
  panel.querySelectorAll('[data-lit-choice]').forEach(btn => btn.addEventListener('click', () => {
    if(btn.disabled) return;
    litView.answers.choice = Number(btn.dataset.litChoice);
    panel.querySelectorAll('[data-lit-choice]').forEach(b => { b.classList.remove('ok','no','sel'); if(b === btn) b.classList.add('sel'); });
  }));
  panel.querySelectorAll('[data-lit-goto]').forEach(b => b.addEventListener('click', () => litHighlight(Number(b.dataset.litGoto))));
  panel.querySelector('#lit-check')?.addEventListener('click', litCheck);
  panel.querySelector('#lit-essay-send')?.addEventListener('click', litSendEssay);
}
function litHighlight(p){
  const panel = litEnsurePanel();
  if(!panel) return;
  panel.querySelectorAll('[data-lit-p]').forEach(el => el.classList.toggle('lit-hl', Number(el.dataset.litP) === p));
  panel.querySelector('[data-lit-p="' + p + '"]')?.scrollIntoView({behavior:'smooth', block:'center'});
}
async function litCheck(){
  if(litBusy || !litView) return;
  const date = litView.date, s = litDoc.sheets[date];
  if(!s) return;
  const g = LiteracyCore.grade(s.sheet, litView.answers);
  litView.marks = g; litView.msg = '';
  litBusy = true; renderLiteracyPanel();
  try{
    if(!litRec(date)){
      const f = await litCommit(date, 'first', {score: g.score});
      if(f && f.tickets > 0) showFeedbackNotice('⚔️ 처음에 ' + g.score + '개 맞혀서 모험 공격권 +' + f.tickets + '!');
    }
    if(g.allRight){
      const out = await litCommit(date, 'done', {});
      if(out && out.gain > 0){
        addTxn('오늘의 지문 완료 보상', out.gain, 'earn');
        void pushEconLog({type:'literacy_reward', detail:'오늘의 지문 (' + date + ')', delta: out.gain,
          balanceBefore: out.before, balanceAfter: out.after, meta:{date, first: out.first}});
        renderEconomyPanels(getMyStudent());
        showFeedbackNotice('🎉 오늘의 지문 완료! 🪙 ' + out.gain);
      }
    }
  }catch(e){
    console.warn('오늘의 지문 저장 실패', e);
    litView.msg = e.message === 'LIT_CLOSED' ? '이 지문은 지금 풀 수 없어요. 목록에서 다시 확인해 주세요.'
      : '저장하지 못했어요. 인터넷 연결을 확인하고 다시 채점해 주세요.';
  }finally{
    litBusy = false;
    renderLiteracyPanel();
    refreshTodayPanel();
    if(litView && litView.marks && !litView.marks.allRight) litHighlight(litView.marks.wrong[0].evidence);
  }
}
async function litSendEssay(){
  const date = litView && litView.date;
  const text = String(document.getElementById('lit-essay-text')?.value || '').trim().slice(0, 600);
  if(!date) return;
  if(text.length < 5) return showFeedbackNotice('✍️ 조금 더 써 볼까요?');
  litBusy = true; renderLiteracyPanel();
  try{ await litCommit(date, 'essay', {text}); showFeedbackNotice('✍️ 선생님께 냈어요!'); }
  catch(e){ console.warn('서술형 저장 실패', e); showFeedbackNotice('⚠️ 저장하지 못했어요. 다시 시도해 주세요.'); }
  finally{ litBusy = false; renderLiteracyPanel(); }
}
/* 서버 트랜잭션: 지문이 승인·공개 중인지 서버 문서로 다시 확인하고 기록·보상을 한 번에 저장 */
async function litCommit(date, kind, arg){
  if(!window._fbReady || !window._db || !roomId || !window._fsRunTxn) throw new Error('CONNECTION_REQUIRED');
  const db = window._db;
  const qs = quizStore();
  const studRef = window._fsDoc(db,'classrooms',roomId,'data','tesk-students');
  const litRef  = window._fsDoc(db,'classrooms',roomId,'data','pesk-literacy');
  let out = null;
  await runLearningTransaction(db, async (txn) => {
    const [qctx, studSnap, litSnap] = await Promise.all([qs.open(txn, myStudentNum), txn.get(studRef), txn.get(litRef)]);
    const lv = litSnap.exists() ? (litSnap.data().value || {}) : {};
    const cfg = LiteracyCore.normalizeCfg(lv.cfg);
    const sheet = lv.sheets && lv.sheets[date];
    const today = todayISO();
    if(!sheet || sheet.status !== 'approved' || LiteracyCore.stateOn(date, today, cfg.graceDays) !== 'open') throw new Error('LIT_CLOSED');
    const all = qctx.all;
    const key = myStudentNum;
    const me = Object.assign({}, all[key] || {});
    const lit = Object.assign({}, me.literacy || {});
    const rec = Object.assign({}, lit[date] || {});
    const now = new Date().toISOString();
    let gain = 0, before = null, after = null, ticketsOut = 0;
    if(kind === 'first'){
      if(rec.firstAt) { out = {gain:0}; return; }
      rec.first = Math.max(0, Math.min(4, Number(arg.score) || 0)); rec.firstAt = now; rec.done = false;
      // 처음 채점에서 맞힌 문항마다 모험 공격권 2개 (사냥 준비 문제 수는 차지하지 않는다, 최대 30개까지 쌓임)
      if(window.RPG){
        const g = window.RPG.normalizeGame(me.game);
        const room = Math.max(0, 30 - g.huntEnergy.length);
        const n = Math.min(room, rec.first * 2);
        for(let i = 0; i < n; i++) g.huntEnergy.push(window.RPG.BASE_DMG);
        me.game = g; rec.tickets = n; ticketsOut = n;
      }
    }else if(kind === 'done'){
      if(rec.done || !rec.firstAt){ out = {gain:0}; return; }
      gain = LiteracyCore.reward(cfg, rec.first).total;
      rec.done = true; rec.doneAt = now; rec.coin = gain;
      me.litDay = today;   // 오늘의 지문 완료 → 오늘 보스 도전 자격
      if(gain > 0){
        const list = studSnap.exists() ? (studSnap.data().value || []) : [];
        const i = list.findIndex(x => Number(x.num) === Number(myStudentNum));
        if(i < 0){ gain = 0; rec.coin = 0; }
        else{
          before = Number(list[i].points || 0); after = before + gain; list[i].points = after;
          txn.set(studRef, {value: list, updatedAt: now});
          out = {students: list};
        }
      }
    }else if(kind === 'essay'){
      if(!rec.done || rec.essayOk || !sheet.essay || !sheet.essay.on){ out = {gain:0}; return; }
      rec.essay = String(arg.text || '').slice(0, 600); rec.essayAt = now;
    }
    lit[date] = rec;
    // 오래된 지문 기록 정리 (문서 비대화 방지 — 150일)
    const keep = LiteracyCore.addDays(today, -150);
    Object.keys(lit).forEach(d => { if(d < keep) delete lit[d]; });
    all[key] = Object.assign(me, {literacy: lit, studentName: myStudentName || '', accountUid: myAccountUid || '', updatedAt: now});
    qs.save(qctx, {[key]: all[key]});
    out = Object.assign(out || {}, {mine: all[key], gain, before, after, first: rec.first, tickets: ticketsOut});
  });
  if(out && out.mine){ const view = withMyQuiz(allQuizProgress); view[myStudentNum] = out.mine; _applyQuizProgress(view); markQuizSummaryDirty(); }
  if(out && out.students) students = out.students;
  return out;
}

/* ─────────────────────────────────────────
   🧩 성장 — 주간 퀘스트 · 조각 · 제작 · 도감 · 세트 (규칙: shared/pesk-progression.js)
   · 퀘스트는 학생마다 무작위 3개 (선생님이 켠 종류 · 고정한 퀘스트 우선). 월요일마다 바뀐다.
   · 조각은 제작에만 쓴다. 제작 아이템은 상점에서 팔지 않는다.
───────────────────────────────────────── */
let questCfg = null;
let _questBusy = false;
function _applyQuestCfg(raw){ questCfg = (raw && typeof raw === 'object') ? raw : null; }
const PG = () => window.PeskProgress;
function myFrags(){ return PG() ? PG().normFrags((qzState() || {}).frags) : {know:0, grit:0, brave:0}; }
function mySetFx(eq){
  return (window.PeskCombat && window.PeskCombat.setEffects) ? window.PeskCombat.setEffects(eq || avEquipped())
    : {wrongDmg:12, petCharge:0, power:0, expPct:0, campHeal:0, royal:0, fragBonus:0, active:[]};
}
function questCtx(){
  return {literacy: !!(todoSchedule && (todoSchedule.weekly.literacy || []).length), boss: typeof bossOn === 'function' && bossOn()};
}
function myQuests(){
  if(!PG()) return [];
  const week = PG().weekKey(todayISO()), rec = qzState(), claimed = PG().questClaimed(rec, week);
  return PG().pickQuests(questCfg, week, String(myStudentNum), questCtx()).map(q => ({...q, week,
    progress: Math.min(q.target, PG().questProgress(q.id, rec, week, questCfg)), claimed: claimed.includes(q.id)}));
}
function fragChipsHtml(){
  if(!PG()) return '';
  const f = myFrags();
  return '<span class="frag-chips">' + PG().FRAG_IDS.map(k => '<span class="frag-chip" title="' + escHtml(PG().FRAGS[k].name + ' · ' + PG().FRAGS[k].from) + '">'
    + PG().FRAGS[k].icon + ' <b>' + f[k] + '</b></span>').join('') + '</span>';
}
/* 접어 둔 상태는 이 기기에만 기억한다 (학생별) */
function questFolded(){ try{ return localStorage.getItem('pesk-quest-fold:' + STUDENT_SCOPE_KEY()) === '1'; }catch(_e){ return false; } }
function toggleQuestFold(){
  try{ localStorage.setItem('pesk-quest-fold:' + STUDENT_SCOPE_KEY(), questFolded() ? '0' : '1'); }catch(_e){}
  avRefresh();
}
function questCardHtml(){
  if(!PG()) return '';
  const qs = myQuests();
  if(!qs.length) return '';
  const fx = mySetFx(), folded = questFolded();
  const doneN = qs.filter(q => q.claimed || q.progress >= q.target).length, claimN = qs.filter(q => !q.claimed && q.progress >= q.target).length;
  const head = '<div class="quest-head"><button type="button" class="quest-fold" onclick="toggleQuestFold()" aria-expanded="' + !folded + '">'
    + '<span class="quest-caret">' + (folded ? '▸' : '▾') + '</span><b>🧩 이번 주 퀘스트</b>'
    + '<small>완료 ' + doneN + '/' + qs.length + (claimN ? ' · <span class="quest-claim-n">받을 보상 ' + claimN + '개</span>' : '') + '</small></button>' + fragChipsHtml() + '</div>';
  if(folded) return '<div class="quest-card folded">' + head + '</div>';
  return '<div class="quest-card">' + head
    + qs.map(q => {
        const done = q.progress >= q.target;
        return '<div class="quest-row' + (q.claimed ? ' claimed' : done ? ' done' : '') + '">'
          + '<span class="quest-ic">' + q.icon + '</span>'
          + '<span class="quest-body"><span class="quest-name">' + escHtml(q.name) + (q.pinned ? ' <small>📌 선생님</small>' : '') + '</span>'
          + '<span class="quest-bar"><i style="width:' + Math.round(q.progress / q.target * 100) + '%"></i></span>'
          + '<small>' + q.progress + ' / ' + q.target + (q.unit || '') + ' · 보상 ' + PG().fragText(q.reward) + (fx.fragBonus ? ' (+' + fx.fragBonus + ' 노력 세트)' : '') + '</small></span>'
          + (q.claimed ? '<span class="quest-ok">✅</span>' : done ? '<button type="button" class="quest-claim" onclick="claimQuest(\'' + q.id + '\')">받기</button>' : '')
          + '</div>';
      }).join('')
    + '<div class="quest-foot">월요일마다 새 퀘스트가 나와요 · 조각은 <a href="#" onclick="openDex();return false;">📚 도감 → 제작</a>에 써요</div></div>';
}
function questClaimableCount(){ return myQuests().filter(q => !q.claimed && q.progress >= q.target).length; }
function openDex(){ showTab('myroom'); avShowRoomTab('dex'); }
async function claimQuest(id){
  if(_questBusy || !PG()) return;
  const q = myQuests().find(x => x.id === id);
  if(!q || q.claimed || q.progress < q.target) return;
  const bonus = mySetFx().fragBonus;
  _questBusy = true;
  try{
    await rpgMutateProgress(current => {
      const claimed = PG().questClaimed(current, q.week);
      if(claimed.includes(id)) return current;
      if(PG().questProgress(id, current, q.week, questCfg) < q.target) throw new Error('NOT_DONE');
      const gain = {...q.reward};
      if(bonus) PG().FRAG_IDS.forEach(k => { if(gain[k]) gain[k] += bonus; });
      return {...current, frags: PG().addFrags(current.frags, gain), qw: {week: q.week, claimed: claimed.concat([id])}};
    });
    showFeedbackNotice('🧩 퀘스트 완료! ' + PG().fragText(q.reward) + (bonus ? ' (+' + bonus + ')' : ''));
  }catch(e){ console.warn('퀘스트 보상 실패', e); showFeedbackNotice('⚠️ 보상을 받지 못했어요. 다시 눌러 주세요.'); }
  finally{ _questBusy = false; avRefresh(); refreshTodayPanel(); }
}

/* ── 📚 도감 ── */
const DEX_CATS = ['weapon','hat','top','bottom','shoes','pet','room','hair'];
function dexStats(){
  const all = [];
  DEX_CATS.forEach(c => (avCatalog()[c] || []).forEach(i => all.push({cat:c, item:i})));
  const owned = all.filter(x => avOwns(x.cat, x.item)).length;
  return {all, owned, total: all.length, pct: all.length ? Math.floor(owned / all.length * 100) : 0};
}
function dexThumb(cat, item){
  if(cat === 'pet') return '<img class="dex-thumb pet" src="' + petImgURL(item.id, 1) + '" alt="">';
  if(cat === 'room') return '<span class="dex-thumb room" style="' + (window.AV_ROOM_STYLE ? window.AV_ROOM_STYLE(item.id) : '') + '"></span>';
  return '<img class="dex-thumb" src="' + avCharDataURL(Object.assign({}, avEquipped(), {[cat]: item.id})) + '" alt="">';
}
function buildDexPanel(){
  if(!PG() || !window.PeskCombat) return '<div class="empty-state">도감 파일을 불러오지 못했어요.</div>';
  const st = dexStats(), f = myFrags(), eq = avEquipped();
  const steps = PG().DEX_STEPS.map(s => {
    const reached = st.pct >= s.pct;
    const item = s.item ? avFind('room', s.item) : null;
    const got = item && avOwns('room', item);
    return '<div class="dex-step' + (reached ? ' on' : '') + '"><b>' + s.pct + '%</b><small>' + escHtml(s.reward) + '</small>'
      + (item && reached && !got ? '<button type="button" onclick="claimDexItem(\'' + s.item + '\')">받기</button>' : got ? '<small>✅ 받음</small>' : '') + '</div>';
  }).join('');
  const title = PG().dexTitle(st.pct);
  const craft = PG().RECIPES.map(r => {
    const item = avFind(r.slot, r.id);
    if(!item) return '';
    const have = avOwns(r.slot, item), can = PG().canCraft(f, r), pw = avPowerOfItem(r.slot, r.id);
    return '<div class="craft-item' + (have ? ' have' : '') + '">' + dexThumb(r.slot, item)
      + '<span class="craft-name">' + escHtml(r.name) + (pw ? ' <small class="av-item-atk static">💪+' + pw + '</small>' : '') + '</span>'
      + '<small>' + PG().fragText(r.cost) + '</small>'
      + (have ? '<span class="craft-have">✅ 가지고 있음</span>'
          : '<button type="button" class="craft-btn"' + (can ? '' : ' disabled') + ' onclick="avCraft(\'' + r.id + '\')">' + (can ? '🔨 만들기' : '조각 부족') + '</button>')
      + '</div>';
  }).join('');
  const sets = window.PeskCombat.setsOf(eq).map(s => {
    const pieces = s.pieces.map(p => {
      const cat = ({a:'hat',t:'top',l:'bottom',e:'shoes',w:'weapon'})[p[0]];
      const item = avFind(cat, p);
      const owned = (avCatalog()[cat] || []).some(i => (s.craft ? i.id === p : window.PeskCombat.pieceMatches(p, i.id)) && avOwns(cat, i));
      const worn = s.craft ? eq[cat] === p : window.PeskCombat.pieceMatches(p, eq[cat]);
      return '<span class="set-piece' + (worn ? ' worn' : owned ? ' owned' : '') + '">' + escHtml(item ? item.name : p) + '</span>';
    }).join('');
    return '<div class="set-card' + (s.level ? ' on' : '') + '"><div class="set-head">' + s.icon + ' <b>' + escHtml(s.name) + ' 세트</b><small>입은 부위 ' + s.count + ' / ' + s.total + '</small></div>'
      + '<div class="set-pieces">' + pieces + '</div>'
      + '<div class="set-fx"><span class="' + (s.level >= 1 ? 'on' : '') + '">3개: ' + escHtml(s.fx[0].text) + '</span><span class="' + (s.level >= 2 ? 'on' : '') + '">' + (s.fullAt ? s.fullAt + '개' : '전부') + ': ' + escHtml(s.fx[1].text) + '</span></div></div>';
  }).join('');
  const grid = DEX_CATS.map(c => {
    const list = avCatalog()[c] || [];
    if(!list.length) return '';
    const have = list.filter(i => avOwns(c, i)).length;
    return '<div class="dex-cat"><div class="dex-cat-head">' + (AV_LABEL[c] || c) + ' <small>' + have + ' / ' + list.length + '</small></div><div class="dex-grid">'
      + list.map(i => {
          const own = avOwns(c, i), pw = avPowerOfItem(c, i.id);
          const src = own ? '' : i.craft ? '🧩 제작' : avPriceOf(c, i).toLocaleString() + '🪙';
          return '<div class="dex-cell' + (own ? '' : ' lock') + '" title="' + escHtml(i.name) + '">' + dexThumb(c, i)
            + (pw ? '<span class="av-item-atk">💪+' + pw + '</span>' : '')
            + '<span class="dex-name">' + escHtml(i.name) + '</span>' + (src ? '<span class="dex-src">' + src + '</span>' : '') + '</div>';
        }).join('') + '</div></div>';
  }).join('');
  return '<div class="dex">'
    + '<div class="dex-top"><div><div class="dex-title">📚 아이템 도감' + (title ? ' <span class="av-title">' + escHtml(title) + '</span>' : '') + '</div>'
    + '<div class="dex-sub">' + st.owned + ' / ' + st.total + '개 모음</div></div><b class="dex-pct">' + st.pct + '%</b></div>'
    + '<div class="dex-bar"><i style="width:' + st.pct + '%"></i></div>'
    + '<div class="dex-steps">' + steps + '</div>'
    + '<div class="section-title" style="margin:18px 0 8px;">🔨 제작 ' + fragChipsHtml() + '</div>'
    + '<p class="av-hint">조각은 주간 퀘스트와 복수 몬스터에서 모아요. 제작 아이템은 상점에서 팔지 않아요.</p>'
    + '<div class="craft-list">' + craft + '</div>'
    + '<div class="section-title" style="margin:18px 0 8px;">🧷 세트 효과</div>'
    + '<p class="av-hint">같은 세트를 3개 입으면 1단계, 전부 입으면 2단계 효과가 생겨요. 불꽃 검처럼 강화된 아이템도 같은 계열로 쳐요.</p>'
    + '<div class="set-list">' + sets + '</div>'
    + '<div class="section-title" style="margin:18px 0 8px;">🗂️ 모든 아이템</div>' + grid
    + '</div>';
}
/* 제작: 조각(학습 기록)과 보유 목록(아바타 문서)을 한 트랜잭션으로 바꾼다 */
async function avCraft(id){
  const r = PG() && PG().RECIPES.find(x => x.id === id);
  if(!r || _avBusy) return;
  const item = avFind(r.slot, id);
  if(!item || avOwns(r.slot, item)) return;
  if(!PG().canCraft(myFrags(), r)) return showFeedbackNotice('조각이 부족해요: ' + PG().fragText(r.cost));
  if(!confirm('「' + r.name + '」을(를) 만들까요?\n사용할 조각: ' + PG().fragText(r.cost))) return;
  await avGrantItem(id, r.cost, '🔨 「' + r.name + '」을(를) 만들었어요! 옷장에서 입어 보세요.');
}
/* 도감 50% 보상: 수집가의 방 */
async function claimDexItem(id){
  const step = PG() && PG().DEX_STEPS.find(s => s.item === id);
  if(!step || dexStats().pct < step.pct) return;
  await avGrantItem(id, null, '🏛️ 「수집가의 방」을 받았어요! 옷장 → 방에서 바꿔 보세요.');
}
async function avGrantItem(id, cost, message){
  if(_avBusy) return;
  if(!window._fbReady || !window._db || !roomId || !window._fsRunTxn) return showFeedbackNotice('인터넷에 연결된 뒤 다시 시도해 주세요.');
  const db = window._db, now = new Date().toISOString();
  const qs = quizStore();
  const avRef = window._fsDoc(db,'classrooms',roomId,'data','pesk-avatars');
  _avBusy = true;
  try{
    let out = null;
    await runLearningTransaction(db, async txn => {
      const [qctx, as] = await Promise.all([qs.open(txn, myStudentNum), txn.get(avRef)]);
      const all = withMyQuiz(allQuizProgress), allAv = as.exists() ? (as.data().value || {}) : {};
      all[myStudentNum] = qctx.mine;
      const prevAv = allAv[myStudentNum] || allAv[String(myStudentNum)] || {};
      const owned = new Set(Array.isArray(prevAv.owned) ? prevAv.owned : []);
      if(owned.has(id)){ out = {all, allAv}; return; }
      if(cost){
        const key = myStudentNum;
        const me = {...(all[key] || {})};
        me.frags = PG().spend(me.frags, cost);   // 부족하면 NOT_ENOUGH 로 멈춘다
        all[key] = {...me, studentName: myStudentName || '', accountUid: myAccountUid || '', updatedAt: now};
        qs.save(qctx, {[key]: all[key]});
      }
      owned.add(id);
      const a = avState();
      allAv[myStudentNum] = {...prevAv, equipped: prevAv.equipped || Object.assign({}, a.equipped), owned: Array.from(owned),
        spent: Number(prevAv.spent || 0), pets: _avMergePets(prevAv.pets, a.pets), pats: _avMergePats(a.pats || prevAv.pats),
        studentName: myStudentName || '', accountUid: myAccountUid || '', updatedAt: now};
      txn.set(avRef, {value: allAv, updatedAt: now});
      out = {all, allAv};
    });
    _applyQuizProgress(out.all);
    allAvatars = out.allAv; myAvatar = out.allAv[myStudentNum] || out.allAv[String(myStudentNum)] || myAvatar;
    showFeedbackNotice(message);
  }catch(e){
    console.warn('아이템 받기 실패', e);
    showFeedbackNotice(String(e.message) === 'NOT_ENOUGH' ? '조각이 부족해요.' : '⚠️ 저장하지 못했어요. 다시 시도해 주세요.');
  }finally{ _avBusy = false; avRefresh(); }
}

/* 주기적으로 가져오기는 최근 2분 안에 화면을 만진 학생만 — 켜 두고 안 쓰는 태블릿은 읽지 않는다 */
let _lastActiveAt = Date.now();
['pointerdown','keydown'].forEach(t=>document.addEventListener(t, ()=>{ _lastActiveAt = Date.now(); }, {capture:true, passive:true}));
function recentlyActive(){ return Date.now() - _lastActiveAt < 120000; }
/* 코인이 모자라 보이면 서버에서 한 번 더 확인한다 — 방금 선생님이 준 포인트가 아직 안 보였을 수 있다 */
async function ensurePointsFresh(need){
  const me = getMyStudent();
  if(me && Number(me.points||0) >= Number(need||0)) return me;
  _studentsPullAt = 0;
  await pullStudents();
  return getMyStudent();
}
/* 포인트 명단 가져오기 — 20초에 한 번까지만, 화면을 보고 있을 때만 */
async function pullStudents(){
  if(!window._fbReady || !window._db || !roomId || document.hidden || _studentsPullBusy) return;
  if(Date.now() - _studentsPullAt < 20000) return;
  _studentsPullBusy = true; _studentsPullAt = Date.now();
  try{
    const snap = await window._fsGetDoc(window._fsDoc(window._db,'classrooms',roomId,'data','tesk-students'));
    if(snap.exists()) applyStudentsList(snap.data().value || []);
  }catch(e){ console.warn('포인트 불러오기 실패', e); }
  finally{ _studentsPullBusy = false; }
}
function subscribeToUpdates(){
  _unsubs.forEach(fn=>fn());
  _unsubs = [];
  if(!window._fbReady) return;

  _unsubs.push(window._fsOnSnapshot(
    window._fsDoc(window._db,'classrooms',roomId,'data','pesk-peer-survey'),
    snap=>applyPeerSurveyDoc(snap.exists()?snap.data():{},true),
    error=>console.warn('설문 회차 동기화 실패',error)
  ));

  // 서버 인증·무료 Firebase 인증에서는 계정 목록을 구독하지 않는다(읽을 수도 없다). 실제 접근은 규칙이 즉시 막는다.
  if(_studentAuthApiCache){
    const check=()=>{if(document.visibilityState!=='hidden')ensureActiveStudentSession(true);};
    const timer=setInterval(check,60000);
    document.addEventListener('visibilitychange',check);
    _unsubs.push(()=>{clearInterval(timer);document.removeEventListener('visibilitychange',check);});
  }else{
    _unsubs.push(window._fsOnSnapshot(
      window._fsDoc(window._db,'classrooms',roomId,'data','tesk-accounts'),
      ()=>{ensureActiveStudentSession(true);}
    ));
  }

  // 학생 포인트 — 반 전체 명단 문서라 실시간으로 받지 않는다. 누가 코인을 받을 때마다
  // 접속한 모두가 다시 읽어 무료 읽기 한도를 넘겼다. 내 코인 변화는 저장할 때 바로 반영되고,
  // 선생님이 준 포인트는 1분 안에(화면으로 돌아오면 바로) 보인다.
  _studentsPullAt = Date.now();   // 시작할 때 이미 읽었다
  const studentsTimer = setInterval(()=>{ if(recentlyActive()) pullStudents(); }, 60000);
  const studentsVisible = ()=>{ if(!document.hidden) pullStudents(); };
  document.addEventListener('visibilitychange', studentsVisible);
  _unsubs.push(()=>{ clearInterval(studentsTimer); document.removeEventListener('visibilitychange', studentsVisible); });

  _unsubs.push(window._fsOnSnapshot(
    window._fsDoc(window._db,'classrooms',roomId,'data','tesk-shop'),
    (snap)=>{
      if(snap.exists()){
        shopItems = snap.data().value || [];
        shopItems.forEach((item, idx)=>{
          if(!item.id) item.id = 'shop_legacy_' + idx;
        });
        const panel = document.getElementById('panel-shop');
        if(panel) panel.innerHTML = buildShopPanel(getMyStudent());
      }
    }
  ));

  _unsubs.push(window._fsOnSnapshot(
    window._fsDoc(window._db,'classrooms',roomId,'data','pesk-purchase-log'),
    (snap)=>{
      purchaseLogs = snap.exists() ? (snap.data().value || []) : [];
      const panel = document.getElementById('panel-shop');
      if(panel) panel.innerHTML = buildShopPanel(getMyStudent());
    }
  ));

  _unsubs.push(window._fsOnSnapshot(
    window._fsDoc(window._db,'classrooms',roomId,'data','pesk-purchases'),
    (snap)=>{
      const allPurchases = snap.exists() ? (snap.data().value || []) : [];
      applyClassBossPurchases(allPurchases);
      myPurchases = allPurchases.filter(recordBelongsToMe);
      const panel = document.getElementById('panel-shop');
      if(panel) panel.innerHTML = buildShopPanel(getMyStudent());
      const bankPanel = document.getElementById('panel-stock');
      if(bankPanel) bankPanel.innerHTML = buildBankPanel(getMyStudent());
    }
  ));

  _unsubs.push(window._fsOnSnapshot(
    window._fsDoc(window._db,'classrooms',roomId,'data','tesk-economy-restrictions'),
    (snap)=>{
      economyRestrictions = snap.exists() ? (snap.data().value || {}) : {};
      renderEconomyPanels(getMyStudent());
    }
  ));

  // 직업/체크 권한 실시간
  _unsubs.push(window._fsOnSnapshot(
    window._fsDoc(window._db,'classrooms',roomId,'data','tesk-jobs'),
    (snap)=>{
      if(snap.exists()){
        jobs = snap.data().value || [];
        refreshChecklistTabUI();
      }
    }
  ));

  // 체크리스트 항목 실시간
  _unsubs.push(window._fsOnSnapshot(
    window._fsDoc(window._db,'classrooms',roomId,'data','tesk-checklist-items'),
    (snap)=>{
      if(snap.exists()){
        checklistItems = snap.data().value || [];
        const panel=document.getElementById('panel-checklist');
        if(panel) panel.innerHTML=buildChecklistPanel();
        refreshChallengePanel();
      }
    }
  ));

  // 체크리스트 기록 실시간
  _unsubs.push(window._fsOnSnapshot(
    window._fsDoc(window._db,'classrooms',roomId,'data','pesk-checklists'),
    (snap)=>{
      checklistRecords = snap.exists() ? (snap.data().value || {}) : {};
      renderChecklistBody();
      refreshChallengePanel();
      maybeAutoPayAutoChallenge('checklist'); // 내 체크 조건 충족 시 자동 지급
    }
  ));

  _unsubs.push(window._fsOnSnapshot(
    window._fsDoc(window._db,'classrooms',roomId,'data','tesk-challenges'),
    (snap)=>{
      classChallenges = snap.exists() ? (snap.data().value || {manual:[]}) : {manual:[]};
      const wrap=document.getElementById('student-challenge-wrap');
      if(wrap) wrap.innerHTML=buildStudentChallengePanel();
      refreshChallengePanel();
    }
  ));

  _unsubs.push(window._fsOnSnapshot(
    window._fsDoc(window._db,'classrooms',roomId,'data','pesk-challenge-submissions'),
    (snap)=>{
      challengeSubmissions = snap.exists() ? (snap.data().value || {}) : {};
      const wrap=document.getElementById('student-challenge-wrap');
      if(wrap) wrap.innerHTML=buildStudentChallengePanel();
      refreshChallengePanel();
    }
  ));

  _unsubs.push(window._fsOnSnapshot(
    window._fsDoc(window._db,'classrooms',roomId,'data','tesk-challenge-awards'),
    (snap)=>{
      challengeAwards = snap.exists() ? (snap.data().value || {}) : {};
      refreshChallengePanel();
    }
  ));

  // 내 글쓰기 피드백 실시간
  _unsubs.push(subscribeMyWritings(
    (allWritings)=>{
        const myNewWritings = allWritings.filter(recordBelongsToMe);
        const prevSignature = _myWritingSignature;
        const nextSignature = getMyWritingSignature(myNewWritings);
        const hadFeedback = peskWritings.filter(w=>w.feedback).length;
        const nowFeedback = myNewWritings.filter(w=>w.feedback).length;
        const hadRead = peskWritings.filter(w=>w.readAt && !w.feedback).length;
        const nowRead = myNewWritings.filter(w=>w.readAt && !w.feedback).length;
        const hadAnthRequest = peskWritings.filter(w=>w.anthology?.status==='student-review').length;
        const nowAnthRequest = myNewWritings.filter(w=>w.anthology?.status==='student-review').length;
        peskWritings = myNewWritings;
        _myWritingSignature = nextSignature;
        const prevAnth = anthologySignature(classAnthology);
        classAnthology = anthologyFrom(allWritings);
        if(prevAnth !== anthologySignature(classAnthology)) refreshAnthologyArea();
        if(nowAnthRequest > hadAnthRequest){
          addNotif('📚 선생님이 내 글을 우리 반 글 모음집에 싣고 싶어 해요!');
          showFeedbackNotice('📚 모음집 맞춤법 확인 요청이 왔어요!');
        }
        refreshChallengePanel();
        const panel = document.getElementById('panel-writing');
        if(panel && panel.style.display !== 'none' && prevSignature !== nextSignature){
          // ⚠️ 절대 panel.innerHTML 전체를 다시 그리지 말 것 (작성 중인 textarea가 파괴되어 글이 사라짐)
          // 리스트 영역만 갱신 — 폼(textarea)은 그대로 유지되어 학생이 쓰던 글이 사라지지 않음
          if(!refreshWritingListOnly()){
            // 최초 렌더 폴백: writing-list-area 컨테이너가 아직 없으면 전체 렌더
            captureWritingDraftFromDom();
            panel.innerHTML = buildWritingPanel();
          }
        }
        if(nowFeedback > hadFeedback){
          addNotif('✉️ 선생님이 피드백을 보내주셨어요!');
          showFeedbackNotice('✉️ 선생님이 피드백을 보내주셨어요!');
        } else {
          if(nowRead > hadRead){
            addNotif('👁️ 선생님이 글을 읽었어요!');
            showFeedbackNotice('👁️ 선생님이 글을 읽었어요!');
          }
        }
    },
    e=>{ console.warn('글쓰기 구독 실패', e); showFeedbackNotice('글 목록을 불러오지 못했어요. 잠시 후 새로고침해주세요.'); }
  ));

  // 🗿 우리 반 보스 설정 실시간 — 선생님이 새 보스를 내면 바로 보인다
  _unsubs.push(window._fsOnSnapshot(
    window._fsDoc(window._db,'classrooms',roomId,'data','pesk-class-boss'),
    (snap)=>{
      _applyBossCfg(snap.exists() ? snap.data().value : null);
      if(advActive()) scheduleAdventureRefresh();
    }
  ));

  // 🧒 오늘 할 일 요일표 실시간 — 선생님이 체크를 바꾸면 홈 목록과 글쓰기 미제출 계산이 바로 따라간다
  _unsubs.push(window._fsOnSnapshot(
    window._fsDoc(window._db,'classrooms',roomId,'data','pesk-todo-schedule'),
    (snap)=>{
      _applyTodoSchedule(snap.exists() ? snap.data().value : null);
      const panel = document.getElementById('panel-writing');
      const formOpen = (document.getElementById('writing-form-wrap')||{}).style?.display === 'block';
      if(panel && panel.style.display !== 'none' && !formOpen) panel.innerHTML = buildWritingPanel();
      renderEconomyPanels(getMyStudent());
      refreshTodayPanel();
    }
  ));

  // 🧩 주간 퀘스트 설정 — 선생님이 종류·목표를 바꾸면 바로 반영
  _unsubs.push(window._fsOnSnapshot(
    window._fsDoc(window._db,'classrooms',roomId,'data','pesk-quest-config'),
    (snap)=>{ _applyQuestCfg(snap.exists() ? snap.data().value : null); if(avAnyVisible()) scheduleAdventureRefresh(); refreshTodayPanel(); }
  ));

  // 📖 오늘의 지문 — 선생님이 승인하거나 취소하면 바로 반영 (푸는 중인 화면은 건드리지 않는다)
  _unsubs.push(window._fsOnSnapshot(
    window._fsDoc(window._db,'classrooms',roomId,'data','pesk-literacy'),
    (snap)=>{
      _applyLiteracy(snap.exists() ? snap.data().value : null);
      if(advActive() === 'rpg'){
        if(advMode !== 'lit') scheduleAdventureRefresh();
        else if(!litView || !litDoc.sheets[litView.date]) renderLiteracyPanel();
      }
      refreshTodayPanel();
    }
  ));

  // ✍️ 일일 글쓰기 의무 설정 실시간
  _unsubs.push(window._fsOnSnapshot(
    window._fsDoc(window._db,'classrooms',roomId,'data','pesk-writing-duty'),
    (snap)=>{
      _applyWritingDuty(snap.exists() ? snap.data().value : null);
      const panel = document.getElementById('panel-writing');
      const formOpen = (document.getElementById('writing-form-wrap')||{}).style?.display === 'block';
      if(panel && !formOpen) panel.innerHTML = buildWritingPanel();
      renderEconomyPanels(getMyStudent());
    }
  ));

  // 📌 글쓰기 주제 실시간 — 선생님이 주제를 바꾸면 새로고침 없이 바로 보인다
  _unsubs.push(window._fsOnSnapshot(
    window._fsDoc(window._db,'classrooms',roomId,'data','pesk-writing-topic'),
    (snap)=>{
      const before = writingTopic ? writingTopic.title : '';
      _applyWritingTopic(snap.exists() ? snap.data().value : null);
      const after = writingTopic ? writingTopic.title : '';
      if(before === after) return;
      const panel = document.getElementById('panel-writing');
      // 작성 중인 글이 날아가지 않게, 폼이 열려 있으면 다시 그리지 않는다
      const formOpen = (document.getElementById('writing-form-wrap')||{}).style?.display === 'block';
      if(panel && !formOpen) panel.innerHTML = buildWritingPanel();
      if(after) addNotif('📌 새 글쓰기 주제: ' + after);
    }
  ));

  // 내 은행 예금 실시간
  _unsubs.push(window._fsOnSnapshot(
    window._fsDoc(window._db,'classrooms',roomId,'data','pesk-deposits'),
    (snap)=>{
      if(snap.exists()){
        const all = snap.data().value || {};
        myDeposits = _canonicalEconomyList(all, _mergeDepositLists);
        renderEconomyPanels(getMyStudent());
        checkDepositMaturityNotices();
      }
    }
  ));

  // 내 주식 보유량 실시간
  _unsubs.push(window._fsOnSnapshot(
    window._fsDoc(window._db,'classrooms',roomId,'data','pesk-portfolios'),
    (snap)=>{
      if(snap.exists()){
        const all = snap.data().value || {};
        myPortfolio = _canonicalEconomyList(all, _mergePortfolioLists);
        renderEconomyPanels(getMyStudent());
      }
    }
  ));

  // 주식 가격 실시간
  _unsubs.push(window._fsOnSnapshot(
    window._fsDoc(window._db,'classrooms',roomId,'data','tesk-stock-prices'),
    (snap)=>{
      if(snap.exists()){
        stockPrices = snap.data().value || {};
        if(!stockPrices || Object.keys(stockPrices).length===0) stockPrices = _defaultStockPrices();
        renderEconomyPanels(getMyStudent());
      }
    }
  ));

  // 🧍 마이룸 — 학급 아바타 / 선생님이 정한 가격
  _unsubs.push(window._fsOnSnapshot(
    window._fsDoc(window._db,'classrooms',roomId,'data','pesk-avatars'),
    (snap)=>{
      if(_avBusy) return;   // 내가 저장하는 중이면 덮어쓰지 않음
      _applyAvatarDoc(snap.exists() ? (snap.data().value || {}) : {});
      if(avAnyVisible()) scheduleAdventureRefresh();
      const mini = document.getElementById('av-mini');
      if(mini) mini.src = avCharDataURL(avEquipped());
    }
  ));

  _unsubs.push(window._fsOnSnapshot(
    window._fsDoc(window._db,'classrooms',roomId,'data','pesk-avatar-prices'),
    (snap)=>{
      _applyAvatarPriceDoc(snap.exists() ? snap.data().value : null);
      if(avAnyVisible()) scheduleAdventureRefresh();
    }
  ));

  // 🎓 모험 학습 설정 (선생님이 학년·단원·보상을 바꾸면 즉시 반영)
  _unsubs.push(window._fsOnSnapshot(
    window._fsDoc(window._db,'classrooms',roomId,'data','pesk-quiz-config'),
    (snap)=>{
      _applyQuizConfig(snap.exists() ? snap.data().value : null);
      rpgQ = null; rpgPicked = null; rpgDiag = null; // 진단도 새 학년·단원 범위로 다시 시작
      if(avAnyVisible()) scheduleAdventureRefresh();
    }
  ));

  // 반 전체 모험 기록은 실시간으로 받지 않는다 — 한 명이 저장할 때마다 접속한 모두가 다시 읽어
  // 무료 읽기 한도를 넘겼다. 내 기록은 저장할 때 바로 반영되고, 친구 기록은 화면을 열 때·3분마다 받는다.
  _quizPullAt = Date.now();   // 첫 화면은 시작할 때 이미 읽었다
  // 밀린 내 요약은 3분마다 올린다(받기도 함께). 화면을 떠날 때도 올린다. 쓰기 한도(하루 2만)를 아끼려고 문제마다 올리지 않는다.
  const quizTimer = setInterval(()=>{ if(_quizSummaryDirty || (avAnyVisible() && recentlyActive())) pullQuizProgress(); }, 180000);
  const quizVisible = ()=>{ if(document.hidden) pullQuizProgress(true); else if(avAnyVisible()) pullQuizProgress(); };
  const quizLeave = ()=>pullQuizProgress(true);
  document.addEventListener('visibilitychange', quizVisible);
  window.addEventListener('pagehide', quizLeave);
  _unsubs.push(()=>{ clearInterval(quizTimer); document.removeEventListener('visibilitychange', quizVisible); window.removeEventListener('pagehide', quizLeave); });

  // 상담 신청 상태
  _unsubs.push(window._fsOnSnapshot(
    window._fsDoc(window._db,'classrooms',roomId,'data','tesk-counsel-requests'),
    (snap)=>{
      if(snap.exists()){
        const all = snap.data().value||[];
        const wasPending = myPendingCounsel;
        myPendingCounsel = all.some(r=>recordBelongsToMe(r) && r.status==='pending');
        if(wasPending && !myPendingCounsel){
          addNotif('✅ 상담 신청이 선생님께 확인됐어요!');
          showFeedbackNotice('✅ 상담 신청이 선생님께 확인됐어요!');
          const panel = document.getElementById('counsel-sub-request');
          if(panel) panel.innerHTML = buildCounselRequestPanel();
        }
      }
    }
  ));
}

function showFeedbackNotice(msg){
  let el = document.getElementById('pesk-notice');
  if(!el){
    el = document.createElement('div');
    el.id = 'pesk-notice';
    el.style.cssText='position:fixed;top:70px;left:50%;transform:translateX(-50%);'
      +'background:var(--pesk);color:#fff;padding:11px 22px;border-radius:14px;'
      +'font-size:13px;font-weight:700;z-index:999;box-shadow:0 4px 20px rgba(79,142,247,0.4);'
      +'animation:fadeDown .3s ease;white-space:nowrap;';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(()=>{ el.style.display='none'; }, 3000);
}

function escHtml(str){
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ─────────────────────────────────────────
   시작
───────────────────────────────────────── */
// 시작이 오래 걸리면 로딩만 돌지 않게 안내한다 (연결·기기 저장소 문제로 응답이 오지 않는 경우)
let _appStarted = false;
setTimeout(()=>{
  if(_appStarted || _sessionInvalidating || _loggingOut || !roomId || !myStudentNum) return;
  document.getElementById('app').innerHTML='<div class="loading">불러오는 데 너무 오래 걸려요.<br>화면을 새로고침해 주세요. 계속 안 되면 열린 Pesk 창을 모두 닫고 다시 열어 주세요.'
    +'<br><br><button type="button" class="pesk-btn primary" style="width:auto;padding:10px 18px;" onclick="location.reload()">새로고침</button></div>';
}, 20000);
waitFirebase(async()=>{
  if(!roomId || !myStudentNum){ renderNoAccess(); return; }
  const sessionOk = await ensureActiveStudentSession(false);
  if(!sessionOk){
    if(!_sessionInvalidating)renderError('계정을 확인하지 못했어요. 인터넷 연결을 확인하고 새로고침해주세요.');
    return;
  }
  await Promise.all([loadData(), _loadQuotes(), avPreload()]);
  _appStarted = true;
  if(students.find(s=>s.num===myStudentNum)){
    renderDashboard();
  } else {
    renderNoAccess();
  }
});
</script>

.survey-cat-section select,.survey-cat-section textarea{font:inherit;font-size:14px;color:var(--text);background:var(--surface);border:1px solid #d1d5db;border-radius:9px;max-width:100%;}
.survey-cat-section select:focus-visible,.survey-cat-section textarea:focus-visible,.friend-chip:focus-visible{outline:3px solid #93c5fd;outline-offset:2px;}
.survey-cat-section legend{font-size:13px;line-height:1.6;}
.survey-cat-section textarea{resize:vertical;}
.sna-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.sna-bar-label{font-size:11px;color:var(--sub);width:72px;flex-shrink:0;}
.sna-bar-track{flex:1;height:8px;background:var(--bg);border-radius:99px;overflow:hidden;}
.sna-bar-fill{height:100%;border-radius:99px;}
.sna-bar-val{font-size:11px;font-weight:800;width:18px;text-align:right;flex-shrink:0;}

/* ── 🧍 마이룸 (픽셀 아바타) ── */
.avatar{position:relative;overflow:visible;cursor:pointer;}
#av-mini{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);
  width:76px;height:76px;image-rendering:pixelated;pointer-events:none;
  filter:drop-shadow(0 3px 3px rgba(0,0,0,.35));}
.av-stage{border-radius:var(--radius-sm);overflow:hidden;border:1.5px solid var(--border);}
/* 방 테마 — 모든 색을 CSS 변수로 빼서 테마별로 갈아끼움 */
.av-room{position:relative;height:210px;
  --wallA:#7f93c4; --wallB:#93a6d4; --floorA:#a9855f; --floorB:#bb9a72;
  --wallLine:rgba(255,255,255,.10); --floorLine:rgba(0,0,0,.10);
  --winSky1:#bde3fb; --winSky2:#7fb6e2; --winFrame:#3b4a6b; --deco:none;
  background:linear-gradient(180deg,var(--wallA) 0%,var(--wallB) 58%,var(--floorA) 58%,var(--floorB) 100%);}
.av-room::before{content:'';position:absolute;inset:0 0 42% 0;
  background-image:var(--deco),
                   linear-gradient(90deg,var(--wallLine) 1px,transparent 1px),
                   linear-gradient(var(--wallLine) 1px,transparent 1px);
  background-size:auto, 28px 28px, 28px 28px;
  background-repeat:repeat, repeat, repeat;}
.av-room::after{content:'';position:absolute;left:0;right:0;bottom:0;height:42%;
  background-image:linear-gradient(90deg,var(--floorLine) 1px,transparent 1px);
  background-size:34px 100%;}
.av-window{position:absolute;top:22px;left:26px;width:56px;height:46px;border-radius:4px;
  background:linear-gradient(180deg,var(--winSky1),var(--winSky2));border:3px solid var(--winFrame);}
.av-window::after{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent 46%,var(--winFrame) 46%,var(--winFrame) 54%,transparent 54%),
             linear-gradient(180deg,transparent 46%,var(--winFrame) 46%,var(--winFrame) 54%,transparent 54%);}
.av-hero{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);}
.av-hero img{width:150px;height:150px;display:block;image-rendering:pixelated;
  filter:drop-shadow(0 5px 4px rgba(0,0,0,.4));}
.av-tag{position:absolute;left:50%;bottom:152px;transform:translateX(-50%);
  background:rgba(20,24,36,.8);color:#fff;border-radius:99px;padding:2px 11px;
  font-size:11px;font-weight:700;white-space:nowrap;}
/* 👦👧 성별 고르기 */
.av-gender{display:flex;gap:6px;margin:9px 0 0;}
.av-gender-btn{flex:1;padding:9px 10px;border-radius:11px;border:1.5px solid var(--border);
  background:var(--card);color:var(--text);font-size:12.5px;font-weight:800;
  cursor:pointer;font-family:inherit;transition:border-color .15s,background .15s;}
.av-gender-btn.on{background:var(--pesk);border-color:var(--pesk);color:#fff;}
/* ⚔️ 모험 */
.rpg-intro{background:var(--card);border:1.5px solid var(--border);border-radius:14px;
  padding:22px 18px;text-align:center;margin-top:12px;}
.rpg-intro-icon{font-size:40px;display:block;margin-bottom:10px;}
.rpg-intro b{font-size:16px;display:block;margin-bottom:8px;}
.rpg-intro p{font-size:12.5px;color:var(--sub);line-height:1.75;}
.rpg-go{margin-top:16px;width:100%;padding:13px;border-radius:12px;border:none;cursor:pointer;
  background:var(--pesk);color:#fff;font-size:14px;font-weight:800;font-family:inherit;}
.rpg-diag-head{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 6px;font-size:13px;}
.rpg-diag-head span{font-size:12px;color:var(--sub);font-weight:800;}
.rpg-diag-bar{height:7px;border-radius:99px;background:var(--border);overflow:hidden;margin-bottom:10px;}
.rpg-diag-bar i{display:block;height:100%;background:var(--pesk);transition:width .3s;}
.rpg-head{display:flex;align-items:center;gap:10px;margin:12px 0 10px;flex-wrap:wrap;}
.rpg-lv{display:flex;align-items:center;gap:7px;flex:1;min-width:180px;}
.rpg-lv-badge{font-size:12px;font-weight:800;color:#fff;background:#7c5cd6;border-radius:99px;padding:3px 9px;}
.rpg-lv-bar{flex:1;height:8px;border-radius:99px;background:var(--border);overflow:hidden;}
.rpg-lv-bar i{display:block;height:100%;background:linear-gradient(90deg,#a78bfa,#7c5cd6);transition:width .4s;}
.rpg-lv-xp{font-size:10.5px;font-weight:800;color:var(--sub);white-space:nowrap;}
.rpg-kills{font-size:11.5px;font-weight:700;color:var(--sub);}
.rpg-stage{background:var(--card);border:1.5px solid var(--border);border-radius:14px;
  padding:16px;text-align:center;margin-bottom:12px;}
.rpg-mon-big{font-size:56px;line-height:1.1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.18));
  position:relative;display:inline-block;}

/* ── 대치 무대 ──
   왼쪽 내 아바타, 오른쪽 몬스터. 움직이지 않고 서로 마주 본 채
   공격할 때만 앞으로 파고들었다 돌아온다. */
.rpg-arena{display:flex;align-items:flex-end;justify-content:center;gap:14px;min-height:96px;}
.rpg-side{display:flex;flex-direction:column;align-items:center;gap:1px;}
.rpg-vs{align-self:center;font-size:10.5px;font-weight:800;color:var(--hint);padding-bottom:26px;}
.rpg-hero{position:relative;display:inline-block;}
.rpg-hero img{width:74px;height:74px;image-rendering:pixelated;display:block;
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.28));}
.rpg-hero-pet{width:28px;height:28px;image-rendering:pixelated;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));}

/* 정답 — 아바타가 파고들며 팔을 휘두른다 */
.rpg-hero.attack{animation:heroLunge .42s cubic-bezier(.32,1.5,.5,1);}
@keyframes heroLunge{
  0%{transform:translateX(0);}
  28%{transform:translateX(20px) scale(1.06);}
  44%{transform:translateX(24px);}
  100%{transform:translateX(0);}
}
/* 휘두른 궤적 */
.rpg-slash{position:absolute;right:-16px;top:10px;width:36px;height:36px;pointer-events:none;
  border-right:5px solid #fff;border-top:5px solid #fff;border-radius:50%;
  opacity:0;animation:rpgSlash .34s ease-out .06s;}
@keyframes rpgSlash{
  0%{opacity:0;transform:rotate(-70deg) scale(.45);}
  35%{opacity:.95;}
  100%{opacity:0;transform:rotate(45deg) scale(1.3);}
}
/* 몬스터 피격 — 흰색 플래시 뒤 흔들림 */
.rpg-mon-big.hurt{animation:monHurt .44s ease .18s both;}
@keyframes monHurt{
  0%{filter:brightness(1);}
  8%{filter:brightness(4) saturate(0);}
  26%{filter:brightness(1);transform:translateX(8px);}
  46%{transform:translateX(-6px);}
  68%{transform:translateX(4px);}
  100%{transform:translateX(0);}
}
/* 오답 — 몬스터가 달려들고 아바타가 맞는다 */
.rpg-mon-big.strike{animation:monStrike .46s ease;}
@keyframes monStrike{
  0%{transform:translateX(0);}
  34%{transform:translateX(-22px) scale(1.07);}
  52%{transform:translateX(-18px);}
  100%{transform:translateX(0);}
}
.rpg-hero.hurt{animation:heroHurt .44s ease .2s both;}
@keyframes heroHurt{
  0%{transform:translateX(0);}
  18%{transform:translateX(-10px);}
  38%{transform:translateX(7px);}
  58%{transform:translateX(-5px);}
  100%{transform:translateX(0);}
}
.rpg-hero.hurt img{animation:heroFlash .44s ease .2s both;}
@keyframes heroFlash{
  0%,100%{filter:drop-shadow(0 3px 4px rgba(0,0,0,.28));}
  22%{filter:drop-shadow(0 3px 4px rgba(0,0,0,.28)) sepia(1) saturate(7) hue-rotate(-35deg);}
}
/* 임팩트 표시 */
.rpg-impact{position:absolute;left:50%;top:6px;transform:translateX(-50%);
  font-size:30px;pointer-events:none;opacity:0;animation:rpgImpact .42s ease-out .2s;}
.rpg-impact.hurt{font-size:24px;top:0;animation-delay:.24s;}
@keyframes rpgImpact{
  0%{opacity:0;transform:translateX(-50%) scale(.4);}
  28%{opacity:1;transform:translateX(-50%) scale(1.2);}
  100%{opacity:0;transform:translateX(-50%) scale(1.5);}
}
/* 데미지 숫자가 위로 튀어오르며 사라진다 */
.rpg-dmg{position:absolute;left:50%;top:-6px;font-weight:900;font-size:19px;color:#fff;
  text-shadow:0 2px 0 rgba(0,0,0,.5),0 0 6px rgba(0,0,0,.35);pointer-events:none;
  animation:rpgDmg .85s ease-out .2s both;}
@keyframes rpgDmg{
  0%{opacity:0;transform:translate(-50%,8px) scale(.6);}
  20%{opacity:1;transform:translate(-50%,-4px) scale(1.2);}
  60%{opacity:1;transform:translate(-50%,-22px) scale(1);}
  100%{opacity:0;transform:translate(-50%,-36px) scale(.95);}
}
/* 움직임을 줄이도록 설정한 기기에서는 흔들지 않는다 */
@media (prefers-reduced-motion:reduce){
  .rpg-hero.attack,.rpg-hero.hurt,.rpg-hero.hurt img,
  .rpg-mon-big.hurt,.rpg-mon-big.strike,.rpg-slash,.rpg-impact,.rpg-dmg{animation:none;}
  .rpg-dmg,.rpg-impact{opacity:1;}
}
.rpg-mon-title{font-size:14px;font-weight:900;margin-top:4px;}
.rpg-hp{height:12px;border-radius:99px;background:var(--border);overflow:hidden;margin:9px 0 4px;}
.rpg-hp i{display:block;height:100%;border-radius:99px;background:var(--mc,#e88a8a);transition:width .4s;}
.rpg-hp-num{font-size:11px;font-weight:800;color:var(--sub);}
.rpg-fx{margin-top:8px;font-size:12.5px;font-weight:800;color:var(--pesk);}
.rpg-regions{margin-top:14px;}
.rpg-region{margin-bottom:12px;}
.rpg-region.lock{opacity:.55;}
.rpg-region-head{font-size:12px;font-weight:800;color:var(--sub);margin-bottom:6px;}
.rpg-lockmsg{font-weight:700;color:var(--hint);font-size:11px;}
.rpg-mons{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px;}
.rpg-mon{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 4px;

.rpg-mon.lock{opacity:.45;cursor:not-allowed;}
.rpg-mon-icon{font-size:22px;line-height:1.1;}
.rpg-mon-name{font-size:10.5px;font-weight:800;text-align:center;line-height:1.25;}
.rpg-mon-sub{font-size:9.5px;font-weight:700;color:var(--hint);}
.rpg-hint{font-size:11px;color:var(--hint);line-height:1.65;margin-top:10px;}
.rpg-pet{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 10px;padding:8px 11px;
  border-radius:11px;background:var(--pesk-l,#eef3ff);font-size:11.5px;font-weight:800;color:var(--pesk);}
.rpg-pet.weak{background:#fff7ed;color:#9a3412;}
.rpg-pet.none{background:var(--bg);color:var(--hint);font-weight:700;}

.rpg-title{margin:0 0 8px;padding:7px 11px;border-radius:11px;background:#fff5d6;color:#a16207;
  font-size:11.5px;font-weight:800;}
.rpg-title span{font-weight:700;opacity:.85;}
.rpg-title-none{color:var(--hint);}
.qz-review{margin:8px 0;padding:9px 12px;border-radius:11px;background:#eef6ff;

.qz-review.soon{background:var(--bg);border-color:var(--border);color:var(--sub);}
.boss-panel{margin-top:12px;}
.boss-head{display:flex;align-items:center;gap:12px;margin-bottom:10px;}

.boss-head-info{flex:1;min-width:0;}
.boss-head-info b{display:block;font-size:16px;font-weight:900;}
.boss-head-info span{display:block;font-size:12px;color:var(--sub);font-weight:700;margin-top:2px;}
.rpg-hp.big{height:16px;}
.boss-lock,.boss-ready{margin-top:12px;padding:14px;border-radius:13px;font-size:12.5px;line-height:1.7;}
.boss-lock{background:var(--bg);border:1.5px solid var(--border);color:var(--sub);}
.boss-ready{background:var(--pesk-l,#eef3ff);border:1.5px solid var(--pesk);color:var(--pesk);}
.boss-roster{margin-top:14px;}
.boss-roster-title{font-size:12px;font-weight:800;color:var(--sub);margin-bottom:6px;}
/* 🗿 우리 반 보스 */
.rpg-stage.boss{border-color:var(--mc,#8f7ae0);border-width:2px;}
.boss-meta{margin-top:8px;font-size:11.5px;font-weight:700;color:var(--sub);}

.boss-cont.me{background:var(--pesk-l,#eef3ff);color:var(--pesk);}
.boss-cont b{font-weight:800;}

/* 📖 몬스터 도감 — 고르는 버튼이 아니라 기록 */
.rpg-dex{margin-top:14px;}

  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.quest-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;margin-bottom:6px;}
.quest-card.folded .quest-head{margin-bottom:0;}
.quest-fold{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;background:none;border:none;padding:2px 0;font:inherit;color:var(--text);cursor:pointer;text-align:left;}
.quest-fold small{font-size:12px;color:var(--sub);font-weight:600;}
.quest-caret{font-size:12px;color:var(--sub);width:12px;}
.quest-claim-n{color:#ea580c;font-weight:800;}
.frag-chips{display:inline-flex;gap:5px;margin-left:auto;}
.frag-chip{font-size:12px;font-weight:700;background:var(--bg);border-radius:99px;padding:2px 8px;}
.quest-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--border);}
.quest-ic{font-size:20px;flex:0 0 26px;text-align:center;}
.quest-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.quest-name{font-size:13.5px;font-weight:800;word-break:keep-all;}
.quest-name small{font-size:10.5px;color:var(--gold);font-weight:800;}
.quest-body small{font-size:11.5px;color:var(--sub);}
.quest-bar{height:7px;border-radius:99px;background:var(--bg);overflow:hidden;}
.quest-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#fbbf24,#f97316);}
.quest-row.claimed{opacity:.55;}
.quest-claim{font:inherit;font-size:13px;font-weight:800;border:none;border-radius:10px;padding:8px 12px;background:linear-gradient(135deg,#f59e0b,#f97316);color:#fff;cursor:pointer;}
.quest-ok{font-size:18px;}
.quest-foot{font-size:11.5px;color:var(--hint);margin-top:6px;}
.quest-foot a{color:var(--pesk);font-weight:700;}
.revenge-nudge{background:#f5f3ff;border:1.5px solid #c4b5fd;color:#5b21b6;border-radius:var(--radius-sm);padding:10px 12px;font-size:12.5px;line-height:1.5;margin:10px 0;}
.rpg-stage.revenge .rpg-arena{filter:hue-rotate(250deg) saturate(1.3);}
.rpg-stage.revenge .rpg-mon-title{color:#6d28d9;}
.av-power-set{font-size:12.5px;color:#9a3412;}
.av-item-atk.static{position:static;display:inline-block;margin-left:4px;}
.av-friend.royal1{box-shadow:0 0 0 2px #fcd34d,0 0 14px rgba(252,211,77,.55);}
.av-friend.royal2{box-shadow:0 0 0 3px #f59e0b,0 0 20px rgba(245,158,11,.7);}
.av-tag.gold{background:linear-gradient(135deg,#fde68a,#f59e0b);color:#5b3a00;}
.dex-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.dex-title{font-size:17px;font-weight:900;}
.dex-sub{font-size:12px;color:var(--sub);}
.dex-pct{font-size:26px;font-weight:900;color:var(--pesk);}
.dex-bar{height:9px;border-radius:99px;background:var(--bg);overflow:hidden;margin:8px 0 10px;}
.dex-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pesk),var(--purple));}
.dex-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.dex-step{border:1.5px solid var(--border);border-radius:12px;padding:7px 5px;text-align:center;display:flex;flex-direction:column;gap:3px;color:var(--hint);background:var(--card);}
.dex-step b{font-size:14px;}
.dex-step small{font-size:10.5px;font-weight:700;word-break:keep-all;}
.dex-step.on{border-color:var(--pesk);color:var(--pesk-d);background:var(--pesk-l);}
.dex-step button{font:inherit;font-size:11px;font-weight:800;border:none;border-radius:8px;background:var(--pesk);color:#fff;padding:4px;cursor:pointer;}
.craft-list,.set-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}
.craft-item{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;}
.craft-item.have{opacity:.65;}
.craft-name{font-size:13px;font-weight:800;word-break:keep-all;}
.craft-item small{font-size:11.5px;color:var(--sub);}
.craft-btn{font:inherit;font-size:12.5px;font-weight:800;border:none;border-radius:10px;padding:7px 10px;background:linear-gradient(135deg,var(--pesk),var(--purple));color:#fff;cursor:pointer;width:100%;}
.craft-btn:disabled{background:var(--bg);color:var(--hint);cursor:default;}
.craft-have{font-size:11.5px;font-weight:800;color:var(--green);}
.dex-thumb{width:56px;height:56px;image-rendering:pixelated;object-fit:contain;}
.dex-thumb.room{display:block;border-radius:10px;background:linear-gradient(var(--wallA),var(--wallB) 60%,var(--floorA) 60%,var(--floorB));}
.set-card{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:10px;}
.set-card.on{border-color:#fb923c;background:#fff7ed;}
.set-head{font-size:13px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;}
.set-head small{margin-left:auto;font-size:11px;color:var(--sub);}
.set-pieces{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0;}
.set-piece{font-size:10.5px;border-radius:99px;padding:2px 7px;background:var(--bg);color:var(--hint);}
.set-piece.owned{color:var(--text);}
.set-piece.worn{background:#fed7aa;color:#9a3412;font-weight:800;}
.set-fx{display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--hint);}
.set-fx .on{color:#c2410c;font-weight:800;}
.dex-cat{margin-top:12px;}
.dex-cat-head{font-size:13px;font-weight:800;margin-bottom:6px;}
.dex-cat-head small{color:var(--sub);font-weight:600;}
.dex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;}
.dex-cell{position:relative;background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;}
.dex-cell.lock .dex-thumb{filter:grayscale(1) brightness(.35) opacity(.6);}
.dex-name{font-size:10.5px;font-weight:700;text-align:center;word-break:keep-all;line-height:1.25;}
.dex-src{font-size:9.5px;color:var(--gold);font-weight:800;}
@media (max-width:420px){.dex-steps{grid-template-columns:repeat(2,1fr);}}
.boss-tier,.boss-rank{background:var(--card);border-radius:var(--radius-sm);box-shadow:var(--shadow-sm);padding:14px 16px;margin:12px 0;}
.boss-tier-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 10px;font-weight:800;font-size:14px;}
.boss-tier-head>b{font-size:20px;color:#ea580c;}
.boss-tier-head span{font-size:12.5px;font-weight:700;color:var(--sub);margin-left:auto;}
.boss-tier-head span b{color:#ea580c;}
.boss-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;}
.boss-step{border:1.5px solid var(--border);border-radius:12px;padding:8px 6px;text-align:center;display:flex;flex-direction:column;gap:2px;color:var(--hint);}
.boss-step b{font-size:14px;}
.boss-step small{font-size:11px;font-weight:700;word-break:keep-all;}
.boss-step.on{border-color:#fb923c;background:#fff7ed;color:#c2410c;}
.boss-tier-note{margin-top:8px;font-size:11.5px;color:var(--hint);line-height:1.5;}
.boss-rank-head{font-weight:800;font-size:14px;}
.boss-rank-head small{font-size:11px;color:var(--hint);font-weight:600;margin-left:6px;}
.boss-rank-tabs{display:flex;gap:6px;margin:10px 0 8px;flex-wrap:wrap;}
.boss-rank-tabs button{font:inherit;font-size:12.5px;font-weight:700;border:1.5px solid var(--border);background:var(--card);color:var(--sub);border-radius:99px;padding:5px 12px;cursor:pointer;}
.boss-rank-tabs button.on{border-color:var(--pesk);background:var(--pesk-l);color:var(--pesk-d);}
.boss-rank-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;}
.boss-rank-list li{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;background:var(--bg);font-size:13.5px;}
.boss-rank-list li.me{background:var(--pesk-l);font-weight:800;}
.boss-rank-n{flex:0 0 34px;font-weight:800;}
.boss-rank-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.boss-rank-me{margin-top:8px;font-size:12.5px;color:var(--sub);}
@media (max-width:420px){.av-power-list{grid-template-columns:1fr;}}
.av-item-price.have{color:var(--hint);}
.av-item.on .av-item-price{color:var(--pesk);}
.av-friends{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;}
.av-friend{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius-sm);
  padding:4px 4px 7px;text-align:center;box-shadow:var(--shadow-sm);}
.av-friend.off{opacity:.5;}
.av-friend.me{border-color:var(--pesk);background:var(--pesk-l);}
.av-friend{position:relative;overflow:hidden;}
.av-friend-room{position:absolute;left:0;right:0;top:0;height:52px;
  background:linear-gradient(180deg,var(--wallA,#7f93c4) 0%,var(--wallB,#93a6d4) 62%,var(--floorA,#a9855f) 62%,var(--floorB,#bb9a72) 100%);
  opacity:.9;}
.av-friend img{position:relative;width:70px;height:70px;display:block;margin:-4px auto -6px;image-rendering:pixelated;}
.av-friend-name,.av-friend-sub{position:relative;}
.av-friend-name{display:block;font-size:11px;font-weight:800;}
.av-friend-pet-name{position:relative;display:block;font-size:9.5px;font-weight:700;color:var(--pesk);
  margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.av-friend-sub{display:block;font-size:9.5px;color:var(--hint);font-weight:700;}
/* 🐾 펫 — 캐릭터 옆에 서서 살짝 통통 뜀 */
.av-pet{position:absolute;left:calc(50% + 62px);bottom:14px;width:48px;height:48px;
  image-rendering:pixelated;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35));
  animation:avPetHop 1.9s ease-in-out infinite;cursor:pointer;}
@keyframes avPetHop{0%,100%{transform:translateY(0);}45%{transform:translateY(-5px);}}
/* 시무룩할 땐 통통 뛰지 않고 살짝 바랜다 — 글자 없이도 상태가 보이게 */
.av-pet.sad{animation:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3)) saturate(.55) brightness(.92);}
.av-pet-thumb{width:52px !important;height:52px !important;margin:2px 0 0 !important;}
.av-friend-pet.pat{cursor:pointer;filter:drop-shadow(0 0 3px var(--pesk));}
.av-pat-hint{font-size:11px;color:var(--sub);line-height:1.6;margin:-4px 0 8px;}
.pet-lv{font-size:10.5px;font-weight:800;color:#fff;background:var(--pesk);border-radius:99px;
  padding:2px 7px;flex:0 0 auto;}
.av-friend-pet{position:absolute !important;right:4px;top:26px;width:22px !important;height:22px !important;
  margin:0 !important;image-rendering:pixelated;z-index:1;}

/* 🐾 펫 돌보기 */
.pet-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius-sm);
  padding:12px;margin:10px 0 12px;}
.pet-card.empty{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.pet-empty-icon{font-size:28px;line-height:1;}
.pet-card.empty b{font-size:13px;}
.pet-card.empty p{font-size:11.5px;color:var(--sub);line-height:1.6;margin-top:3px;}
.pet-empty-go{margin-left:auto;padding:8px 12px;border-radius:10px;border:none;cursor:pointer;
  background:var(--pesk);color:#fff;font-size:12px;font-weight:800;font-family:inherit;}
.pet-top{display:flex;gap:12px;align-items:center;}
.pet-face{position:relative;flex:0 0 auto;width:64px;height:64px;border-radius:14px;
  background:var(--pesk-l,#eef3ff);display:flex;align-items:center;justify-content:center;}
.pet-face img{width:56px;height:56px;image-rendering:pixelated;
  animation:avPetHop 2.2s ease-in-out infinite;}
.pet-face.sad img{animation:none;filter:saturate(.55) brightness(.94);}
.pet-face.glad{box-shadow:0 0 0 2px rgba(255,201,60,.55);}
.pet-bubble{position:absolute;top:-6px;right:-6px;font-size:15px;
  background:var(--card);border:1.5px solid var(--border);border-radius:99px;
  width:24px;height:24px;display:flex;align-items:center;justify-content:center;}
.pet-meta{flex:1;min-width:0;}
.pet-name{font-size:14px;font-weight:800;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.pet-kind{font-size:11px;font-weight:700;color:var(--sub);}
.pet-noname{color:var(--hint);font-weight:700;}
.pet-rename{border:none;background:transparent;cursor:pointer;font-size:12px;padding:2px;line-height:1;}
.pet-sub{font-size:11.5px;color:var(--sub);font-weight:600;margin-top:2px;}
.pet-bond{display:flex;align-items:center;gap:7px;margin-top:6px;}
.pet-bond-bar{flex:1;height:7px;border-radius:99px;background:var(--border);overflow:hidden;}
.pet-bond-bar i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,#ff8fb1,#ff5f8f);transition:width .3s;}
.pet-bond-num{font-size:11px;font-weight:800;color:#e2517c;white-space:nowrap;}
.pet-gauges{display:grid;gap:5px;margin:11px 0 10px;}
.pet-gauge{display:flex;align-items:center;gap:7px;}
.pet-gauge-label{font-size:11px;font-weight:700;color:var(--sub);width:66px;flex:0 0 auto;}
.pet-gauge-bar{flex:1;height:8px;border-radius:99px;background:var(--border);overflow:hidden;}
.pet-gauge-bar i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,#7fd6a8,#3fb98a);transition:width .3s;}
.pet-gauge.low .pet-gauge-bar i{background:linear-gradient(90deg,#ffb46b,#ef6b5c);}
.pet-gauge-num{font-size:10.5px;font-weight:800;color:var(--sub);width:24px;text-align:right;flex:0 0 auto;}
.pet-acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.pet-act{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px;
  border-radius:11px;border:1.5px solid var(--border);background:var(--card);
  cursor:pointer;font-family:inherit;transition:transform .12s,border-color .12s;}
.pet-act:active{transform:scale(.95);}
.pet-act:not(.off):hover{border-color:var(--pesk);}
.pet-act.off{opacity:.45;cursor:not-allowed;}
.pet-act-icon{font-size:19px;line-height:1.1;}
.pet-act-name{font-size:11px;font-weight:800;}
.pet-act-sub{font-size:9.5px;font-weight:700;color:var(--hint);}
.pet-hint{font-size:10.5px;color:var(--hint);line-height:1.65;margin-top:9px;}
/* 등급 — 색만 다른 게 아니라 눈에 띄게 */
.pet-tier,.av-pet-tier{font-size:9.5px;font-weight:800;border-radius:99px;padding:2px 7px;margin-left:4px;}
.pet-tier.rare,.av-pet-tier.rare{background:#e0f5fd;color:#0e7490;}
.pet-tier.legend,.av-pet-tier.legend{background:#fff5d6;color:#a16207;}
.av-pet-tier{position:absolute;top:4px;left:4px;margin:0;z-index:2;}
.av-item{position:relative;}
.av-pet-evo{display:block;font-size:9.5px;font-weight:700;color:var(--pesk);margin-top:3px;
  text-decoration:underline;cursor:pointer;}
.av-pet-thumb.glow,.av-pet.glow,.av-friend-pet.glow{
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.3)) drop-shadow(0 0 6px var(--fx,#ffc93c));}
.pet-face.glow{box-shadow:0 0 0 2px var(--fx,#ffc93c), 0 0 14px var(--fx,#ffc93c);}
.pet-job{width:100%;margin-top:8px;padding:11px;border-radius:12px;cursor:pointer;font-family:inherit;
  border:1.5px solid var(--gold,#c9921a);background:var(--gold-l,#fdf3e0);color:var(--gold,#c9921a);
  font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:7px;}
.pet-job span{font-size:11px;font-weight:700;opacity:.85;}
.pet-job.off{opacity:.5;cursor:not-allowed;}
.pev-tier{display:flex;flex-direction:column;gap:2px;margin-top:10px;padding:8px 10px;border-radius:10px;
  background:var(--bg);font-size:11.5px;}
.pev-tier.rare{background:#e0f5fd;color:#0e7490;}
.pev-tier.legend{background:#fff5d6;color:#a16207;}
.pev-tier span{font-size:11px;opacity:.9;}
.pet-face{cursor:pointer;}

/* 🔬 진화 도감 */
.pev-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:2000;
  display:flex;align-items:center;justify-content:center;padding:18px;}
.pev-box{background:var(--card);border-radius:18px;padding:20px 18px;width:100%;max-width:420px;
  max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center;}
.pev-title{font-size:16px;font-weight:900;color:var(--text);}
.pev-sub{font-size:12px;font-weight:700;color:var(--sub);margin-top:3px;}
.pev-steps{display:flex;align-items:flex-start;justify-content:center;gap:2px;margin:16px 0 4px;}
.pev-step{flex:1;min-width:0;padding:9px 4px;border-radius:12px;border:1.5px solid var(--border);
  background:var(--card);opacity:.5;}
.pev-step.on{opacity:1;}
.pev-step.cur{border-color:var(--pesk);background:var(--pesk-l,#eef3ff);}
.pev-step img{width:54px;height:54px;image-rendering:pixelated;display:block;margin:0 auto 4px;}
.pev-stage{font-size:10px;font-weight:800;color:var(--sub);}
.pev-name{font-size:11.5px;font-weight:800;color:var(--text);line-height:1.35;margin-top:1px;}
.pev-need{font-size:9.5px;font-weight:700;color:var(--hint);line-height:1.5;margin-top:4px;}
.pev-need b{color:#e2517c;}
.pev-badge{margin-top:5px;font-size:9.5px;font-weight:800;color:#fff;background:var(--pesk);
  border-radius:99px;padding:2px 7px;display:inline-block;}
.pev-arrow{align-self:center;color:var(--hint);font-weight:800;font-size:15px;padding:0 1px;}
.pev-only{margin-top:4px;font-size:9px;font-weight:800;color:#a16207;background:#fff5d6;
  border-radius:99px;padding:2px 5px;display:inline-block;}
.pev-steps.four .pev-step img{width:44px;height:44px;}
.pev-steps.four .pev-name{font-size:10.5px;}
.pev-steps.four .pev-arrow{font-size:12px;}
.pev-tip{font-size:11.5px;color:var(--sub);line-height:1.7;margin-top:10px;}
.pev-close{margin-top:14px;width:100%;padding:12px;border-radius:12px;border:none;cursor:pointer;
  background:var(--pesk);color:#fff;font-size:13px;font-weight:800;font-family:inherit;}
@media (prefers-reduced-motion:reduce){ .pet-face img{animation:none;} }
.av-room-swatch{display:block;width:70px;height:52px;border-radius:8px;margin:0 auto 2px;
  border:1px solid rgba(0,0,0,.12);
  background:linear-gradient(180deg,var(--wallA) 0%,var(--wallB) 60%,var(--floorA) 60%,var(--floorB) 100%);}
@media (prefers-reduced-motion:reduce){ .av-pet{animation:none;} }

/* 🎨 색 고르기 */
.av-tint-wrap{margin:2px 0 10px;}
.av-tint-title{font-size:11px;font-weight:800;color:var(--sub);margin-bottom:6px;}
.av-tints{display:flex;gap:6px;flex-wrap:wrap;}
.av-tint{padding:0;border:2px solid var(--border);border-radius:50%;background:var(--card);
  cursor:pointer;font-family:inherit;line-height:0;min-width:34px;min-height:34px;
  display:flex;align-items:center;justify-content:center;transition:all .12s;}
.av-tint:hover{border-color:var(--hint);transform:scale(1.06);}
.av-tint.on{border-color:var(--pesk);border-width:3px;box-shadow:0 0 0 2px var(--pesk-l);}
.av-tint-dot{display:block;width:22px;height:22px;border-radius:50%;
  box-shadow:inset 0 -2px 3px rgba(0,0,0,.18);}
.av-tint-dot.none{width:auto;height:auto;padding:4px 7px;border-radius:99px;background:var(--bg);
  font-size:9.5px;font-weight:800;color:var(--sub);line-height:1.4;box-shadow:none;}
.av-chip.locked{opacity:.6;}
.av-item.locked{opacity:.62;}
/* ✨ 화려한 고급 아이템 */
.av-item.fancy{position:relative;border-color:var(--fx,#ffc93c);
  background:linear-gradient(180deg,rgba(255,255,255,.9),color-mix(in srgb,var(--fx,#ffc93c) 14%,#fff));}
.av-item.fancy img{filter:drop-shadow(0 0 5px var(--fx,#ffc93c));}
.av-item.fancy.locked img{filter:none;}
.av-item.fancy .av-item-name{color:color-mix(in srgb,var(--fx,#ffc93c) 60%,#1a1a2e);}
.av-fancy-tag{position:absolute;top:3px;right:4px;font-size:11px;line-height:1;
  filter:drop-shadow(0 0 3px var(--fx,#ffc93c));animation:avSparkle 1.8s ease-in-out infinite;}
@keyframes avSparkle{0%,100%{opacity:.55;transform:scale(.9);}50%{opacity:1;transform:scale(1.15);}}

<script>
/* ── 알림 대화상자 ──
   브라우저 기본 alert 창은 태블릿에서 흐름을 끊고 아이들에게 딱딱해 보여서
   앱 안의 대화상자로 바꾼다. 메시지를 차례대로 하나씩 보여준다.
   (이 블록은 본문 스크립트와 따로 둔다 — 단위 테스트는 본문만 불러와 alert 를 직접 가로챈다) */
(function(){
  if(typeof window === 'undefined' || typeof document === 'undefined' || !document.createElement) return;
  const nativeAlert = window.alert ? window.alert.bind(window) : null;
  window._peskNativeAlert = nativeAlert;
  const queue = [];
  let open = false;
  function kind(msg){
    if(/^✅|완료|했어요!$/.test(msg)) return 'ok';
    if(/실패|오류|부족|없어요|권한|안 돼|못했|막혀|초과|차단|중단/.test(msg)) return 'warn';
    return 'info';
  }
  function showNext(){
    if(open || !queue.length) return;
    const msg = queue.shift();
    const k = kind(msg);
    const prevFocus = document.activeElement;
    const overlay = document.createElement('div');
    overlay.className = 'pesk-dialog-overlay';
    const box = document.createElement('div');
    box.className = 'pesk-dialog ' + k;
    box.setAttribute('role', 'alertdialog');
    box.setAttribute('aria-modal', 'true');
    box.setAttribute('aria-describedby', 'pesk-dialog-msg');
    const ic = document.createElement('div');
    ic.className = 'pesk-dialog-ic';
    ic.setAttribute('aria-hidden', 'true');
    ic.textContent = k === 'ok' ? '🎉' : k === 'warn' ? '😥' : '💡';
    const text = document.createElement('div');
    text.className = 'pesk-dialog-msg';
    text.id = 'pesk-dialog-msg';
    text.textContent = msg.replace(/^✅\s*/, '');
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = '확인';
    box.append(ic, text, btn);
    overlay.appendChild(box);
    open = true;
    function close(){
      document.removeEventListener('keydown', onKey, true);
      overlay.remove();
      open = false;
      if(prevFocus && typeof prevFocus.focus === 'function' && document.contains(prevFocus)) prevFocus.focus();
      showNext();
    }
    function onKey(e){
      if(e.key === 'Enter' || e.key === 'Escape' || e.key === ' '){ e.preventDefault(); e.stopPropagation(); close(); }
      else if(e.key === 'Tab'){ e.preventDefault(); btn.focus(); }
    }
    btn.addEventListener('click', close);
    overlay.addEventListener('click', e => { if(e.target === overlay) close(); });
    document.addEventListener('keydown', onKey, true);
    document.body.appendChild(overlay);
    btn.focus();
  }
  window.alert = function(message){
    if(!document.body){ if(nativeAlert) nativeAlert(message); return; }
    queue.push(String(message === undefined ? '' : message));
    showNext();
  };
})();
</script>
</body>
</html>
