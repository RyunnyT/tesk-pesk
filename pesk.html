/* ── 착용 상태 저장 (돈이 오가지 않는 경우) ── */
async function avSaveEquip(){
  const a = avState();
  if(!window._fbReady || !window._db || !roomId) return;
  try{
    const ref = window._fsDoc(window._db, 'classrooms', roomId, 'data', 'pesk-avatars');
    if(window._fsRunTxn){
      await window._fsRunTxn(window._db, async (txn)=>{
        const snap = await txn.get(ref);
        const all = snap.exists() ? (snap.data().value || {}) : {};
        const prev = all[myStudentNum] || all[String(myStudentNum)] || {};
        all[myStudentNum] = _avMergeRecord(prev, a);
        txn.set(ref, {value: all, updatedAt: new Date().toISOString()});
        allAvatars = all;
      });
    } else {
      const snap = await window._fsGetDoc(ref);
      const all = snap.exists() ? (snap.data().value || {}) : {};
      const prev = all[myStudentNum] || all[String(myStudentNum)] || {};
      all[myStudentNum] = _avMergeRecord(prev, a);
      await window._fsSetDoc(ref, {value: all, updatedAt: new Date().toISOString()});
      allAvatars = all;
    }
  }catch(e){ console.warn('아바타 저장 실패:', e); }
}
/* 착용만 바꾸는 저장. 보유 목록·지출액의 기준은 언제나 서버 기록이고,
   결제 없이 늘어날 수 없다. 안 산 아이템이 equipped 에 남아 있으면 벗긴다. */
function _avMergeRecord(prev, mine){
  const owned = Array.isArray(prev?.owned) ? prev.owned.slice() : [];
  const equipped = {};
  // 색 선택과 성별은 소유와 무관한 표현이라 그대로 보존
  (window.AV_TINTABLE || []).forEach(c => {
    const v = mine.equipped ? mine.equipped[c + 'Color'] : '';
    equipped[c + 'Color'] = v || '';
  });
  equipped.gender = (mine.equipped && mine.equipped.gender === 'girl') ? 'girl' : 'boy';
  AV_CATS.forEach(c => {
    const id = mine.equipped ? mine.equipped[c] : null;
    if(!id) { equipped[c] = null; return; }
    const item = avFind(c, id);
    equipped[c] = (item && (avPriceOf(c, item) === 0 || owned.includes(id))) ? id : null;
  });
  return {
    equipped,
    owned,
    spent: Number(prev?.spent||0),
    pets: _avMergePets(prev?.pets, mine.pets),
    pats: _avMergePats(mine.pats || prev?.pats),
    studentName: myStudentName || '',
    accountUid: myAccountUid || '',
    updatedAt: new Date().toISOString()
  };
}
/* 오늘 쓰다듬은 친구 목록 — 날짜가 지나면 자동으로 비워진다 */
function _avMergePats(raw){
  const today = todayISO();
  const p = (raw && typeof raw === 'object') ? raw : {};
  if(p.day !== today || !Array.isArray(p.to)) return {day: today, to: []};
  const to = [...new Set(p.to.map(Number).filter(Number.isFinite))].slice(0, 50);
  return {day: today, to};
}

/* 펫 돌보기 상태 — 코인·XP 와 무관한 값이지만, 저장 전에 범위를 잘라 둔다.
   내 기기에 아직 안 읽힌 펫이 서버에 있으면 서버 쪽을 그대로 남긴다 */
function _avMergePets(prevPets, minePets){
  const base = (prevPets && typeof prevPets === 'object') ? prevPets : {};
  const mine = (minePets && typeof minePets === 'object') ? minePets : {};
  const out = {};
  Object.keys(Object.assign({}, base, mine)).forEach(id => {
    const r = mine[id] || base[id];
    if(!r || typeof r !== 'object') return;
    const num = v => Number.isFinite(Number(v)) ? Number(v) : 0;
    const acts = {};
    PET_ACT_KEYS.forEach(k => { if(r.acts && num(r.acts[k]) > 0) acts[k] = num(r.acts[k]); });
    out[id] = {
      name: String(r.name || '').slice(0, PET_NAME_MAX),
      born: num(r.born) || Date.now(),
      care: Math.max(0, Math.min(999, Math.round(num(r.care)))),
      hunger: petClamp(r.hunger), clean: petClamp(r.clean), happy: petClamp(r.happy),
      at: num(r.at) || Date.now(),
      acts,
      day: String(r.day || '').slice(0, 10),
      dayCare: Math.max(0, Math.min(99, Math.round(num(r.dayCare)))),
      dayAct:  Math.max(0, Math.min(99, Math.round(num(r.dayAct)))),
      dayRecv: Math.max(0, Math.min(99, Math.round(num(r.dayRecv)))),
      chkDay: String(r.chkDay || '').slice(0, 10),
      jobAt: Math.max(0, num(r.jobAt)),
      dayGuard: Math.max(0, Math.min(99, Math.round(num(r.dayGuard))))
    };
  });
  return out;
}

/* ── 구매: 잔액 차감 + 보유 기록을 한 트랜잭션으로 (매점 구매와 동일한 방식) ── */
async function avBuy(buyIds, totalPrice, label){
  const db = window._db;
  const studentsRef  = window._fsDoc(db,'classrooms',roomId,'data','tesk-students');
  const avatarsRef   = window._fsDoc(db,'classrooms',roomId,'data','pesk-avatars');
  const portfoliosRef= window._fsDoc(db,'classrooms',roomId,'data','pesk-portfolios');
  const depositsRef  = window._fsDoc(db,'classrooms',roomId,'data','pesk-deposits');
  const pricesRef    = window._fsDoc(db,'classrooms',roomId,'data','tesk-stock-prices');
  const a = avState();
  let out = null;

  await window._fsRunTxn(db, async (txn)=>{
    const studSnap = await txn.get(studentsRef);
    const avSnap   = await txn.get(avatarsRef);
    const portSnap = await txn.get(portfoliosRef);
    const depSnap  = await txn.get(depositsRef);
    const priceSnap= await txn.get(pricesRef);

    const allStudents = studSnap.exists() ? (studSnap.data().value || []) : [];
    const allAv       = avSnap.exists()   ? (avSnap.data().value || {})   : {};
    const allPort     = portSnap.exists() ? (portSnap.data().value || {}) : {};
    const allDep      = depSnap.exists()  ? (depSnap.data().value || {})  : {};
    const serverPrices= priceSnap.exists()? (priceSnap.data().value || {}): {};

    const stuIdx=allStudents.findIndex(s=>Number(s.num)===Number(myStudentNum));
    if(stuIdx < 0) throw new Error('STUDENT_NOT_FOUND');
    const beforePoints = Number(allStudents[stuIdx].points || 0);

    // 결제 기준은 오직 서버 기록. 로컬의 낙관적 보유 목록은 계산에 넣지 않는다
    // (넣으면 방금 담은 아이템이 "이미 보유"로 잡혀 0원 결제가 된다).
    const prev = allAv[myStudentNum] || allAv[String(myStudentNum)] || {};
    const serverOwned = new Set(Array.isArray(prev.owned) ? prev.owned : []);
    // 이미 서버에 보유로 기록된 것은 다시 결제하지 않음 (중복 클릭/새로고침 대비)
    const need = buyIds.filter(id => !serverOwned.has(id));
    if(need.some(id => { const c = avCatOf(id); return !!(c && avFind(c, id)?.craft); })) throw new Error('CRAFT_ONLY');
    const charge = need.reduce((sum, id) => {
      const c = avCatOf(id);
      return sum + (c ? avPriceOf(c, avFind(c, id)) : 0);
    }, 0);
    if(beforePoints < charge) throw new Error('INSUFFICIENT_BALANCE:' + beforePoints);

    const afterPoints = beforePoints - charge;
    allStudents[stuIdx].points = afterPoints;
    need.forEach(id => serverOwned.add(id));

    const myPortForSnapshot = _economyListFromDoc(allPort, _mergePortfolioLists);
    const myDepsForSnapshot = _economyListFromDoc(allDep, _mergeDepositLists);
    const snapAt = Date.now();
    const assetBefore = _buildAssetSnapshot(beforePoints, myPortForSnapshot, myDepsForSnapshot, serverPrices, snapAt);
    const assetAfter  = _buildAssetSnapshot(afterPoints,  myPortForSnapshot, myDepsForSnapshot, serverPrices, snapAt);

    allAv[myStudentNum] = {
      equipped: Object.assign({}, a.equipped),
      owned: Array.from(serverOwned),
      spent: Number(prev.spent||0) + charge,
      pets: _avMergePets(prev.pets, a.pets),   // 옷을 사도 펫 돌보기 기록은 그대로
      pats: _avMergePats(a.pats || prev.pats),
      studentName: myStudentName || '',
      accountUid: myAccountUid || '',
      updatedAt: new Date().toISOString()
    };
    txn.set(studentsRef, { value: allStudents, updatedAt: new Date().toISOString() });
    txn.set(avatarsRef,  { value: allAv,       updatedAt: new Date().toISOString() });

    out = {allStudents, allAv, charge, beforePoints, afterPoints, assetBefore, assetAfter, boughtIds: need};
  });

  students   = out.allStudents;
  allAvatars = out.allAv;
  myAvatar   = out.allAv[myStudentNum];

  if(out.charge > 0){
    addTxn('마이룸 ' + label, out.charge, 'spend');
    await pushEconLog({
      type:'avatar_buy',
      detail:'마이룸 ' + label,
      delta:-out.charge,
      balanceBefore: out.beforePoints,
      balanceAfter: out.afterPoints,
      assetBefore: out.assetBefore,
      assetAfter: out.assetAfter,
      meta:{ itemIds: out.boughtIds, itemNames: out.boughtIds.map(id=>{
        const c = avCatOf(id); const it = c ? avFind(c, id) : null; return it ? it.name : id;
      })}
    });
    addNotif('🧍 마이룸 ' + label + ' 구매 완료! (' + out.charge.toLocaleString() + '🪙 차감)');
    showFeedbackNotice('✅ ' + label + ' 구매 완료!');
  }
  renderEconomyPanels(getMyStudent());
  return out;
}

function avBuyError(e, totalPrice){
  const msg = String(e?.message || '');
  const code = String(e?.code || '');
  if(msg.startsWith('INSUFFICIENT_BALANCE:')){
    const balance = Number(msg.split(':')[1]||0);
    alert('코인이 부족해요!\n필요: ' + Number(totalPrice||0).toLocaleString() + ' 🪙\n현재 보유: ' + balance.toLocaleString() + ' 🪙');
    return;
  }
  if(msg==='SHOP_PRICE_CHANGED'||msg==='ITEM_UNAVAILABLE'){alert('상품의 가격이나 판매 상태가 바뀌었어요. 새로고침 후 다시 확인해주세요.');return;}
    if(msg === 'STUDENT_NOT_FOUND'){
    alert('학생 정보를 다시 불러오는 중이에요. 잠시 후 다시 시도해주세요.');
    return;
  }
  // 규칙 미배포처럼 설정 문제일 때는 "잠시 후 다시" 안내가 오히려 원인을 가린다
  if(code === 'permission-denied' || /permission|insufficient permissions/i.test(msg)){
    console.error('아바타 저장 권한 거부 — Firestore 규칙에 pesk-avatars 쓰기 허용이 배포됐는지 확인하세요.', e);
    alert('아바타를 저장할 권한이 없어요.\n선생님께 "마이룸 저장 권한(pesk-avatars)" 확인을 부탁드려 주세요.\n\n(코인은 차감되지 않았어요)');
    return;
  }
  console.error('아바타 구매 실패', e);
  alert('구매에 실패했어요. 잠시 후 다시 시도해주세요.\n(오류: ' + (code || msg || '알 수 없음') + ')');
}

/* ── 착용 / 구매 ── */
let _avBusy = false;
async function avPick(cat, id){
  if(_avBusy) return;
  const item = avFind(cat, id); if(!item) return;
  const me = getMyStudent();
  if(!me) return alert('학생 정보를 찾을 수 없어요.');
  const a = avState(), price = avPriceOf(cat, item);
  const needBuy = !avOwns(cat, item);
  if(needBuy && item.craft){ showFeedbackNotice('🧩 「' + item.name + '」은(는) 도감에서 조각으로 만들 수 있어요.'); return openDex(); }

  if(needBuy){
    if(!qzUnlocked(cat, item))
      return alert('"' + item.name + '"은(는) 학습 레벨 ' + qzRequiredLevel(cat, item) + '부터 살 수 있어요.\n지금은 Lv.' + qzLevel() + '이에요.\n🎓 모험 학습를 풀면 레벨이 올라요!');
    if(!(await ensureActiveStudentSession(false))) return;
    if(economyBlocked('shop')) return economyBlockedNotice('shop');
    const fresh = await ensurePointsFresh(price) || me;
    if(Number(fresh.points||0) < price) return alert('코인이 부족해요!\n필요: ' + price.toLocaleString() + ' 🪙\n보유: ' + Number(fresh.points||0).toLocaleString() + ' 🪙');
    if(!confirm('"' + item.name + '"을(를) ' + price.toLocaleString() + ' 🪙에 살까요?\n(한 번 사면 환불은 안 돼요)')) return;
  }

  // 착용 상태를 먼저 정하고, 구매가 필요하면 같은 트랜잭션에 함께 저장
  const prevEquipped = Object.assign({}, a.equipped);
  const prevOwned = a.owned.slice();
  if(AV_REQUIRED.includes(cat)) a.equipped[cat] = id;
  else a.equipped[cat] = (a.equipped[cat] === id) ? null : id;

  _avBusy = true;
  try{
    if(needBuy){
      a.owned.push(id);
      await avBuy([id], price, '"' + item.name + '"');
      showFeedbackNotice('👕 「' + item.name + '」을(를) 샀어요! 옷장에 넣고 바로 입혔어요.');
    } else {
      await avSaveEquip();
    }
  }catch(e){
    a.equipped = prevEquipped;
    a.owned = prevOwned;
    avBuyError(e, price);
  }finally{
    _avBusy = false;
    avRefresh();
  }
}

async function avWearPreset(idx){
  if(_avBusy) return;
  const preset = AV_PRESETS[idx]; if(!preset) return;
  const set = preset[1];
  const me = getMyStudent(); if(!me) return;
  const a = avState();

  // 아직 없는 아이템만 계산 (판매 중지된 부위는 코디에서 제외)
  let total = 0; const buyIds = [];
  const wear = {};
  Object.keys(set).forEach(cat => {
    const item = avFind(cat, set[cat]);
    if(!item) return;
    const owned = avOwns(cat, item);
    // 못 사는 건(판매 중지·레벨 잠금) 코디에서 건너뜀
    if(!owned && (avCatOff(cat) || avItemOff(item.id) || !qzUnlocked(cat, item))) return;
    wear[cat] = item.id;
    if(!owned){ total += avPriceOf(cat, item); buyIds.push(item.id); }
  });
  if(!Object.keys(wear).length) return alert('지금은 이 코디를 입을 수 없어요.');

  if(total > 0){
    if(!(await ensureActiveStudentSession(false))) return;
    if(economyBlocked('shop')) return economyBlockedNotice('shop');
    if(Number(me.points||0) < total)
      return alert('이 코디를 다 사려면 ' + total.toLocaleString() + ' 🪙가 필요해요.\n(지금 ' + Number(me.points||0).toLocaleString() + ' 🪙)');
    if(!confirm(preset[0] + ' 코디에서 아직 없는 ' + buyIds.length + '개를\n' + total.toLocaleString() + ' 🪙에 살까요?\n(한 번 사면 환불은 안 돼요)')) return;
  }

  const prevEquipped = Object.assign({}, a.equipped);
  const prevOwned = a.owned.slice();
  a.equipped = Object.assign(avOutfitBase(a.equipped), wear);
  buyIds.forEach(id => { if(!a.owned.includes(id)) a.owned.push(id); });

  _avBusy = true;
  try{
    if(total > 0) await avBuy(buyIds, total, preset[0] + ' 코디');
    else await avSaveEquip();
  }catch(e){
    a.equipped = prevEquipped; a.owned = prevOwned;
    avBuyError(e, total);
  }finally{
    _avBusy = false;
    avRefresh();
  }
}

/* 가지고 있는 옷 중에서만 무작위 코디 — 돈이 들지 않음.
   방·펫은 '옷'이 아니고 펫은 돌보는 대상이라 무작위로 바뀌지 않는다. */
async function avRandomOutfit(){
  if(_avBusy) return;
  const a = avState();
  const pick = arr => arr.length ? arr[Math.floor(Math.random()*arr.length)] : null;
  const next = {};
  avVisibleCats().filter(c => AV_DRAWN.includes(c)).forEach(cat => {
    const mine = avList(cat).filter(i => avOwns(cat, i) && qzUnlocked(cat, i));
    if(!mine.length) return;
    if(AV_REQUIRED.includes(cat)) next[cat] = pick(mine).id;
    else next[cat] = Math.random() < 0.5 ? pick(mine).id : null;
  });
  a.equipped = Object.assign(avOutfitBase(a.equipped), next);
  _avBusy = true;
  try{ await avSaveEquip(); }
  finally{ _avBusy = false; avRefresh(); }
}

/* 🎓 XP 로 매점 물건 사기
   · 학급 화폐(tesk-students)는 건드리지 않음 → 물가에 영향 0
   · XP 차감 + 재고 감소 + 구매 기록을 한 트랜잭션으로 (서버 XP 기준으로 검증)
   · '공동 목표 달성 시에만' 조건도 서버 데이터로 다시 확인 */
async function buyShopItemWithXp(item){
  if(item?.bossReward) return;
  const me = getMyStudent();
  if(!me){ alert('학생 정보 오류'); return; }
  const price = Math.max(0, Number(item.price||0));
  const gState = qzShopGoalState(item);
  if(gState.need && !gState.ok)
    return alert('이 물건은 [' + gState.text.replace(' 필요','') + '] 조건이 있어요.\n🎓 모험 학습에서 다 같이 채워봐요!');
  if(qzXp() < price)
    return alert('학습 XP가 부족해요!\n필요: ' + price.toLocaleString() + ' XP\n지금: ' + qzXp().toLocaleString() + ' XP');
  if(item.stock !== undefined && item.stock !== -1 && item.stock <= 0) return alert('품절된 상품이에요.');
  if(!confirm('"' + item.name + '"을(를) ' + price.toLocaleString() + ' XP로 살까요?\n(학급 화폐는 차감되지 않아요)')) return;

  const db = window._db;
  if(!db || !window._fsRunTxn) return alert('연결 상태를 확인해주세요.');
  const qs = quizStore();
  const purchRef = window._fsDoc(db,'classrooms',roomId,'data','pesk-purchases');
  const shopRef  = window._fsDoc(db,'classrooms',roomId,'data','tesk-shop');
  let out = null;
  qzBusy = true;
  try{
    await window._fsRunTxn(db, async (txn)=>{
      const qctx = await qs.open(txn, myStudentNum, {cls:true});   // 공동 목표 확인에 반 요약이 필요하다
      const [buySnap, shopSnap] = await Promise.all([txn.get(purchRef), txn.get(shopRef)]);
      const all   = qctx.all;
      const buys  = buySnap.exists() ? (buySnap.data().value || []) : [];
      const items = shopSnap.exists() ? (shopSnap.data().value || []) : [];

      const latestItem=items.find(i=>String(i.id)===String(item.id));
      if(!latestItem||latestItem.bossReward||latestItem.payWith!=='xp'||Number(latestItem.price)!==price||!Number.isSafeInteger(price)||price<0)throw new Error('SHOP_PRICE_CHANGED');
      // 공동 목표 조건을 서버 데이터로 재확인
      const gs = qzShopGoalState(item, all);
      if(gs.need && !gs.ok) throw new Error('GOAL_NOT_REACHED');

      const meRaw = all[myStudentNum] || all[String(myStudentNum)] || {};
      const haveXp = Number(meRaw.xp || 0);
      if(haveXp < price) throw new Error('NOT_ENOUGH_XP:' + haveXp);

      // 재고
      let idx = items.findIndex(i => String(i.id||'') === String(item.id||''));
      if(idx < 0) idx = items.findIndex(i => i.name === item.name && i.price === item.price);
      if(idx >= 0 && items[idx].stock !== undefined && items[idx].stock !== -1){
        if(Number(items[idx].stock||0) < 1) throw new Error('OUT_OF_STOCK');
        items[idx].stock = Math.max(0, Number(items[idx].stock||0) - 1);
      }

      all[myStudentNum] = Object.assign({}, meRaw, {
        xp: haveXp - price,
        xpSpent: Number(meRaw.xpSpent||0) + price,
        studentName: myStudentName || '', accountUid: myAccountUid || '',
        updatedAt: new Date().toISOString()
      });

      const existing = buys.findIndex(p => recordBelongsToMe(p) && String(p.itemId||'')===String(item.id) && shopPurchaseRemaining(p)>0);
      if(existing >= 0){
        buys[existing].qty = shopPurchaseQty(buys[existing]) + 1;
        buys[existing].date = new Date().toLocaleDateString('ko-KR');
      } else {
        buys.push({
          id: uid(), studentNum: myStudentNum, studentName: myStudentName, accountUid: myAccountUid,
          itemId: item.id||'', itemName: item.name, icon: item.icon||'🎁', price: price,
          paidWith: 'xp',
          date: new Date().toLocaleDateString('ko-KR'), status: 'pending', qty: 1
        });
      }

      qs.save(qctx, {[myStudentNum]: all[myStudentNum]});
      txn.set(purchRef, {value: buys,  updatedAt: new Date().toISOString()});
      if(idx >= 0) txn.set(shopRef, {value: items, updatedAt: new Date().toISOString()});
      out = {all, buys, items, price};
    });
  }catch(e){
    const m = String(e?.message||'');
    qzBusy = false;
    if(m.startsWith('NOT_ENOUGH_XP:'))
      return alert('학습 XP가 부족해요!\n필요: ' + price.toLocaleString() + ' XP\n지금: ' + Number(m.split(':')[1]||0).toLocaleString() + ' XP');
    if(m === 'GOAL_NOT_REACHED') return alert('아직 우리 반 공동 목표를 달성하지 못했어요.');
    if(m === 'OUT_OF_STOCK') return alert('품절된 상품이에요.');
    console.error('XP 구매 실패', e);
    return alert('구매에 실패했어요. 잠시 후 다시 시도해주세요.');
  }
  qzBusy = false;
  if(!out) return;
  allQuizProgress = out.all;
  myQuiz = out.all[myStudentNum];
  myPurchases = out.buys.filter(recordBelongsToMe);
  if(out.items && out.items.length) shopItems = out.items;

  addTxn('"' + item.name + '" 구매 (XP)', 0, 'spend');
  await pushEconLog({
    type:'shop_buy_xp',
    detail:'"' + item.name + '" XP 구매',
    delta: 0,                                   // 학급 화폐 변동 없음 → 경제 리포트에 영향 주지 않음
    meta:{itemId:item.id||'', itemName:item.name, xpSpent:out.price}
  });
  addNotif('🎓 "' + item.name + '"을(를) ' + out.price.toLocaleString() + ' XP로 구매했어요!');
  showFeedbackNotice('✅ "' + item.name + '" 구매 완료! (-' + out.price.toLocaleString() + ' XP)');
  shopPanelTab = 'myitems';
  renderEconomyPanels(getMyStudent());
}

/* ─────────────────────────────────────────
   🎓 모험 학습 — 수학·영단어를 풀고 XP/코인 획득
   · 문제는 quiz-bank.js 가 교사가 고른 학년/학기/단원에서 생성
   · XP 는 마이룸 전용(레벨·아이템 잠금 해제), 코인은 하루 상한 안에서만 지급
   · 코인 지급은 매점 구매와 같은 트랜잭션 방식 + 서버 기준 상한 검증
───────────────────────────────────────── */
const QZ_DEFAULT = {
  enabled: true, grade: 5, term: 1, mathUnits: [], mathOn: true, englishOn: true,
  xpPerCorrect: 10, coinPerCorrect: 5, dailyQuestionLimit: 20, dailyCoinCap: 50,
  // pet 은 8종 모두 Lv.5 라서 부위 단위로도 걸어 둔다 → 옷장 탭에 🔒5 와 안내가 뜬다
  lockLevels: {face:1, hair:1, top:1, bottom:1, shoes:1, hat:3, weapon:5, pet:5},
  // period: 'week'(월~일) | 'month'(1일~말일) | 'semester'(3~8월 / 9~2월)
  // goal 은 예전(목표 1개) 설정 — 지금은 goals 배열을 쓰고, 옛 설정은 읽을 때 자동 변환한다
  goal: {enabled:false, metric:'correct', period:'week', target:300, rewardXp:50, rewardItemId:'', note:''},
  goals: []
};
const QZ_MAX_GOALS = 3;   // 학생 화면이 목표 카드로 길어지지 않게 제한
let qzSubject = 'math';
let qzBusy    = false;

function qzCfg(){
  const c = quizConfig && typeof quizConfig === 'object' ? quizConfig : {};
  const out = Object.assign({}, QZ_DEFAULT, c);
  out.lockLevels = Object.assign({}, QZ_DEFAULT.lockLevels, c.lockLevels || {});
  out.mathUnits  = Array.isArray(c.mathUnits) ? c.mathUnits : [];
  out.goal       = Object.assign({}, QZ_DEFAULT.goal, c.goal || {});
  out.goals      = Array.isArray(c.goals) ? c.goals : [];
  return out;
}

/* ── 🤝 우리 반 공동 목표 ──
   진행률은 학생별 daily 기록을 '이번 기간'만 합산해서 구한다. 별도 집계 문서가 없어
   교사가 목표치를 바꿔도 과거 기록이 그대로 재계산된다.
   기간은 선생님이 주 / 달 / 학기 중에서 고른다. */
function _qzYmd(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
/* 지금이 속한 목표 기간의 시작·끝 날짜와 기록용 키.
   · week  → 월요일 날짜 그대로 (예전 주간 보상 기록과 호환)
   · month → 'M2026-08-01'
   · semester → 'S2026-1' (3~8월) / 'S2026-2' (9월~다음해 2월) */
/* 기간이 'custom' 이면 선생님이 고른 시작일~종료일을 그대로 쓴다.
   range 는 {start:'YYYY-MM-DD', end:'YYYY-MM-DD'} — 보통 목표 객체를 그대로 넘긴다. */
function _qzValidYmd(v){ return /^\d{4}-\d{2}-\d{2}$/.test(String(v||'')); }
function _qzYmdLabel(v){
  const m = String(v||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? (Number(m[2]) + '월 ' + Number(m[3]) + '일') : String(v||'');
}
function qzPeriodInfo(period, base, range){
  if(period === 'custom'){
    const st = String(range && range.start || ''), en = String(range && range.end || '');
    // 날짜를 아직 안 정했거나 거꾸로 넣었으면 주간으로 되돌려 화면이 깨지지 않게 한다
    if(_qzValidYmd(st) && _qzValidYmd(en) && en >= st){
      return {period:'custom', key:'C' + st + '_' + en, start:st, end:en,
              label:_qzYmdLabel(st) + '~' + _qzYmdLabel(en), unit:'기간',
              reset:_qzYmdLabel(en) + '까지', custom:true};
    }
    period = 'week';
  }
  const p = (period === 'month' || period === 'semester') ? period : 'week';
  const t = base ? new Date(base) : new Date();
  if(p === 'month'){
    const s = new Date(t.getFullYear(), t.getMonth(), 1);
    const e = new Date(t.getFullYear(), t.getMonth()+1, 0);
    return {period:p, key:'M'+_qzYmd(s), start:_qzYmd(s), end:_qzYmd(e),
            label:'이번 달', unit:'월간', reset:'다음 달 1일'};
  }
  if(p === 'semester'){
    const m = t.getMonth() + 1;
    const isFirst = m >= 3 && m <= 8;                       // 3~8월 = 1학기
    const y = isFirst ? t.getFullYear() : (m >= 9 ? t.getFullYear() : t.getFullYear()-1);
    const s = isFirst ? new Date(y,2,1) : new Date(y,8,1);   // 3/1 또는 9/1
    const e = isFirst ? new Date(y,7,31) : new Date(y+1,2,0);// 8/31 또는 다음해 2월 말일
    return {period:p, key:'S'+y+'-'+(isFirst?'1':'2'), start:_qzYmd(s), end:_qzYmd(e),
            label:'이번 학기', unit:'학기', reset:(isFirst?'9월 1일':'3월 1일')};
  }
  const day = (t.getDay() + 6) % 7;                          // 월=0
  const s = new Date(t); s.setDate(t.getDate() - day);
  const e = new Date(s); e.setDate(s.getDate() + 6);
  return {period:'week', key:_qzYmd(s), start:_qzYmd(s), end:_qzYmd(e),
          label:'이번 주', unit:'주간', reset:'다음 주 월요일'};
}
/* 목표 하나를 표준 모양으로 — 옛 설정이든 새 설정이든 같은 필드를 갖게 한다 */
function _qzGoalNorm(raw, i){
  const g = Object.assign({}, QZ_DEFAULT.goal, (raw && typeof raw === 'object') ? raw : {});
  g.id     = String(g.id || ('g' + (i+1)));
  g.title  = String(g.title || '').trim();
  g.metric = g.metric === 'tried' ? 'tried' : 'correct';
  g.period = ['month','semester','custom'].includes(g.period) ? g.period : 'week';
  g.start  = _qzValidYmd(g.start) ? String(g.start) : '';
  g.end    = _qzValidYmd(g.end)   ? String(g.end)   : '';
  g.target = Math.max(1, Number(g.target||0));
  g.rewardXp = Math.max(0, Number(g.rewardXp||0));
  return g;
}
/* 지금 켜져 있는 공동 목표 목록 (최대 3개).
   goals 배열이 없으면 예전 goal 하나짜리 설정을 목록으로 바꿔 읽는다 → 옛 학급도 그대로 동작 */
function qzGoals(){
  const c = qzCfg();
  const raw = Array.isArray(c.goals) ? c.goals : [];
  if(raw.length){
    return raw.map((g,i)=>_qzGoalNorm(g,i)).filter(g=>g.enabled !== false).slice(0, QZ_MAX_GOALS);
  }
  const legacy = c.goal;
  if(legacy && legacy.enabled === true) return [_qzGoalNorm(Object.assign({}, legacy, {id: legacy.id || 'main'}), 0)];
  return [];
}
function qzGoalById(id){
  const list = qzGoals();
  return list.find(g=>String(g.id) === String(id)) || null;
}
/* 목표 이름 — 안 정했으면 기간으로 부른다 (예: '주간 목표') */
function qzGoalName(g, idx){
  if(g && g.title) return g.title;
  const P = qzPeriodInfo(g && g.period, null, g);
  return P.unit + ' 목표' + (typeof idx === 'number' && idx > 0 ? ' ' + (idx+1) : '');
}
function qzGoalPeriod(goal){
  const g = goal || qzGoals()[0] || qzCfg().goal;
  return qzPeriodInfo(g.period, null, g);
}
/* 학급 전체 / 내 기여도 — 목표마다 기간·기준이 다르므로 목표를 받아서 계산한다 */
function qzGoalProgress(progressMap, goal){
  const g = goal || qzGoals()[0] || _qzGoalNorm(qzCfg().goal, 0);
  const metric = g.metric === 'tried' ? 'tried' : 'correct';
  const P = qzPeriodInfo(g.period, null, g);
  const src = progressMap || allQuizProgress || {};
  let total = 0, mine = 0, joined = 0;
  Object.keys(src).forEach(k=>{
    const p = src[k];
    if(!p || !p.daily) return;
    let sum = 0;
    // daily 키가 'YYYY-MM-DD' 라 문자열 비교만으로 기간 안인지 가릴 수 있다
    Object.keys(p.daily).forEach(d=>{
      if(d < P.start || d > P.end) return;
      const rec = p.daily[d];
      if(rec) sum += Number(rec[metric]||0);
    });
    if(sum > 0) joined++;
    total += sum;
    if(String(k) === String(myStudentNum)) mine = sum;
  });
  return {total, mine, joined, metric, period:P, goal:g};
}
/* 목표 하나를 달성했는지 */
function qzGoalAchieved(map, goal){
  const g = goal || qzGoals()[0];
  if(!g) return false;
  return qzGoalProgress(map, g).total >= Math.max(1, Number(g.target||0));
}
/* 보상 중복 수령 방지 키 — 예전 목표('main')는 옛 키를 그대로 써서 이미 받은 기록이 살아 있다 */
function qzGoalClaimKey(goal){
  const g = goal || qzGoals()[0];
  if(!g) return '';
  const pKey = qzPeriodInfo(g.period, null, g).key;
  return String(g.id) === 'main' ? pKey : (g.id + '#' + pKey);
}
function qzGoalClaimed(goal){
  const g = goal || qzGoals()[0];
  if(!g) return false;
  const s = qzState();
  const c = (s.goalClaimed && typeof s.goalClaimed === 'object') ? s.goalClaimed : {};
  return !!c[qzGoalClaimKey(g)];
}
/* 매점 상품의 공동 목표 조건 판정.
   item.requireGoalId — '' : 아무 목표나 1개 / '*' : 모든 목표 / 그 외 : 특정 목표 id
   (지정한 목표가 지워졌으면 '아무 목표나'로 되돌린다) */
function qzShopGoalState(item, map){
  const goals = qzGoals();
  if(!item || !item.requireGoal) return {need:false, ok:true, text:''};
  if(!goals.length) return {need:true, ok:false, text:'우리 반 공동 목표 달성 필요'};
  const want = String(item.requireGoalId || '');
  const picked = want && want !== '*' ? goals.find(g=>String(g.id)===want) : null;
  if(picked){
    const ok = qzGoalAchieved(map, picked);
    const nm = qzGoalName(picked, goals.indexOf(picked));
    return {need:true, ok, goals:[picked], text: ok ? nm + ' 달성!' : nm + ' 달성 필요'};
  }
  if(want === '*'){
    const ok = goals.every(g=>qzGoalAchieved(map, g));
    return {need:true, ok, goals, text: ok ? '모든 목표 달성!' : '모든 공동 목표 달성 필요'};
  }
  const ok = goals.some(g=>qzGoalAchieved(map, g));
  const label = goals.length > 1 ? '공동 목표 아무거나' : qzGoalName(goals[0], 0);
  return {need:true, ok, goals, text: ok ? label + ' 달성!' : label + ' 달성 필요'};
}
function qzGoalItemName(id){
  if(!id || !window.AV_MANIFEST) return '';
  const cat = avCatOf(id); if(!cat) return '';
  const it = avFind(cat, id);
  return it ? it.name : '';
}

/* 목표 카드 하나 */
function buildOneGoalCard(g, idx, count){
  const target = Math.max(1, Number(g.target||0));
  const pr = qzGoalProgress(null, g);
  const P = pr.period;
  const pct = Math.min(100, Math.round(pr.total / target * 100));
  const done = pr.total >= target;
  const claimed = qzGoalClaimed(g);
  const label = pr.metric === 'tried' ? '푼 문제' : '맞힌 문제';
  const itemName = qzGoalItemName(g.rewardItemId);

  const rewardBits = [];
  if(Number(g.rewardXp||0) > 0) rewardBits.push('<b>+' + Number(g.rewardXp) + ' XP</b>');
  if(itemName) rewardBits.push('<b>' + escHtml(itemName) + '</b> 무료 지급');
  const rewardTxt = rewardBits.length ? rewardBits.join(' · ') : '선생님의 칭찬';

  let action = '';
  if(done && !claimed && pr.mine > 0){
    action = '<button class="qz-goal-claim" onclick="qzClaimGoal(\'' + escHtml(g.id) + '\')">🎁 보상 받기</button>';
  } else if(done && claimed){
    action = '<div class="qz-goal-got">✅ 보상을 받았어요</div>';
  } else if(done && pr.mine === 0){
    action = '<div class="qz-goal-got" style="color:var(--hint);">' + P.label + '에 한 문제라도 풀면 보상을 받을 수 있어요</div>';
  }

  // 목표가 여러 개면 이름을 앞세워 어떤 목표인지 바로 알게 한다
  const heading = count > 1 ? escHtml(qzGoalName(g, idx)) : '우리 반 목표';

  return '<div class="qz-goal' + (done?' done':'') + '">'
    + '<div class="qz-goal-top">'
    +   '<span class="qz-goal-title">🤝 ' + heading + ' '
    +     '<span class="qz-goal-period" title="' + P.start + ' ~ ' + P.end + ' · ' + P.reset + ' 초기화">' + P.label + '</span></span>'
    +   '<span class="qz-goal-num">' + pr.total.toLocaleString() + ' / ' + target.toLocaleString() + '</span>'
    + '</div>'
    + (g.note ? '<div class="qz-goal-note">' + escHtml(g.note) + '</div>' : '')
    + '<div class="qz-goal-bar"><i style="width:' + pct + '%"></i></div>'
    + '<div class="qz-goal-sub">'
    +   '<span>' + P.label + ' ' + label + ' · 친구 ' + pr.joined + '명이 함께했어요</span>'
    +   '<span class="qz-goal-mine">내 기여 ' + pr.mine.toLocaleString() + '개</span>'
    + '</div>'
    + '<div class="qz-goal-reward">' + (done ? '🎉 목표 달성! ' : '달성하면 모두에게 ') + rewardTxt + '</div>'
    + action
    + '</div>';
}

/* 보상 받기 — 목표마다 기간당 1회, 서버 기록으로 달성 여부를 다시 확인 */
async function qzClaimGoal(goalId){
  if(qzBusy) return;
  const g = goalId ? qzGoalById(goalId) : qzGoals()[0];
  if(!g) return;
  qzBusy = true;
  try{
    if(!window._fbReady || !window._db || !roomId || !window._fsRunTxn) throw new Error('OFFLINE');
    const db = window._db;
    const qs = quizStore();
    const avRef   = window._fsDoc(db,'classrooms',roomId,'data','pesk-avatars');
    const periodKey = qzGoalClaimKey(g);
    let out = null;

    await window._fsRunTxn(db, async (txn)=>{
      // 내 기록은 학생 문서에서, 반 전체 달성 여부는 반 요약에서 다시 계산한다
      const qctx = await qs.open(txn, myStudentNum, {cls:true});
      const aSnap = await txn.get(avRef);
      const all = qctx.all;
      // 달성 여부를 서버 데이터로 다시 계산 (클라이언트 화면만 믿지 않음)
      const pr = qzGoalProgress(all, g);
      if(pr.total < Math.max(1, Number(g.target||0))) throw new Error('NOT_REACHED');
      if(pr.mine <= 0) throw new Error('NOT_JOINED');

      const meRaw = all[myStudentNum] || all[String(myStudentNum)] || {};
      const claimed = (meRaw.goalClaimed && typeof meRaw.goalClaimed==='object') ? meRaw.goalClaimed : {};
      if(claimed[periodKey]) throw new Error('ALREADY');

      const gainXp = Math.max(0, Number(g.rewardXp||0));
      claimed[periodKey] = true;
      all[myStudentNum] = Object.assign({}, meRaw, {
        xp: Number(meRaw.xp||0) + gainXp,
        goalClaimed: claimed,
        studentName: myStudentName || '', accountUid: myAccountUid || '',
        updatedAt: new Date().toISOString()
      });
      qs.save(qctx, {[myStudentNum]: all[myStudentNum]});

      // 한정 아이템을 무료로 지급 (돈이 오가지 않으므로 잔액은 건드리지 않음)
      let itemGiven = '';
      const itemId = String(g.rewardItemId||'');
      if(itemId && window.AV_MANIFEST && avCatOf(itemId)){
        const allAv = aSnap.exists() ? (aSnap.data().value || {}) : {};
        const prev = allAv[myStudentNum] || allAv[String(myStudentNum)] || {};
        const owned = Array.isArray(prev.owned) ? prev.owned.slice() : [];
        if(!owned.includes(itemId)){
          owned.push(itemId);
          allAv[myStudentNum] = Object.assign({}, prev, {
            equipped: prev.equipped || avDefault().equipped,
            owned, spent: Number(prev.spent||0),
            studentName: myStudentName || '', accountUid: myAccountUid || '',
            updatedAt: new Date().toISOString()
          });
          txn.set(avRef, {value: allAv, updatedAt:new Date().toISOString()});
          itemGiven = qzGoalItemName(itemId);
          out = {allAv};
        }
      }
      out = Object.assign(out||{}, {all, gainXp, itemGiven});
    });

    if(out){
      allQuizProgress = out.all;
      myQuiz = out.all[myStudentNum];
      if(out.allAv){ allAvatars = out.allAv; myAvatar = out.allAv[myStudentNum]; }
      const bits = [];
      if(out.gainXp > 0) bits.push('+' + out.gainXp + ' XP');
      if(out.itemGiven) bits.push('"' + out.itemGiven + '"');
      const gName = qzGoalName(g, qzGoals().findIndex(x=>String(x.id)===String(g.id)));
      addNotif('🤝 ' + gName + ' 달성 보상을 받았어요! (' + (bits.join(' · ')||'축하해요') + ')');
      showFeedbackNotice('🎉 ' + gName + ' 달성! ' + (bits.join(' · ')||''));
    }
  }catch(e){
    const m = String(e?.message||'');
    const pLabel = qzPeriodInfo(g.period, null, g).label;
    if(m==='ALREADY') alert('이미 ' + pLabel + ' 보상을 받았어요.');
    else if(m==='NOT_REACHED') alert('아직 목표에 도달하지 않았어요. 조금만 더!');
    else if(m==='NOT_JOINED') alert(pLabel + '에 문제를 한 개라도 풀어야 보상을 받을 수 있어요.');
    else alert('보상을 받지 못했어요. 잠시 후 다시 시도해주세요.');
  }finally{
    qzBusy = false;
    avRefresh();
  }
}
function _applyQuizConfig(raw){ quizConfig = (raw && typeof raw === 'object') ? raw : null; }
function qzSubjects(){return window.PeskSubjects ? window.PeskSubjects.enabled(qzCfg()).filter(x=>['math','english'].includes(x.id)) : [{id:'math',label:'📐 수학'},{id:'english',label:'🔤 영단어'}].filter(x=>qzCfg()[x.id==='math'?'mathOn':'englishOn']!==false);}
function qzQuestionLevel(){const d=Number(qzCfg().difficulty);return d===1?1:d===2?4:d===3?8:qzLevel();}
function _applyQuizProgress(all){
  allQuizProgress = (all && typeof all === 'object') ? all : {};
  myQuiz = allQuizProgress[myStudentNum] || allQuizProgress[String(myStudentNum)] || null;
  // 서버에서 온 값은 여기서 한 번만 정제한다 (이후에는 같은 객체를 계속 쓴다)
  if(myQuiz && window.RPG) myQuiz.game = window.RPG.normalizeGame(myQuiz.game);
}
function qzState(){
  if(!myQuiz || typeof myQuiz !== 'object') myQuiz = {xp:0, tried:0, correct:0, daily:{}, byUnit:{}};
  if(typeof myQuiz.xp !== 'number') myQuiz.xp = 0;
  if(!myQuiz.daily || typeof myQuiz.daily !== 'object') myQuiz.daily = {};
  if(!myQuiz.byUnit || typeof myQuiz.byUnit !== 'object') myQuiz.byUnit = {};
  // rating 은 '지금 어느 수준인가'. 학생에게 보여주지 않는다 (레벨과 역할이 다르다)
  if(typeof myQuiz.rating !== 'number') myQuiz.rating = 0;   // 0 = 아직 진단 전
  if(window.QRATE) myQuiz.review = window.QRATE.reviewNormalize(myQuiz.review);
  if(window.RPG && !myQuiz.boss) myQuiz.boss = window.RPG.normalizeBossRec(null);
  // game 은 '없을 때만' 만든다. 매번 normalizeGame 으로 새 객체를 만들면
  // rpgGame() 으로 잡아 둔 참조가 매 호출마다 딴 객체가 되어 체력 감소가 버려진다.
  // 정제는 불러올 때(_applyQuizProgress)와 저장할 때만 한다.
  if(window.RPG && (!myQuiz.game || typeof myQuiz.game !== 'object'))
    myQuiz.game = window.RPG.newGameState();
  return myQuiz;
}

/* ── 실력 레이팅 ──
   레벨(누적)과 분리해서 다룬다. 레이팅이 0 이면 아직 진단을 안 본 것이다. */
function qzRating(){ return Number(qzState().rating || 0); }
function qzHasRating(){ return qzRating() > 0; }
/* 레이팅 기반 출제를 쓸 수 있는가 —
   quiz-rating.js 의 유형이 5학년용이라 다른 학년은 기존 방식을 그대로 쓴다 */
function qzRatingMode(){
  return !!(window.QRATE && Number(qzCfg().grade) === 5 && qzSubject === 'math' && !Number(qzCfg().difficulty) && qzHasRating() && qzAllowedTypeCodes().length);
}
function qzAllowedTypeCodes(){
  const c=qzCfg(),marks=['①','②','③','④','⑤','⑥','⑦','⑧','⑨'];
  return Object.keys(window.QRATE?.TYPES||{}).filter(code=>{
    const m=String(window.QRATE.TYPES[code].unit).match(/^(\d)-(\d)\s*(.)/);
    return m && Number(m[1])===Number(c.grade) && Number(m[2])===Number(c.term)
      && (!c.mathUnits.length || c.mathUnits.map(Number).includes(marks.indexOf(m[3])+1));
  });
}
function qzToday(){ return todayISO(); }
function qzDaily(state){
  const s = state || qzState();
  const d = s.daily[qzToday()];
  return (d && typeof d === 'object') ? d : {tried:0, correct:0, coin:0};
}
function qzXp(){ return Number(qzState().xp || 0); }
function qzLevel(){ return window.QUIZ ? window.QUIZ.levelOfXp(qzXp()) : 1; }

/* 마이룸 아이템 잠금 — 부위별 필요 레벨.
   화려한 파생 아이템은 자기 minLevel 을 따로 갖고, 둘 중 높은 쪽이 적용된다. */
function qzRequiredLevel(cat, item){
  const v = qzCfg().lockLevels[cat];
  const byCat = Number.isFinite(Number(v)) ? Math.max(1, Number(v)) : 1;
  const byItem = item && Number.isFinite(Number(item.minLevel)) ? Math.max(1, Number(item.minLevel)) : 1;
  return Math.max(byCat, byItem);
}
function qzUnlocked(cat, item){ return qzLevel() >= qzRequiredLevel(cat, item); }

/* ─────────────────────────────────────────
   ⚔️ 모험 — 진단 10문항 + 몬스터 처치

   · 진단은 처음 한 번만. 실력을 몰라 모두를 같은 난이도로 시작시키면
     잘하는 학생은 계속 쉬운 문제를, 힘든 학생은 계속 어려운 문제를 받는다.
   · 틀려도 학생은 아무것도 잃지 않는다. 몬스터가 조금 회복할 뿐이다.
   · 데미지는 난이도 대비로 정규화해서, 실력이 달라도 한 문제당 기여도가 비슷하다.
   · 게임 레벨은 절대 내려가지 않는다.
───────────────────────────────────────── */
let rpgDiag = null;          // 진행 중인 진단
let rpgQ = null;             // 전투 중인 문제
let rpgPicked = null;
let rpgBusy = false;
async function runLearningTransaction(db, update){
  const hint=message=>document.querySelectorAll('[data-learning-save]').forEach(el=>{el.textContent=message;});
  const timer=setTimeout(()=>hint('친구들과 함께 기록을 저장하고 있어요. 잠시 기다려주세요. 화면을 닫지 않아도 돼요.'),1800);
  try{
    if(window.PeskLearningSync)return await window.PeskLearningSync.run(window._fsRunTxn,db,update,{onRetry:()=>hint('동시에 저장하는 친구가 많아 다시 연결하고 있어요. 답변과 공격 기록은 유지돼요.')});
    return await window._fsRunTxn(db,update);
  }finally{clearTimeout(timer);}
}
let rpgFx = '';              // 방금 일어난 일 (연출 문구)
/* 한 번만 재생하는 타격 연출.
   innerHTML 로 다시 그릴 때 요소가 새로 만들어지면서 CSS 애니메이션이 저절로 시작된다.
   그래서 별도 게임 루프 없이 클래스만 붙였다 떼면 된다. */
let rpgAnim = { kind: '', dmg: 0, prevPct: -1 };

/* 아바타와 몬스터가 마주 보는 무대.
   왼쪽에 내가 꾸민 아바타(+펫), 오른쪽에 몬스터. */

/* 체력바가 0.4초에 걸쳐 따라 내려오게 한다.
   다시 그리면 요소가 새로 생겨 transition 이 안 걸리므로,
   이전 값으로 그려 두고 다음 프레임에 목표값을 준다. */
function rpgAfterRender(){
  const bar = document.querySelector('#panel-adventure .rpg-hp i[data-to], #panel-boss .rpg-hp i[data-to]');
  if(!bar) return;
  const to = bar.getAttribute('data-to');
  // requestAnimationFrame 은 화면이 안 보일 때 멈춘다(탭 전환·절전).
  // 레이아웃을 한 번 읽어 시작 폭을 확정시키면 rAF 없이도 transition 이 걸린다.
  void bar.getBoundingClientRect().width;
  bar.style.width = to + '%';
}

function rpgGame(){ return qzState().game || (qzState().game = window.RPG.newGameState()); }
function rpgMonster(){ return window.RPG.monsterById(rpgGame().monsterId) || window.RPG.MONSTERS[0]; }

/* ── 진단 ── */
function rpgStartDiag(){
  if(!window.QRATE) return;
  if(!qzAllowedTypeCodes().length)return;
  rpgDiag = window.QRATE.newDiagnostic([roomId, myStudentNum, Date.now()].join('|'),undefined,qzAllowedTypeCodes());
  window.QRATE.diagnosticNext(rpgDiag);
  avRefresh();
}
async function rpgAnswerDiag(idx){
  if(!rpgDiag || rpgBusy) return;
  const q = rpgDiag.current;
  if(!q) return;
  const correct = String(q.options[idx]) === String(q.answer);
  window.QRATE.diagnosticAnswer(rpgDiag, correct);
  if(rpgDiag.done){
    const res = window.QRATE.diagnosticResult(rpgDiag);
    rpgBusy = true;
    const previousRating=qzState().rating;
    try{
      qzState().rating = res.rating;
      await rpgSaveProgress();
      addNotif('⚔️ 실력 진단 완료! 이제 네 수준에 맞는 문제가 나와요.');
      showFeedbackNotice('진단 끝! 모험을 시작해요 ⚔️');
    }catch(e){ qzState().rating=previousRating;showFeedbackNotice('진단 결과를 저장하지 못했어요. 연결을 확인하고 다시 시도해주세요.');console.warn('진단 저장 실패', e); }
    finally{ rpgBusy = false; rpgDiag = null; }
  } else {
    window.QRATE.diagnosticNext(rpgDiag);
  }
  avRefresh();
}

/* ── 전투 ── */
function rpgEnsureQuestion(){
  if(rpgQ && rpgQ._camp){ rpgQ = null; rpgPicked = null; }   // 모닥불 문제는 일반 문제로 쓰지 않는다
  if(rpgQ) return rpgQ;
  // 출제 규칙은 qzMake 하나만 쓴다. 여기서 따로 만들면 학년·과목·복습 처리가
  // 두 벌이 되어 한쪽만 고치는 실수가 난다.
  rpgQ = qzMake();
  if(rpgQ){rpgQ._attemptTried=Number(qzDaily().tried||0);rpgQ._attemptDay=qzToday();}
  rpgPicked = null;
  return rpgQ;
}
function rpgSubmitShort(){
  if(!rpgQ||rpgQ.responseMode!=='short'||rpgBusy||rpgPicked!==null)return;
  const input=document.getElementById('rpg-short-answer'),value=input?.value||'';
  rpgQ._draft=value;
  const error=document.getElementById('rpg-short-error');
  if(!value.trim()||(rpgQ.inputKind==='number'&&(!/^[\d, .０-９．，]+$/.test(value)||window.QUIZ.numericValue(value)===null))){
    if(error)error.textContent=value.trim()?'숫자로 답을 입력해 주세요. 단위는 쓰지 않아도 돼요.':'답을 입력한 뒤 확인을 눌러 주세요.';
    input?.focus();return;
  }
  return rpgAnswer(null,value);
}
async function rpgAnswer(idx,typed){
  if(rpgQ && rpgQ._camp) return rpgCampAnswer(idx,typed);
  if(rpgBusy || rpgPicked !== null || !rpgQ || rpgGame().pendingAttack || rpgGame().heroHp<=0) return;
  const q = rpgQ, chosen = typed===undefined?q.options[idx]:typed;
  if(typed!==undefined&&q.responseMode!=='short')return;
  if(chosen === undefined) return;
  const correct = window.QUIZ.sameAnswer(q,chosen);
  const pw = petPower(), weapon = rpgWeapon(), skill = window.PeskCombat.skillFor(avEquipped().pet);
  const petId=avEquipped().pet||'',pet=window.PeskCombat.petProfile(petId,petId?petLevelOfCare(petNow(petId).care):1,petTierKey(petId));
  const setFx = mySetFx();
  const input = {correct, target:rpgGame().monsterId, day:q._attemptDay, expectedTried:q._attemptTried,
    passiveGuard:pw.guard, wrongDmg:setFx.wrongDmg, extraEnergy:q.isReview ? 1 : 0,
    ticket:{id:uid()+'-'+Date.now().toString(36),monsterId:rpgGame().monsterId,
      bossRound:'',weaponStyle:weapon.id,petSkill:skill ? skill.id : '',
      mode:'hunt',weaponId:avEquipped().weapon||'',petId,petTier:pet?.tier||'common',
      baseDamage:Math.max(1,Math.round(window.RPG.damageFor(qzRating()||1000,q.difficulty,window.QRATE.expectedScore))),
      expMultiplier:1}};
  rpgBusy = true; qzBusy = true; rpgPicked = chosen; rpgFx = '학습 기록 저장 중…';
  avRefresh();
  try{
    const result = await qzCommit(q,correct,input);
    rpgFx=correct
      ? (q.isReview ? '복수 몬스터를 물리쳤어요! 공격권 +2' + (result && result.fragGain ? ' · 🔁 극복 조각 +' + result.fragGain : '') + (result && result.graduated ? ' · 이 유형 졸업! 🎓' : '') : '정답! 공격권 +1')
      : '몬스터의 반격! 모험 체력 −' + setFx.wrongDmg + ' · 공격권은 생기지 않아요.';
    rpgClearAnim();
    if(!correct) rpgAnim = {kind:'miss',dmg:0,prevPct:-1};
  }catch(e){
    rpgPicked = null;
    rpgFx = String(e.message)==='DAILY_LIMIT' ? '오늘 문제를 모두 풀었어요. 내일 다시 만나요!'
      : '기록을 저장하지 못했어요. 연결을 확인하고 다시 눌러주세요.';
    if(['STALE_QUESTION','ATTACK_PENDING','BOSS_UNAVAILABLE','DAILY_LIMIT','HUNT_FULL','REST_REQUIRED'].includes(e.message)){
      await rpgReloadProgress(); rpgQ=null;
      rpgFx='진행 상황이 바뀌어 최신 기록을 불러왔어요.';
    }
    console.warn('모험 답안 저장 실패',e);
  }finally{rpgBusy=false;qzBusy=false;avRefresh();}
  if(rpgGame().huntEnergy.length && rpgAutoEnabled())await rpgBeginHunt(true);
}

// 한 공격 기회는 트랜잭션에서 한 번만 소비한다. 보상/피해가 이중 적용되지 않는다.
async function rpgMutateProgress(change){
  if(!window._fbReady || !window._db || !window._fsRunTxn) throw new Error('CONNECTION_REQUIRED');
  const db=window._db,qs=quizStore();
  const bossRef=window._fsDoc(db,'classrooms',roomId,'data','pesk-class-boss');
  let result;
  await runLearningTransaction(db,async txn=>{
    // 보스 진행은 반 전체 피해를 알아야 하므로 반 요약도 함께 연다 (내 칸만 전체 기록)
    const [qctx,bs]=await Promise.all([qs.open(txn,myStudentNum,{cls:true}),txn.get(bossRef)]);
    const all=qctx.all;
    const current=all[myStudentNum] || {};
    const cfg=window.RPG.normalizeBoss(bs.exists() ? bs.data().value : null);
    const before=JSON.stringify(current);
    const bossBefore=JSON.stringify((window.PeskQuizStore.summaryOf(current)||{}).boss);
    const updated=change(current,all,cfg);
    const changed=before!==JSON.stringify(updated);
    if(changed)all[myStudentNum]={...updated,studentName:myStudentName||'',accountUid:myAccountUid||'',updatedAt:new Date().toISOString()};
    // 보스 피해·칭호가 바뀌면 반 요약도 바로 고친다 (보스 체력은 모두가 같이 봐야 한다). 그 밖의 변화는 나중에 모아 올린다.
    const bossChanged=changed && JSON.stringify((window.PeskQuizStore.summaryOf(all[myStudentNum])||{}).boss)!==bossBefore;
    let settled = null;

let rpgCampN = Math.floor(Math.random()*1e6);

async function rpgCampAnswer(idx,typed){

  if(!window.QUIZ.sameAnswer(q,chosen)) return avRefresh();
  await rpgRest();
  if(rpgGame().heroHp<=0){ rpgPicked = null; return avRefresh(); }   // 저장 실패 — 같은 문제로 다시 시도

function rpgCampHtml(){

    + '<button class="qz-next" onclick="rpgCampNext()">다른 모닥불 문제 →</button></div>';

function rpgStartCharge(event){

/* 보스 입장 자격 — 오늘 N문제를 풀었거나 오늘 몬스터를 쓰러뜨렸고, 오늘 아직 도전하지 않았다.
   매일 리셋되므로 뒤처진 아이도 오늘 풀면 바로 들어온다. */
function bossEntry(){
  const e = window.RPG.bossChallenge(bossCfg, qzState(), qzToday());
  return {...e, done:e.tried};
}

/* 내가 가진 보스 칭호 중 가장 최근 것 */
function bossTitle(){
  const t = window.RPG.normalizeBossRec(qzState().boss).titles;
  return t.length ? String(t[t.length - 1]).split(':').slice(1).join(':') : '';
}

/* 다음 몬스터 — 학생이 고르지 않는다. 쓰러뜨린 뒤에만 새 몬스터가 무작위로 나타난다.
   아직 살아 있는 몬스터는 바꿀 수 없다(약한 몬스터만 골라 잡는 것을 막는다). */
async function rpgNextMonster(){
  if(rpgBusy)return;
  if(rpgGame().pendingAttack)return showFeedbackNotice('준비된 공격을 먼저 사용해주세요.');
  rpgCancelCharge();rpgBusy=true;qzBusy=true;
  let met=null;
  try{
    await rpgMutateProgress(current=>{
      const G=window.RPG,game=G.normalizeGame(current.game);
      if(game.pendingAttack)throw new Error('ATTACK_PENDING');
      if(game.hp>0)return current;
      const m=G.randomMonster(game.monsterId,undefined,game);
      game.monsterId=m.id;game.hp=m.hp;met=m;
      return {...current,game};
    });
    rpgQ=null;rpgPicked=null;rpgPetArmed=false;rpgClearAnim();
    rpgFx=met?'🎲 '+met.name+' 등장! ('+window.RPG.monsterRank(met).label+')':'';
  }catch(e){showFeedbackNotice('새 몬스터를 불러오지 못했어요. 연결을 확인하고 다시 눌러주세요.');}
  finally{rpgBusy=false;qzBusy=false;avRefresh();}
}
// 진단 결과만 저장한다. 다른 탭에서 진행한 전투 상태를 덮어쓰지 않는다.
async function rpgSaveProgress(){
  const rating=qzRating();
  await rpgMutateProgress(current=>({...current,rating,game:window.RPG.normalizeGame(current.game)}));
}

/* ── 화면 ── */
function buildRpgPanel(me){
  if(!window.QRATE || !window.RPG || !window.PeskCombat)
    return '<div class="empty-state"><span class="empty-icon">⚔️</span>모험 파일을 불러오지 못했어요<br>quiz-rating.js · rpg-monsters.js 를 확인해주세요.</div>';
  if(rpgGame().pendingAttack)return rpgBattleHtml(me);
  if(qzCfg().enabled === false)
    return '<div class="empty-state"><span class="empty-icon">⚔️</span>지금은 모험 학습이 닫혀 있어요</div>';

  // ① 진단을 아직 안 봤으면 진단부터
  const c=qzCfg();
  const subjects=qzSubjects();
  if(!subjects.length)return '<div class="empty-state">선생님이 아직 과목을 열지 않았어요.</div>';
  if(!subjects.some(x=>x.id===qzSubject))qzSubject=subjects[0].id;
  if(!Number(c.difficulty) && !qzHasRating() && qzSubject==='math' && qzAllowedTypeCodes().length) return rpgLearnHeadHtml()+rpgDiagHtml();
  return rpgBattleHtml(me);
}

function rpgDiagHtml(){
  if(!rpgDiag){
    return '<div class="rpg-intro">'
      + '<div class="rpg-intro-icon">🧭</div>'
      + '<b>먼저 실력을 알아볼게요</b>'
      + '<p>10문제만 풀면 돼요. 맞히든 틀리든 괜찮아요 — 점수가 아니라 '
      + '<b>너에게 딱 맞는 문제</b>를 찾기 위한 거예요.<br>'
      + '너무 쉬우면 심심하고 너무 어려우면 힘드니까요.</p>'
      + '<button class="rpg-go" onclick="rpgStartDiag()">진단 시작하기</button></div>';
  }
  const q = rpgDiag.current;
  if(!q) return '<div class="rpg-intro"><b>정리하는 중...</b></div>';
  const step = rpgDiag.step + 1;
  return '<div class="rpg-diag">'
    + '<div class="rpg-diag-head"><b>실력 진단</b><span>' + step + ' / ' + rpgDiag.n + '</span></div>'
    + '<div class="rpg-diag-bar"><i style="width:' + Math.round((rpgDiag.step / rpgDiag.n) * 100) + '%"></i></div>'
    + '<div class="qz-card"><div class="qz-q">' + escHtml(q.prompt).replace(/\n/g,'<br>') + '</div>'
    + '<div class="qz-opts">'
    + q.options.map((o,i)=>'<button class="qz-opt" onclick="rpgAnswerDiag(' + i + ')">'
        + '<span class="qz-opt-no">' + '①②③④'[i] + '</span>'
        + '<span class="qz-opt-txt">' + escHtml(String(o)) + '</span></button>').join('')
    + '</div></div>'
    + '<p class="rpg-hint">모르면 찍어도 괜찮아요. 그것도 정보가 돼요.</p></div>';
}

/* 퀘스트 탭을 없애면서 옮겨온 것들 — 레벨·오늘 몫·코인, 과목 고르기, 공동 목표 */
function rpgLearnHeadHtml(){
  const c = qzCfg(), s = qzState(), d = qzDaily(s);
  const lv = qzLevel();
  const inLv = window.QUIZ.xpInLevel(qzXp()), per = window.QUIZ.xpForNextLevel(qzXp());
  const limit = Math.max(0, Number(c.dailyQuestionLimit || 0));
  const left = limit > 0 ? Math.max(0, limit - Number(d.tried || 0)) : Infinity;
  const coinLeft = Math.max(0, Number(c.dailyCoinCap || 0) - Number(d.coin || 0));
  const accuracy = s.tried ? Math.round((s.correct / s.tried) * 100) : 0;

  const head = '<div class="qz-head">'
    + '<div class="qz-lv"><span class="qz-lv-badge">🎓 Lv.' + lv + '</span>'
    +   '<div class="qz-lv-bar"><i style="width:' + Math.round(inLv / per * 100) + '%"></i></div>'
    +   '<span class="qz-lv-xp">' + inLv + ' / ' + per + ' XP</span></div>'
    + '<div class="qz-stats">'
    +   '<div><b>' + (limit > 0 ? left : '∞') + '</b><span>오늘 남은 문제</span></div>'
    +   '<div><b>' + coinLeft.toLocaleString() + '</b><span>오늘 더 받을 코인</span></div>'
    +   '<div><b>' + accuracy + '%</b><span>전체 정답률</span></div>'
    + '</div></div>';

  if(!qzSubjects().length && !litTabOn()) return head + '<div class="empty-state"><span class="empty-icon">🎓</span>선생님이 아직 과목을 열지 않았어요</div>';
  return head + rpgSubjectTabsHtml() + bossNudgeHtml();
}
/* 과목 탭 — 수학 · 영단어 · 📖 오늘의 지문. 지문 화면에서도 같은 탭을 위에 둔다 */
function litTabOn(){
  if(!window.LiteracyCore || !litDoc.cfg) return false;
  const days = todoSchedule ? (todoSchedule.weekly.literacy || []) : [];
  return !!(litOpenList().length || days.length || Object.keys(litDoc.sheets).length);
}
function rpgSubjectTabsHtml(){
  // 꺼진 과목도 회색으로 남겨 이유를 알 수 있게 한다
  const ALL = qzSubjects().map(x=>[x.id,x.label,true]);
  const on = ALL.filter(b => b[2]);
  if(on.length && !on.some(b => b[0] === qzSubject)) qzSubject = on[0][0];
  const lit = advMode === 'lit', todo = litTabOn() ? litOpenList().filter(x => !litRec(x.date)?.done).length : 0;
  const offNames = ALL.filter(b => !b[2]).map(b => b[1]);
  return '<div class="qz-subjects" role="tablist">' + ALL.map(b =>
      b[2] ? '<button class="qz-subject' + (!lit && qzSubject === b[0] ? ' active' : '') + '" role="tab" aria-selected="' + (!lit && qzSubject === b[0]) + '" onclick="rpgPickSubject(\'' + b[0] + '\')">' + b[1] + '</button>'
           : '<button class="qz-subject off" disabled title="선생님이 이 과목을 꺼두셨어요">' + b[1] + ' 🔒</button>'
    ).join('')
    + (litTabOn() ? '<button class="qz-subject' + (lit ? ' active' : '') + '" role="tab" aria-selected="' + lit + '" onclick="openLiteracy()">📖 오늘의 지문' + (todo ? '<span class="qz-dot">' + todo + '</span>' : '') + '</button>' : '')
    + '</div>'
    + (offNames.length ? '<p class="qz-subj-off">' + offNames.join(' · ')
        + '은(는) 지금 꺼져 있어요. 선생님이 <b>모험 학습 설정 → 과목</b>에서 켜주시면 풀 수 있어요.</p>' : '');
}
function rpgPickSubject(sub){
  if(advMode === 'lit'){ litView = null; advMode = 'rpg'; }   // 📖 지문 탭에서 과목 탭으로
  if(rpgBusy || rpgGame().pendingAttack){ avRefresh(); return showFeedbackNotice('준비된 공격을 먼저 사용해주세요.'); }
  qzSubject = sub; rpgQ = null; rpgPicked = null; rpgFx = ''; rpgClearAnim();
  avRefresh();
}

/* ── 💪 공격력 ── 장착 아이템 공격력의 합. 사냥·보스 출발 때 공격권에 담겨 실제 피해에 곱해진다 */
const AV_POWER_LABEL = {weapon:'무기', top:'상의', bottom:'하의', shoes:'신발', hat:'모자', pet:'펫', set:'세트'};
function avPetTierNow(petId){
  if(!petId || !window.PeskCombat) return 'common';
  const p = window.PeskCombat.petProfile(petId, petLevelOfCare(petNow(petId).care), petTierKey(petId));
  return p ? p.tier : 'common';
}
function avPower(eq){
  eq = eq || avEquipped();
  if(!window.PeskCombat || !window.PeskCombat.powerOf) return {base:10,total:10,parts:[],bonusPct:0};
  return window.PeskCombat.powerOf(eq, avPetTierNow(eq.pet));
}
function avPowerOfItem(cat, id){
  if(!window.PeskCombat || !window.PeskCombat.itemPower) return 0;
  return window.PeskCombat.itemPower(cat, id, cat === 'pet' ? avPetTierNow(id) : '');
}
/* 내 공격력 카드 — 합계, 부위별 공격력, 무기·펫 효과 */
function avPowerCardHtml(){
  const eq = avEquipped(), pw = avPower(eq);
  const w = window.PeskCombat.weaponProfile(rpgWeapon().id, eq.weapon || '');
  const pet = eq.pet ? window.PeskCombat.petProfile(eq.pet, petLevelOfCare(petNow(eq.pet).care), petTierKey(eq.pet)) : null;
  const rows = pw.parts.map(p => {
    const item = p.slot === 'pet' ? {name: (pet && pet.name) || ''} : p.slot === 'set' ? {name: '⚔️ 군단 세트'} : avFind(p.slot, p.id);
    return '<li><span>' + AV_POWER_LABEL[p.slot] + ' · ' + escHtml(item ? item.name : p.id) + '</span><b>+' + p.power + '</b></li>';
  }).join('');
  return '<div class="av-power">'
    + '<div class="av-power-head"><span>💪 내 공격력</span><b>' + pw.total + '</b><small>피해 +' + pw.bonusPct + '%</small></div>'
    + '<ul class="av-power-list"><li><span>기본</span><b>' + pw.base + '</b></li>' + rows + '</ul>'
    + '<div class="av-power-fx">'
    + '<div>' + w.icon + ' <b>' + escHtml(avFind('weapon', eq.weapon)?.name || '맨손 (' + w.name + ' 모양)') + '</b> · ' + escHtml(w.desc) + '</div>'
    + (pet ? '<div>' + pet.icon + ' <b>' + escHtml(pet.name) + ' (' + escHtml(pet.tierName) + ')</b> · ' + escHtml(pet.skill + ': ' + pet.desc) + (pet.rank > 0 ? ' · ' + escHtml(pet.trait) : '') + '</div>' : '<div>🐾 펫이 없어요 · 펫을 데려오면 공격력과 스킬이 생겨요</div>')
    + '</div>'
    + mySetFx(eq).active.map(a => '<div class="av-power-set">' + a.icon + ' <b>' + escHtml(a.name) + ' 세트 ' + a.level + '단계</b> · ' + escHtml(a.text) + '</div>').join('')
    + '<div class="av-power-note">공격력 1점마다 피해가 1%씩 커져요 (최대 +50%). 사냥이나 보스전을 <b>출발할 때</b> 입고 있는 장비로 계산해요.</div>'
    + '</div>';
}

 const g=rpgGame(),eq=avEquipped(),w=rpgWeapon(),pet=window.PeskCombat.petProfile(eq.pet,eq.pet?petLevelOfCare(petNow(eq.pet).care):1,petTierKey(eq.pet));

function rpgActionHtml(){
  const g=rpgGame(),t=g.pendingAttack;if(!t)return '';
  if(rpgBusy)return '<section class="combat-action" aria-label="준비된 공격" role="status" data-learning-save>공격 결과를 저장하고 있어요…</section>';
  if(rpgShooterReport?.id===t.id)return '<section class="combat-action" aria-label="준비된 공격"><h3>전투 결과를 다시 저장할까요?</h3><p>명중 '+rpgShooterReport.hits+'회 · 공격 기회는 아직 남아 있어요.</p><button class="rpg-go" onclick="rpgRetryShooter()">결과 저장 다시 시도</button><button class="combat-basic" onclick="rpgSkipBattle()">기본 공격으로 다음 문제 →</button></section>';
  return '<section class="combat-action" aria-label="준비된 공격"><div id="rpg-battle-choice"><div class="combat-ready">사냥 에너지가 준비됐어요</div><h3>'+t.ammo+'번 공격할 수 있어요</h3><p>몬스터에게 다가가 직접 공격해요.<br>⚡ 붉은 원을 피하거나 막으면 다음 공격이 강타!<br>✨ 무기 스킬은 공격권 2개 — 몬스터 반격을 끊어요.<br>태블릿: 왼쪽 조이스틱 이동 · 오른쪽 공격 버튼<br>키보드: 방향키 · A/S/D/F</p><button class="rpg-go shooter-start" onclick="rpgStartShooter()">⚔️ RPG 전투 시작</button><button class="combat-basic" onclick="rpgSkipBattle()">전투 건너뛰고 다음 문제 →</button><small>학습 코인·경험치는 같아요. 직접 싸우면 피해를 최대 35% 더 줄 수 있고, 일찍 쓰러뜨리면 남은 공격권을 돌려받아요.</small></div>'

}
/* 전투 창 — 모험과 보스전이 같은 전투 화면을 쓴다 */

function rpgBattleHtml(me){
  const G = window.RPG, R = window.QRATE;
  const g = rpgGame();
  const mon = rpgMonster();
  const rank = G.monsterRank(mon);
  const lv = G.gameLevel(g.gxp);
  const inLv = G.gxpInLevel(g.gxp), per = G.gxpForNextLevel(g.gxp);
  const hpPct = Math.round(g.hp / mon.hp * 100);
  const total = G.totalKills(g);

  const learning=rpgLearnHeadHtml()+(!g.pendingAttack?revengeNudgeHtml()+rpgHuntBar():'');
  const rev=!!(rpgQ && rpgQ.isReview && !g.pendingAttack && g.hp>0);
  const petBar='';

  const head = '<div class="rpg-head">'
    + '<div class="rpg-lv"><span class="rpg-lv-badge">⚔️ Lv.' + lv + '</span>'
    +   '<div class="rpg-lv-bar"><i style="width:' + Math.round(inLv / per * 100) + '%"></i></div>'
    +   '<span class="rpg-lv-xp">' + inLv + ' / ' + per + '</span></div>'
    + '<div class="rpg-kills">쓰러뜨린 몬스터 <b>' + total + '</b></div>'
    + '</div>'
    + (function(){
        const cur = G.titleOf(g.gxp), nxt = G.nextTitle(g.gxp);
        if(!cur && !nxt) return '';
        return '<div class="rpg-title">'
          + (cur ? '🏅 <b>' + escHtml(cur) + '</b>' : '<span class="rpg-title-none">아직 칭호가 없어요</span>')
          + (nxt ? '<span> · Lv.' + nxt.lv + ' 에 「' + escHtml(nxt.name) + '」</span>' : '<span> · 마지막 칭호예요</span>')
          + '</div>';
      })()
    + petBar;

  // 몬스터 도감 — 고르는 버튼이 아니라 지금까지 잡은 기록만 보여준다
  // 지역별로 묶는다. 열린 지역의 몬스터만 무작위로 나오고, 처치 수가 쌓이면 다음 지역이 열린다
  const nextReg = G.nextRegionInfo(g);
  const dex = '<div class="rpg-dex"><div class="rpg-region-head">📖 몬스터 도감 <span class="rpg-lockmsg">열린 지역의 몬스터가 무작위로 나타나요'
    + (nextReg ? ' · ' + nextReg.region.icon + ' ' + escHtml(nextReg.region.name) + '까지 ' + nextReg.remain + '마리' : '') + '</span></div>'
    + G.REGIONS.map(r => {
      const open = G.regionUnlocked(r.id, g);
      return '<div class="rpg-region-row' + (open ? '' : ' closed') + '"><small>' + r.icon + ' ' + escHtml(r.name) + (open ? '' : ' · 🔒 ' + r.need + '마리 처치하면 열려요') + '</small>'
        + '<div class="rpg-mons">' + G.monstersOf(r.id).map(m => {
          const kills = g.kills[m.id] || 0;
          return '<span class="rpg-mon' + (m.id === g.monsterId ? ' on' : '') + (kills ? '' : ' lock') + '">'
            + '<span class="rpg-mon-icon">' + (kills || m.id === g.monsterId ? m.icon : '❔') + '</span>'
            + '<span class="rpg-mon-name">' + (kills || m.id === g.monsterId ? escHtml(m.name) : '???') + '</span>'
            + '<span class="rpg-mon-sub">' + G.monsterRank(m).label + (kills ? ' · ×' + kills : '') + '</span></span>';
        }).join('') + '</div></div>';
    }).join('') + '</div>';

  const fromPct = rpgAnim.prevPct >= 0 ? rpgAnim.prevPct : hpPct;
  const stage = '<div class="rpg-stage' + (rev ? ' revenge' : '') + '" style="--mc:' + mon.color + '">'
      + rpgArenaHtml(mon.icon, mon.color)
      + '<div class="rpg-mon-title">' + (rev ? '🔁 복수의 ' : '') + escHtml(mon.name) + ' <span class="rpg-rank ' + rank.id + '">' + rank.label + '</span></div>'
      + '<div class="rpg-hp"><i style="width:' + fromPct + '%" data-to="' + hpPct + '"></i></div>'
      + '<div class="rpg-hp-num">' + g.hp + ' / ' + mon.hp + '</div>'
      + (rpgFx ? '<div class="rpg-fx">' + escHtml(rpgFx) + '</div>' : '')
      + '</div>';

  if(g.pendingAttack)return learning+head+stage+rpgActionHtml();
  if(rpgBusy)return learning+head+stage+'<div class="combat-action" role="status" data-learning-save>학습 기록 저장 중…</div>';
  if(g.hp===0)return learning+head+stage
    + '<div class="combat-victory"><span>🏆</span><h3>'+escHtml(mon.name)+' 처치!</h3><p>또 하나의 모험을 해냈어요. 다음엔 어떤 몬스터가 나올까요?</p>'
    + '<button class="rpg-go" onclick="rpgNext()">🎲 다음 몬스터 만나기 →</button></div>'+dex;
  if(g.heroHp<=0)return learning+head+stage+rpgCampHtml();
  const c0 = qzCfg();
  const limit0 = Math.max(0, Number(c0.dailyQuestionLimit || 0));
  if(limit0 > 0 && Number(qzDaily().tried || 0) >= limit0 && rpgPicked===null){
    return learning + head + stage
      + '<div class="qz-done"><span class="qz-done-icon">🎉</span>'
      + '<b>오늘 몫을 다 풀었어요!</b><p>내일 또 도전해요.</p></div>';
  }

  // 한 번에 준비하는 문제 수(교사 설정)를 다 풀면 사냥을 다녀와야 다음 문제가 나온다. 막힌 것처럼 보이지 않게 여기서 바로 출발한다.
  if(g.huntAttempts>=rpgHuntLimit()&&rpgPicked===null)return learning+head+stage+'<div class="combat-victory"><h3>사냥 준비 완료!</h3>'
    +(g.huntEnergy.length
      ?'<p>문제 '+rpgHuntLimit()+'개를 다 풀었어요. 모은 공격권 '+g.huntEnergy.length+'회로 사냥을 다녀오면 바로 다음 문제를 풀 수 있어요.</p>'
        +'<button class="rpg-go" '+(rpgBusy||g.heroHp<=0?'disabled':'')+' onclick="rpgBeginHunt()">⚔️ 사냥하러 가기 · '+g.huntEnergy.length+'회 공격</button>'
        +'<button class="combat-basic" '+(rpgBusy||g.heroHp<=0?'disabled':'')+' onclick="rpgBeginHunt(true)">전투 건너뛰고 다음 문제 풀기</button>'
      :'<p>이번에는 공격권을 모으지 못했어요. 모닥불에서 쉬면 다시 문제를 풀 수 있어요.</p><button class="rpg-go" onclick="rpgRest()">🔥 쉬고 다시 준비하기</button>')
    +'</div>'+dex;
  const q = rpgEnsureQuestion();
  if(!q) return learning + head + stage + '<div class="empty-state">'+escHtml(subjectBankError&&window.PeskSubjects?.CUSTOM.includes(qzSubject)?subjectBankError:'선택한 범위에 준비된 문제가 없어요. 선생님께 학년·학기·단원 설정 확인을 부탁드려요.')+'</div>';
  const answered = rpgPicked !== null;
  const isRight = answered && window.QUIZ.sameAnswer(q,rpgPicked);

  const opts = q.options.map((o,i)=>{
    let cls = 'qz-opt';
    if(answered){
      if(String(o) === String(q.answer)) cls += ' right';
      else if(String(o) === String(rpgPicked)) cls += ' wrong';
      else cls += ' dim';
    }
    return '<button class="' + cls + '"' + (answered ? ' disabled' : '')
      + ' onclick="rpgAnswer(' + i + ')">'
      + '<span class="qz-opt-no">' + '①②③④'[i] + '</span>'
      + '<span class="qz-opt-txt">' + escHtml(String(o)) + '</span></button>';
  }).join('');

  const fb = !answered ? '' :
    '<div class="qz-feedback ' + (isRight ? 'ok' : 'no') + '">'
    + '<b>' + (isRight ? '⭕ 정답이에요!' : '다시 도전해요') + '</b>'
    + (isRight ? '' : '<span class="qz-ans">정답: ' + escHtml(String(q.answer)) + '</span>')
    + '<p>' + escHtml(q.explain || '') + '</p>'
    + '<button class="qz-next" onclick="rpgNext()">다음 문제 →</button></div>';

  // 무대는 문제보다 먼저 그려지므로, 이번 문제가 복수 몬스터면 여기서 모습을 바꾼다
  const stageNow = q.isReview && !rev ? stage.replace('<div class="rpg-stage"', '<div class="rpg-stage revenge"').replace('<div class="rpg-mon-title">', '<div class="rpg-mon-title">🔁 복수의 ') : stage;
  return learning + head + stageNow
    + (q.isReview ? '<div class="qz-review">🔁 <b>복수 몬스터 등장!</b> 전에 틀렸던 유형이에요. 맞히면 공격권 2개 + 🔁 극복 조각!</div>' : '')
    + '<div class="qz-card"><div class="qz-unit">' + escHtml(q.unit) + ' · '+(q.questionStyle==='word'?'문장제 · ':'')+(q.responseMode==='short'?'직접 입력':'보기 선택')+'</div>'
    + '<div class="qz-q">' + escHtml(q.q).replace(/\n/g,'<br>') + '</div>'
    + (q.responseMode==='short'?rpgShortAnswerHtml(q,answered):'<div class="qz-opts">'+opts+'</div>')+'</div>'
    + fb
    + dex
    + '<p class="rpg-hint">정답은 공격권 +1 · 틀리면 몬스터 반격으로 모험 체력 −' + mySetFx().wrongDmg + '. 학습 경험치는 유지돼요.<br>여기서 모은 공격권은 모험 몬스터에게만 써요. 우리 반 보스는 🗿 보스 탭에서 하루 한 번 따로 도전해요.</p>';
}

/* QRATE 문항을 quiz-bank 문항 모양으로 맞춘다.
   unit 문자열('5-1 ④ 약분과 통분')에서 학기와 단원 번호를 되살려야
   byUnit 통계 키가 기존('5-1-4')과 같아지고 교사앱 '약한 단원'에 제대로 잡힌다. */
const QZ_UNIT_MARKS = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨'];
let rpgPadOpen = false;
function rpgAnswerPadHtml(q,answered){
  if(answered)return '';
  const rows=q.inputKind==='word'?['qwertyuiop','asdfghjkl','zxcvbnm']:['123','456','789','.0'];
  const button=(key,label)=>'<button type="button" data-answer-key="'+escHtml(key)+'" onpointerdown="event.preventDefault()" onclick="rpgPadKey(this.dataset.answerKey)">'+escHtml(label||key)+'</button>';
  return '<details class="answer-pad" '+(rpgPadOpen?'open':'')+' ontoggle="rpgPadOpen=this.open"><summary onpointerdown="event.preventDefault()">⌨ 화면 키패드 · 키보드가 안 뜨면 눌러주세요</summary>'
    + rows.map(row=>'<div class="answer-pad-row">'+[...row].map(k=>button(k)).join('')+'</div>').join('')
    + '<div class="answer-pad-row">'+(q.inputKind==='word'?button(' ','띄어쓰기'):'')+button('backspace','⌫ 지우기')+button('clear','전체 지우기')+'</div></details>';
}
function rpgPadKey(key){
  const input=document.getElementById('rpg-short-answer');
  if(!input||input.disabled||!rpgQ||rpgBusy||rpgPicked!==null)return;
  const value=input.value,start=input.selectionStart??value.length,end=input.selectionEnd??start;
  let next=value,caret=start;
  if(key==='clear'){next='';caret=0;}
  else if(key==='backspace'){const from=start===end?Math.max(0,start-1):start;next=value.slice(0,from)+value.slice(end);caret=from;}
  else if((rpgQ.inputKind==='word'?/^[a-z ]$/:/^[0-9.]$/).test(key)){next=value.slice(0,start)+key+value.slice(end);caret=start+key.length;}
  if(next.length>80)return;
  input.value=next;rpgQ._draft=next;input.setSelectionRange(caret,caret);
  const error=document.getElementById('rpg-short-error');if(error)error.textContent='';
}
function rpgShortAnswerHtml(q,answered){
  const word=q.inputKind==='word',help=word?'영어 단어를 입력하세요. 대소문자는 구분하지 않아요.':'숫자만 입력하세요. 예: 12 또는 1.5';
  return '<form class="qz-short" onsubmit="event.preventDefault();rpgSubmitShort()">'
    +'<label for="rpg-short-answer">'+(word?'영어 단어':'숫자 답')+'</label>'
    +'<div class="qz-short-row"><input id="rpg-short-answer" type="text" inputmode="'+(word?'text':'decimal')+'" maxlength="80" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="rpg-short-help rpg-short-error" value="'+escHtml(String(answered?rpgPicked:q._draft||''))+'" '+(answered?'disabled ':'')+'oninput="if(rpgQ)rpgQ._draft=this.value" onkeydown="if(event.key===\'Enter\' &amp;&amp; event.isComposing)event.preventDefault()">'
    +'<button class="qz-next" type="submit"'+(answered?' disabled':'')+'>정답 확인</button></div>'
    +'<p id="rpg-short-help">'+help+'</p><p id="rpg-short-error" role="status"></p>'+rpgAnswerPadHtml(q,answered)+'</form>';
}
function qzFromRate(q, cfg){
  if(!q) return null;
  const c = cfg || qzCfg();
  const m = String(q.unit || '').match(/^(\d)-(\d)\s*(.)/);
  const term = m ? Number(m[2]) : c.term;
  const mark = m ? QZ_UNIT_MARKS.indexOf(m[3]) : -1;
  return {
    subject:'math', grade: m ? Number(m[1]) : c.grade, term,
    unit:q.unit, unitName:q.typeName, unitNo: mark >= 0 ? mark + 1 : null,
    q:q.prompt, answer:q.answer, options:q.options, explain:q.explain,
    typeCode:q.typeCode, difficulty:q.actualDifficulty, tier:null
  };
}

/* ── 문제 만들기 ── */
function qzMake(opts={}){
  if(!window.QUIZ) return null;
  const c = qzCfg(), s = qzState(), d = qzDaily(s);
  // 시드에 '오늘 푼 문제 수'를 넣어, 답하기 전에는 새로고침해도 같은 문제가 나오게 함
  const seed = [roomId, myStudentNum, qzToday(), qzSubject, d.tried].join('|') + (opts.seedSuffix || '');
  if(!qzSubjects().some(x=>x.id===qzSubject))return null;
  const allowReview = opts.forceReview || !window.PeskProgress || window.PeskProgress.reviewSlot(d.tried);

  /* 레이팅 모드 — 학생 실력에 맞춰 난이도를 정한다.
     예전에는 레벨 → tier(1~3) 로만 정해서 레벨 8 이상은 난이도가 더 오르지 않았다.
     레이팅은 상한이 없으므로 잘하는 학생에게 계속 더 어려운 문제가 나간다. */
  if(qzRatingMode()){
    const R = window.QRATE;
    const rng = R.makeRng(seed);
    // 오늘 다시 볼 오답이 있으면 그것부터. 같은 유형·난이도로 내되 숫자는 새로 만든다
    const codes=qzAllowedTypeCodes();
    const due = allowReview ? R.reviewDue((s.review||[]).filter(x=>codes.includes(x.code)), qzToday()) : null;
    const target = due ? due.d : R.pickTargetDifficulty(qzRating(), rng);
    const code = due ? due.code : R.pickTypeFor(target, codes, rng);
    const q = code ? R.generateQuestion(code, target, seed) : null;
    if(q){ const out = window.QUIZ.prepareQuestion(qzFromRate(q, c),seed); out.isReview = !!due; return out; }
  }

  // 🔁 복수 몬스터 — 전에 틀린 단원·난이도(영단어는 같은 단어)를 새 문제로 다시 낸다
  if(allowReview && window.PeskProgress){
    const P = window.PeskProgress, units = (c.mathUnits || []).map(Number);
    const due = P.revengeDue(s.revenge, qzToday(), k => k.subject === qzSubject && (k.subject === 'english'
      || (k.grade === Number(c.grade) && k.term === Number(c.term) && (!units.length || units.includes(k.unitNo)))))[0];
    if(due){
      const k = P.parseKey(due.k);
      const rq = window.QUIZ.makeQuestion({subject:k.subject, grade:c.grade, term:c.term, unitNos:k.unitNo ? [k.unitNo] : null,
        tier:k.tier, word:k.word, level:qzQuestionLevel(), seed:seed + ':revenge'});
      if(rq){ rq.isReview = true; rq.reviewKey = due.k; return rq; }
    }
  }
  return window.QUIZ.makeQuestion({
    subject: qzSubject, grade: c.grade, term: c.term,
    unitNos: qzSubject === 'math' ? c.mathUnits : null,
    level: qzQuestionLevel(), seed
  });
}
/* ── 패널 ── */

/* ── 채점 + 보상 ── */
/* 기록 저장 + (정답이면) XP·코인 지급.
   상한은 반드시 '서버에 저장된 오늘 기록'을 기준으로 판정한다. */
async function qzCommit(q, right, battleInput){
  const c = qzCfg();
  const today = qzToday();
  const unitKey = q.subject!=='math' && q.subject!=='english' ? q.subject+':'+q.grade+'-'+q.term+'-'+q.unitNo : q.subject === 'english' ? 'english'
    : (q.unitNo != null ? ((q.grade||c.grade) + '-' + (q.term||c.term) + '-' + q.unitNo)
                        : (q.typeCode || (c.grade + '-' + c.term + '-0')));
  if(!window._fbReady || !window._db || !roomId || !window._fsRunTxn){
    if(battleInput)throw new Error('CONNECTION_REQUIRED');
    // 오프라인이면 로컬만 갱신
    const s = qzState(), d = qzDaily(s);
    s.tried++; if(right){ s.correct++; s.xp += Number(c.xpPerCorrect||0); }
    s.daily[today] = {tried:Number(d.tried||0)+1, correct:Number(d.correct||0)+(right?1:0), coin:Number(d.coin||0)};
    return;
  }
  const db = window._db;
  const qs = quizStore();
  const studRef  = window._fsDoc(db,'classrooms',roomId,'data','tesk-students');
  const configRef = window._fsDoc(db,'classrooms',roomId,'data','pesk-quiz-config');
  let out = null;

  await runLearningTransaction(db, async (txn)=>{
    // 내 학생 문서만 읽고 쓴다 — 친구들이 동시에 풀어도 서로 기다리지 않는다
    const [qctx, studSnap, configSnap] = await Promise.all([qs.open(txn, myStudentNum), txn.get(studRef), txn.get(configRef)]);
    const c=Object.assign({},QZ_DEFAULT,configSnap.exists() ? configSnap.data().value : qzCfg());
    const units=q.subject==='math'?c.mathUnits:c.subjectUnits?.[q.subject];
    const selectedUnits=Array.isArray(units)?units.map(Number):[];
    if(battleInput && (Number(q.grade)!==Number(c.grade) || (q.subject!=='english' && (Number(q.term)!==Number(c.term) || (selectedUnits.length && !selectedUnits.includes(Number(q.unitNo)))))))throw new Error('STALE_QUESTION');
    const all  = qctx.all;
    const prevRaw = all[myStudentNum] || {};
    const prev = {
      xp: Number(prevRaw.xp||0), tried: Number(prevRaw.tried||0), correct: Number(prevRaw.correct||0),
      daily: (prevRaw.daily && typeof prevRaw.daily==='object') ? prevRaw.daily : {},
      byUnit: (prevRaw.byUnit && typeof prevRaw.byUnit==='object') ? prevRaw.byUnit : {},
      rating: Math.max(0, Number(prevRaw.rating)||0),
      review: window.QRATE ? window.QRATE.reviewNormalize(prevRaw.review) : []
    };
    const pd = prev.daily[today] || {tried:0, correct:0, coin:0};
    const triedToday = Number(pd.tried||0), coinToday = Number(pd.coin||0);

    // 하루 문제 수 상한 (서버 기준)
    const limit = Math.max(0, Number(c.dailyQuestionLimit||0));
    if(limit > 0 && triedToday >= limit) throw new Error('DAILY_LIMIT');
    if(c.enabled===false || !['math','english'].includes(q.subject) || c[q.subject==='math'?'mathOn':'englishOn']===false)throw new Error('STALE_QUESTION');
    if(battleInput && (battleInput.day!==today || battleInput.expectedTried!==triedToday))throw new Error('STALE_QUESTION');
    if(battleInput && Number(c.difficulty) && Number(q.tier)!==Number(c.difficulty))throw new Error('STALE_QUESTION');
    if(battleInput?.ticket.mode==='hunt'&&window.RPG.normalizeGame(prevRaw.game).huntAttempts>=Math.max(1,Math.min(30,Number(c.huntQuestionLimit)||8)))throw new Error('HUNT_FULL');
    const combat=battleInput ? window.PeskCombat.prepare(prevRaw.game,battleInput,window.RPG) : null;

    const gainXp = right ? Math.max(0, Number(c.xpPerCorrect||0)) : 0;
    // 하루 코인 상한 (서버 기준) — 남은 만큼만 지급
    const cap = Math.max(0, Number(c.dailyCoinCap||0));
    const wantCoin = right ? Math.max(0, Number(c.coinPerCorrect||0)) : 0;
    const gainCoin = Math.max(0, Math.min(wantCoin, cap - coinToday));

    // 오답 복습 목록 갱신 — 틀리면 넣고, 맞히면 다음 간격으로 미룬다
    if(window.QRATE && q.typeCode){
      prev.review = right
        ? window.QRATE.reviewOnRight(prevRaw.review, q.typeCode)
        : window.QRATE.reviewOnWrong(prevRaw.review, q.typeCode, q.difficulty);
    }

    // 실력 레이팅 갱신 — 문항 난이도가 있는 문제(레이팅 모드)에서만
    if(window.QRATE && Number.isFinite(Number(q.difficulty))){
      const before = Math.max(0, Number(prevRaw.rating) || 0) || qzRating();
      prev.rating = window.QRATE.updateRating(before, Number(q.difficulty), right);
    } else if(Number.isFinite(Number(prevRaw.rating))){
      prev.rating = Number(prevRaw.rating);
    }

    const unitStat = prev.byUnit[unitKey] || {tried:0, correct:0};
    prev.byUnit[unitKey] = {tried:Number(unitStat.tried||0)+1, correct:Number(unitStat.correct||0)+(right?1:0)};
    prev.daily[today] = {tried:triedToday+1, correct:Number(pd.correct||0)+(right?1:0), coin:coinToday+gainCoin};
    prev.tried += 1; if(right) prev.correct += 1;
    prev.xp += gainXp;

    // 🔁 복수 몬스터 · 🧩 조각 · 이번 주 집계 (주간 퀘스트)
    const PGx = window.PeskProgress, grow = {};
    let fragGain = 0, graduated = false;
    if(PGx){
      let list = prevRaw.revenge;
      const rk = q.reviewKey || PGx.revengeKey(q);
      if(rk){
        if(right && q.isReview){ const rr = PGx.revengeOnRight(list, rk, today); list = rr.list; graduated = rr.graduated; }
        else if(!right) list = PGx.revengeOnWrong(list, rk, today);
      }else if(right && q.isReview && q.typeCode){
        graduated = !prev.review.some(x => x.code === q.typeCode);   // 레이팅 유형: 목록에서 빠졌으면 졸업
      }
      if(right && q.isReview) fragGain = 1 + (graduated ? 2 : 0);
      grow.revenge = PGx.revengeNormalize(list);
      grow.wk = PGx.bumpWeek(prevRaw.wk, today, {correct:right, unitKey, revenge:!!q.isReview});
      if(fragGain) grow.frags = PGx.addFrags(prevRaw.frags, {grit:fragGain});
    }

    // 오래된 일별 기록 정리 (문서 비대화 방지 — 최근 60일만)
    const days = Object.keys(prev.daily).sort();
    if(days.length > 60) days.slice(0, days.length-60).forEach(k=>{ delete prev.daily[k]; });

    all[myStudentNum] = Object.assign({}, prevRaw, prev, grow, {
      rating: Math.max(0, Math.round(Number(prev.rating) || 0)),
      review: window.QRATE ? window.QRATE.reviewNormalize(prev.review) : [],
      game: window.RPG ? window.RPG.normalizeGame(combat ? combat.game : prevRaw.game) : undefined,
      studentName: myStudentName || '', accountUid: myAccountUid || '',
      updatedAt: new Date().toISOString()
    });

    let before = null, after = null;
    if(gainCoin > 0){
      const allStudents = studSnap.exists() ? (studSnap.data().value || []) : [];
      const i = allStudents.findIndex(s=>Number(s.num)===Number(myStudentNum));
      if(i >= 0){
        before = Number(allStudents[i].points||0);
        after  = before + gainCoin;
        allStudents[i].points = after;
        txn.set(studRef, {value: allStudents, updatedAt:new Date().toISOString()});
        out = {students: allStudents};
      }
    }
    qs.save(qctx, {[myStudentNum]: all[myStudentNum]});
    out = Object.assign(out||{}, {gainXp, gainCoin, before, after, mine: all[myStudentNum], unitKey,guarded:!!combat?.guarded, fragGain, graduated});
  });

  if(!out) return;
  if(out.students) students = out.students;
  allQuizProgress = withMyQuiz(allQuizProgress);
  allQuizProgress[myStudentNum] = myQuiz = out.mine;
  markQuizSummaryDirty();   // 일별 푼 수는 반 요약에 나중에 모아 올린다

  // 정답 PET_QUIZ_PER_CARE 개마다 펫 친밀도 +1 (서버에 저장된 누적 정답 수 기준)
  if(right){
    const total = Number(myQuiz?.correct || 0);
    if(total > 0 && total % PET_QUIZ_PER_CARE === 0) petGrow('quiz', 1);
  }

  try{
  if(out.gainCoin > 0){
    addTxn('모험 학습 정답 보상', out.gainCoin, 'earn');
    void pushEconLog({
      type:'quiz_reward',
      detail:'모험 학습 정답 (' + (q.unit||'') + ')',
      delta: out.gainCoin,
      balanceBefore: out.before, balanceAfter: out.after,
      meta:{subject:q.subject, unit:out.unitKey, xp:out.gainXp}
    });
    renderEconomyPanels(getMyStudent());
  }
  // 레벨업 알림
  const before = window.QUIZ.levelOfXp(qzXp() - (out.gainXp||0));
  const now = qzLevel();
  if(now > before){
    addNotif('🎓 학습 레벨 ' + now + ' 달성! 새 아이템이 열렸는지 마이룸에서 확인해요.');
    showFeedbackNotice('🎉 학습 레벨 ' + now + ' 달성!');
  }
  }catch(e){console.warn('학습 기록 저장 후 알림 갱신 실패',e);}
  return out;
}

function showTab(tab){
  rpgStopShooter();
  rpgCancelCharge();

    showFeedbackNotice('🔒 체크리스트 권한이 필요해요.');

  ['home','adventure','boss','shop','myroom','writing','counsel','stock','checklist','challenge'].forEach(t=>{
    const panel = document.getElementById('panel-'+t);
    const btn = document.getElementById('tab-'+t);
    const bottomBtn = document.getElementById('bottom-tab-'+t);
    const moreBtn = document.getElementById('more-tab-'+t);

    if(bottomBtn) bottomBtn.classList.toggle('active', t===tab);
    if(moreBtn) moreBtn.classList.toggle('active', t===tab);
  });
  const bottomMore=document.getElementById('bottom-tab-more');
  if(bottomMore) bottomMore.classList.toggle('active', ['myroom','counsel','stock','checklist','challenge'].includes(tab));
  const topMore=document.getElementById('tab-more');
  if(topMore) topMore.classList.toggle('active', ['stock','checklist','challenge'].includes(tab));
  if(tab==='myroom' && !['me','store','class','dex'].includes(avRoomTab)) avRoomTab = 'me';
