    + `<button onclick="switchShopPanelTab('items')" style="flex:1;padding:9px;border:none;border-radius:8px;font-weight:700;font-size:11px;cursor:pointer;${shopPanelTab==='items'?'background:#fff;color:var(--pesk);box-shadow:0 1px 3px rgba(0,0,0,.08);':'background:none;color:var(--sub);'}">🏪 상품</button>`
    + `<button onclick="switchShopPanelTab('myitems')" style="flex:1;padding:9px;border:none;border-radius:8px;font-weight:700;font-size:11px;cursor:pointer;position:relative;${shopPanelTab==='myitems'?'background:#fff;color:var(--pesk);box-shadow:0 1px 3px rgba(0,0,0,.08);':'background:none;color:var(--sub);'}">🎒 내 물건${myItemCount>0?' <span style="background:var(--pesk);color:#fff;border-radius:99px;padding:1px 6px;font-size:10px;margin-left:2px;">'+myItemCount+'</span>':''}</button>`
    + `<button onclick="switchShopPanelTab('classrewards')" style="flex:1;padding:9px;border:0;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;${shopPanelTab==='classrewards'?'background:#d8e8dc;color:#23533a;':'background:none;color:var(--sub);'}">🤝 공동 보상</button>`
    + (canApproveShopUse() ? `<button onclick="switchShopPanelTab('approvals')" style="flex:1;padding:9px;border:none;border-radius:8px;font-weight:700;font-size:11px;cursor:pointer;position:relative;${shopPanelTab==='approvals'?'background:#fff;color:var(--pesk);box-shadow:0 1px 3px rgba(0,0,0,.08);':'background:none;color:var(--sub);'}">✅ 승인${approvalCount>0?' <span style="background:var(--coral);color:#fff;border-radius:99px;padding:1px 6px;font-size:10px;margin-left:2px;">'+approvalCount+'</span>':''}</button>` : '')
    + `<button onclick="switchShopPanelTab('history')" style="flex:1;padding:9px;border:none;border-radius:8px;font-weight:700;font-size:11px;cursor:pointer;${shopPanelTab==='history'?'background:#fff;color:var(--pesk);box-shadow:0 1px 3px rgba(0,0,0,.08);':'background:none;color:var(--sub);'}">📋 내역</button>`
    + '</div>';

  if(shopPanelTab === 'classrewards') return tabBar + buildClassRewardInventory();
  if(shopPanelTab === 'approvals') return tabBar + buildShopApprovalPanel();
  if(shopPanelTab === 'history') return tabBar + buildTxnList();
  if(shopPanelTab === 'myitems') return tabBar + buildMyItemsPanel();
  const approvalShortcut = canApproveShopUse()
    ? '<button onclick="switchShopPanelTab(\'approvals\')" style="width:100%;margin-bottom:12px;padding:11px 12px;border:1px solid #fde68a;background:#fffbeb;color:#92400e;border-radius:12px;font-size:13px;font-weight:900;cursor:pointer;text-align:left;">✅ 승인 요청 확인' + (approvalCount>0 ? ' · 대기 ' + approvalCount + '건' : ' · 대기 없음') + '</button>'
    : '';

  // 상품 목록 탭
  if(!shopItems || shopItems.length===0){
    return tabBar + '<div class="empty-state"><span class="empty-icon">🏪</span>아직 매점 상품이 없어요<br>선생님이 학급 경제 → 상점에서 추가하면 여기에 나타나요.</div>';
  }
  const header = (shopBlocked ? '<div style="padding:10px 12px;border:1px solid #fecaca;background:#fff1f2;color:#b91c1c;border-radius:10px;font-size:12px;font-weight:800;line-height:1.5;margin-bottom:12px;">' + escHtml(economyBlockReason('shop')) + '</div>' : '')
    + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">'
    + '<div style="font-size:15px;font-weight:800;">🏪 매점</div>'
    + '<div style="font-size:13px;font-weight:700;color:var(--gold);">보유 ' + coins.toLocaleString() + ' 🪙'
    + '<span style="color:var(--pesk);margin-left:8px;">' + qzXp().toLocaleString() + ' XP</span></div>'
    + '</div>';
  const items = shopItems.filter(item=>!item.bossReward).map((item,i)=>{
    const isXp = item.payWith === 'xp';
    const wallet = isXp ? qzXp() : coins;
    // 상품마다 어떤 공동 목표를 조건으로 걸었는지 따로 판정 (아무 목표나 / 모든 목표 / 특정 목표)
    const gState = qzShopGoalState(item);
    const goalLocked = gState.need && !gState.ok;
    const inStock = (item.stock === -1 || item.stock > 0);
    const canBuy = !shopBlocked && !goalLocked && wallet >= item.price && inStock;
    const stockText = item.stock === -1 ? '무제한' : (item.stock + '개');
    return '<div style="border:1.5px solid #e5e7eb;border-radius:12px;padding:14px;margin-bottom:10px;background:#fafafa;display:flex;align-items:center;gap:12px;">'
      + '<div style="font-size:28px;">' + (item.icon||'🎁') + '</div>'
      + '<div style="flex:1;">'
      + '<div style="font-weight:700;font-size:14px;">' + escHtml(item.name) + '</div>'
      + '<div style="font-size:11px;color:var(--sub);">재고 ' + stockText + '</div>'
      + (isXp ? '<span class="shop-badge xp">🎓 공부해서 사는 물건</span>' : '')
      + (gState.need ? '<span class="shop-badge goal' + (gState.ok?' ok':'') + '">🤝 ' + escHtml(gState.text) + '</span>' : '')
      + '</div>'
      + '<div style="text-align:right;">'
      + '<div style="font-size:14px;font-weight:900;color:' + (isXp?'var(--pesk)':'var(--gold)') + ';margin-bottom:4px;">'
        + item.price.toLocaleString() + (isXp ? ' XP' : ' 🪙') + '</div>'
      + (canBuy
        ? '<button onclick="buyShopItem(\'' + item.id + '\')" style="padding:6px 14px;background:var(--pesk);color:#fff;border:none;border-radius:8px;font-weight:700;font-size:11px;cursor:pointer;">구매</button>'
        : '<button disabled style="padding:6px 14px;background:#e5e7eb;color:#999;border:none;border-radius:8px;font-weight:700;font-size:11px;">'
          + (!inStock ? '품절' : goalLocked ? '🤝 목표 미달' : (isXp?'XP 부족':'잔액 부족')) + '</button>')
      + '</div>'
      + '</div>';
  }).join('');
  return tabBar + approvalShortcut + header + buildClassBossQuestCard() + '<div class="shop-grid">' + (items || '<div class="empty-state">일반 판매 상품이 없어요. 공동 활동은 공동 보상 탭에서 확인하세요.</div>') + '</div>';
}

/* ── 내 구매 목록 패널 ── */
function buildMyItemsPanel(){
  // myPurchases에서 qty > 0 (usedQty 차감 후)인 것만 표시
  const activeItems = myPurchases.filter(p => {
    const remaining = shopPurchaseRemaining(p);
    return remaining > 0;
  });
  if(activeItems.length === 0){
    return '<div class="empty-state"><span class="empty-icon">🎒</span>구매한 상품이 없어요<br>🏪 상품 탭에서 물건을 구매해보세요!</div>';
  }
  return '<div class="shop-grid">' + activeItems.map(p => {
    const remaining = shopPurchaseRemaining(p);
    const totalOwned = shopPurchaseQty(p);
    const usedCount = shopPurchaseUsedQty(p);
    const item = shopItemForPurchase(p);
    const needsApproval = shopItemNeedsApproval(item);
    const pendingReq = (purchaseLogs||[]).filter(l=>String(l.type||'')==='shop_use_request'
      && String(l.purchaseId||l.meta?.purchaseId||'')===String(p.id||'')
      && String(l.approval?.status || l.status || 'pending')==='pending').length;
    const useBtn = needsApproval
      ? '<button onclick="requestUseMyItem(\'' + (p.id||'') + '\',1)" style="flex:1;padding:8px;background:var(--pesk);color:#fff;border:none;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer;">사용 승인 요청</button>'
        + (remaining > 1 ? '<button onclick="requestUseMyItem(\'' + (p.id||'') + '\',' + remaining + ')" style="padding:8px 14px;background:#fef3c7;color:#92400e;border:1px solid #fde68a;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer;">전체 요청</button>' : '')
      : '<button onclick="useMyItem(\'' + (p.id||'') + '\',1)" style="flex:1;padding:8px;background:var(--pesk);color:#fff;border:none;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer;">🎫 1개 사용하기</button>'
        + (remaining > 1 ? '<button onclick="useMyItem(\'' + (p.id||'') + '\',' + remaining + ')" style="padding:8px 14px;background:#fef3c7;color:#92400e;border:1px solid #fde68a;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer;">전체 사용</button>' : '');
    return '<div style="border:1.5px solid #e5e7eb;border-radius:12px;padding:14px;margin-bottom:10px;background:#fff;">'
      + '<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">'
      + '<div style="font-size:28px;">' + (p.icon || '📦') + '</div>'
      + '<div style="flex:1;">'
      + '<div style="font-weight:700;font-size:14px;">' + escHtml(p.itemName || p.name || '상품') + '</div>'
      + '<div style="font-size:11px;color:var(--sub);">구매일: ' + (p.date || '-') + '</div>'
      + (needsApproval ? '<div style="font-size:10px;color:var(--coral);font-weight:800;margin-top:2px;">사용 시 승인 필요' + (pendingReq ? ' · 대기 ' + pendingReq + '건' : '') + '</div>' : '')
      + '</div>'
      + '<div style="text-align:right;">'
      + '<div style="font-size:13px;font-weight:800;color:var(--pesk);">남은 수량</div>'
      + '<div style="font-size:20px;font-weight:900;color:var(--text);">' + remaining + '<span style="font-size:12px;color:var(--sub);">/' + totalOwned + '</span></div>'
      + '</div>'
      + '</div>'
      // 진행바
      + '<div style="background:#f3f4f6;border-radius:99px;height:6px;overflow:hidden;margin-bottom:10px;">'
      + '<div style="width:' + Math.round(remaining/totalOwned*100) + '%;height:100%;background:var(--pesk);border-radius:99px;"></div>'
      + '</div>'
      // 사용하기 버튼
      + '<div style="display:flex;gap:6px;">'
      + useBtn
      + '</div>'
      + (usedCount > 0 ? '<div style="font-size:10px;color:var(--sub);margin-top:6px;text-align:right;">사용 완료: ' + usedCount + '개</div>' : '')
      + '</div>';
  }).join('') + '</div>';
}

function requestUseMyItem(...args){return economyOnce('shop-request',()=>_requestUseMyItem(...args));}
async function _requestUseMyItem(purchId, useQty){
  if(!(await ensureActiveStudentSession(false))) return;
  if(economyBlocked('shop')) return economyBlockedNotice('shop');
  useQty=Number(useQty);
  if(!Number.isInteger(useQty) || useQty <= 0){ alert('사용 수량이 올바르지 않아요.'); return; }
  const p = myPurchases.find(x=>x.id===purchId);
  if(!p){ alert('상품을 찾을 수 없어요.'); return; }
  const remaining = shopPurchaseRemaining(p);
  if(useQty > remaining){ alert('남은 수량이 부족해요.'); return; }
  const pendingQty = (purchaseLogs||[]).filter(l=>String(l.type||'')==='shop_use_request'
    && String(l.purchaseId||l.meta?.purchaseId||'')===String(purchId)
    && String(l.approval?.status || l.status || 'pending')==='pending')
    .reduce((sum,l)=>sum + Number(l.qty || l.meta?.qty || 1), 0);
  if(pendingQty + useQty > remaining){
    alert('이미 승인 대기 중인 수량이 있어서 남은 수량을 초과해요.');
    return;
  }
  const item = shopItemForPurchase(p);
  if(!shopItemNeedsApproval(item)){
    return useMyItem(purchId, useQty);
  }
  const itemName = p.itemName || p.name || '상품';
  if(!confirm('"' + itemName + '" ' + useQty + '개 사용 승인을 요청할까요?')) return;
  try{
    const reqId = uid();
    const request={
      id:reqId,studentNum:myStudentNum,studentName:myStudentName,accountUid:myAccountUid,
      type:'shop_use_request',
      detail:`${itemName} 사용 승인 요청`,
      itemId:item?.id || p.itemId || '',
      purchaseId:purchId,
      itemName,
      icon:p.icon || item?.icon || '📦',
      qty:useQty,
      approval:{status:'pending'},
      status:'pending',
      date:new Date().toLocaleString('ko-KR'),
      timestamp:Date.now(),
      meta:{itemId:item?.id || p.itemId || '', purchaseId:purchId, itemName, qty:useQty}
    };
    const ref=key=>window._fsDoc(window._db,'classrooms',roomId,'data',key);
    await window._fsRunTxn(window._db,async txn=>{
      const [ps,ls]=await Promise.all([txn.get(ref('pesk-purchases')),txn.get(ref('pesk-purchase-log'))]);
      const latest=(ps.exists()?ps.data().value||[]:[]).find(x=>x.id===purchId&&recordBelongsToMe(x));
      if(!latest)throw new Error('구매 기록을 찾지 못했어요.');
      const logs=ls.exists()?ls.data().value||[]:[];
      const reserved=logs.filter(l=>l.type==='shop_use_request'&&String(l.purchaseId||l.meta?.purchaseId||'')===String(purchId)&&String(l.approval?.status||l.status||'pending')==='pending').reduce((n,l)=>n+Number(l.qty||l.meta?.qty||1),0);
      if(reserved+useQty>shopPurchaseRemaining(latest))throw new Error('남은 수량 또는 승인 대기 수량을 다시 확인해주세요.');
      logs.push(request);_trimLogsToByteLimit(logs);
      txn.set(ref('pesk-purchase-log'),{value:logs,updatedAt:new Date().toISOString()});
    });
    purchaseLogs.unshift({
      id:reqId,type:'shop_use_request',studentNum:myStudentNum,studentName:myStudentName,accountUid:myAccountUid,
      itemId:item?.id || p.itemId || '',purchaseId:purchId,itemName,icon:p.icon || item?.icon || '📦',qty:useQty,
      approval:{status:'pending'},status:'pending',ts:Date.now(),date:new Date().toLocaleString('ko-KR')
    });
    addNotif('✅ "' + itemName + '" 사용 승인 요청 완료');
    showFeedbackNotice('✅ 사용 승인 요청을 보냈어요.');
    const panel = document.getElementById('panel-shop');
    if(panel) panel.innerHTML = buildShopPanel(getMyStudent());
  }catch(e){
    alert('승인 요청 실패: ' + e.message);
  }
}

/* ── 구매 상품 사용하기 ── */
async function _useMyItem(purchId, useQty){
  if(!(await ensureActiveStudentSession(false))) return;
  if(economyBlocked('shop')) return economyBlockedNotice('shop');
  useQty=Number(useQty);
  if(!Number.isInteger(useQty) || useQty <= 0){ alert('사용 수량이 올바르지 않아요.'); return; }
  const pIdx = myPurchases.findIndex(p => p.id === purchId);
  if(pIdx < 0){ alert('상품을 찾을 수 없어요.'); return; }
  const p = myPurchases[pIdx];
  if(shopItemNeedsApproval(shopItemForPurchase(p))) return requestUseMyItem(purchId, useQty);
  const remaining = shopPurchaseRemaining(p);
  if(useQty > remaining){ alert('남은 수량이 부족해요.'); return; }
  const itemName = p.itemName || p.name || '상품';
  if(!confirm('"' + itemName + '" ' + useQty + '개를 사용할까요?\n사용하면 되돌릴 수 없어요.')) return;

  try {
    const db = window._db;
    const purchRoomId = localStorage.getItem('pesk-room-id');
    if(!window._fsRunTxn) throw new Error('TRANSACTION_UNAVAILABLE');
    const purchasesRef = window._fsDoc(db,'classrooms',purchRoomId,'data','pesk-purchases');
    const logRef = window._fsDoc(db,'classrooms',purchRoomId,'data','pesk-purchase-log');
    const notifRef = window._fsDoc(db,'classrooms',purchRoomId,'data','tesk-teacher-notif');
    const useShopRef=window._fsDoc(db,'classrooms',purchRoomId,'data','tesk-shop');
    let txResult = null;

    await window._fsRunTxn(db, async (txn)=>{
      const purchSnap = await txn.get(purchasesRef);
      const logSnap = await txn.get(logRef);
      const notifSnap = await txn.get(notifRef);
      const useShopSnap=await txn.get(useShopRef);
      const allPurch = purchSnap.exists() ? (purchSnap.data().value || []) : [];
      const globalIdx = allPurch.findIndex(pp => pp.id === purchId && recordBelongsToMe(pp));
      if(globalIdx < 0) throw new Error('PURCHASE_NOT_FOUND');

      const latest = allPurch[globalIdx];
      const latestItem=(useShopSnap.exists()?useShopSnap.data().value||[]:[]).find(x=>String(x.id)===String(latest.itemId));
      if(shopItemNeedsApproval(latestItem))throw new Error('APPROVAL_REQUIRED');
      const reserved=(logSnap.exists()?logSnap.data().value||[]:[]).filter(l=>l.type==='shop_use_request'&&String(l.purchaseId||l.meta?.purchaseId||'')===String(purchId)&&String(l.approval?.status||l.status||'pending')==='pending').reduce((n,l)=>n+Number(l.qty||l.meta?.qty||1),0);
      const latestRemaining=Math.max(0,shopPurchaseRemaining(latest)-reserved);
      if(useQty > latestRemaining) throw new Error('INSUFFICIENT_ITEM_QTY:' + latestRemaining);

      latest.usedQty = shopPurchaseUsedQty(latest) + useQty;
      if(latest.usedQty >= shopPurchaseQty(latest)){
        latest.status = 'used_all';
      }

      const logs = logSnap.exists() ? (logSnap.data().value || []) : [];
      logs.push({
        id: uid(), type: 'use',
        studentNum: myStudentNum, studentName: myStudentName, accountUid: myAccountUid,
        itemName: latest.itemName || latest.name || itemName, icon: latest.icon || p.icon || '📦', qty: useQty,
        date: new Date().toLocaleString('ko-KR'), timestamp: Date.now()
      });
      if(logs.length > 500) logs.splice(0, logs.length - 500);
      _trimLogsToByteLimit(logs);

      // 교사 알림: 승인 없이 바로 사용한 상품도 교사가 알 수 있게 기록
      const notifs = notifSnap.exists() ? (notifSnap.data().value || []) : [];
      notifs.unshift({
        id: uid(), type: 'item-used',
        msg: myStudentName + '(' + myStudentNum + '번)이(가) "' + (latest.itemName || latest.name || itemName) + '" ' + useQty + '개를 사용했어요',
        date: new Date().toLocaleString('ko-KR'),
        read: false
      });
      if(notifs.length > 100) notifs.length = 100;

      const updatedAt = new Date().toISOString();
      txn.set(purchasesRef, { value: allPurch, updatedAt });
      txn.set(logRef, { value: logs, updatedAt });
      txn.set(notifRef, { value: notifs, updatedAt });
      txResult = { allPurch, updatedPurchase: {...latest} };
    });

    await economyAfterCommit(async()=>{
    // 로컬 반영
    myPurchases = (txResult?.allPurch || myPurchases).filter(recordBelongsToMe);
    addTxn('"' + itemName + '" ' + useQty + '개 사용', 0, 'spend');
    addNotif('🎫 "' + itemName + '" ' + useQty + '개 사용 완료!');
    showFeedbackNotice('✅ "' + itemName + '" 사용 완료!');

    // UI 갱신 (상점 패널 + 은행 패널의 구매 목록 모두)
    const me = students.find(s=>s.num===myStudentNum);
    const panel = document.getElementById('panel-shop');
    if(panel) panel.innerHTML = buildShopPanel(me);
    const bankPanel = document.getElementById('panel-stock');
    if(bankPanel) bankPanel.innerHTML = buildBankPanel(me);
    });
  } catch(e) {
    const msg = String(e?.message || '');
    if(msg==='APPROVAL_REQUIRED'){alert('이 상품은 사용 승인이 필요해요. 새로고침 후 승인 요청을 해주세요.');return;}
    if(msg === 'PURCHASE_NOT_FOUND'){
      alert('구매 기록을 찾을 수 없어요. 화면을 새로고침해 주세요.');
      return;
    }
    if(msg.startsWith('INSUFFICIENT_ITEM_QTY:')){
      const latestRemaining = Number(msg.split(':')[1] || 0);
      alert('남은 수량이 부족해요.\n현재 남은 수량: ' + latestRemaining + '개');
      return;
    }
    if(msg === 'TRANSACTION_UNAVAILABLE'){
      alert('거래 처리 기능을 불러오지 못했어요. 잠시 후 다시 시도해주세요.');
      return;
    }
    alert('사용 실패: ' + e.message);
  }
}

function buildShopApprovalPanel(){
  const rows = pendingShopUseRequestsForMe();
  if(!canApproveShopUse()){
    return '<div class="empty-state"><span class="empty-icon">🔒</span>승인 권한이 없어요<br>선생님이 상품별 승인 직업을 배정하면 사용할 수 있어요.</div>';
  }
  if(rows.length===0){
    return '<div class="empty-state"><span class="empty-icon">✅</span>대기 중인 사용 요청이 없어요</div>';
  }
  return rows.map(r=>{
    const qty = Number(r.qty || r.meta?.qty || 1);
    return '<div style="border:1.5px solid #e5e7eb;border-radius:12px;padding:14px;margin-bottom:10px;background:#fff;">'
      + '<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">'
      + '<div style="font-size:28px;">' + (r.icon || '📦') + '</div>'
      + '<div style="flex:1;">'
      + '<div style="font-weight:800;font-size:14px;">' + escHtml(r.itemName || r.meta?.itemName || '상품') + ' × ' + qty + '</div>'
      + '<div style="font-size:11px;color:var(--sub);">' + escHtml(r.studentName||'학생') + '(' + (r.studentNum||'-') + '번) · ' + (r.date || (r.createdAt ? new Date(r.createdAt).toLocaleString('ko-KR') : '')) + '</div>'
      + '</div></div>'
      + '<div style="display:flex;gap:6px;">'
      + '<button onclick="approveShopUseRequest(\'' + escHtml(r.id) + '\',true)" style="flex:1;padding:8px;background:var(--pesk);color:#fff;border:none;border-radius:8px;font-weight:800;font-size:12px;cursor:pointer;">승인</button>'
      + '<button onclick="approveShopUseRequest(\'' + escHtml(r.id) + '\',false)" style="padding:8px 14px;background:#fee2e2;color:#b91c1c;border:1px solid #fecaca;border-radius:8px;font-weight:800;font-size:12px;cursor:pointer;">반려</button>'
      + '</div></div>';
  }).join('');
}

async function approveShopUseRequest(requestId, approved){
  if(!(await ensureActiveStudentSession(false))) return;
  const req = (purchaseLogs||[]).find(l=>String(l.id)===String(requestId));
  if(!req){ alert('요청을 찾을 수 없어요.'); return; }
  const itemId = String(req.itemId || req.meta?.itemId || '');
  const item = shopItems.find(i=>String(i.id||'')===itemId) || shopItems.find(i=>String(i.name||'')===String(req.itemName||req.meta?.itemName||''));
  if(!item || !myShopApprovalItemIds().has(String(item.id||''))){
    alert('이 상품을 승인할 권한이 없어요.');
    return;
  }
  if(Number(req.studentNum || 0) === Number(myStudentNum) || (myAccountUid && String(req.accountUid || '') === myAccountUid)){
    alert('자신의 사용 요청은 직접 승인할 수 없어요. 다른 승인자나 선생님에게 요청하세요.');
    return;
  }
  const itemName = req.itemName || req.meta?.itemName || '상품';
  if(!confirm('"' + itemName + '" 사용 요청을 ' + (approved?'승인':'반려') + '할까요?')) return;
  try{
    const db = window._db;
    const purchasesRef = window._fsDoc(db,'classrooms',roomId,'data','pesk-purchases');
    const logRef = window._fsDoc(db,'classrooms',roomId,'data','pesk-purchase-log');
    const notifRef = window._fsDoc(db,'classrooms',roomId,'data','tesk-teacher-notif');
    let nextLogs = null;
    let nextPurch = null;
    await window._fsRunTxn(db, async (txn)=>{
      const [purchSnap, logSnap, notifSnap] = await Promise.all([txn.get(purchasesRef), txn.get(logRef), txn.get(notifRef)]);
      const allPurch = purchSnap.exists() ? (purchSnap.data().value || []) : [];
      const logs = logSnap.exists() ? (logSnap.data().value || []) : [];
      const idx = logs.findIndex(l=>String(l.id)===String(requestId));
      if(idx < 0) throw new Error('REQUEST_NOT_FOUND');
      const curStatus = String(logs[idx].approval?.status || logs[idx].status || 'pending');
      if(curStatus !== 'pending') throw new Error('ALREADY_HANDLED');
      logs[idx].approval = {
        ...(logs[idx].approval||{}),
        status: approved ? 'approved' : 'rejected',
        approverNum: myStudentNum,
        approverName: myStudentName,
        approverAccountUid: myAccountUid,
        decidedAt: new Date().toISOString()
      };
      logs[idx].status = approved ? 'approved' : 'rejected';
      if(approved){
        const purchId = String(logs[idx].purchaseId || logs[idx].meta?.purchaseId || '');
        const useQty = Number(logs[idx].qty || logs[idx].meta?.qty || 1);
        const ownerNum = Number(logs[idx].studentNum || 0);
        const ownerUid = String(logs[idx].accountUid || '');
        const pIdx = allPurch.findIndex(p=>String(p.id||'')===purchId
          && (Number(p.studentNum||0)===ownerNum || (ownerUid && String(p.accountUid||'')===ownerUid)));
        if(pIdx < 0) throw new Error('PURCHASE_NOT_FOUND');
        const latest = allPurch[pIdx];
        const latestRemaining = shopPurchaseRemaining(latest);
        if(useQty > latestRemaining) throw new Error('INSUFFICIENT_ITEM_QTY:' + latestRemaining);
        latest.usedQty = shopPurchaseUsedQty(latest) + useQty;
        if(latest.usedQty >= shopPurchaseQty(latest)) latest.status = 'used_all';
        logs.push({
          id: uid(), type: 'shop_use_approved',
          studentNum: logs[idx].studentNum, studentName: logs[idx].studentName, accountUid: logs[idx].accountUid,
          actor:'student-approver', approverNum:myStudentNum, approverName:myStudentName,
          itemId:item?.id || itemId, purchaseId:purchId, itemName, icon:logs[idx].icon || item?.icon || '📦',
          qty:useQty,
          date:new Date().toLocaleString('ko-KR'), timestamp:Date.now(), ts:Date.now(), createdAt:new Date().toISOString()
        });
      }
      const notifs = notifSnap.exists() ? (notifSnap.data().value || []) : [];
      notifs.unshift({
        id:uid(), type: approved ? 'item-use-approved' : 'item-use-rejected',
        msg:(logs[idx].studentName||'학생') + '의 "' + itemName + '" 사용 요청 ' + (approved?'승인':'반려') + ' - ' + myStudentName,
        date:new Date().toLocaleString('ko-KR'),
        read:false
      });
      if(notifs.length > 100) notifs.length = 100;
      if(logs.length > 2000) logs.splice(0, logs.length - 2000);
      _trimLogsToByteLimit(logs);
      txn.set(purchasesRef,{value:allPurch,updatedAt:new Date().toISOString()});
      txn.set(logRef,{value:logs,updatedAt:new Date().toISOString()});
      txn.set(notifRef,{value:notifs,updatedAt:new Date().toISOString()});
      nextLogs = logs;
      nextPurch = allPurch;
    });
    purchaseLogs = nextLogs || purchaseLogs;
    myPurchases = (nextPurch || myPurchases).filter(recordBelongsToMe);
    showFeedbackNotice(approved ? '✅ 사용 요청을 승인했어요.' : '반려했어요.');
    const panel = document.getElementById('panel-shop');
    if(panel) panel.innerHTML = buildShopPanel(getMyStudent());
  }catch(e){
    const msg=String(e?.message||'');
    if(msg==='REQUEST_NOT_FOUND') return alert('요청을 찾을 수 없어요.');
    if(msg==='ALREADY_HANDLED') return alert('이미 처리된 요청이에요.');
    if(msg==='PURCHASE_NOT_FOUND') return alert('구매 기록을 찾을 수 없어서 승인할 수 없어요.');
    if(msg.startsWith('INSUFFICIENT_ITEM_QTY:')){
      const latestRemaining = Number(msg.split(':')[1] || 0);
      return alert('남은 수량이 부족해서 승인할 수 없어요.\n현재 남은 수량: ' + latestRemaining + '개');
    }
    alert('승인 처리 실패: ' + e.message);
  }
}

      ? '<button class="w-del-btn" onclick="deletePeskWriting(\'' + escHtml(w.id) + '\')">🗑️ 삭제</button>'
      : '';
    // '제목까지' 모드에서는 접는 순간 제목까지 사라지므로 안내 문구도 '숨기기'로 바꿔준다
    const foldWord = collapsed ? '펼치기' : (writingFoldHideTitle ? '숨기기' : '접어두기');
    const header = '<div style="cursor:pointer;" title="' + foldWord + '"'
      + ' onclick="toggleWritingCollapse(\'' + escHtml(w.id) + '\')">'
      + '<div class="w-title">' + (collapsed ? '▸ ' : '▾ ') + escHtml(w.title)
      + '<span class="w-fold-hint">' + foldWord + '</span></div>'
      + '<div class="w-meta">'
      + '<span>' + (w.date||'') + '</span>'
      + (String(w.topic||'').trim() ? '<span class="w-topic-badge">📌 ' + escHtml(w.topic) + '</span>' : '')
      + '<span class="status-badge ' + (hasFeedback||isRead?'reviewed':'pending') + '">' + (hasFeedback?'✅ 피드백 완료':(isRead?'👁️ 선생님 읽음':'⏳ 검토 중')) + '</span>'
      + (w.updatedAt && canEdit ? '<span>수정됨</span>' : '')
      + '</div>'
      + '</div>';
    if(collapsed){
      return '<div class="writing-item">' + header + '</div>';
    }
    return '<div class="writing-item">'
      + header
      + (!hasFeedback
        ? '<div style="margin-top:8px;font-size:12px;line-height:1.7;white-space:pre-wrap;color:var(--text);background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px;">' + escHtml(w.content||'') + '</div>'
          + (canEdit
            ? '<div class="w-btn-row">'
              + '<button class="pesk-btn secondary" style="margin-top:8px;width:auto;padding:8px 12px;font-size:12px;" onclick="startEditWriting(\'' + escHtml(w.id) + '\')">✏️ 고쳐 쓰기</button>'
              + delBtn + '</div>'

        : '')
      + (hasFeedback
        ? '<div class="w-feedback" style="cursor:pointer;" onclick="toggleWritingContent(\'' + escHtml(w.id) + '\')">'
          + '<div class="fb-label">💬 선생님 피드백</div>'
          + '<div class="fb-text">' + escHtml(w.feedback) + '</div>'
          + (w.learningGoal ? '<p><b>이번에 고쳐 볼 한 가지</b><br>'+escHtml(w.learningGoal)+'</p>' : '')
          + (w.needsRevisionReview ? '<p>고쳐 쓴 글을 선생님이 다시 확인할 예정이에요. 위 피드백은 이전 글에 대한 내용이에요.</p>' : '')
          + '<div style="font-size:10px;color:var(--sub);margin-top:4px;">' + (w.feedbackDate||'') + ' · 클릭하면 내가 쓴 글 보기</div>'
          + '</div>'
          + (expanded
            ? '<div style="margin-top:8px;padding:10px;border-radius:10px;background:#f8fafc;border:1px solid #e2e8f0;">'
              + '<div style="font-size:11px;font-weight:800;color:var(--sub);margin-bottom:6px;">📝 내가 제출한 글</div>'
              + '<div style="font-size:12px;line-height:1.8;white-space:pre-wrap;color:var(--text);">' + escHtml(w.content||'') + '</div>'
              + '</div>'

/* ── ✍️ 일일 글쓰기 의무 ──
   선생님이 켜두면, 마감 시각이 지난 글쓰기 요일에 글을 안 낸 것이 연속으로 쌓인다.
   첫 번째 미제출은 경고만 하고, 정해진 횟수(기본 2회)부터 매점 이용이 잠긴다.
   · 요일표(오늘 할 일)의 글쓰기 요일만 센다. 기본은 평일. 아파서 하루 빠진 정도로 바로 잠기지 않게 하기 위함.
   · 잠겨도 펫 밥·놀기·씻기는 무료라 그대로 된다 (이중 처벌 방지).
   · 글을 내면 그 순간 연속 기록이 0이 되어 바로 풀린다. */
let writingDuty = null;
/* 🧒 오늘 할 일 요일표 — 교사가 체크한 요일에만 홈 '오늘 할 일'에 띄운다.
   체크가 없는 날도 탭에서는 자유롭게 할 수 있다. 저장한 적 없는 학급은 예전과 같은 기본값. */
let todoSchedule = window.TodoSchedule ? TodoSchedule.normalize(null) : null;
function _applyTodoSchedule(raw){ if(window.TodoSchedule) todoSchedule = TodoSchedule.normalize(raw); }
function todoOn(id, date){
  if(!todoSchedule) return id === 'writing' ? ![0,6].includes((date||new Date()).getDay()) : true;
  return TodoSchedule.isOn(todoSchedule, id, date || new Date());
}
function _applyWritingDuty(raw){
  const d = (raw && typeof raw === 'object') ? raw : null;
  // 0시 마감이 유효하므로 `|| 기본값` 금지 (0 이 falsy 라 기본값으로 튕긴다)
  const num = (v, dflt) => Number.isFinite(Number(v)) ? Number(v) : dflt;
  writingDuty = d && d.enabled === true ? {
    enabled: true,
    deadlineHour: Math.min(23, Math.max(0, num(d.deadlineHour, 17))),
    lockAfter: Math.min(10, Math.max(1, num(d.lockAfter, 2))),
    exempt: Array.isArray(d.exempt) ? d.exempt.map(Number).filter(Number.isFinite) : []
  } : null;
}
function _writingDayKey(w){
  const iso = String(w?.submittedAt || '').trim();
  if(iso){
    const d = new Date(iso);
    if(!Number.isNaN(d.getTime()))
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  return '';
}
/* 연속 미제출 평일 수 */
function writingMissStreak(){
  if(!writingDuty) return 0;
  const submitted = new Set((peskWritings||[]).map(_writingDayKey).filter(Boolean));
  const now = new Date();
  let streak = 0;
  const cur = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  // 오늘은 마감 시각이 지나야 '미제출'로 친다
  if(now.getHours() < writingDuty.deadlineHour) cur.setDate(cur.getDate() - 1);
  for(let i = 0; i < 30; i++){
    if(todoOn('writing', cur)){          // 요일표의 글쓰기 요일만
      const key = cur.getFullYear() + '-' + String(cur.getMonth()+1).padStart(2,'0') + '-' + String(cur.getDate()).padStart(2,'0');
      if(submitted.has(key)) break;
      streak++;
      if(streak >= writingDuty.lockAfter + 3) break;   // 충분히 셌으면 그만
    }
    cur.setDate(cur.getDate() - 1);
  }
  return streak;
}
function writingDutyState(){
  if(!writingDuty) return {on:false, streak:0, locked:false, exempt:false, lockAfter:0};
  const exempt = writingDuty.exempt.includes(Number(myStudentNum));
  const streak = exempt ? 0 : writingMissStreak();
  return {on:true, streak, locked: !exempt && streak >= writingDuty.lockAfter,
          exempt, lockAfter: writingDuty.lockAfter, deadlineHour: writingDuty.deadlineHour};
}
function writingDutyLocked(){ return writingDutyState().locked; }
function buildWritingDutyBanner(){
  const st = writingDutyState();
  if(!st.on || st.streak <= 0) return '';
  if(st.locked)
    return '<div class="w-duty lock">🔒 <b>글쓰기를 ' + st.streak + '일 연속 안 냈어요.</b>'
      + '<br>매점 이용이 잠겨 있어요. <b>오늘 글을 내면 바로 풀려요.</b></div>';
  const left = st.lockAfter - st.streak;
  return '<div class="w-duty warn">⚠️ <b>어제 글쓰기를 안 냈어요.</b>'
    + '<br>' + left + '번 더 안 내면 매점 이용이 잠겨요. 오늘 꼭 써봐요!</div>';
}

/* ── 📌 오늘의 글쓰기 주제 ──
   선생님이 교사앱에서 정한 주제를 보여준다. 주제가 있어도 자유 글쓰기는 그대로 되고,
   '이 주제로 쓰기'를 누르면 제목이 주제로 채워진 채 폼이 열린다. */
function _applyWritingTopic(raw){
  const t = (raw && typeof raw === 'object') ? raw : null;
  writingTopic = (t && t.active !== false && String(t.title||'').trim())
    ? {title: String(t.title).trim(), guide: String(t.guide||'').trim(), updatedAt: t.updatedAt || ''}
    : null;
}
/* 이 주제로 이미 낸 글이 있는지 — 같은 주제를 두 번 쓰라고 재촉하지 않기 위해 */
function _wroteThisTopic(){
  if(!writingTopic) return false;
  return peskWritings.some(w => String(w.topic||'').trim() === writingTopic.title);
}
function buildWritingTopicCard(){
  if(!writingTopic) return '';
  const done = _wroteThisTopic();
  return '<div class="w-topic' + (done ? ' done' : '') + '">'
    + '<div class="w-topic-head"><span class="w-topic-tag">📌 선생님이 낸 주제</span>'
    + (done ? '<span class="w-topic-done">✅ 제출 완료</span>' : '') + '</div>'
    + '<div class="w-topic-title">' + escHtml(writingTopic.title) + '</div>'
    + (writingTopic.guide ? '<div class="w-topic-guide">' + escHtml(writingTopic.guide) + '</div>' : '')
    + '<button class="w-topic-go" onclick="startTopicWriting()">'
    + (done ? '이 주제로 한 번 더 쓰기' : '이 주제로 쓰기 ✍️') + '</button>'
    + '</div>';
}
/* 주제를 제목으로 채워 새 글 폼 열기 */
function startTopicWriting(){
  if(!writingTopic) return;
  const hasDraft = (writingDraft.title||writingDraft.content||'').trim();

}

/* ── 📚 우리 반 글 모음집 ──
   선생님이 고른 글이 실린다. 모음집 정보는 글 문서의 anthology 필드에 있고,
   학생은 '학생 확인' 요청이 온 자기 글의 맞춤법 제안을 하나씩 고른 뒤 싣는다. */
function anthologyFrom(all){
  return (all || []).filter(w => w && w.anthology?.status === 'published' && !w.deleted)
    .sort((a, b) => String(b.anthology.publishedAt || '').localeCompare(String(a.anthology.publishedAt || '')));
}
function anthologySignature(list){ return (list || []).map(w => w.id + ':' + (w.anthology?.publishedAt || '') + ':' + (w.anthology?.anonymous ? 1 : 0)).join('|'); }
let anthologyExpanded = {};
let anthologyShowAll = false;
function buildAnthologyRequestHtml(){
  const reqs = (peskWritings || []).filter(w => w.anthology?.status === 'student-review');
  return reqs.map(w => '<div class="anth-request">'
    + '<div class="anth-request-text">📚 <b>선생님이 「' + escHtml(w.title || '') + '」 글을 우리 반 글 모음집에 싣고 싶어 해요!</b>'
    + '<br>싣기 전에 맞춤법 제안 ' + (w.anthology.edits || []).length + '개를 같이 확인해 볼까요?</div>'
    + '<button class="pesk-btn primary" style="width:auto;margin:0;padding:9px 14px;font-size:13px;" onclick="openAnthologyReview(\'' + escHtml(w.id) + '\')">확인하기 ✏️</button>'
    + '</div>').join('');
}
function buildAnthologyHtml(){
  const list = classAnthology || [];
  if(!list.length) return '';
  const shown = anthologyShowAll ? list : list.slice(0, 5);
  return '<div class="anth-section">'
    + '<div class="section-title" style="margin:0 0 10px;">📚 우리 반 글 모음집 <span style="font-size:12px;color:var(--sub);font-weight:600;">' + list.length + '편</span></div>'
    + shown.map(w => {
        const a = w.anthology, mine = recordBelongsToMe(w), open = !!anthologyExpanded[w.id];
        const text = String(a.text || w.content || '');
        const by = mine ? '내 글' : (a.anonymous ? '우리 반 친구' : (w.studentName || '우리 반 친구'));
        return '<div class="anth-item' + (mine ? ' mine' : '') + '" onclick="toggleAnthologyItem(\'' + escHtml(w.id) + '\')">'
          + '<div class="anth-item-head"><b>' + escHtml(a.title || w.title || '') + '</b><span>' + escHtml(by) + '</span></div>'
          + '<div class="anth-item-text' + (open ? ' open' : '') + '">' + escHtml(open ? text : text.slice(0, 80) + (text.length > 80 ? '…' : '')) + '</div>'
          + (text.length > 80 ? '<div class="anth-more">' + (open ? '접기 ▴' : '전체 읽기 ▾') + '</div>' : '')
          + '</div>';
      }).join('')
    + (list.length > 5 ? '<button class="pesk-btn secondary" style="margin-top:6px;" onclick="anthologyShowAll=!anthologyShowAll;refreshAnthologyArea()">' + (anthologyShowAll ? '접기' : list.length - 5 + '편 더 보기') + '</button>' : '')
    + '</div>';
}
function toggleAnthologyItem(id){ anthologyExpanded[id] = !anthologyExpanded[id]; refreshAnthologyArea(); }
function refreshAnthologyArea(){
  const a = document.getElementById('writing-anthology-area');
  if(a) a.innerHTML = buildAnthologyHtml();

/* 학생이 맞춤법 제안을 하나씩 고른다: 고칠래요(O) / 그대로 둘래요(X) */
let _anthReview = null;
function openAnthologyReview(id){
  const w = (peskWritings || []).find(x => x.id === id);
  if(!w || w.anthology?.status !== 'student-review') return alert('확인할 요청을 찾을 수 없어요. 화면을 새로고침해 주세요.');
  _anthReview = {id, choices:{}, busy:false};
  drawAnthologyReview();
}
function closeAnthologyReview(){ document.getElementById('anth-review')?.remove(); _anthReview = null; }
function drawAnthologyReview(){
  const st = _anthReview; if(!st) return;
  const w = (peskWritings || []).find(x => x.id === st.id);
  if(!w || w.anthology?.status !== 'student-review'){ closeAnthologyReview(); return; }
  const edits = w.anthology.edits || [];
  const decided = edits.filter(e => st.choices[e.id] !== undefined).length;
  const P = window.WritingProofread;
  const segs = P ? P.segments(w.content, edits).map(s => s.text !== undefined ? escHtml(s.text)
    : '<span class="anth-mark' + (st.choices[s.edit.id] === true ? ' yes' : st.choices[s.edit.id] === false ? ' no' : '') + '">'
      + (st.choices[s.edit.id] === true ? escHtml(s.edit.to) : escHtml(s.edit.from)) + '</span>').join('') : escHtml(w.content);
  let box = document.getElementById('anth-review');
  if(!box){
    box = document.createElement('div'); box.id = 'anth-review'; box.className = 'anth-review';
    box.setAttribute('role', 'dialog'); box.setAttribute('aria-modal', 'true'); box.setAttribute('aria-label', '모음집 맞춤법 확인');
    document.body.appendChild(box);
  }
  box.innerHTML = '<div class="anth-review-box">'
    + '<div class="anth-review-head"><b>📚 「' + escHtml(w.title || '') + '」 맞춤법 확인</b><button onclick="closeAnthologyReview()" aria-label="닫기">✕</button></div>'
    + '<p class="anth-review-help">선생님과 AI가 찾은 고칠 곳이에요. 하나씩 보고 <b>고칠래요</b> 또는 <b>그대로 둘래요</b>를 골라 주세요. (' + decided + ' / ' + edits.length + ')</p>'
    + '<ol class="anth-review-list">' + edits.map((e, i) =>
        '<li><div class="anth-fix"><span class="from">' + escHtml(e.from) + '</span> → <span class="to">' + escHtml(e.to) + '</span>'
        + (e.reason ? '<small>' + escHtml(e.reason) + '</small>' : '') + '</div>'
        + '<div class="anth-choice"><button class="' + (st.choices[e.id] === true ? 'on yes' : '') + '" onclick="chooseAnthologyEdit(\'' + e.id + '\',true)">⭕ 고칠래요</button>'
        + '<button class="' + (st.choices[e.id] === false ? 'on no' : '') + '" onclick="chooseAnthologyEdit(\'' + e.id + '\',false)">✖ 그대로 둘래요</button></div></li>').join('') + '</ol>'
    + '<div class="anth-review-preview"><div class="anth-review-label">모음집에 실릴 글 미리보기</div><div class="anth-review-text">' + segs + '</div></div>'
    + '<div class="anth-review-foot">'
    + '<button class="pesk-btn secondary" style="width:auto;margin:0;" onclick="declineAnthology()"' + (st.busy ? ' disabled' : '') + '>이 글은 싣지 않을래요</button>'
    + '<button class="pesk-btn primary" style="width:auto;margin:0;" onclick="submitAnthologyReview()"' + (decided < edits.length || st.busy ? ' disabled' : '') + '>'
    + (st.busy ? '저장 중…' : decided < edits.length ? (edits.length - decided) + '개 더 골라 주세요' : '📚 모음집에 싣기') + '</button>'
    + '</div></div>';
}
function chooseAnthologyEdit(eid, yes){ if(!_anthReview) return; _anthReview.choices[eid] = yes; drawAnthologyReview(); }
function _writingBasis(w){ return JSON.stringify([w.title || '', w.content || '', w.revision || 1]); }
async function _saveAnthologyChoice(make){
  const st = _anthReview; if(!st || st.busy) return;
  st.busy = true; drawAnthologyReview();
  try{
    if(!(await ensureActiveStudentSession(false))) return;
    const saved = await writingStore().update(st.id, cur => {
      if(!recordBelongsToMe(cur)) throw new Error('WRITING_NOT_FOUND');
      if(cur.anthology?.status !== 'student-review') throw new Error('ANTH_CHANGED');
      if(cur.anthology.basis && cur.anthology.basis !== _writingBasis(cur)) throw new Error('ANTH_STALE');
      return {...cur, anthology:make(cur)};
    });
    peskWritings = window.PeskWritings.merge(peskWritings, [saved]);
    if(saved.anthology?.status === 'published') classAnthology = anthologyFrom(window.PeskWritings.merge(classAnthology, [saved]));
    closeAnthologyReview();
    refreshWritingListOnly();
    return saved;
  }catch(e){
    const m = String(e?.message || '');
    alert(m === 'ANTH_STALE' ? '요청을 받은 뒤 글을 고쳐서 이 제안을 쓸 수 없어요. 선생님께 다시 요청해 달라고 말씀드려요.'
      : m === 'ANTH_CHANGED' ? '선생님이 요청을 바꾸셨어요. 화면을 새로고침해 주세요.'
      : '저장하지 못했어요. 잠시 후 다시 해 주세요. (' + m + ')');
  }finally{
    if(_anthReview){ _anthReview.busy = false; drawAnthologyReview(); }
  }
}
async function submitAnthologyReview(){
  const choices = {...(_anthReview?.choices || {})};
  const saved = await _saveAnthologyChoice(cur => {
    const edits = cur.anthology.edits || [];
    const accepted = edits.filter(e => choices[e.id] === true).map(e => e.id);
    return {...cur.anthology, status:'published', by:'student', studentChoices:choices, acceptedIds:accepted,
      title:cur.title, text:window.WritingProofread.apply(cur.content, edits, accepted), publishedAt:new Date().toISOString()};
  });
  if(saved) showFeedbackNotice('📚 우리 반 글 모음집에 실렸어요!');
}
async function declineAnthology(){
  if(!confirm('이 글은 모음집에 싣지 않을까요? 선생님께 알려 드려요.')) return;
  const saved = await _saveAnthologyChoice(cur => ({...cur.anthology, status:'declined', declinedAt:new Date().toISOString()}));
  if(saved) showFeedbackNotice('싣지 않기로 했어요.');
}

/* 잘못 쓴 글 지우기 — 선생님이 읽음 처리하기 전까지만 */
let _writingDeleting = false;
async function deletePeskWriting(id){
  if(_writingDeleting) return;
  const target = peskWritings.find(w=>w.id===id && recordBelongsToMe(w));
  if(!target) return alert('지울 글을 찾을 수 없어요.');
  if(String(target.readAt||'').trim() || target.status === 'read'){
    return alert('선생님이 이미 읽은 글은 지울 수 없어요.');
  }
  const warn = String(target.feedback||'').trim()
    ? '이 글에는 선생님 피드백이 달려 있어요. 지우면 피드백도 같이 사라져요.\n\n'
    : '';
  if(!confirm(warn + '"' + (target.title||'제목 없음') + '" 글을 지울까요?\n지운 글은 되돌릴 수 없어요.')) return;
  if(!(await ensureActiveStudentSession(false))) return;

  _writingDeleting = true;
  try{
    await writingStore().remove(id, current=>{
      if(!recordBelongsToMe(current)) throw new Error('WRITING_NOT_FOUND');
      // 저장 직전에 서버 기록으로 한 번 더 확인 — 그 사이 선생님이 읽었을 수 있다
      if(String(current.readAt||'').trim() || current.status === 'read') throw new Error('WRITING_ALREADY_REVIEWED');
    });

    peskWritings = peskWritings.filter(w=>w.id !== id);
    _myWritingSignature = getMyWritingSignature(peskWritings);
    delete expandedWritingIds[id];
    delete collapsedWritingIds[id];
    saveWritingCollapse();
    addTxn('글쓰기 삭제: ' + (target.title||''), 0, 'earn');
    // 지운 글을 고쳐 쓰던 중이었다면 폼도 함께 닫는다
    if(writingDraft.editId === id){
      resetWritingDraft(false);
      const panel = document.getElementById('panel-writing');
      if(panel) panel.innerHTML = buildWritingPanel();
    } else if(!refreshWritingListOnly()){
      const panel = document.getElementById('panel-writing');
      if(panel) panel.innerHTML = buildWritingPanel();
    }
    const btn = document.getElementById('writing-collapse-all-btn');
    if(btn) btn.textContent = _allWritingsCollapsed() ? '모두 펼치기' : '모두 접기';
    refreshChallengePanel();
    showFeedbackNotice('글을 지웠어요.');
  }catch(e){
    const msg = String(e?.message||'');
    if(msg === 'WRITING_ALREADY_REVIEWED') alert('선생님이 방금 읽음 처리해서 더 이상 지울 수 없어요.');
    else if(msg === 'WRITING_NOT_FOUND') alert('지울 글을 찾을 수 없어요. 화면을 새로고침한 뒤 다시 시도해주세요.');
    else alert('삭제 실패: ' + e.message);
  }finally{
    _writingDeleting = false;
  }
}

let _writingSubmitting = false;
function writingAfterCommit(action){
  try{ Promise.resolve(action()).catch(e=>console.warn('글 저장 후 부가 처리 실패',e)); }
  catch(e){ console.warn('글 저장 후 부가 처리 실패',e); }
}
async function submitPeskWriting(){
  if(_writingSubmitting) return;
  captureWritingDraftFromDom();
  const title = (writingDraft.title||'').trim();
  const content = (writingDraft.content||'').trim();
  if(!title || !content){ alert('제목과 내용을 모두 입력해주세요.'); return; }

  _writingSubmitting = true;
  const btn = document.querySelector('#writing-form-wrap .pesk-btn.primary');
  if(btn){ btn.textContent = '제출 중...'; btn.disabled = true; }

  let committed = false;
  try {
    if(!(await ensureActiveStudentSession(false))) return;
    const store = writingStore();
    const now = new Date();
    const editId = writingDraft.editId || '';
    let savedEntry = null;
    if(editId){
      savedEntry = await store.update(editId, current=>{
        if(!recordBelongsToMe(current)) throw new Error('WRITING_NOT_FOUND');
        // 최신 서버 기록을 합쳐 동시 읽음 처리·피드백·평가를 보존한다.
        return {
          ...current,
          title,
          content,
          status: current.status || 'pending',
          updatedAt: now.toISOString(),
          editCount: Number(current.editCount||0) + 1
        };
      });
    } else {
        // 선생님이 낸 주제로 쓴 글이면 표시해 둔다 (교사앱에서 주제별로 모아 보기 위해).
        // 주제 버튼으로 시작했거나, 제목을 주제 그대로 쓴 경우 둘 다 인정.
        const activeTopic = writingTopic ? writingTopic.title : '';
        const usedTopic = activeTopic && (writingDraft.topic === activeTopic || title === activeTopic)
          ? activeTopic : '';
        savedEntry = {
          id: store.newId(), studentNum: parseInt(myStudentNum), studentName: myStudentName, accountUid: myAccountUid,
          title, content, topic: usedTopic, date: now.toLocaleDateString('ko-KR'),
          submittedAt: now.toISOString(),
          status: 'pending', feedback: '', feedbackDate: '', readAt: ''
        };
        await store.add(savedEntry);
    }

    committed = true;
    // 실시간 구독이 먼저 같은 글을 받았어도 목록에는 한 번만 넣는다.
    peskWritings = window.PeskWritings.merge(peskWritings, [savedEntry]);
    _myWritingSignature = getMyWritingSignature(peskWritings);
    resetWritingDraft(false);
    // 제출 완료 후: 폼 입력값을 비우고 닫은 뒤, 리스트만 새로 그림
    const titleEl = document.getElementById('w-title-inp');
    if(titleEl) titleEl.value = '';
    const contentEl = document.getElementById('w-content-inp');
    if(contentEl) contentEl.value = '';
    const formWrap = document.getElementById('writing-form-wrap');
    if(formWrap) formWrap.style.display = 'none';
    writingAfterCommit(()=>{ if(!refreshWritingListOnly()){
      const panel = document.getElementById('panel-writing');
      if(panel) panel.innerHTML = buildWritingPanel();
    }});
    showFeedbackNotice(editId ? '글 수정이 저장됐어요.' : '글이 제출됐어요.');
    if(btn){ btn.textContent = '제출하기 📤'; btn.disabled = false; }
    if(!editId){
      writingAfterCommit(()=>addTxn('글쓰기 제출: ' + title, 0, 'earn'));
      writingAfterCommit(()=>petGrow('writing', 1));
      writingAfterCommit(()=>renderEconomyPanels(getMyStudent()));
      writingAfterCommit(()=>maybeAutoPayAutoChallenge('writing'));
    }
  } catch(e) {
    console.warn('글쓰기 처리 오류',e);
    if(committed){
      alert('글은 저장됐어요. 화면을 새로고침하면 확인할 수 있어요. 다시 제출하지 않아도 돼요.');
      return;
    }
    const msg = String(e?.message||'');
    if(msg === 'WRITING_NOT_FOUND'){
      alert('수정할 글을 찾을 수 없어요. 화면을 새로고침한 뒤 다시 시도해주세요.');
      if(btn){ btn.textContent = '제출하기 📤'; btn.disabled = false; }
      return;
    }
    alert('제출 실패: ' + e.message);
    if(btn){ btn.textContent = '제출하기 📤'; btn.disabled = false; }
  } finally {
    _writingSubmitting = false;
    if(btn){ btn.textContent = writingDraft.editId ? '수정 저장하기' : '제출하기 📤'; btn.disabled = false; }
  }
}

async function submitCounselRequest(){
  if(!(await ensureActiveStudentSession(false))) return;
  const reason = document.getElementById('counsel-reason-inp')?.value.trim();
  if(!reason){ alert('상담 신청 이유를 입력해주세요.'); return; }
  const urgencyEl = document.querySelector('input[name=counsel-urgency]:checked');
  const urgency = urgencyEl ? parseInt(urgencyEl.value) : 0;
  const urgencyLabels = ['보통','조금 급해요','많이 급해요'];

  const btn = document.querySelector('#counsel-sub-request .pesk-btn.primary');
  if(btn){ btn.textContent = '신청 중...'; btn.disabled = true; }

  try {
    const db = window._db;
    const ref = window._fsDoc(db,'classrooms',roomId,'data','tesk-counsel-requests');
    const newReq = {
      id: uid(), studentNum: myStudentNum, studentName: myStudentName, accountUid: myAccountUid,
      reason: reason + (urgency>0 ? ' ['+urgencyLabels[urgency]+']' : ''),
      date: new Date().toLocaleDateString('ko-KR'), status: 'pending'
    };
    // 트랜잭션으로 덧붙인다 — 그 사이 선생님이 읽음 처리한 신청을 옛 목록으로 덮어쓰지 않게
    await window._fsRunTxn(db, async txn=>{
      const snap = await txn.get(ref);
      const existing = snap.exists() && Array.isArray(snap.data().value) ? snap.data().value : [];
      txn.set(ref, { value: [...existing, newReq], updatedAt: new Date().toISOString() });
    });

    myPendingCounsel = true;
    const panel = document.getElementById('counsel-sub-request');
    if(panel) panel.innerHTML = buildCounselRequestPanel();
  } catch(e) {
    alert('신청 실패: ' + e.message);
    if(btn){ btn.textContent = '상담 신청하기 ✉️'; btn.disabled = false; }
  }
}

// 카테고리 선택 상태
let surveyPicks = Object.fromEntries(SURVEY_CATS.map(cat=>[cat.key,[]]));
let surveyReflection = {};
let surveyDistance = {};   // 마음거리 검사: {친구번호: 1~5}
let surveyEditing = false;

/* ── 마음거리 검사 ── 반 친구 한 명마다 1~5로 답합니다. 답하지 않은 친구는 '잘 몰라요'로 봅니다. */
const DISTANCE_LABELS = ['아주 멀어요','조금 멀어요','보통이에요','조금 가까워요','아주 가까워요'];
const DISTANCE_COLORS = ['#94a3b8','#a5b4fc','#818cf8','#6366f1','#4338ca'];
function buildDistanceSection(otherStudents){
  const answered = otherStudents.filter(s=>surveyDistance[s.num]).length;
  return '<div class="survey-cat-section" style="border-color:#c7d2fe;">'
    + '<div class="survey-cat-header"><span class="survey-cat-emoji">💞</span><span class="survey-cat-title" style="color:#4338ca;">마음거리</span>'
    + '<span class="survey-cat-counter" id="distance-counter" style="background:#eef2ff;color:#4338ca;">' + answered + '/' + otherStudents.length + '</span></div>'
    + '<div class="survey-cat-q">지금 이 친구와 나의 마음 거리는 어느 정도인가요? 친구마다 하나씩 골라 주세요. 잘 모르는 친구는 비워 두어도 괜찮아요.</div>'
    + '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin:6px 0 8px;"><span>1 아주 멀어요</span><span>3 보통이에요</span><span>5 아주 가까워요</span></div>'
    + otherStudents.map(s=>'<div class="distance-row" style="display:flex;align-items:center;gap:6px;padding:6px 0;border-top:1px solid #eef2ff;">'
        + '<span style="flex:1;min-width:64px;font-size:14px;font-weight:700;">' + escHtml(s.name) + '</span>'
        + DISTANCE_LABELS.map((label,i)=>{const v=i+1,on=Number(surveyDistance[s.num])===v;
            return '<button type="button" class="distance-btn" id="dist-' + s.num + '-' + v + '" aria-pressed="' + on + '" aria-label="' + escHtml(s.name) + ' ' + label + '" title="' + label + '" onclick="setSurveyDistance(' + s.num + ',' + v + ')" '
              + 'style="width:36px;height:36px;border-radius:50%;border:2px solid ' + DISTANCE_COLORS[i] + ';background:' + (on?DISTANCE_COLORS[i]:'#fff') + ';color:' + (on?'#fff':DISTANCE_COLORS[i]) + ';font-weight:800;font-size:14px;cursor:pointer;">' + v + '</button>';}).join('')
        + '</div>').join('')
    + '<div class="survey-cat-note">🔒 친구들은 내 답을 볼 수 없어요. 선생님이 우리 반이 더 편안해지도록 돕는 데만 사용해요.</div>'
    + '</div>';
}
function setSurveyDistance(num, v){
  num = Number(num);
  surveyDistance[num] = Number(surveyDistance[num])===v ? undefined : v;   // 같은 칸을 다시 누르면 지웁니다
  if(surveyDistance[num]===undefined) delete surveyDistance[num];
  DISTANCE_LABELS.forEach((_,i)=>{
    const b=document.getElementById('dist-'+num+'-'+(i+1)); if(!b) return;
    const on=surveyDistance[num]===i+1;
    b.setAttribute('aria-pressed',String(on)); b.style.background=on?DISTANCE_COLORS[i]:'#fff'; b.style.color=on?'#fff':DISTANCE_COLORS[i];
  });
  const counter=document.getElementById('distance-counter');
  const others=students.filter(s=>Number(s.num)!==Number(myStudentNum));
  if(counter) counter.textContent=others.filter(s=>surveyDistance[s.num]).length+'/'+others.length;
}
function cleanSurveyDistance(){
  const out={};
  Object.entries(surveyDistance).forEach(([k,v])=>{const n=Number(k),x=Number(v);
    if(n!==Number(myStudentNum)&&students.some(s=>Number(s.num)===n)&&Number.isInteger(x)&&x>=1&&x<=5) out[n]=x;});
  return out;
}
let surveySubmitting = false;
function applyPeerSurveyDoc(data, live=false){
  const next = PeerSurvey.current(data, myStudentNum, myAccountUid);
  const changed = activeSurveyRoundId !== next.roundId;
  const labelChanged = activeSurveyRoundLabel !== next.roundLabel;
  const previous = JSON.stringify(mySurvey);
  activeSurveyRoundId = next.roundId;
  activeSurveyRoundLabel = next.roundLabel;
  if(changed){
    surveyPicks = PeerSurvey.emptyPicks();
    surveyReflection = {};
    surveyDistance = {};
    surveyEditing = false;
  }
  mySurvey = next.response;
  allSurveys = mySurvey ? {[myStudentNum]:mySurvey} : {};
  // Other students submitting must not replace the form currently being filled.
  if(live && (changed || labelChanged || (!surveyEditing && previous !== JSON.stringify(mySurvey)))){
    const panel=document.getElementById('counsel-sub-survey');
    if(panel) panel.innerHTML=buildSurveyPanel();
  }
}

function toggleSurveyChip(catKey, num){
  const cat = SURVEY_CATS.find(c => c.key === catKey);
  if(!cat) return;
  const picks = surveyPicks[catKey];
  const idx = picks.indexOf(num);
  if(idx >= 0){
    picks.splice(idx, 1);
  } else {
    if(picks.length >= cat.max) return; // 최대 초과
    picks.push(num);
  }
  // 해당 카테고리 칩 시각 업데이트
  students.filter(s => s.num !== myStudentNum).forEach(s => {
    const chip = document.getElementById('chip-' + catKey + '-' + s.num);
    if(!chip) return;
    const sel = picks.includes(s.num);
    chip.setAttribute('aria-pressed', String(sel));
    chip.style.background = sel ? cat.bg : '';
    chip.style.borderColor = sel ? cat.color : '';
    chip.style.color       = sel ? cat.color : '';
    chip.style.fontWeight  = sel ? '700' : '';
  });
  // 카운터 업데이트
  const counter = document.getElementById('counter-' + catKey);
  if(counter) counter.textContent = picks.length + '/' + cat.max;
}

function computeOceanType(scores){
  return (scores.E>=3?'E':'I')+(scores.A>=3?'A':'L')+(scores.O>=3?'O':'C')+(scores.C>=3?'C':'L')+'-'+(scores.N>=3?'β':'α');
}

async function submitPeerSurvey(){
  if(surveySubmitting) return;
  surveySubmitting = true;
  const submittedRoundId = activeSurveyRoundId;
  const submittedRoundLabel = activeSurveyRoundLabel;
  const picks = Object.fromEntries(SURVEY_CATS.map(cat=>[cat.key,
    [...new Set((surveyPicks[cat.key]||[]).map(Number))].filter(n=>n!==Number(myStudentNum)&&students.some(s=>Number(s.num)===n)).slice(0,cat.max)
  ]));
  surveyReflection = PeerSurvey.readForm(document);
  const reflection = surveyReflection;
  const btn = document.querySelector('#counsel-sub-survey .pesk-btn.primary');
  if(btn){ btn.textContent = '제출 중...'; btn.disabled = true; }
  try {
    if(!(await ensureActiveStudentSession(false))) return;
    const db = window._db;
    const ref = window._fsDoc(db,'classrooms',roomId,'data','pesk-peer-survey');
    const surveyRecord = {
      studentNum: myStudentNum, studentName: myStudentName, accountUid: myAccountUid,
      roundId: submittedRoundId, roundLabel: submittedRoundLabel,
      schemaVersion: 4, timeframe: '최근 2주', nominationLimits:Object.fromEntries(SURVEY_CATS.map(c=>[c.key,c.max])), reflection, ...picks,
      distance: cleanSurveyDistance(), distanceScale: '1 아주 멀어요 ~ 5 아주 가까워요',
      likedStudents: [...new Set([...picks.study, ...picks.play, ...picks.support])],
      dislikedStudents: picks.discomfort,
      submittedAt: new Date().toISOString(), date: new Date().toLocaleDateString('ko-KR')
    };
    await window._fsRunTxn(db, async (txn)=>{
      const snap = await txn.get(ref);
      const data = snap.exists() ? (snap.data() || {}) : {};
      const current = PeerSurvey.current(data, myStudentNum, myAccountUid);
      if(current.roundId !== submittedRoundId){
        const error = new Error('선생님이 설문 회차를 변경했어요. 새 회차를 확인하고 답변해주세요.');
        error.code='survey/round-changed'; error.surveyData=data; throw error;
      }
      surveyRecord.roundLabel = current.roundLabel;
      txn.set(ref, {
        ...data,
        value: {...(data.value||{}), [submittedRoundId+':'+myStudentNum]:surveyRecord},
        rounds: Object.keys(data.rounds||{}).length ? data.rounds : {[submittedRoundId]:{id:submittedRoundId,label:current.roundLabel,status:'active'}},
        activeRoundId: submittedRoundId, updatedAt: new Date().toISOString()
      });
    });
    // A new round may have arrived via the live listener while the save was in flight.
    if(activeSurveyRoundId===submittedRoundId){
      mySurvey=surveyRecord; allSurveys={[myStudentNum]:surveyRecord};
      surveyEditing=false; surveyPicks=PeerSurvey.emptyPicks(); surveyReflection={}; surveyDistance={};
      const panel=document.getElementById('counsel-sub-survey');
      if(panel) panel.innerHTML=buildSurveyPanel();
    }
  } catch(e) {
    if(e.code==='survey/round-changed') applyPeerSurveyDoc(e.surveyData,true);
    alert('제출 실패: '+e.message);
  } finally {
    surveySubmitting=false;
    if(btn){ btn.textContent=submittedRoundLabel+' 설문 제출하기'; btn.disabled=false; }
  }
}

function resetSurvey(){
  surveyEditing=true;
  surveyPicks=Object.fromEntries(PeerSurvey.keys.map(key=>[key,[...(mySurvey?.[key]||[])].map(Number)]));
  surveyReflection=PeerSurvey.reflection(mySurvey?.reflection);
  surveyDistance={...(mySurvey?.distance||{})};
  const panel=document.getElementById('counsel-sub-survey');
  if(panel) panel.innerHTML=buildSurveyPanel();
}

/* ⚠️ 학생 화면에서 사회연결망 분석은 절대 노출되지 않음.
   다른 학생의 친구관계 설문 데이터(특히 갈등·불편 응답)가 본인에게 노출되어
   따돌림·갈등 정보가 유출되는 사고가 있어, 학생 클라이언트에선 SNA 함수를 무력화함.
   사회연결망 분석은 교사 화면(tesk_teacher_v2.html)에서만 가능. */
function computeSNAMetrics(){
  return { posIn:0, negIn:0, SP:0, SI:0, mutualCount:0 };
}

/* ⚠️ 학생 화면에선 사회연결망 그래프를 절대 표시하지 않음 — 무력화 */
function buildSocialNetworkSVG(){ return ''; }

// 아래는 옛 구현(레퍼런스용으로 남겨두지만 절대 호출되지 않음 — 항상 위 빈 함수가 우선)
function _legacy_buildSocialNetworkSVG_DISABLED(){
  const surveyedStudents = students.filter(s => allSurveys[s.num]);
  if(surveyedStudents.length < 2){
    return '<div class="empty-state" style="padding:16px 0;"><span class="empty-icon">🕸️</span>아직 설문 참여자가 부족해요<br>친구들이 설문을 완료하면 네트워크가 표시돼요</div>';
  }

  const W = 320, H = 270;
  const cx = W / 2, cy = H / 2;
  // 노드 원형 배치
  const positions = {};
  surveyedStudents.forEach((s, i) => {
    const angle = (i / surveyedStudents.length) * 2 * Math.PI - Math.PI / 2;
    const r = Math.min(cx, cy) - 36;
    positions[s.num] = { x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle), name: s.name };
  });
  if(!positions[myStudentNum]){
    positions[myStudentNum] = { x: cx, y: cy, name: myStudentName };
  }

  const mySurveyData = allSurveys[myStudentNum];

  // 카테고리별 엣지 색상 정의
  const catEdgeDef = {
    study:      { color: '#4f8ef7', dash: '', w: 1.8 },
    play:       { color: '#22c55e', dash: '', w: 1.8 },
    support:    { color: '#f59e0b', dash: '', w: 1.8 },
    leader:     { color: '#7c3aed', dash: '', w: 1.8 },
    discomfort: { color: '#ef4444', dash: '5,3', w: 1.5 }
  };

  // ① 배경 엣지 (다른 학생들 간, 회색)
  let bgEdges = '';
  Object.entries(allSurveys).forEach(([sNum, survey]) => {
    const fromNum = parseInt(sNum);
    if(fromNum === myStudentNum) return;
    const fp = positions[fromNum];
    if(!fp) return;
    ['study','play','support','leader'].forEach(cat => {
      (survey[cat]||[]).forEach(toNum => {
        if(toNum === myStudentNum) return;
        const tp = positions[toNum];
        if(!tp) return;
        bgEdges += '<line x1="' + fp.x.toFixed(1) + '" y1="' + fp.y.toFixed(1)
          + '" x2="' + tp.x.toFixed(1) + '" y2="' + tp.y.toFixed(1)
          + '" stroke="#e2e8f0" stroke-width="1.2"/>';
      });
    });
  });

  // ② 나의 관계 엣지 (카테고리별 컬러)
  let myEdges = '';
  if(mySurveyData){
    const mp = positions[myStudentNum];
    if(mp){
      SURVEY_CATS.forEach(cat => {
        const def = catEdgeDef[cat.key];
        (mySurveyData[cat.key]||[]).forEach(toNum => {
          const tp = positions[toNum];
          if(!tp) return;
          const dashAttr = def.dash ? (' stroke-dasharray="' + def.dash + '"') : '';
          myEdges += '<line x1="' + mp.x.toFixed(1) + '" y1="' + mp.y.toFixed(1)
            + '" x2="' + tp.x.toFixed(1) + '" y2="' + tp.y.toFixed(1)
            + '" stroke="' + def.color + '" stroke-width="' + def.w + '"' + dashAttr + '/>';
        });
      });
      // 나를 선택한 긍정 관계 (상호 아닌 경우만, 연보라 점선)
      Object.entries(allSurveys).forEach(([sNum, survey]) => {
        const fromNum = parseInt(sNum);
        if(fromNum === myStudentNum) return;
        const fp = positions[fromNum];
        if(!fp) return;
        const theyPickedMe = ['study','play','support','leader'].some(cat => (survey[cat]||[]).includes(myStudentNum));
        const iPickedThem = ['study','play','support','leader'].some(cat => (mySurveyData[cat]||[]).includes(fromNum));
        if(theyPickedMe && !iPickedThem){
          myEdges += '<line x1="' + fp.x.toFixed(1) + '" y1="' + fp.y.toFixed(1)
            + '" x2="' + mp.x.toFixed(1) + '" y2="' + mp.y.toFixed(1)
            + '" stroke="#a5b4fc" stroke-width="1.4" stroke-dasharray="4,3"/>';
        }
      });
    }
  }

  // ③ 노드 그리기 (SNA 지표로 크기/색 조절)
  let nodes = '';
  Object.entries(positions).forEach(([num, pos]) => {
    const n = parseInt(num);
    const isMe = n === myStudentNum;
    const metrics = computeSNAMetrics(n);
    const baseR = isMe ? 20 : Math.min(24, Math.max(14, 13 + metrics.posIn * 2));
    const fill = isMe ? '#4f8ef7' : (metrics.SP >= 2 ? '#dcfce7' : metrics.SP <= -1 ? '#fee2e2' : '#f8fafc');
    const stroke = isMe ? '#1d5bbf' : (metrics.SP >= 2 ? '#22c55e' : metrics.SP <= -1 ? '#ef4444' : '#cbd5e1');
    const textColor = isMe ? '#fff' : '#374151';
    const shortName = (pos.name||'').slice(0, 3);
    nodes += '<circle cx="' + pos.x.toFixed(1) + '" cy="' + pos.y.toFixed(1)
      + '" r="' + baseR + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="2"/>';
    nodes += '<text x="' + pos.x.toFixed(1) + '" y="' + (pos.y + 0.5).toFixed(1)
      + '" text-anchor="middle" dominant-baseline="middle" fill="' + textColor
      + '" font-size="9" font-weight="700" font-family="Pretendard,sans-serif">' + shortName + '</text>';
  });

  // ④ SNA 지표 카드
  const myMetrics = computeSNAMetrics(myStudentNum);
  const statItems = [
    { val: myMetrics.posIn,      label: '긍정 선택\n받은 수',  bg: '#f0fdf4', color: '#22c55e' },
    { val: myMetrics.mutualCount,label: '상호\n친한 친구',     bg: '#eef4ff', color: '#4f8ef7' },
    { val: myMetrics.SP,         label: '사회 선호도\n(SP)',   bg: myMetrics.SP >= 0 ? '#f0fdf4' : '#fef2f2', color: myMetrics.SP >= 0 ? '#22c55e' : '#ef4444' },
    { val: myMetrics.SI,         label: '사회 영향력\n(SI)',   bg: '#f5f3ff', color: '#7c3aed' }
  ];
  let statsHtml = '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:12px;">';
  statItems.forEach(function(item){
    statsHtml += '<div style="text-align:center;padding:9px 4px;background:' + item.bg + ';border-radius:12px;">'
      + '<div style="font-size:18px;font-weight:900;color:' + item.color + ';">' + item.val + '</div>'
      + '<div style="font-size:9px;color:var(--sub);margin-top:2px;line-height:1.3;white-space:pre-line;">' + item.label + '</div>'
      + '</div>';
  });
  statsHtml += '</div>';

  // ⑤ 카테고리별 나를 선택한 수 바
  const totalResponders = Math.max(Object.keys(allSurveys).length, 1);
  const catCountHtml = '<div style="margin-top:10px;">'
    + SURVEY_CATS.map(function(cat){
        const cnt = Object.entries(allSurveys).filter(function(e){
          return parseInt(e[0]) !== myStudentNum && (e[1][cat.key]||[]).includes(myStudentNum);
        }).length;
        const pct = Math.round((cnt / totalResponders) * 100);
        return '<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px;">'
          + '<span style="font-size:11px;min-width:28px;">' + cat.emoji + '</span>'
          + '<span style="font-size:10px;color:var(--sub);min-width:58px;">' + cat.label + '</span>'
          + '<div style="flex:1;height:8px;background:#f1f5f9;border-radius:4px;overflow:hidden;">'
          + '<div style="width:' + pct + '%;height:100%;background:' + cat.color + ';border-radius:4px;"></div>'
          + '</div>'
          + '<span style="font-size:10px;font-weight:700;color:' + cat.color + ';min-width:20px;text-align:right;">' + cnt + '</span>'
          + '</div>';
      }).join('')
    + '</div>';

  // ⑥ 범례
  const legendHtml = '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">'
    + SURVEY_CATS.map(function(cat){
        const def = catEdgeDef[cat.key];
        const grad = def.dash
          ? 'background:repeating-linear-gradient(to right,' + def.color + ' 0,' + def.color + ' 4px,transparent 4px,transparent 7px);'
          : 'background:' + def.color + ';';
        return '<div style="display:flex;align-items:center;gap:3px;font-size:9px;color:var(--sub);">'
          + '<span style="width:16px;height:3px;' + grad + 'display:inline-block;border-radius:2px;"></span>'
          + cat.emoji + cat.label + '</div>';
      }).join('')
    + '<div style="display:flex;align-items:center;gap:3px;font-size:9px;color:var(--sub);">'
    + '<span style="width:16px;height:3px;background:repeating-linear-gradient(to right,#a5b4fc 0,#a5b4fc 4px,transparent 4px,transparent 7px);display:inline-block;"></span>나를 선택함</div>'
    + '</div>';

  const totalParticipants = surveyedStudents.length;
  const totalStudents = students.length;

  return '<div style="margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;">'
    + '<div style="font-size:12px;font-weight:800;color:var(--text);">🕸️ 사회 연결망 분석</div>'
    + '<div style="font-size:10px;color:var(--sub);">참여 ' + totalParticipants + ' / ' + totalStudents + '명</div>'
    + '</div>'
    + '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;border-radius:14px;background:#f8fafc;border:1px solid var(--border);">'
    + bgEdges + myEdges + nodes
    + '</svg>'
    + statsHtml
    + catCountHtml
    + legendHtml;
}

}

// 물품 사용하기
async function useMyPurchase(purchId){
  if(!(await ensureActiveStudentSession(false))) return;
  if(economyBlocked('shop')) return economyBlockedNotice('shop');
  const p = myPurchases.find(x=>x.id===purchId);
  if(!p){ alert('물품을 찾을 수 없어요.'); return; }
  if(shopPurchaseRemaining(p) <= 0){ alert('이미 모두 사용한 물품이에요.'); return; }
  if(shopItemNeedsApproval(shopItemForPurchase(p))) return requestUseMyItem(purchId, 1);
  return useMyItem(purchId, 1);
}

        : '<button onclick="buyShopItem(\'' + item.id + '\')" style="padding:6px 12px;border-radius:8px;border:none;background:' + (canBuy?'var(--pesk)':'var(--bg)') + ';color:' + (canBuy?'#fff':'var(--hint)') + ';font-size:11px;font-weight:700;cursor:' + (canBuy?'pointer':'not-allowed') + ';font-family:inherit;">'
          + (canBuy?'구매':'코인 부족')
          + '</button>')
      + '</div>'
      + '</div>';
  }).join('');
  return header + list;
}

function buildTxnList(){
  const txns = (localTxns||[]).slice(0, 40);
  if(txns.length === 0){
    return '<div class="empty-state" style="padding:16px 0;"><span class="empty-icon">📋</span>아직 거래 내역이 없어요</div>';
  }
  const rows = txns.map(t=>{
    const isEarn = t.type === 'earn';
    const sign = isEarn ? '+' : '-';
    const color = isEarn ? 'var(--green,#059669)' : 'var(--coral,#ef4444)';
    const amount = (t.amount||0).toLocaleString();
    return '<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);">'
      + '<div style="flex:1;">'
      +   '<div style="font-weight:700;font-size:13px;color:var(--text);">' + escHtml(t.desc||'거래') + '</div>'
      +   '<div style="font-size:10px;color:var(--hint);">' + (t.date||'') + '</div>'
      + '</div>'
      + '<div style="font-weight:800;font-size:13px;color:' + color + ';">' + sign + amount + ' 🪙</div>'
      + '</div>';
  }).join('');
  return '<div style="padding:4px 2px;">' + rows + '</div>';
}

const economyActions=new Set();
async function economyOnce(key,run){if(economyActions.has(key))return;economyActions.add(key);try{return await run();}finally{economyActions.delete(key);}}
function buyShopItem(...args){return economyOnce('shop-buy',()=>_buyShopItem(...args));}
function useMyItem(...args){return economyOnce('shop-use',()=>_useMyItem(...args));}
function buyStockPesk(...args){return economyOnce('stock-buy',()=>_buyStockPesk(...args));}
function sellStockPesk(...args){return economyOnce('stock-sell',()=>_sellStockPesk(...args));}
async function economyAfterCommit(run){try{await run();}catch(e){console.warn('거래 저장 완료 후 화면 갱신 실패',e);showFeedbackNotice('거래는 저장됐어요. 화면을 새로고침해 확인해주세요.');}}
async function _buyShopItem(itemId){
  if(!(await ensureActiveStudentSession(false))) return;
  if(economyBlocked('shop')) return economyBlockedNotice('shop');
  const item = shopItems.find(i => i.id === itemId);
  if(item?.bossReward) return alert('우리 반이 함께 쓰는 공동 보상이에요. 보스를 처치하면 공동 보상 탭에 열려요.');
  if(!item){ alert('상품을 찾을 수 없어요.'); return; }
  // 🎓 XP 로 사는 상품은 학급 화폐를 건드리지 않는 별도 경로로 처리
  if(item.payWith === 'xp') return buyShopItemWithXp(item);
  const gState = qzShopGoalState(item);
  if(gState.need && !gState.ok)
    return alert('이 물건은 [' + gState.text.replace(' 필요','') + '] 조건이 있어요.\n🎓 모험 학습에서 다 같이 채워봐요!');
  const me = await ensurePointsFresh(item.price);
  if(!me){ alert('학생 정보 오류'); return; }
  if(me.points < item.price){
    alert('코인이 부족해요!\n필요: ' + item.price.toLocaleString() + ' 🪙\n보유: ' + me.points.toLocaleString() + ' 🪙');
    return;
  }
  if(item.stock !== undefined && item.stock !== -1 && item.stock <= 0){
    alert('품절된 상품이에요.'); return;
  }

  // 수량 선택: 재고와 잔액이 허용하는 범위 안에서 여러 개 한 번에 구매
  const stockLimit = (item.stock === undefined || item.stock === -1) ? Infinity : Number(item.stock||0);
  const affordLimit = item.price > 0 ? Math.floor(me.points / item.price) : Infinity;
  const maxQty = Math.max(1, Math.min(stockLimit, affordLimit, 99));
  let qty = 1;
  if(maxQty > 1){
    const input = prompt('"' + item.name + '" 몇 개 구매할까요?\n(1 ~ ' + maxQty + '개, 개당 ' + item.price.toLocaleString() + ' 🪙)', '1');
    if(input === null) return;
    qty=Number(input);
    if(!Number.isInteger(qty) || qty < 1){ alert('수량은 1 이상 숫자로 입력해 주세요.'); return; }
    if(qty > maxQty){ alert('최대 ' + maxQty + '개까지 구매할 수 있어요.'); return; }
  }
  const totalPrice = item.price * qty;
  const qtyLabel = qty > 1 ? ' ' + qty + '개' : '';
  if(!confirm('"' + item.name + '"' + qtyLabel + '을(를) 총 ' + totalPrice.toLocaleString() + ' 🪙에 구매할까요?')) return;

  // 서버 경제 모드: 잔액/재고 검증과 차감을 Cloud Functions 트랜잭션이 담당(위변조 방지).
  if(window.TESK_USE_SERVER_ECONOMY && window._economyApi){
    let bought = 0;
    try{
      // 서버 API는 1개 단위 구매라 수량만큼 반복 호출 (실패 시 중단)
      for(let k=0;k<qty;k++){
        await window._economyApi.purchaseShopItem(roomId, itemId);
        bought++;
      }
      alert('구매 완료! ' + item.name + qtyLabel + ' (-' + totalPrice.toLocaleString() + ' 🪙)');
    }catch(e){
      const base = (e && e.message) ? e.message : '구매에 실패했어요. 잠시 후 다시 시도해주세요.';
      alert(bought > 0 ? bought + '개는 구매됐고, 이후 실패했어요.\n' + base : base);
    }
    await refreshEconomyFromServer(true);   // 포인트 명단은 실시간 구독하지 않으므로 직접 다시 읽는다
    return;
  }

  try {
    const db = window._db;
    const studentsRef = window._fsDoc(db,'classrooms',roomId,'data','tesk-students');
    const purchasesRef = window._fsDoc(db,'classrooms',roomId,'data','pesk-purchases');
    const shopRef = window._fsDoc(db,'classrooms',roomId,'data','tesk-shop');
    const portfoliosRef = window._fsDoc(db,'classrooms',roomId,'data','pesk-portfolios');
    const depositsRef = window._fsDoc(db,'classrooms',roomId,'data','pesk-deposits');
    const stockPricesRef = window._fsDoc(db,'classrooms',roomId,'data','tesk-stock-prices');

    let txResult = null;
    // 트랜잭션으로 잔액 차감 + 구매 기록 + 재고 감소를 원자적으로 처리
    // (이전엔 Math.max(0, ...) 으로 잔액 부족인데도 0으로 만들고 진행시켰던 사기 매수 버그가 있었음)
    await window._fsRunTxn(db, async (txn)=>{
      const studSnap = await txn.get(studentsRef);
      const purchSnap = await txn.get(purchasesRef);
      const shopSnap=await txn.get(shopRef);
      const portSnap = await txn.get(portfoliosRef);
      const depSnap = await txn.get(depositsRef);
      const priceSnap = await txn.get(stockPricesRef);

      const allStudents = studSnap.exists() ? (studSnap.data().value || []) : [];
      const existingPurch = purchSnap.exists() ? (purchSnap.data().value || []) : [];
      const allItems = shopSnap && shopSnap.exists() ? (shopSnap.data().value || []) : [];
      const latestItem=allItems.find(x=>String(x.id)===String(itemId));
      if(!latestItem || latestItem.bossReward)throw new Error('ITEM_UNAVAILABLE');
      if(latestItem.payWith==='xp'||Number(latestItem.price)!==Number(item.price))throw new Error('SHOP_PRICE_CHANGED');
      if(!Number.isSafeInteger(Number(latestItem.price))||Number(latestItem.price)<0||!Number.isSafeInteger(totalPrice))throw new Error('INVALID_PRICE');
      const allPortfolios = portSnap.exists() ? (portSnap.data().value || {}) : {};
      const allDeposits = depSnap.exists() ? (depSnap.data().value || {}) : {};
      const serverPrices = priceSnap.exists() ? (priceSnap.data().value || {}) : {};

      const stuIdx=allStudents.findIndex(s=>Number(s.num)===Number(myStudentNum));
      if(stuIdx < 0) throw new Error('STUDENT_NOT_FOUND');
      const beforePoints = Number(allStudents[stuIdx].points || 0);
      // 서버 잔액 검증 (트랜잭션 내부)
      if(beforePoints < totalPrice){
        throw new Error('INSUFFICIENT_BALANCE:' + beforePoints);
      }
      // 재고 검증 (서버 기준)
      let shopIdx = -1;
      if(latestItem.stock !== undefined && Number(latestItem.stock) !== -1){
        shopIdx=allItems.indexOf(latestItem);
        if(!Number.isSafeInteger(Number(latestItem.stock))||Number(latestItem.stock)<0)throw new Error('OUT_OF_STOCK');
        if(shopIdx >= 0 && Number(allItems[shopIdx].stock || 0) < qty){
          throw new Error('OUT_OF_STOCK:' + Number(allItems[shopIdx].stock || 0));
        }
      }

      const afterPoints = beforePoints - totalPrice;
      allStudents[stuIdx].points = afterPoints;
      const myPortForSnapshot = _economyListFromDoc(allPortfolios, _mergePortfolioLists);
      const myDepsForSnapshot = _economyListFromDoc(allDeposits, _mergeDepositLists);
      const snapAt = Date.now();
      const assetBefore = _buildAssetSnapshot(beforePoints, myPortForSnapshot, myDepsForSnapshot, serverPrices, snapAt);
      const assetAfter = _buildAssetSnapshot(afterPoints, myPortForSnapshot, myDepsForSnapshot, serverPrices, snapAt);

      // 구매 기록 병합/추가
      let mergedId = null;
      const existingIdx = existingPurch.findIndex(p =>
        recordBelongsToMe(p) &&
        String(p.itemId||'')===String(item.id) &&
        shopPurchaseRemaining(p) > 0
      );
      if(existingIdx >= 0){
        existingPurch[existingIdx].qty = shopPurchaseQty(existingPurch[existingIdx]) + qty;
        existingPurch[existingIdx].date = new Date().toLocaleDateString('ko-KR');
        mergedId = existingPurch[existingIdx].id;
      } else {
        const newPurch = {
          id: uid(), studentNum: myStudentNum, studentName: myStudentName, accountUid: myAccountUid,
          itemId: item.id || '', itemName: item.name, icon: item.icon||'📦', price: item.price,
          date: new Date().toLocaleDateString('ko-KR'), status: 'pending',
          qty: qty
        };
        existingPurch.push(newPurch);
        mergedId = newPurch.id;
      }

      // 재고 감소
      if(shopIdx >= 0){
        allItems[shopIdx].stock = Math.max(0, Number(allItems[shopIdx].stock||0) - qty);
      }

      txn.set(studentsRef,  { value: allStudents,   updatedAt: new Date().toISOString() });
      txn.set(purchasesRef, { value: existingPurch, updatedAt: new Date().toISOString() });
      if(shopSnap && shopIdx >= 0){
        txn.set(shopRef,    { value: allItems,      updatedAt: new Date().toISOString() });
      }

      txResult = { allStudents, existingPurch, allItems, mergedId, beforePoints, afterPoints, assetBefore, assetAfter };
    });

    await economyAfterCommit(async()=>{
    // 로컬 반영
    students = txResult.allStudents;
    myPurchases = txResult.existingPurch.filter(recordBelongsToMe);
    if(txResult.allItems && txResult.allItems.length) shopItems = txResult.allItems;
    const meAfter = students.find(s=>s.num===myStudentNum) || me;
    addTxn('"' + item.name + '"' + qtyLabel + ' 구매', totalPrice, 'spend');
    await pushEconLog({
      type:'shop_buy',
      detail:`${item.name}${qtyLabel} 구매`,
      delta:-totalPrice,
      balanceBefore: txResult.beforePoints,
      balanceAfter: txResult.afterPoints,
      assetBefore: txResult.assetBefore,
      assetAfter: txResult.assetAfter,
      meta:{itemId:item.id||'', itemName:item.name, qty, mergedId: txResult.mergedId||''}
    });

    const panel = document.getElementById('panel-stock');
    if(panel) panel.innerHTML = buildBankPanel(meAfter);
    setTimeout(()=>showPurchSubTab('shop'), 50);
    addNotif('🛒 "' + item.name + '"' + qtyLabel + ' 구매 완료! (' + totalPrice.toLocaleString() + '🪙 차감)');
    showFeedbackNotice('✅ "' + item.name + '"' + qtyLabel + ' 구매 완료!');
    shopPanelTab = 'myitems';
    const shopPanel = document.getElementById('panel-shop');
    if(shopPanel) shopPanel.innerHTML = buildShopPanel(meAfter);
    });
  } catch(e) {
    const msg = String(e?.message||'');
    if(msg.startsWith('INSUFFICIENT_BALANCE:')){
      const balance = Number(msg.split(':')[1]||0);
      alert('코인이 부족해요!\n필요: ' + totalPrice.toLocaleString() + ' 🪙\n현재 보유: ' + balance.toLocaleString() + ' 🪙');
      return;
    }
    if(msg === 'OUT_OF_STOCK' || msg.startsWith('OUT_OF_STOCK:')){
      const left = Number(msg.split(':')[1]);
      alert(Number.isFinite(left) && left > 0
        ? '재고가 부족해요. 현재 남은 재고: ' + left + '개'
        : '품절된 상품이에요. 다시 시도해주세요.');
      return;
    }
    if(msg==='SHOP_PRICE_CHANGED'||msg==='ITEM_UNAVAILABLE'){alert('상품의 가격이나 판매 상태가 바뀌었어요. 새로고침 후 다시 확인해주세요.');return;}
    if(msg === 'STUDENT_NOT_FOUND'){
      alert('학생 정보를 다시 불러오는 중이에요. 잠시 후 다시 시도해주세요.');
      return;
    }
    alert('구매 실패: ' + e.message);
  }
}
