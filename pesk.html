<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, getDocs, setDoc, onSnapshot, collection, query, where, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { firebaseConfig } from "./shared/firebase-config.js";
// 학생 앱은 교사 Google 로그인과 다른 Firebase 앱 이름을 쓴다 (shared/pesk-student-auth-free.js 의 STUDENT_APP).
// 같은 브라우저에서 교사 화면을 열어도 학생 로그인이 풀리지 않고, 교사 화면도 학생 계정으로 바뀌지 않는다.
const app = initializeApp(firebaseConfig, 'pesk-student');
// 학생 앱은 기기 저장(IndexedDB 캐시)을 쓰지 않는다 (2026-10-08).
// 캐시를 켜고 로그아웃 때 지우게 했더니, 같은 브라우저에 잠든 다른 탭이 있으면 지우기가 '대기'에 걸려
// 다음에 연 앱이 문구 없이 로딩만 도는 일이 생겼다. 학교 태블릿·크롬북에서는 캐시보다 안정성이 우선.
const db = getFirestore(app);
window._fsQuery=query; window._fsWhere=where;
window._auth = getAuth(app); window._signOut = signOut;
// signOut 이 실패해도 학생이 공용 기기에서 빠져나갈 수 있게, 이 기기에 남은 학생 로그인 기록만 직접 지운다.
// (같은 브라우저의 교사 로그인은 다른 키라서 건드리지 않는다)
window._forceLocalSignOut = ()=>new Promise((resolve, reject)=>{
  const key = 'firebase:authUser:' + firebaseConfig.apiKey + ':' + app.name;
  try{ localStorage.removeItem(key); sessionStorage.removeItem(key); }catch(_e){}
  let req, fresh = false;
  try{ req = indexedDB.open('firebaseLocalStorageDb'); }catch(_e){ return resolve(); }
  req.onupgradeneeded = ()=>{ fresh = true; req.transaction.abort(); };   // 저장소가 없으면 지울 것도 없다
  req.onerror = ()=>fresh ? resolve() : reject(req.error);
  req.onsuccess = ()=>{
    const idb = req.result;
    if(!idb.objectStoreNames.contains('firebaseLocalStorage')){ idb.close(); return resolve(); }
    const tx = idb.transaction('firebaseLocalStorage', 'readwrite');
    tx.objectStore('firebaseLocalStorage').delete(key);
    tx.oncomplete = ()=>{ idb.close(); resolve(); };
    tx.onerror = tx.onabort = ()=>{ idb.close(); reject(tx.error); };
  };
});
window._db=db; window._fsDoc=doc; window._fsGetDoc=getDoc;
window._fsGetDocs=getDocs;
window._fsSetDoc=setDoc; window._fsOnSnapshot=onSnapshot;
window._fsCollection=collection; window._fsRunTxn=runTransaction; window._fbReady=true;
// 경제 로직 서버 API (USE_SERVER_ECONOMY 플래그가 켜진 경우 사용)
import("./shared/pesk-economy-api.js").then(m => { window._economyApi = m; });
window._studentAuthReady = import("./shared/pesk-student-auth.js").then(m=>{window._studentAuthApi=m;}).catch(()=>{});
// 학급별 학생 인증 방식: 서버 인증(Blaze) / 무료 Firebase 인증(전환한 학급) / 기존 방식(null)
window._studentAuthFor = roomId => import("./shared/pesk-student-auth-free.js?v=20261001app1").then(m=>m.resolveStudentAuth(roomId));
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f5f6fa;
  --surface:#ffffff;
  --card:#ffffff;
  --border:#eeeef8;
  --text:#1a1a2e;
  --sub:#6b7280;
  --hint:#b0b7c3;
  --pesk:#4f8ef7;
  --pesk-m:#3b7fee;
  --pesk-l:#eef4ff;
  --pesk-d:#1d5bbf;
  --gold:#f59e0b;
  --gold-l:#fffbeb;
  --green:#22c55e;
  --green-l:#f0fdf4;
  --coral:#ef4444;
  --coral-l:#fef2f2;
  --purple:#7c3aed;
  --purple-l:#f5f3ff;
  --teal:#14b8a6;
  --teal-l:#f0fdfa;
  --radius:20px;
  --radius-sm:14px;
  --shadow:0 4px 24px rgba(79,142,247,0.08), 0 1px 3px rgba(0,0,0,0.04);
  --shadow-sm:0 2px 8px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.03);
  --transition:cubic-bezier(0.4, 0, 0.2, 1);
}
html,body{min-height:100vh;font-family:'Pretendard','Geist',sans-serif;
  background:var(--bg);color:var(--text);overflow-x:hidden;}

/* ── 헤더 ── */
.header{
  position:sticky;top:0;z-index:100;
  background:rgba(255,255,255,0.92);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  padding:14px 20px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid rgba(255,255,255,0.6);
  box-shadow:0 1px 8px rgba(0,0,0,0.03);
}
.header-logo{
  font-family:'Geist',sans-serif;font-weight:900;font-size:20px;
  background:linear-gradient(135deg,var(--pesk),var(--purple));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.header-class{font-size:12px;color:var(--sub);}
.header-back{
  font-size:12px;color:var(--sub);cursor:pointer;text-decoration:none;font-family:inherit;
  padding:6px 14px;border-radius:99px;
  background:var(--bg);border:1px solid var(--border);
  transition:all .15s;
}
.header-back:hover{background:var(--pesk-l);color:var(--pesk);}

/* ── 접근 불가 ── */
.no-access{max-width:400px;margin:80px auto;padding:0 20px;text-align:center;}
.no-access-icon{font-size:48px;margin-bottom:16px;}
.no-access-title{font-size:20px;font-weight:800;margin-bottom:8px;}
.no-access-desc{font-size:13px;color:var(--sub);margin-bottom:24px;line-height:1.6;}

/* ── 로딩 ── */
.loading{text-align:center;padding:80px 20px;color:var(--sub);}
.loading .spin{font-size:36px;display:block;animation:spin 1s linear infinite;margin-bottom:14px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── 메인 레이아웃 ── */
.main{max-width:480px;margin:0 auto;padding:20px 16px 96px;}

/* ── 가로모드/태블릿(넓은 화면) 2단 레이아웃 ── */
@media (min-width:760px){
  .main{max-width:1000px;display:flex;gap:18px;align-items:flex-start;}
  .main-side{width:330px;flex-shrink:0;position:sticky;top:16px;}
  .main-content{flex:1;min-width:0;}
  /* 상점/내 물품 카드 2열 */
  .shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;align-items:start;}
  /* 학급은행: 코인 카드 아래 투자/매점 섹션 나란히 */
  #bank-main-view{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;align-items:start;}
  #bank-main-view > :first-child{grid-column:1 / -1;}
}

/* ── 프로필 카드 ── */
.profile-card{
  background:linear-gradient(135deg,var(--pesk) 0%,var(--purple) 100%);
  border-radius:var(--radius);
  padding:24px;
  margin-bottom:16px;
  color:#fff;
  position:relative;
  overflow:hidden;
}
.profile-card::before{
  content:'';position:absolute;
  width:160px;height:160px;
  background:rgba(255,255,255,0.10);
  border-radius:50%;
  top:-50px;right:-40px;
  filter:blur(40px);
}
.profile-card::after{
  content:'';position:absolute;
  width:100px;height:100px;
  background:rgba(255,255,255,0.08);
  border-radius:50%;
  bottom:-30px;left:20px;
  filter:blur(30px);
}
.profile-top{
  display:flex;align-items:center;gap:14px;
  margin-bottom:18px;position:relative;z-index:1;
}
.avatar{
  width:56px;height:56px;border-radius:50%;
  background:rgba(255,255,255,0.25);
  border:2px solid rgba(255,255,255,0.5);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:800;flex-shrink:0;
  color:#fff;
}
.profile-name-wrap{flex:1;}
.profile-name{font-size:20px;font-weight:800;color:#fff;margin-bottom:2px;}
.profile-class{font-size:12px;color:rgba(255,255,255,0.75);}
.profile-lv{
  background:rgba(255,255,255,0.2);
  border:1px solid rgba(255,255,255,0.35);
  border-radius:12px;padding:8px 12px;text-align:center;flex-shrink:0;
}
.profile-lv .lv-label{font-size:9px;font-weight:700;letter-spacing:.1em;color:rgba(255,255,255,0.75);}
.profile-lv .lv-num{font-family:'Geist',sans-serif;font-size:24px;font-weight:900;color:#fff;line-height:1.1;}

/* 배지 행 */
.profile-badges{
  position:relative;z-index:1;
  background:rgba(255,255,255,0.15);
  border-radius:var(--radius-sm);
  padding:12px 14px;
  margin-bottom:10px;
}
.pb-label{font-size:10px;font-weight:700;color:rgba(255,255,255,0.7);letter-spacing:.06em;margin-bottom:8px;}
.pb-items{display:flex;gap:6px;flex-wrap:wrap;}
.pb-badge{
  background:rgba(255,255,255,0.25);
  border:1px solid rgba(255,255,255,0.35);
  border-radius:99px;
  padding:4px 10px;
  font-size:11px;font-weight:600;color:#fff;
  display:flex;align-items:center;gap:4px;
}
.pb-empty{font-size:11px;color:rgba(255,255,255,0.55);font-style:italic;}

/* 직업 행 */
.profile-job{
  position:relative;z-index:1;
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,0.15);
  border-radius:var(--radius-sm);
  padding:10px 14px;
}
.pj-icon{font-size:16px;}
.pj-name{font-size:13px;font-weight:700;color:#fff;}
.pj-salary{font-size:11px;color:rgba(255,255,255,0.7);}
.pj-empty{font-size:12px;color:rgba(255,255,255,0.6);font-style:italic;}

/* ── 알림 섹션 ── */
.notif-section{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow-sm);
  padding:16px;
  margin-bottom:14px;
  border:1px solid var(--border);
}
.notif-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;
}
.notif-title{font-size:13px;font-weight:800;color:var(--text);}
.notif-clear{font-size:11px;color:var(--sub);cursor:pointer;border:none;background:none;font-family:inherit;}
.notif-item{
  display:flex;align-items:flex-start;gap:10px;
  padding:10px 0;
  border-bottom:1px solid var(--border);
}
.notif-item:last-child{border-bottom:none;}
.notif-dot{width:8px;height:8px;border-radius:50%;background:var(--pesk);flex-shrink:0;margin-top:4px;}
.notif-dot.read{background:var(--hint);}
.notif-msg{font-size:12px;color:var(--text);line-height:1.5;flex:1;}
.notif-time{font-size:10px;color:var(--hint);white-space:nowrap;}
.notif-dismiss{background:none;border:none;color:var(--hint);font-size:14px;cursor:pointer;padding:0 2px;flex-shrink:0;line-height:1;}
.notif-dismiss:hover{color:var(--danger,#e74c3c);}
.notif-empty{font-size:12px;color:var(--hint);text-align:center;padding:8px 0;}

/* ── 탭 바 ── */
.tab-bar{
  display:flex;gap:6px;
  background:var(--card);
  border-radius:var(--radius);
  padding:6px;
  margin-bottom:14px;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  box-shadow:var(--shadow-sm);
  border:1px solid var(--border);
}
.tab-bar::-webkit-scrollbar{display:none;}
.tab-btn{
  flex:1;flex-shrink:0;
  padding:9px 10px;
  border-radius:var(--radius-sm);
  border:none;background:none;
  color:var(--sub);font-size:11px;font-weight:700;
  cursor:pointer;transition:all .2s var(--transition, ease);
  font-family:inherit;white-space:nowrap;
  min-width:56px;
}
.tab-btn.active{
  background:var(--pesk);
  color:#fff;
  box-shadow:0 4px 12px rgba(79,142,247,0.25), 0 1px 3px rgba(79,142,247,0.15);
}
.tab-btn:not(.active):hover{background:var(--bg);}
.tab-btn.locked{opacity:.45;filter:grayscale(.4);}

.bottom-tabbar{
  position:fixed;left:50%;bottom:10px;transform:translateX(-50%);
  width:min(560px, calc(100% - 18px));
  z-index:220;
  /* 버튼 수(모험·보스 유무)에 맞춰 칸이 정해진다 */
  display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;
  padding:8px;
  padding-bottom:max(8px, env(safe-area-inset-bottom));
  background:rgba(255,255,255,0.94);
  border:1px solid rgba(229,231,235,0.9);
  border-radius:22px;
  box-shadow:0 12px 34px rgba(15,23,42,0.18);
  backdrop-filter:blur(18px) saturate(180%);
  -webkit-backdrop-filter:blur(18px) saturate(180%);
}
.bottom-tab-btn{
  min-height:54px;border:none;border-radius:16px;background:transparent;
  color:var(--sub);font-family:inherit;font-weight:800;font-size:11px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  cursor:pointer;touch-action:manipulation;white-space:nowrap;padding:0 4px;min-width:0;
}
.bottom-tab-btn .bt-icon{font-size:18px;line-height:1;}
.bottom-tab-btn.active{background:var(--pesk);color:#fff;box-shadow:0 5px 16px rgba(79,142,247,0.28);}
.bottom-tab-btn.locked{opacity:.48;filter:grayscale(.45);}
.bottom-more-menu{
  position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(8px);
  width:min(320px, calc(100% - 34px));z-index:219;
  display:none;grid-template-columns:1fr;gap:7px;padding:10px;
  background:rgba(255,255,255,0.97);border:1px solid rgba(229,231,235,0.92);
  border-radius:20px;box-shadow:0 18px 46px rgba(15,23,42,0.22);
  backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);
}
.bottom-more-menu.open{display:grid;animation:morePop .18s ease forwards;}
.bottom-more-item{
  border:none;background:var(--bg);border-radius:14px;padding:12px 14px;
  display:flex;align-items:center;gap:10px;font-family:inherit;font-size:13px;font-weight:900;
  color:var(--text);cursor:pointer;text-align:left;
}
.bottom-more-item.active{background:var(--pesk-l);color:var(--pesk);}
.bottom-more-item.locked{opacity:.5;filter:grayscale(.45);}
.bottom-more-item .mi{font-size:18px;width:22px;text-align:center;}
@keyframes morePop{
  from{opacity:0;transform:translateX(-50%) translateY(12px) scale(.96);}
  to{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}
}

/* ── 공통 카드 ── */
.w-card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow-sm);
  border:1px solid var(--border);
  margin-bottom:14px;
  overflow:hidden;
  transition:box-shadow .25s ease, transform .25s ease;
}
.w-card-header{
  padding:16px 18px 12px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.w-card-title{font-size:13px;font-weight:800;color:var(--text);}
.w-card-body{padding:14px 18px;}

.section-title{
  font-size:11px;font-weight:800;color:var(--hint);
  letter-spacing:.07em;text-transform:uppercase;
  margin-bottom:10px;margin-top:4px;
}

/* ── 미션 ── */
.mission-list{display:flex;flex-direction:column;gap:8px;}
.mission-item{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:14px 16px;
  display:flex;align-items:center;gap:12px;
  box-shadow:var(--shadow-sm);
  transition:all .25s ease;
}
.mission-item:hover{border-color:var(--pesk);box-shadow:0 2px 12px rgba(79,142,247,0.12);transform:translateY(-1px);}
.mission-item.done{opacity:.55;}
.mission-icon-wrap{
  width:40px;height:40px;border-radius:12px;
  background:var(--pesk-l);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;
}
.mission-item.done .mission-icon-wrap{background:var(--green-l);}
.mission-info{flex:1;}
.mission-info .title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:2px;}
.mission-info .desc{font-size:11px;color:var(--sub);}
.mission-reward{
  font-family:'Geist',sans-serif;font-size:12px;font-weight:800;
  color:var(--gold);flex-shrink:0;
  background:var(--gold-l);padding:4px 8px;border-radius:8px;
}
.mission-check{
  width:24px;height:24px;border-radius:50%;
  border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;transition:all .15s;
  font-size:12px;
}
.mission-item.done .mission-check{background:var(--green);border-color:var(--green);color:#fff;}
.checklist-roster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
.checklist-row{
  border:1.5px solid var(--border);background:var(--bg);border-radius:12px;
  padding:10px 12px;display:flex;align-items:center;justify-content:space-between;
  gap:8px;font-family:inherit;cursor:pointer;text-align:left;transition:all .15s ease;
}
.checklist-row.checked{background:var(--green-l);border-color:var(--green);color:var(--green);}
.checklist-row.checking{transform:scale(.98);box-shadow:0 0 0 3px rgba(45,122,71,.14);}
.checklist-row.checked .checklist-student::before{content:'✓ ';color:var(--green);font-weight:900;}
.checklist-student{font-size:13px;font-weight:800;color:var(--text);}
.checklist-state{font-size:11px;font-weight:900;color:var(--sub);}
.checklist-row.checked .checklist-state{color:var(--green);}

/* ── 랭킹 ── */
.rank-list{display:flex;flex-direction:column;gap:8px;}
.rank-item{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:12px 16px;
  display:flex;align-items:center;gap:12px;
  box-shadow:var(--shadow-sm);
}
.rank-item.me{
  border-color:var(--pesk);
  background:var(--pesk-l);
  box-shadow:0 2px 12px rgba(79,142,247,0.15);
}
.rank-num-wrap{
  width:32px;height:32px;border-radius:50%;
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.rank-item:nth-child(1) .rank-num-wrap{background:#fff8e0;}
.rank-item:nth-child(2) .rank-num-wrap{background:#f5f5f5;}
.rank-item:nth-child(3) .rank-num-wrap{background:#fff0e0;}
.rank-num{font-family:'Geist',sans-serif;font-weight:900;font-size:14px;color:var(--sub);}
.rank-item:nth-child(1) .rank-num{color:var(--gold);}
.rank-item:nth-child(2) .rank-num{color:#9ca3af;}
.rank-item:nth-child(3) .rank-num{color:#d97706;}
.rank-name{flex:1;font-size:13px;font-weight:700;color:var(--text);}
.rank-pts{
  font-family:'Geist',sans-serif;font-size:13px;font-weight:800;
  color:var(--gold);
  background:var(--gold-l);padding:4px 10px;border-radius:8px;
}

/* ── 글쓰기 ── */
.writing-form{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:18px;margin-bottom:12px;
  box-shadow:var(--shadow-sm);
}
.writing-form input,.writing-form textarea{
  width:100%;padding:11px 14px;
  border:1.5px solid var(--border);border-radius:12px;
  font-size:13px;font-family:inherit;
  background:var(--bg);color:var(--text);
  outline:none;margin-bottom:10px;resize:vertical;
}
.writing-form input:focus,.writing-form textarea:focus{border-color:var(--pesk);box-shadow:0 0 0 3px rgba(79,142,247,0.1);}
.writing-form textarea{min-height:120px;line-height:1.6;}
.writing-item{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:16px 18px;margin-bottom:8px;
  box-shadow:var(--shadow-sm);
}
.writing-item .w-title{font-size:14px;font-weight:800;color:var(--text);margin-bottom:6px;}
.w-fold-hint{font-size:10px;font-weight:700;color:var(--hint);margin-left:6px;}
/* 접기 방식 고르기 (내용만 / 제목까지) */
.w-fold-mode{display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
.w-fold-mode .wfm-label{font-size:10px;font-weight:800;color:var(--sub);margin-right:2px;}
.w-fold-mode .wfm-opt{
  display:inline-flex;align-items:center;gap:4px;cursor:pointer;
  font-size:11px;font-weight:700;color:var(--sub);
  border:1.5px solid var(--border);border-radius:99px;padding:5px 9px;background:var(--card);
  user-select:none;
}
.w-fold-mode .wfm-opt input{width:13px;height:13px;margin:0;accent-color:var(--pesk);cursor:pointer;}
.w-fold-mode .wfm-opt.on{border-color:var(--pesk);color:var(--pesk);background:var(--pesk-l,#eef3ff);}
/* 제목까지 접어서 목록에서 감춘 글 안내줄 */
.w-hidden-bar{
  border:1.5px dashed var(--border);border-radius:12px;padding:11px 13px;margin-bottom:8px;
  font-size:12px;font-weight:700;color:var(--sub);background:var(--card);
  cursor:pointer;text-align:center;
}
.w-hidden-bar:hover{border-color:var(--pesk);color:var(--pesk);}
.w-del-btn{
  margin-top:8px;padding:8px 12px;font-size:12px;font-weight:800;font-family:inherit;
  border-radius:11px;border:1.5px solid rgba(220,38,38,0.35);
  background:var(--card);color:#dc2626;cursor:pointer;
}
.w-del-btn:disabled{opacity:.6;cursor:default;}
.w-btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
/* ✍️ 일일 글쓰기 안내 */
.w-duty{border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:12.5px;line-height:1.65;}
.w-duty.warn{background:#fff7ed;border:1.5px solid #fdba74;color:#9a3412;}
.w-duty.lock{background:#fef2f2;border:1.5px solid #fca5a5;color:#991b1b;}

/* 📌 선생님이 낸 주제 */
.w-topic{background:var(--pesk-l,#eef3ff);border:1.5px solid var(--pesk);border-radius:14px;
  padding:13px 14px;margin-bottom:14px;}
.w-topic.done{background:var(--card);border-color:var(--border);}
.w-topic-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;}
.w-topic-tag{font-size:11px;font-weight:800;color:var(--pesk);}
.w-topic.done .w-topic-tag{color:var(--sub);}
.w-topic-done{font-size:11px;font-weight:800;color:var(--tesk-m,#2d7a47);}
.w-topic-title{font-size:15px;font-weight:900;line-height:1.45;color:var(--text);}
.w-topic-guide{font-size:12px;color:var(--sub);line-height:1.65;margin-top:6px;white-space:pre-wrap;}
.w-topic-go{margin-top:11px;width:100%;padding:11px;border-radius:11px;border:none;cursor:pointer;
  background:var(--pesk);color:#fff;font-size:13px;font-weight:800;font-family:inherit;}
.w-topic.done .w-topic-go{background:var(--card);color:var(--pesk);border:1.5px solid var(--pesk);}
.w-topic-badge{display:inline-block;font-size:10px;font-weight:800;color:var(--pesk);
  background:var(--pesk-l,#eef3ff);border-radius:99px;padding:2px 7px;}
.writing-item .w-meta{font-size:11px;color:var(--sub);display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.writing-item .w-feedback{
  margin-top:12px;padding:14px;border-radius:12px;
  background:var(--pesk-l);border:1px solid rgba(79,142,247,0.2);
}
.writing-item .w-feedback .fb-label{
  font-size:10px;font-weight:800;color:var(--pesk);
  letter-spacing:.06em;margin-bottom:6px;
}
.writing-item .w-feedback .fb-text{font-size:12px;line-height:1.7;color:var(--text);}
.status-badge{
  display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;
  font-size:10px;font-weight:700;
}
.status-badge.pending{background:var(--gold-l);color:var(--gold);}
.status-badge.reviewed{background:var(--green-l);color:var(--green);}

/* ── 상담 ── */
.sub-tab-bar{
  display:flex;gap:6px;margin-bottom:14px;
  background:var(--bg);border-radius:12px;padding:4px;
}
.sub-tab-btn{
  flex:1;padding:8px;border-radius:8px;border:none;
  background:none;color:var(--sub);font-size:12px;font-weight:700;
  cursor:pointer;font-family:inherit;transition:all .15s;
}
.sub-tab-btn.active{background:var(--pesk);color:#fff;}
.counsel-form{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:18px;
  box-shadow:var(--shadow-sm);
}
.counsel-form textarea{
  width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:12px;
  font-size:13px;font-family:inherit;background:var(--bg);color:var(--text);
  outline:none;resize:vertical;min-height:100px;line-height:1.6;
}
.counsel-form textarea:focus{border-color:var(--pesk);box-shadow:0 0 0 3px rgba(79,142,247,0.1);}
.counsel-form .form-label{
  font-size:11px;font-weight:800;color:var(--sub);
  letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;display:block;
}
.counsel-form .form-group{margin-bottom:14px;}
.counsel-request-item{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:8px;
  box-shadow:var(--shadow-sm);
}
.counsel-request-item .cr-reason{font-size:12px;line-height:1.5;margin-top:4px;color:var(--text);}

/* OCEAN */
.ocean-question{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:16px;margin-bottom:8px;
  box-shadow:var(--shadow-sm);
}
.ocean-question .q-trait{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;}
.ocean-question .q-text{font-size:13px;font-weight:600;margin-bottom:12px;line-height:1.5;color:var(--text);}
.ocean-scale{display:flex;gap:4px;}
.ocean-scale label{flex:1;text-align:center;}
.ocean-scale input[type=radio]{display:none;}
.ocean-scale .scale-btn{
  display:flex;align-items:center;justify-content:center;
  width:100%;aspect-ratio:1;border-radius:10px;
  background:var(--bg);border:1.5px solid var(--border);
  font-size:13px;font-weight:700;cursor:pointer;
  transition:all .15s;color:var(--sub);
}
.ocean-scale input[type=radio]:checked + .scale-btn{background:var(--pesk);border-color:var(--pesk);color:#fff;}
.ocean-result-card{
  background:var(--card);border:1.5px solid var(--pesk);
  border-radius:var(--radius);padding:18px;margin-bottom:12px;
  box-shadow:var(--shadow);
}
.ocean-type{font-family:'Geist',sans-serif;font-size:28px;font-weight:900;color:var(--pesk);letter-spacing:2px;margin-bottom:10px;}
.ocean-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.ocean-bar-label{font-size:11px;color:var(--sub);width:60px;flex-shrink:0;}
.ocean-bar-track{flex:1;height:7px;background:var(--bg);border-radius:99px;overflow:hidden;}
.ocean-bar-fill{height:100%;border-radius:99px;}
.ocean-bar-val{font-size:11px;font-weight:800;width:20px;text-align:right;flex-shrink:0;}

/* 친구 칩 */
.friend-chip-wrap{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.friend-chip{
  padding:5px 12px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;
  border:1.5px solid var(--border);background:var(--bg);color:var(--sub);transition:all .15s;
}
.friend-chip.liked{border-color:var(--pesk);background:var(--pesk-l);color:var(--pesk-m);}
.friend-chip.disliked{border-color:var(--coral);background:var(--coral-l);color:var(--coral);}

/* ── 학급은행 ── */
.bank-coin-card{
  background:linear-gradient(135deg,var(--pesk) 0%,var(--purple) 100%);
  border-radius:var(--radius);padding:24px 26px;
  margin-bottom:12px;color:#fff;
  position:relative;overflow:hidden;
}
.bank-coin-card::before{
  content:'';position:absolute;
  width:140px;height:140px;
  background:rgba(255,255,255,0.07);
  border-radius:50%;top:-50px;right:-30px;
}
.bcc-label{font-size:11px;font-weight:700;color:rgba(255,255,255,0.7);letter-spacing:.06em;margin-bottom:6px;position:relative;z-index:1;}
.bcc-amount{font-family:'Geist',sans-serif;font-size:36px;font-weight:900;color:#fff;line-height:1;position:relative;z-index:1;}
.bcc-sub{font-size:11px;color:rgba(255,255,255,0.65);margin-top:4px;position:relative;z-index:1;}

.bank-section{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);margin-bottom:12px;
  box-shadow:var(--shadow-sm);overflow:hidden;
}
.bank-section-header{
  padding:14px 18px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.bank-section-title{font-size:13px;font-weight:800;color:var(--text);}
.bank-section-badge{
  font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px;
  background:var(--pesk-l);color:var(--pesk);
}
.bank-section-body{padding:14px 18px;}

/* 투자 포트폴리오 행 */
.port-item{
  display:flex;align-items:center;gap:12px;
  padding:10px 0;border-bottom:1px solid var(--border);
}
.port-item:last-child{border-bottom:none;}
.port-icon{
  width:36px;height:36px;border-radius:10px;
  background:var(--pesk-l);display:flex;align-items:center;
  justify-content:center;font-size:16px;flex-shrink:0;
}
.port-name{flex:1;}
.port-name .pn-name{font-size:13px;font-weight:700;color:var(--text);margin-bottom:1px;}
.port-name .pn-qty{font-size:11px;color:var(--sub);}
.port-value{text-align:right;}
.port-value .pv-amount{font-family:'Geist',sans-serif;font-size:14px;font-weight:900;}
.port-value .pv-amount.up{color:var(--green);}
.port-value .pv-amount.down{color:var(--coral);}
.port-value .pv-change{font-size:10px;font-weight:700;}
.port-value .pv-change.up{color:var(--green);}
.port-value .pv-change.down{color:var(--coral);}

/* 주식 매매 */
.stock-list-item{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:8px;
  box-shadow:var(--shadow-sm);
  touch-action:manipulation;
}
.stock-list-item .s-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.stock-list-item .s-name{font-size:13px;font-weight:800;color:var(--text);}
.stock-list-item .s-code{font-size:10px;color:var(--hint);margin-top:1px;}
.stock-list-item .s-price{font-family:'Geist',sans-serif;font-size:18px;font-weight:900;color:var(--text);}
.stock-list-item .s-holding{font-size:10px;color:var(--pesk);font-weight:700;background:var(--pesk-l);padding:2px 7px;border-radius:99px;}
.stock-buy-form{display:flex;gap:6px;align-items:center;}
.stock-buy-form input{
  flex:1;padding:8px 12px;
  border:1.5px solid var(--border);border-radius:10px;
  background:var(--bg);color:var(--text);font-size:12px;font-family:inherit;outline:none;
  max-width:90px;
}
.stock-buy-form input:focus{border-color:var(--pesk);box-shadow:0 0 0 3px rgba(79,142,247,0.1);}
.stock-btn{
  padding:8px 14px;border-radius:10px;border:none;
  font-size:11px;font-weight:800;cursor:pointer;font-family:inherit;transition:all .2s ease;
}
.stock-btn.buy{background:var(--green-l);color:var(--green);border:1.5px solid var(--green);}
.stock-btn.buy:hover{background:var(--green);color:#fff;transform:translateY(-1px);box-shadow:0 4px 12px rgba(34,197,94,0.3);}
.stock-btn.sell{background:var(--coral-l);color:var(--coral);border:1.5px solid var(--coral);}
.stock-btn.sell:hover{background:var(--coral);color:#fff;transform:translateY(-1px);box-shadow:0 4px 12px rgba(239,68,68,0.3);}
.stock-search{
  width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:12px;
  background:var(--bg);color:var(--text);font-size:13px;font-family:inherit;
  outline:none;margin-bottom:10px;
}
.stock-search:focus{border-color:var(--pesk);box-shadow:0 0 0 3px rgba(79,142,247,0.1);}

.install-prompt{
  display:none;margin-bottom:14px;padding:12px 14px;border-radius:16px;
  background:linear-gradient(135deg,#eef4ff,#f5f3ff);
  border:1px solid #dbeafe;color:var(--text);box-shadow:var(--shadow-sm);
}
.install-prompt.show{display:flex;align-items:center;gap:10px;}
.install-prompt-text{flex:1;font-size:12px;line-height:1.5;color:var(--sub);}
.install-prompt-text b{display:block;color:var(--text);font-size:13px;margin-bottom:2px;}
.install-prompt button{
  min-height:38px;border:none;border-radius:11px;padding:0 12px;
  background:var(--pesk);color:#fff;font-size:12px;font-weight:800;font-family:inherit;
}

/* 구매 물품 행 */
.purchase-item{
  display:flex;align-items:center;gap:12px;
  padding:10px 0;border-bottom:1px solid var(--border);
}
.purchase-item:last-child{border-bottom:none;}
.pi-icon{width:34px;height:34px;border-radius:10px;background:var(--purple-l);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.pi-info{flex:1;}
.pi-name{font-size:13px;font-weight:700;color:var(--text);}
.pi-date{font-size:10px;color:var(--sub);margin-top:1px;}
.pi-price{font-family:'Geist',sans-serif;font-size:13px;font-weight:800;color:var(--coral);}

/* 자산 내역 행 */
.txn-item{
  display:flex;align-items:center;gap:12px;
  padding:10px 0;border-bottom:1px solid var(--border);
}
.txn-item:last-child{border-bottom:none;}
.txn-type{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.txn-type.earn{background:var(--green-l);}
.txn-type.spend{background:var(--coral-l);}
.txn-info{flex:1;}
.txn-desc{font-size:13px;font-weight:700;color:var(--text);}
.txn-date{font-size:10px;color:var(--sub);margin-top:1px;}
.txn-amount{font-family:'Geist',sans-serif;font-size:14px;font-weight:900;}
.txn-amount.earn{color:var(--green);}
.txn-amount.spend{color:var(--coral);}

/* ── 공통 버튼 ── */
.pesk-btn{
  padding:12px 18px;border-radius:12px;border:none;
  font-size:13px;font-weight:700;cursor:pointer;
  font-family:inherit;transition:all .25s var(--transition, ease);width:100%;margin-top:8px;
}
.pesk-btn.primary{background:var(--pesk);color:#fff;box-shadow:0 4px 14px rgba(79,142,247,0.25), 0 1px 3px rgba(79,142,247,0.12);}
.pesk-btn.primary:hover{background:var(--pesk-m);transform:translateY(-1px);box-shadow:0 6px 20px rgba(79,142,247,0.3);}
.pesk-btn.secondary{background:var(--bg);color:var(--text);border:1.5px solid var(--border);}
.pesk-btn.secondary:hover{border-color:var(--pesk);color:var(--pesk);}
.pesk-btn.primary:disabled{background:var(--hint);cursor:not-allowed;box-shadow:none;}
.empty-state{text-align:center;padding:28px 16px;color:var(--hint);font-size:13px;line-height:1.6;}
.empty-state .empty-icon{font-size:28px;margin-bottom:8px;display:block;}

/* ── 아침 글쓰기 팝업 ── */
.morning-overlay{
  position:fixed;inset:0;z-index:999;
  background:rgba(26,26,46,0.5);
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  backdrop-filter:blur(4px);
}
.morning-popup{
  background:#fff;border-radius:var(--radius);
  padding:28px 24px;max-width:340px;width:100%;
  text-align:center;
  animation:popIn .4s cubic-bezier(.16,1,.3,1);
}
@keyframes popIn{from{opacity:0;transform:scale(.85);}to{opacity:1;transform:scale(1);}}
.morning-popup .mp-emoji{font-size:48px;margin-bottom:14px;display:block;}
.morning-popup .mp-title{font-size:18px;font-weight:900;color:var(--text);margin-bottom:8px;}
.morning-popup .mp-desc{font-size:13px;color:var(--sub);line-height:1.6;margin-bottom:20px;}
.morning-popup .mp-btn{
  display:block;width:100%;padding:13px;border-radius:12px;border:none;
  background:var(--pesk);color:#fff;font-size:14px;font-weight:800;
  cursor:pointer;font-family:inherit;margin-bottom:8px;
  box-shadow:0 3px 10px rgba(79,142,247,0.35);
}
.morning-popup .mp-later{
  display:block;width:100%;padding:11px;border-radius:12px;border:1.5px solid var(--border);
  background:none;color:var(--sub);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;
}

/* ── 알림 토스트 ── */
@keyframes fadeDown{
  from{opacity:0;transform:translateX(-50%) translateY(-10px);}
  to{opacity:1;transform:translateX(-50%) translateY(0);}
}

/* ── 스크롤바 ── */
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(79,142,247,0.15);border-radius:99px;}
::-webkit-scrollbar-thumb:hover{background:rgba(79,142,247,0.3);}

@media (max-width:560px){
  body{padding-bottom:env(safe-area-inset-bottom);}
  .header{padding:11px 14px;}
  .header-logo{font-size:18px;}
  .header-class{max-width:48vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .main{padding:14px 12px 108px;}
  .profile-card{padding:20px;margin-bottom:12px;border-radius:18px;}
  .profile-top{gap:11px;margin-bottom:14px;}
  .avatar{width:50px;height:50px;font-size:20px;}
  .profile-name{font-size:18px;}
  .notif-section,.w-card,.bank-section,.stock-list-item{border-radius:16px;}

function recordBelongsToMe(record){
  if(!record || record.scope==='class') return false;
  if(record.accountUid && myAccountUid && record.accountUid === myAccountUid) return true;
  return parseInt(record.studentNum) === myStudentNum;
}

function myEconomyKey(){

}

function _mergePortfolioLists(primary, legacy){
  const merged = Array.isArray(primary) ? primary.map(p=>({...p})) : [];
  (Array.isArray(legacy)?legacy:[]).forEach(item=>{
    if(!item || !item.code) return;
    const existing = merged.find(p=>p.code===item.code);
    const addQty = Number(item.qty||0);
    if(existing){
      const oldQty = Number(existing.qty||0);
      // Same-code legacy rows can be stale copies of the UID row. Keep the larger
      // holding instead of adding quantities and accidentally copying money.
      if(addQty > oldQty){
        existing.qty = addQty;
        existing.avgPrice = Number(item.avgPrice||existing.avgPrice||0);
      }
    } else {
      merged.push({...item});
    }
  });
  return merged
    .filter(p=>Number(p?.qty||0)>0)
    .map(p=>({...p,qty:Number(p.qty),avgPrice:Number(p.avgPrice)||0,studentNum:myStudentNum,accountUid:myAccountUid}));
}

function _mergeDepositLists(primary, legacy){
  const seen = new Set();
  const merged = [];
  [...(Array.isArray(primary)?primary:[]), ...(Array.isArray(legacy)?legacy:[])].forEach(dep=>{
    if(!dep) return;
    // id 없는 옛 예금은 내용으로 고정 id를 만든다. 없으면 해지할 때 엉뚱한 예금과 짝지어진다.
    const id = dep.id || ('legacy-' + [dep.planId, dep.amount, dep.startDate].join('|'));
    if(seen.has(id)) return;
    seen.add(id);
    merged.push({...dep, id, studentNum:myStudentNum, accountUid:myAccountUid});
  });
  return merged;
}

// 예금·주식의 "내 기록" 판정은 교사 앱과 같은 규칙(shared/economy-ownership.js)을 쓴다.
// 번호만 같고 계정이 다른 기록은 남의 것이다 — 예전에는 이걸 내 것으로 합쳐서,
// 해지한 예금이 다른 칸의 복사본에서 되살아나 몇 번이고 다시 해지됐다.
function _economyOwner(){ return {uid:myAccountUid||'', num:myStudentNum}; }
function _canonicalEconomyList(allData, merger){
  return merger(window.EconomyOwnership.ownedList(allData||{}, _economyOwner()), []);
}
// 내 목록을 정답 칸 하나에 쓰고, 다른 칸에 남은 내 복사본은 지운다(되살아나지 않게).
function _setMyEconomyList(allData, list){
  return window.EconomyOwnership.setOwnedList(allData, _economyOwner(), list);
}
async function migrateMyEconomyBucket(docKey, allData, merger){
  if(!window._fbReady||!window._db||!roomId)return allData;
  if(!window.EconomyOwnership.needsConsolidation(allData||{}, _economyOwner()))return allData;
  const ref=window._fsDoc(window._db,'classrooms',roomId,'data',docKey);let result=allData;
  try{
    await window._fsRunTxn(window._db,async txn=>{
      const snap=await txn.get(ref),latest=snap.exists()?(snap.data().value||{}):{};
      _setMyEconomyList(latest,_canonicalEconomyList(latest,merger));
      txn.set(ref,{value:latest,updatedAt:new Date().toISOString()});result=latest;
    });
  }catch(e){ console.warn('경제 기록 정리 실패 — 다음 거래 때 다시 정리돼요', docKey, e); }
  return result;
}

function _clearStudentSession(){

function _invalidateStudentSession(message){

// 이 학급의 학생 인증 모듈(서버 인증 또는 무료 Firebase 인증). 기존 방식 학급이면 null.
// 시작할 때 한 번 정해지고, 실시간 구독(subscribeToUpdates)도 이 값을 본다.
let _studentAuthApiCache;
async function studentAuthApi(){
  if(_studentAuthApiCache!==undefined) return _studentAuthApiCache;
  if(window.TESK_USE_SERVER_STUDENT_AUTH || window.TESK_USE_SERVER_ECONOMY){
    await window._studentAuthReady;
    if(!window._studentAuthApi) throw new Error('로그인 서버에 연결하지 못했어요.');
    return (_studentAuthApiCache = window._studentAuthApi);
  }
  _studentAuthApiCache = window._studentAuthFor ? await window._studentAuthFor(roomId) : null;
  return _studentAuthApiCache;
}

async function ensureActiveStudentSession(silent){
  if(_sessionInvalidating || _loggingOut) return false;
  if(!window._fbReady || !window._db || !roomId || !myStudentNum) return false;
  try{
    const authApi = await studentAuthApi();
    if(authApi){
      try{
        const session=await authApi.verifySession({roomId,studentNum:myStudentNum,accountUid:myAccountUid,sessionVersion:mySessionVersion});
        if(session.mustChangePassword) return _invalidateStudentSession('비밀번호 변경이 필요해요. 다시 로그인해주세요.');
        return true;
      }catch(e){
        if(['functions/unauthenticated','functions/permission-denied'].includes(e.code))return _invalidateStudentSession(e.message);
        throw e;
      }
    }
    const ref = window._fsDoc(window._db,'classrooms',roomId,'data','tesk-accounts');
    const snap = await window._fsGetDoc(ref);
    const accounts = snap.exists() ? (snap.data().value || {}) : {};
    const key = accounts[String(myStudentNum)] ? String(myStudentNum) : (accounts[myStudentNum] ? myStudentNum : null);
    if(key == null) return _invalidateStudentSession('이 학생 계정이 삭제되었어요. 선생님께 확인 후 다시 로그인해주세요.');
    const acc = accounts[key] || {};
    const serverVersion = Number(acc.sessionVersion || 1);
    if(!myAccountUid || !mySessionVersion || !myLoginId){
      return _invalidateStudentSession('계정 보안 정보가 새 방식으로 바뀌었어요. 다시 로그인해주세요.');
    }
    if(acc.accountUid && myAccountUid !== acc.accountUid){
      return _invalidateStudentSession('새로 만든 다른 계정이 감지되었어요. 다시 로그인해주세요.');
    }
    if(serverVersion && mySessionVersion !== serverVersion){
      return _invalidateStudentSession('비밀번호 또는 계정 상태가 변경되었어요. 다시 로그인해주세요.');
    }
    if(acc.id && myLoginId && acc.id !== myLoginId){
      return _invalidateStudentSession('계정 아이디가 변경되었어요. 다시 로그인해주세요.');
    }
    // 비밀번호 변경 권장 안내 (강제 로그아웃 X — sessionVersion이 같으면 본인 세션은 유효)
    // 이전엔 acc.pwChanged === false 만으로 강제 로그아웃했지만, 다른 학생 비번 초기화 시
    // accounts doc 전체 갱신으로 본인 비번 안 바꾼 학생 모두가 튕기는 버그가 있었음.
    // sessionVersion 비교(위)에서 본인 세션이 유효하면 그대로 진행하고, 비번 변경 안내만 표시.
    if(acc.mustChangePassword === true){
      try {
        if(localStorage.getItem('pesk-pw-changed') !== 'recommended-shown'){
          localStorage.setItem('pesk-pw-changed', 'recommended-shown');
        }
      } catch(_e){}
      // 다음 로그인 안내용으로 false 유지
    } else {
      try{ localStorage.setItem('pesk-pw-changed', 'true'); }catch(_e){}
    }
    return true;
  }catch(e){
    console.warn('계정 세션 확인 실패', e);
    if(!silent) alert('계정 확인에 실패했어요. 잠시 후 다시 시도해주세요.');
    return false;
  }
}

function normalizePeskChallenges(){
  const c = classChallenges && typeof classChallenges === 'object' ? classChallenges : {};
  c.auto = c.auto || {};
  c.auto.checklist = Object.assign({enabled:true,itemId:'morning',days:3,reward:50}, c.auto.checklist || {});
  c.auto.writing = Object.assign({enabled:true,days:3,reward:50}, c.auto.writing || {});
  c.auto.checklist.enabled = c.auto.checklist.enabled !== false;
  c.auto.writing.enabled = c.auto.writing.enabled !== false;
  c.auto.writing.autoPay = c.auto.writing.autoPay === true;
  c.auto.checklist.autoPay = c.auto.checklist.autoPay === true;
  // 조건 일수: 교사가 3~5일에서 선택 (기본 5일)
  c.auto.checklist.days = Math.min(5, Math.max(3, parseInt(c.auto.checklist.days) || 5));
  c.auto.writing.days = Math.min(5, Math.max(3, parseInt(c.auto.writing.days) || 5));
  c.manual = Array.isArray(c.manual) ? c.manual : [];
  classChallenges = c;
  return c;
}

function challengeAwardKey(type, stuNum, signature){
  return type + ':' + signature + ':' + stuNum;
}

function dateKeyFromAny(v){
  const d = v ? new Date(v) : new Date();
  if(Number.isNaN(d.getTime())) return '';
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function dateMinus(dateStr, offset){
  const d = new Date(dateStr);
  d.setDate(d.getDate() - offset);
  return dateKeyFromAny(d);
}

function currentSchoolWeek(){
  const today = new Date();
  const day = today.getDay();
  const monday = new Date(today);
  monday.setDate(today.getDate() + (day === 0 ? -6 : 1 - day));
  const keys = [];
  for(let i=0;i<5;i++){
    const d = new Date(monday);
    d.setDate(monday.getDate()+i);
    keys.push(dateKeyFromAny(d));
  }
  return {start:keys[0], end:keys[4], keys};
}

function formatSchoolWeekLabel(week=currentSchoolWeek()){
  const s = week.start.split('-').map(Number);
  const e = week.end.split('-').map(Number);
  return s[1] + '월 ' + s[2] + '일(월) ~ ' + e[1] + '월 ' + e[2] + '일(금)';
}

function checklistDoneOnDate(itemId, dateStr){
  const rec = checklistRecords?.[dateStr]?.[itemId]?.[myStudentNum] || checklistRecords?.[dateStr]?.[itemId]?.[String(myStudentNum)];
  return !!rec?.checked;
}

function myChecklistWeekCount(itemId, week=currentSchoolWeek()){
  return week.keys.filter(d=>checklistDoneOnDate(itemId, d)).length;
}

function myWritingWeekDayCount(week=currentSchoolWeek()){
  const allowed = new Set(week.keys);
  const days = new Set();
  (peskWritings || []).forEach(w=>{
    const d = dateKeyFromAny(w.submittedAt || w.updatedAt || w.date || w.createdAt || w.ts);
    if(allowed.has(d)) days.add(d);
  });
  return days.size;
}

function autoChallengeState(type){
  const c = normalizePeskChallenges();
  const cfg = c.auto?.[type] || {};
  const week = currentSchoolWeek();
  const days = Math.min(5, Math.max(3, parseInt(cfg.days) || 5));
  const reward = Math.max(0, Number(cfg.reward || 0));
  const itemId = cfg.itemId || 'morning';
  const progress = type === 'checklist' ? myChecklistWeekCount(itemId, week) : myWritingWeekDayCount(week);
  const signature = type === 'checklist'
    ? type + ':' + itemId + ':' + week.start + ':' + week.end + ':' + days + ':' + reward
    : type + ':' + week.start + ':' + week.end + ':' + days + ':' + reward;
  const paid = !!challengeAwards[challengeAwardKey(type, myStudentNum, signature)] || !!challengeAwards[challengeAwardKey(type, String(myStudentNum), signature)];
  const item = activeChecklistItems().find(i=>String(i.id)===String(itemId));
  return {cfg, days, reward, itemId, itemTitle:item?.title || itemId, progress, eligible:progress>=days && reward>0, paid, week, signature};
}

// 자동 챌린지(글쓰기/체크리스트): 조건 충족 시 학생 화면에서 즉시 자동 지급 (교사 설정 autoPay 필요)
async function maybeAutoPayAutoChallenge(type){
  try{
    if(type !== 'writing' && type !== 'checklist') return;
    const st = autoChallengeState(type);
    if(st.cfg.enabled === false || st.cfg.autoPay !== true) return;
    if(!st.eligible || st.paid) return;
    if(!window._fsRunTxn || !window._db || !roomId) return;
    const db = window._db;
    const studentsRef = window._fsDoc(db,'classrooms',roomId,'data','tesk-students');
    const awardsRef = window._fsDoc(db,'classrooms',roomId,'data','tesk-challenge-awards');
    const key = challengeAwardKey(type, myStudentNum, st.signature);
    let payResult = null;
    await window._fsRunTxn(db, async (txn)=>{
      const [studSnap, awardSnap] = await Promise.all([txn.get(studentsRef), txn.get(awardsRef)]);
      const allStudents = studSnap.exists() ? (studSnap.data().value || []) : [];
      const awards = awardSnap.exists() ? (awardSnap.data().value || {}) : {};
      if(awards[key] || awards[challengeAwardKey(type, String(myStudentNum), st.signature)]) return; // 이미 지급됨
      const stuIdx = allStudents.findIndex(s=>Number(s.num)===Number(myStudentNum));
      if(stuIdx < 0) return;
      const before = Number(allStudents[stuIdx].points || 0);
      allStudents[stuIdx].points = before + st.reward;
      awards[key] = {type, studentNum:myStudentNum, reward:st.reward, paidAt:new Date().toISOString(), progress:st.progress, signature:st.signature, autoPaid:true};
      const updatedAt = new Date().toISOString();
      txn.set(studentsRef, {value:allStudents, updatedAt});
      txn.set(awardsRef, {value:awards, updatedAt});
      payResult = {before, after: before + st.reward, allStudents};
    });
    if(!payResult) return;
    applyStudentsList(payResult.allStudents);   // 실시간 구독이 없으므로 직접 반영
    challengeAwards[key] = {reward:st.reward, paidAt:new Date().toISOString()};
    const label = type === 'writing' ? '글쓰기 제출일 챌린지' : '체크리스트 연속 챌린지';
    addTxn(label + ' 자동 보상', st.reward, 'earn');
    await pushEconLog({
      type:'challenge_auto_pay',
      detail:label + ' 자동 지급 (' + st.progress + '/' + st.days + '일)',
      delta: st.reward,
      balanceBefore: payResult.before,
      balanceAfter: payResult.after,
      meta:{challenge:type, signature:st.signature}
    });
    addNotif('🏁 ' + label + ' 달성! 보상 ' + st.reward.toLocaleString() + ' 🪙이 자동 지급됐어요!');
    showFeedbackNotice('🏁 챌린지 달성! +' + st.reward.toLocaleString() + ' 🪙 자동 지급');
  }catch(e){
    console.warn('challenge auto-pay failed', type, e);
  }
}

async function submitManualChallenge(chId, done){
  if(!window._fbReady || !window._db || !roomId) return alert('연결을 확인해주세요.');
  const ref=window._fsDoc(window._db,'classrooms',roomId,'data','pesk-challenge-submissions');
  try{
    let next=null;
    const apply=(data)=>{
      const v=data&&typeof data==='object'?data:{};
      v[chId]=v[chId]||{};
      v[chId][String(myStudentNum)]={done:!!done,studentNum:myStudentNum,studentName:myStudentName,accountUid:myAccountUid||'',updatedAt:new Date().toISOString()};
      return v;
    };
    if(window._fsRunTxn){
      await window._fsRunTxn(window._db, async(txn)=>{
        const snap=await txn.get(ref);
        next=apply(snap.exists()?(snap.data().value||{}):{});
        txn.set(ref,{value:next,updatedAt:new Date().toISOString()});
      });
    }else{
      const snap=await window._fsGetDoc(ref);
      next=apply(snap.exists()?(snap.data().value||{}):{});
      await window._fsSetDoc(ref,{value:next,updatedAt:new Date().toISOString()});
    }
    challengeSubmissions=next||challengeSubmissions;
    const wrap=document.getElementById('student-challenge-wrap');
    if(wrap) wrap.innerHTML=buildStudentChallengePanel();
    showFeedbackNotice(done?'🏁 챌린지를 O로 표시했어요.':'챌린지를 X로 표시했어요.');
  }catch(e){
    alert('챌린지 저장 실패: ' + e.message);
  }
}

function addTxn(desc, amount, type){

  localTxns.unshift(t);
  if(localTxns.length > 50) localTxns.pop();

}

// Firestore 문서 1MB 한도 보호: 로그 배열을 바이트 크기 기준으로 오래된 것부터 정리
function _trimLogsToByteLimit(logs, maxBytes=850000){
  const pending=l=>l.type==='shop_use_request'&&String(l.approval?.status||l.status||'pending')==='pending';
  const bytes=()=>typeof TextEncoder==='function'?new TextEncoder().encode(JSON.stringify(logs)).length:JSON.stringify(logs).length*3;
  while(bytes()>maxBytes){
    const index=logs.findIndex(l=>!pending(l));
    if(index<0)throw new Error('승인 대기 내역이 많아요. 선생님이 기존 요청을 처리한 뒤 다시 시도해주세요.');
    logs.splice(index,1);
  }
  return logs;
}

async function pushEconLog(entry){
  if(!window._fbReady || !window._db || !roomId) return;
  try{
    const ref = window._fsDoc(window._db,'classrooms',roomId,'data','pesk-purchase-log');
    const payload = {
      id: uid(),
      roomId,
      studentNum: parseInt(myStudentNum),
      studentName: myStudentName || '',
      accountUid: myAccountUid,
      actor: 'student',
      ts: Date.now(),
      createdAt: new Date().toISOString(),
      ...entry
    };
    if(window._fsRunTxn){
      await window._fsRunTxn(window._db, async (txn)=>{
        const snap = await txn.get(ref);
        const logs = snap.exists() ? (snap.data().value||[]) : [];
        logs.push(payload);
        if(logs.length > 2000) logs.splice(0, logs.length - 2000);
        _trimLogsToByteLimit(logs);
        txn.set(ref, { value: logs, updatedAt: new Date().toISOString() });
      });
    } else {
      const snap = await window._fsGetDoc(ref);
      const logs = snap.exists() ? (snap.data().value||[]) : [];
      logs.push(payload);
      if(logs.length > 2000) logs.splice(0, logs.length - 2000);
      _trimLogsToByteLimit(logs);
      await window._fsSetDoc(ref, { value: logs, updatedAt: new Date().toISOString() });
    }
  }catch(e){
    console.warn('econ log save failed', e);
  }
}

function getMyStudent(){

function _jobNums(j){
  if(Array.isArray(j?.studentNums)) return j.studentNums.map(n=>parseInt(n)).filter(n=>n>0);
  if(Array.isArray(j?.students)) return j.students.map(n=>parseInt(n)).filter(n=>n>0);
  return j?.studentNum!=null ? [parseInt(j.studentNum)].filter(n=>n>0) : [];
}
function myJobs(){
  return (Array.isArray(jobs)?jobs:[]).filter(j=>_jobNums(j).includes(myStudentNum));
}
function checklistItemIdsForJob(j){
  if(Array.isArray(j?.checklistItemIds) && j.checklistItemIds.length>0) return j.checklistItemIds.map(String);
  if(j?.checklistAccess===true) return activeChecklistItems().map(i=>String(i.id));
  return [];
}
function allowedChecklistItemIds(){
  const set=new Set();
  myJobs().forEach(j=>checklistItemIdsForJob(j).forEach(id=>set.add(String(id))));
  return set;
}
function canUseChecklist(){
  return allowedChecklistItemIds().size>0;
}
function activeChecklistItems(){
  const arr=Array.isArray(checklistItems)?checklistItems:[];
  const active=arr.filter(i=>i && i.active!==false);
  return active.length ? active : [{id:'morning',title:'아침활동',active:true}];
}
function myAllowedChecklistItems(){
  const allowed=allowedChecklistItemIds();
  return activeChecklistItems().filter(i=>allowed.has(String(i.id)));
}
function shopItemForPurchase(p){
  if(!p) return null;
  const itemId = String(p.itemId || p.shopItemId || '');
  if(itemId){
    const byId = shopItems.find(i=>String(i.id||'')===itemId);
    if(byId) return byId;
  }
  const name = String(p.itemName || p.name || '');
  return shopItems.find(i=>String(i.name||'')===name) || null;
}
function shopUseApproverJobIds(item){
  if(!item) return [];
  if(Array.isArray(item.useApproverJobIds)) return item.useApproverJobIds.map(String);
  if(Array.isArray(item.approverJobIds)) return item.approverJobIds.map(String);
  return [];
}
function shopItemNeedsApproval(item){
  // 승인 직업이 지정된 상품만 승인 필요 — 지정 안 된 상품은 바로 사용 가능
  return shopUseApproverJobIds(item).length > 0;
}
function shopPurchaseQty(p){
  const q=Number(p?.qty);return Number.isInteger(q)&&q>=1?q:1;
}
function shopPurchaseUsedQty(p){
  if(['used','used_all'].includes(p?.status))return shopPurchaseQty(p);
  const q=Number(p?.usedQty);return Number.isInteger(q)&&q>=0?Math.min(q,shopPurchaseQty(p)):0;
}
function shopPurchaseRemaining(p){
  return Math.max(0, shopPurchaseQty(p) - shopPurchaseUsedQty(p));
}
function myShopApprovalItemIds(){
  const myJobTitles = new Set(myJobs().map(j=>String(j.title||'')));
  const allowed = new Set();
  (shopItems||[]).forEach(item=>{
    const approvers = shopUseApproverJobIds(item);
    if(approvers.some(title=>myJobTitles.has(title))) allowed.add(String(item.id||''));
  });
  return allowed;
}
function canApproveShopUse(){
  return myShopApprovalItemIds().size > 0;
}
function myEconomyRestriction(){
  const raw = economyRestrictions?.[myStudentNum] || economyRestrictions?.[String(myStudentNum)] || {};
  return raw && typeof raw === 'object' ? raw : {};
}
function economyBlocked(kind){
  const me = getMyStudent();
  if(me && Number(me.points||0) < 0 && ['stock','shop','bank'].includes(kind)) return true;
  const r = myEconomyRestriction();
  if(kind === 'stock') return !!r.stockBlocked;
  if(kind === 'shop') return !!r.shopBlocked || writingDutyLocked();
  return false;
}
function economyBlockReason(kind){
  const me = getMyStudent();
  if(me && Number(me.points||0) < 0){
    return '현재 잔고가 마이너스라서 주식 매수·예금 넣기·상점 이용이 잠시 막혀 있어요. 주식 매도와 예금 인출은 할 수 있어요.';
  }
  if(kind === 'stock') return '선생님이 주식 이용을 잠시 막아두었어요.';
  if(kind === 'shop'){
    const d = writingDutyState();
    if(d.locked)
      return '글쓰기를 ' + d.streak + '일 연속 내지 않아 매점 이용이 잠겼어요.\n오늘 글을 제출하면 바로 풀려요!';
    return '선생님이 상점 이용을 잠시 막아두었어요.';
  }
  return '지금은 이용할 수 없어요.';
}
function economyBlockedNotice(kind){
  alert(economyBlockReason(kind));
}
function pendingShopUseRequestsForMe(){
  const allowed = myShopApprovalItemIds();
  return (purchaseLogs||[]).filter(l=>{
    if(String(l.type||'') !== 'shop_use_request') return false;
    if(String(l.approval?.status || l.status || 'pending') !== 'pending') return false;
    const requesterNum = Number(l.studentNum || l.meta?.studentNum || 0);
    const requesterUid = String(l.accountUid || l.meta?.accountUid || '');
    if(requesterNum === Number(myStudentNum) || (myAccountUid && requesterUid === myAccountUid)) return false;
    const itemId = String(l.itemId || l.meta?.itemId || '');
    if(itemId && allowed.has(itemId)) return true;
    const item = (shopItems||[]).find(i=>String(i.name||'')===String(l.itemName||l.meta?.itemName||''));
    return item && allowed.has(String(item.id||''));
  }).sort((a,b)=>Number(b.ts||b.timestamp||0)-Number(a.ts||a.timestamp||0));
}
function todayISO(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

async function refreshEconomyFromServer(render=true){
  if(!window._fbReady || !window._db || !roomId) return getMyStudent();
  try{
    const db = window._db;
    const keys = ['tesk-students','pesk-portfolios','pesk-deposits','tesk-stock-prices','tesk-bank-plans'];
    const snaps = await Promise.all(keys.map(k=>
      window._fsGetDoc(window._fsDoc(db,'classrooms',roomId,'data',k))
    ));
    if(snaps[4] && snaps[4].exists()){
      const plans = snaps[4].data().value;
      if(Array.isArray(plans) && plans.length) BANK_PLANS = plans;
    }
    if(snaps[0].exists()) students = snaps[0].data().value || [];
    const allPortfolios = snaps[1].exists() ? (snaps[1].data().value || {}) : {};
    myPortfolio = _canonicalEconomyList(allPortfolios, _mergePortfolioLists);
    const allDeposits = snaps[2].exists() ? (snaps[2].data().value || {}) : {};
    myDeposits = _canonicalEconomyList(allDeposits, _mergeDepositLists);
    if(snaps[3].exists()) stockPrices = snaps[3].data().value || stockPrices || {};
    if(!stockPrices || Object.keys(stockPrices).length===0) stockPrices = _defaultStockPrices();
    const me = getMyStudent();
    if(render) renderEconomyPanels(me);
    return me;
  }catch(e){
    console.warn('economy refresh failed', e);
    if(render) renderEconomyPanels(getMyStudent());
    return getMyStudent();
  }
}

let _quoteCache = [];
let _quoteLoaded = false;
const QUOTE_SHEET_ID = '1zpBs9feCPBOwfd3sZVjI3j8QPCHqI7sGg4VhxGypxYg';
async function _loadQuotes(){
  if(_quoteLoaded && _quoteCache.length) return;
  try{
    const url = 'https://docs.google.com/spreadsheets/d/'+QUOTE_SHEET_ID+'/gviz/tq?tqx=out:csv';
    const res = await fetch(url);
    const csv = await res.text();
    // CSV 파싱
    const lines = csv.split('\n').filter(l=>l.trim());
    _quoteCache = lines.map(line=>{
      // 간단 CSV 파싱 (쉼표 구분, 따옴표 처리)
      const cols = [];
      let cur='', inQ=false;
      for(let i=0;i<line.length;i++){
        const c=line[i];
        if(c==='"'){ inQ=!inQ; }
        else if(c===','&&!inQ){ cols.push(cur.trim()); cur=''; }
        else { cur+=c; }
      }
      cols.push(cur.trim());
      return { text: cols[1]||'', author: cols[2]||'' };
    }).filter(q=>q.text && q.text!=='명언' && q.text!=='quote'); // 헤더 제거
    _quoteLoaded = true;
  }catch(e){
    console.warn('명언 로드 실패:', e);
  }
}
function _getRandomQuote(){
  if(_quoteCache.length===0) return {text:'오늘도 화이팅!', author:'Tesk & Pesk'};
  return _quoteCache[Math.floor(Math.random()*_quoteCache.length)];
}
function buildQuotePanel(){
  const q = _getRandomQuote();

    + '<div style="font-size:40px;margin-bottom:14px;">💬</div>'

    + '<button onclick="refreshQuote()" style="margin-top:16px;padding:8px 20px;border:1.5px solid var(--pesk);background:#fff;color:var(--pesk);border-radius:99px;font-weight:700;font-size:12px;cursor:pointer;">🔄 다른 명언 보기</button>'

/* ── 🏠 오늘 홈 ──
   로그인하면 가장 먼저 보는 화면. 이미 받아 둔 데이터만 모아 '오늘 할 일'로 보여준다.
   새로 저장하는 값은 없고, 피드백 확인 여부만 기기에 기억한다. */
const TODAY_FB_SEEN_KEY = () => 'pesk-fb-seen-' + STUDENT_SCOPE_KEY();
function _feedbackSig(w){ return String(w.id || '') + '|' + String(w.feedbackDate || ''); }
function _feedbackSeenSet(){
  try{ return new Set(JSON.parse(localStorage.getItem(TODAY_FB_SEEN_KEY()) || '[]')); }catch(_e){ return new Set(); }
}
/* 교사 화면은 feedbackDate 를 '2026. 9. 28.' 형식으로 남긴다. 최근 7일 것만 '새 피드백'으로 친다 */
function _feedbackIsRecent(w){
  const m = String(w.feedbackDate || '').match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  if(!m) return false;
  const at = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])).getTime();
  return Date.now() - at < 7 * 24 * 60 * 60 * 1000;
}
function unseenFeedbackWritings(){
  const seen = _feedbackSeenSet();
  return (peskWritings || []).filter(w => String(w.feedback || '').trim() && _feedbackIsRecent(w) && !seen.has(_feedbackSig(w)));
}
function markWritingFeedbackSeen(){
  const fresh = unseenFeedbackWritings();
  if(!fresh.length) return;
  const seen = _feedbackSeenSet();
  fresh.forEach(w => seen.add(_feedbackSig(w)));
  try{ localStorage.setItem(TODAY_FB_SEEN_KEY(), JSON.stringify([...seen].slice(-200))); }catch(_e){}
}

      const e = bossEntry();
      if(e.usedToday) tasks.push({icon:'🤝', done:true, go:"openAdventure('boss')", title:'오늘 보스 도전 완료', desc:'보스는 하루에 한 번 도전할 수 있어요.'});
      else if(e.pending || e.ok) tasks.push({icon:'🤝', go:"openAdventure('boss')", hot:true, title:'우리 반 보스에 도전할 수 있어요!', desc:'친구들과 함께 보스를 쓰러뜨려요. 지금 ' + bossNow().pct + '% 진행됐어요.'});

    }
  }catch(_e){}
  // 오늘의 지문 — 승인된 지문이 열려 있는 동안 (놓친 회차 기간 포함)

  // 글쓰기 — 글쓰기 요일이 아니면 쓴 경우에만 보여준다
  const wroteToday = (peskWritings || []).some(w => _writingDayKey(w) === today);
  if(wroteToday){
    tasks.push({icon:'✍️', done:true, go:"showTab('writing')", title:'오늘 글쓰기 완료', desc:'선생님이 읽고 피드백을 보내주실 거예요.'});
  }else if(todoOn('writing')){
    const exempt = writingDuty && writingDuty.exempt.includes(Number(myStudentNum));
    const due = writingDuty && !exempt ? ' · ' + writingDuty.deadlineHour + '시까지' : '';
    tasks.push({icon:'✍️', go:"showTab('writing')", title:'오늘의 글쓰기', desc:'아직 오늘 글을 쓰지 않았어요' + due});
  }
  const fresh = unseenFeedbackWritings();
  if(fresh.length) tasks.push({icon:'✉️', go:"showTab('writing')", hot:true, title:'새 피드백 ' + fresh.length + '개', desc:'선생님이 내 글에 피드백을 보내주셨어요.'});
  const anthReq = (peskWritings || []).filter(w => w.anthology?.status === 'student-review');
  if(anthReq.length) tasks.push({icon:'📚', go:"openAnthologyReview('" + String(anthReq[0].id).replace(/[^\w-]/g, '') + "')", hot:true,
    title:'모음집 맞춤법 확인', desc:'「' + (anthReq[0].title || '') + '」 글을 모음집에 싣기 전에 같이 확인해요.'});
  // 예금 만기
  const matured = (myDeposits || []).filter(dep => dep && dep.startDate && dep.termDays && _isDepositMatured(dep));
  if(matured.length){
    const sum = matured.reduce((s, dep) => s + (Number(_depositMaturedValue(dep)) || 0), 0);
    tasks.push({icon:'🏦', go:"openBankFromToday()", hot:true, title:'예금 만기 ' + matured.length + '건', desc:'지금 찾으면 ' + sum.toLocaleString() + ' 🪙을 받아요.'});
  }
  // 학급 챌린지 (오늘 아직 표시하지 않은 것)
  const manual = (classChallenges?.manual || []).filter(ch => ch.active !== false);
  if(manual.length && todoOn('challenge')){
    const left = manual.filter(ch => {
      const sub = challengeSubmissions?.[ch.id]?.[myStudentNum] || challengeSubmissions?.[ch.id]?.[String(myStudentNum)];

  }
  return tasks.filter(t => !t.done).concat(tasks.filter(t => t.done));
}
