<body>
<div class="wrap">
<h1>1부에서 2부로 가는 길 · 시안</h1>
<p class="lead">1부 루멘 마을을 모두 되살린 뒤의 상태에서 시작해요. 마을은 안전 구역이고, 동쪽 길목 사냥터 세 곳(들판길, 숲길, 해안길)을 지나야 2부 루멘 항구에 닿아요. 숲길 북쪽에는 막다른 숲이 있고, 해안길 끝에는 안개 문지기가 길을 막고 있어요.</p>
<p class="keys">이동 방향키·WASD · 조사 스페이스 · 선제공격 Q · 점프 J 또는 Z(몬스터도 넘어요) · 지도 M · 전투 중 답 고르기 1·2·3, 스킬 E·R·T·Y<button id="reset" type="button">시안 처음부터</button></p>
<div class="stage" id="stage" tabindex="0">
<canvas id="cv" width="320" height="180" aria-label="게임 화면"></canvas>
<div class="hud" id="hud"><span id="h1"></span><span id="h2" class="hh"></span><span id="h3"></span><span id="h4" class="goal" hidden></span></div>
<div class="mm" id="mm"><button id="mmb" type="button" aria-expanded="true">지도 접기 ▴</button><div class="mmp" id="mmp"><div class="chain" id="chain"></div><canvas id="mmc" width="96" height="64" aria-label="미니맵"></canvas></div><button class="ftb" id="ftb" type="button" hidden>별의 나침반 · 순간이동</button></div>
<div class="toast" id="toast" hidden></div>
<button class="act" id="act" type="button" hidden></button>
<div class="pad" id="pad" hidden><span></span><button data-k="ArrowUp" aria-label="위">▲</button><span></span><button data-k="ArrowLeft" aria-label="왼쪽">◀</button><span></span><button data-k="ArrowRight" aria-label="오른쪽">▶</button><span></span><button data-k="ArrowDown" aria-label="아래">▼</button><span></span></div>
<div class="btns" id="btns" hidden><button id="bK" type="button">공격</button><button id="bJ" type="button">점프</button><button id="bA" type="button">조사</button></div>
<div class="box dlg" id="dlg" hidden><b id="dn"></b><p id="dt"></p><span class="nx">다음 ▼</span></div>
<div class="box ftl" id="ftl" hidden></div>
<div class="bh" id="bh" hidden><span id="bh1"></span><span id="bh2"></span></div>
<div class="box bt" id="bt" role="dialog" aria-label="전투" hidden><b class="btt" id="btt"></b><p class="bth" id="bth"></p><div class="bq" id="bq"></div><div class="bc" id="bc"></div><div class="bs"><button type="button" id="bsk">E 별빛 베기 ◆◆</button><button type="button" class="emp" aria-disabled="true">R 빈 칸</button><button type="button" class="emp" aria-disabled="true">T 빈 칸</button><button type="button" class="emp" aria-disabled="true">Y 빈 칸</button><button type="button" class="run" id="brun">도망가기 Esc</button></div><p class="bm" id="bm"></p></div>
<div class="box book" id="book" role="dialog" aria-label="지문 읽기" hidden><button class="cx" id="bx" type="button" aria-label="닫기">×</button><div class="bk" id="bk"></div></div>
</div>

const PH=['이 자리에 선생님의 지문이 들어가요. 길목과 막다른 길에도 지문을 놓아서, 75개를 1년 내내 모험하며 만나게 해요.','지문마다 확인 문제 2~3개가 붙어요.'];

FL(G,6,19,47,20,':');FL(G,29,10,30,18,':');FL(G,26,11,34,16,'q');FL(G,29,11,30,16,':');FL(G,10,15,10,18,':');FL(G,17,15,17,18,':');FL(G,8,27,24,27,':');FL(G,24,21,24,27,':');FL(G,10,26,10,26,':');FL(G,0,19,3,20,'b');
for(let y=10;y<31;y++)for(let a=35;a<47;a++)if(G[y][a]==='.'&&hsh(a,y)%5===0)G[y][a]=',';for(let y=11;y<31;y++)for(let a=6;a<26;a++)if(G[y][a]==='.'&&hsh(a,y)%11===0)G[y][a]=',';

[[20,1],[21,1],[20,2],[39,1],[40,1],[40,2],[22,7],[38,8],[26,2]].forEach(([a,y])=>O[y][a]='T');

[[38,12],[36,16],[44,12],[39,27],[34,25],[45,17]].forEach(([a,y])=>O[y][a]='r');[[37,21],[43,22],[36,30]].forEach(([a,y])=>O[y][a]='l');for(let a=34;a<=39;a++)O[23][a]='f';
[[27,12],[33,12],[27,15],[33,15]].forEach(([a,y])=>O[y][a]='g');O[17][14]='w';
